.num { font-variant-numeric: tabular-nums; }

.lede { color: var(--ink2); margin: 2px 0 14px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0 4px; }
.term { background: var(--page); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
.term b { color: var(--ink); display: block; margin-bottom: 2px; }

svg { display: block; width: 100%; height: auto; overflow: visible; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 8px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

.tile { background: var(--page); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12.5px; color: var(--ink2); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
tr.hit-row { cursor: pointer; } tr.hit-row:hover td, tr.hl td { background: var(--page); }
tr.runner td { color: var(--muted); }
tr.cut td { border-bottom: 2px dashed var(--warm); padding: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.bar.runner { background: var(--axis); }
.path { word-break: break-word; }
.path small { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--page); padding: 12px;

.answer { font-size: 15.5px; line-height: 1.65; }

code { font-size: 0.92em; background: var(--page); padding: 1px 5px; border-radius: 4px; }
.cite { font: inherit; font-size: 12px; font-weight: 650; border: 0; border-radius: 6px; padding: 0 6px;

.cite:hover, .cite:focus { background: var(--accent); color: #fff; outline: none; }
.cited-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.cg { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 13px;

.cg.on { background: var(--accent); border-color: var(--accent); color: #fff; }

e included the\nshipment of hazardous aircraft equipment items aboard company airplanes.\n\n35. The procedures of many air carriers for handling hazardous company materials (COMAT) are\nnot fully consistent with the hazardous materials regulations and the guidance provided on\nDecember 13, 1996, by the Research and Special Programs Administration on the transport\nof COMAT by air carriers.\n\n36. It is equally important that employees of both the air carrier and of relevant subcontractors be\nthoroughly versed and trained on the handling of hazardous materials and on the air carrier’s\nauthority to transport hazardous materials.\n\n37. Had ValuJet implemented a program to ensure that its subcontractor maintenance facility\nemployees were trained on the company’s lack of authority to transport hazardous materials\nand had received hazardous materials recognition training, SabreTech might not have\nmishandled the packaging and shipment of the chemical oxygen generators that were loaded\non flight 592.\n\n38. ValuJet failed to adequately oversee SabreTech and this failure was a cause of the accident.\n\n39. Before the accident, the Federal Aviation Administration’s (FAA) oversight of ValuJet did\nnot include any significant oversight of its heavy maintenance functions. The FAA’s\ninadequate oversight of ValuJet’s maintenance functions, including its failure to address\nValuJet’s limited oversight capabilities, contributed to this accident.\n\n40. The continuing lack of an explicit requirement for the principal maintenance inspector of a\nPart 121 operator to regularly inspect or surveil Part 145 repair stations that are performing\nheavy maintenance for their air carriers is a significant deficiency in the Federal Aviation\nAdministration’s oversight of the operator’s total maintenance program.\n\n41. The manner in which the Federal Aviation Administration’s Southern Region applied the\nresults of the Flight Standards District Office (FSDO) staffing level models was not\nsufficiently flexible to account for a rapidly growing and complex air carrier and resulted in\nan inadequate level of inspector resources in the Atlanta FSDO.\n\n42. In part because he was responsible for so many operators, the principal maintenance inspector\nassigned to oversee the SabreTech facility in Miami was unable to provide effective oversight\nof the ValuJet heavy maintenance operations conducted at that facility.", "x": -0.16101300716400146, "y": -0.1575498878955841}, {"rank": 2, "i": 3519, "id": "087-valujet-flight-592.pdf#192", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 133"], "folder": "1990'ler", "score": 0.685175895690918, "text": "[087-valujet-flight-592.pdf › Sayfa 133]\n# Sayfa 133\n\n119\n2.6.6 SabreTech’s Preparation of the COMAT Shipment\nBased at least partially on the improper handling and tagging of the oxygen\ngenerators by SabreTech mechanics, the SabreTech stock clerk did not prepare or package the\ngenerators properly, or attach hazardous materials labeling that likely would have alerted\nValuJet’s ramp personnel to the hazardous contents of the shipment. Consequently, the Safety\nBoard concludes that the failure of SabreTech to properly prepare, package, and identify the\nunexpended chemical oxygen generators before presenting them to ValuJet for carriage aboard\nflight 592 was causal to the accident.\n2.6.7 Human Factors in the Maintenance Environment\nMany of the shortcomings discussed above (including the SabreTech mechanics’\nfailure to install safety caps, their improper maintenance entries, their use of improper tags, and\nthe inadequate communications between the maintenance shop floor and stores department)\nresult from human failures that might have been avoided if more attention were given to human\nfactors issues in the maintenance environment. Although it is unclear whether it may have\nplayed a role in this accident, the Safety Board is also concerned that the SabreTech mechanics\ndid not follow a consistent procedure for accomplishing shift changes or for tracking which\nspecific tasks were performed during each shift. The Safety Board has addressed this issue\npreviously127 and continues to believe that emphasis should be placed on proper procedures.\nThe Safety Board recognizes that the FAA has conducted workshops and\nsponsored research into the human factors issues relevant to air carrier maintenance. However,\nbased on previous accidents involving deficiencies in the performance of maintenance tasks, 128\nand the circumstances of this accident, the Safety Board concludes that some aspects of air\ncarrier maintenance programs do not adequately reflect the human factors issues involved in the\nair carrier maintenance environment. Therefore, the Safety Board believes that the FAA should\ninclude, in its development and approval of air carrier maintenance procedures and programs,\nexplicit consideration of human factors issues, including training, procedures development,\nredundancy, supervision, and the work environment, to improve the performance of personnel\nand their adherence to procedures.", "x": -0.16776250302791595, "y": -0.11171514540910721}, {"rank": 3, "i": 3541, "id": "087-valujet-flight-592.pdf#214", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 141"], "folder": "1990'ler", "score": 0.6728259325027466, "text": "[087-valujet-flight-592.pdf › Sayfa 141]\nSayfa 141\n\n127\ncertificate-holding entities, including an additional 20 Part 145 repair stations, the Safety Board\nconcludes that the PMI assigned to oversight of the SabreTech facility in Miami was unable to\nprovide effective oversight of the ValuJet heavy maintenance operations conducted at that\nfacility. Based on the circumstances of this accident, the Safety Board believes that the FAA\nshould review the volume and nature of the work requirements of its PMIs assigned to 14 CFR\nPart 145 Repair Stations that perform maintenance for Part 121 air carriers, and ensure that these\ninspectors have adequate time and resources to perform surveillance.\n2.10 Adequacy of FAA’s Hazardous Materials Program\nThe circumstances surrounding the fire on board ValuJet flight 592 raised\nconcerns about the effectiveness of the FAA’s hazardous materials program in addressing the\ndangers of chemical oxygen generators. Before the crash of flight 592, the FAA knew of five\nseparate incidents that occurred between August 10, 1986, and October 20, 1994, involving\nchemical oxygen generators that initiated fires in transportation. The worst of these fires\ndestroyed an American Trans Air DC-10 airplane on the ground at O’Hare International Airport,\nin Chicago, Illinois, on August 10, 1986. Immediately following this fire, the FAA issued a\nwarning to all air carriers about the hazards of chemical oxygen generators. However, despite the\nseries of chemical oxygen generator fires that occurred since 1986, the FAA took no substantive\naction before the ValuJet accident near Miami to address the safety hazard posed by these\ngenerators.\nFurther, although the FAA’s investigations of the chemical oxygen generator fires\nbetween 1986 through 1994 determined that the generators were being removed from airplanes\nduring maintenance, the FAA did not adjust its resources to inspect aircraft maintenance\nfacilities; no inspections regarding hazardous materials were performed at maintenance facilities\nduring this period.\nA factor in the failure of the FAA to develop an effective hazardous materials\nprogram to address the dangers of chemical oxygen generators might have been the inadequate\nallocation of resources to, and the inadequate emphasis on, compliance with the regulations\nregarding the transportation of hazardous materials by air. Before the ValuJet flight 592\naccident, resources had been shifted from the FAA’s hazardous materials program to the FAA’s\nsecurity program. Further, some security inspectors who performed the hazardous materials\ncompliance inspections used only 3 to 4 percent of their work time performing such inspections;\nthe remainder of their time was devoted to security issues. The Safety Board recognizes the\nimportance to the traveling public of allocating resources to airport and airline security issues;\nhowever, the FAA should have allocated sufficient resources to its hazardous materials program.\nThe Safety Board concludes that had the FAA responded to the prior chemical oxygen generator\nfires and allocated sufficient resources and initiated programs to address the potential hazards of\nthese generators, including issuing follow-up warnings and inspecting the shipping", "x": -0.20881474018096924, "y": -0.1983765810728073}, {"rank": 4, "i": 3478, "id": "087-valujet-flight-592.pdf#151", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 115"], "folder": "1990'ler", "score": 0.6507518291473389, "text": "[087-valujet-flight-592.pdf › Sayfa 115]\n# Sayfa 115\n\n101\nthe breached area of the cargo compartment. Thus, the electrical system was not a source of\nignition of the fire.\nThe investigation revealed that shortly before flight 592’s departure from Miami,\nfive boxes of unexpended chemical oxygen generators and three tires (two of which included\nwheel assemblies)119 were loaded into the forward cargo compartment in the area where the fire\ndamage was the most severe. The investigation further found that safety caps were not installed\nover the percussion caps that start a chemical reaction in the oxygen generators; lanyards for the\nretaining pins for the percussion caps’ spring-loaded actuation mechanism were not secured on\nseveral generators; and the generators were not packaged adequately to prevent generators from\nstriking the actuation mechanism or dislodging retaining pins on adjacent generators. Based on\nthe results of the Safety Board’s fire tests on chemical oxygen generators that were conducted\nnear Atlantic City, New Jersey, after the accident, the physical evidence of fire damage in the\nforward cargo compartment of the accident airplane, and the lack of other cargo capable of\ninitiating a fire in the forward cargo hold, the Safety Board concludes that the activation of one or\nmore chemical oxygen generators in the forward cargo compartment of the airplane initiated the\nfire on ValuJet flight 592.\nThe Safety Board’s analysis, therefore, first examines the accident sequence,\nincluding the initiation and propagation of the onboard fire, and the adequacy of air carrier and\nFAA efforts to minimize the hazards posed by fires in cargo compartments of commercial\nairplanes. The analysis also explores the pilots’ performance and actions when they became\naware of the fire shortly after takeoff from Miami, and the adequacy of smoke protection\nequipment and smoke evacuation procedures aboard air carrier aircraft. The analysis then\nexamines the circumstances surrounding the shipment of the oxygen generators and the\nprocedures for shipping company material and hazardous materials.\nThe analysis also evaluates concerns raised regarding the adequacy of the FAA’s\nhazardous materials program; ValuJet’s outsourcing of maintenance and training activity; the\ncompany’s oversight of its contract maintenance facilities; and the FAA’s oversight of ValuJet\nand ValuJet’s contract maintenance facilities. Finally, the analysis addresses the adequacy of\nValuJet’s procedures for manifesting lap children.\n2.2 Propagation and Detection of Fire\nThe first indication of a problem during the accident flight occurred at 1410:03,\napproximately 6 minutes after flight 592 took off from Miami, when the CVR recorded an\nunidentified sound, which prompted the captain to ask “What was that?” Simultaneously, an\nanomaly in the FDR altitude and airspeed parameters occurred consistent with a static pressure", "x": -0.20759961009025574, "y": -0.01915443129837513}, {"rank": 5, "i": 3512, "id": "087-valujet-flight-592.pdf#185", "p ard concludes that although the installation of safety caps would not\nlikely have prevented the oxygen generators from being transported on board flight 592, it is very\nlikely that had safety caps been installed, the generators would not have activated and the\naccident would not have occurred. Based on the Aircraft Maintenance Service Agreement\nbetween ValuJet and SabreTech, the safety caps that were required to be installed on the\nchemical oxygen generators removed from N802VV and N803VV were considered “peculiar”\nexpendables because they were not routinely carried in SabreTech’s inventory. (The removal of\nchemical oxygen generators was an infrequently performed task because of the generators’ 12-\nyear life limit.) It appears from the service agreement that ValuJet was responsible for supplying\npeculiar expendables to SabreTech. However, ValuJet did not ensure that the required safety\ncaps were obtained and installed. Although SabreTech never specifically requested that ValuJet\nsupply it with safety caps, one of the ValuJet technical representatives assigned to the SabreTech\nfacility during the reconfiguration of the MD-80s stated that he had observed generators without", "x": -0.14780032634735107, "y": -0.12119227647781372}, {"rank": 6, "i": 3545, "id": "087-valujet-flight-592.pdf#218", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 142"], "folder": "1990'ler", "score": 0.6416257619857788, "text": "[087-valujet-flight-592.pdf › Sayfa 142]\nchemical oxygen\ngenerators on ValuJet flight 592 have raised concerns that the practices, procedures, and training\nof the personnel involved in the identification and handling of undeclared hazardous materials\nhave remained inadequate.\nAlthough the FAA had developed more than 1,000 enforcement cases on undeclared\nshipments of hazardous materials in 1994 and 1995 combined, these cases were primarily\ndeveloped in reaction to a package in air cargo or a passenger bag that had\n\nbroken open , ValuJet directed SabreTech to\naccomplish the following maintenance tasks on both N802VV and N803VV:\n• Modify the existing right-hand three (3) oxygen mask passenger unitized\noxygen insert assemblies to four (4) oxygen mask passenger unitized oxygen\ninsert assemblies12 in accordance with ValuJet engineering order (E.O.) 15-\n3520-B0820.\n• Remove and replace all cabin chemical oxygen generators per ValuJet routine\nwork card 13 #0069 (CHEMICAL OXYGEN GENERATOR-\nREMOVE/INSTALL). (See appendix D.)\n1.1.2.1 Description of Chemical Oxygen Generators 14\nThe MD-80 passenger emergency oxygen system 15 is composed of oxygen\ngenerators that upon activation provide emergency oxygen to the occupants of the passenger\ncabin if cabin pressure is lost. 16 The oxygen generators, together with the oxygen masks, are\nmounted behind panels above or adjacent to passengers. If a decompression occurs, the panels\nare opened either by an automatic pressure switch or by a manual switch, and the mask\nassemblies are released.\n\n12 These generators come in three sizes and are referred to in this report as two-mask, three-mask, or four-mask\ngenerators, referring to the number of oxygen masks the generator is designed to supply. This report discusses only\nthe two sizes removed from the MD-80 aircraft—the two- and three-mask generators.\n13 A routine work card is a pre-printed step-by-step listing of the key steps for a particular maintenance task;\nmechanics are to sign by each step to indicate completion of the task. ValuJet’s work card 0069 was taken from a\nMcDonnell Douglas-generated work card for that task and was part of the maintenance package ValuJet purchased\nfrom McDonnell Douglas. The contents of the work card had not been changed by ValuJet, nor had ValuJet used the\nwork card before the removal of the oxygen generators from the MD-80 airplanes at SabreTech.\n14 Before discussing the mechanics’ activities related to the removal and replacement of the oxygen generators,\nthis report provides some background information on the description of the chemical oxygen generators and the\nguidance provided for the removal and disposition of the oxygen generators.\n15 The accident airplane, N904VJ (a DC-9), did not have a chemically generated oxygen system installed in its\ncabin. None of the DC-9-30 series airplanes use chemically generated oxygen systems.\n16 Chemical oxygen generators are also used in first aid portable oxygen units carried by some airlines.", "x": -0.11082764714956284, "y": -0.12342537939548492}], "runners_up": [{"rank": 9, "i": 3666, "id": "087-valujet-flight-592.pdf#339", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 242"], "folder": "1990'ler", "score": 0.6202505230903625, "text": "[087-valujet-flight-592.pdf › Sayfa 242]\n# Sayfa 242\n\n228\n33. On or about May 25, 1996, a ValuJet mechanic released for renin to service NSI3 VV, DC-\n9-32, after inspecting the nosewheel comparument, when the cover for the external power\nconnection in that compartment was missing.\n34. On ValuJet aircraft N922VV an FAA Inspector observed that a lavatory fire extinguisher\nwas not properly installed in that one of the discharge nozzies was not routed to the trash\ncontainer. As of Jume 6, 1996, ValuJet personnel were unable to provide documentetion for\ninsaalation of this type of fire extinguishers, which is properly installed on 2 Boeing 727/737\nai\nCorisidering the above, the FAA alleges that ValuJet violated the following sections of the\nFederal Aviation Regulations:\n1. 121.105 in that ValuJet failed to ensure that competent personnel and adequate facilities\nand equipment are available ar such points along the air carrier’s route as are necessary for\nthe proper servicing, maintecance, and preventative maintenance of airplanes and auxiliary\nequipment.\n2. 121.135(a) in that ValuJet failed to include in a reauired manua! instructions and\ninformation ne¢cessary to allow the personnel concemed to perform their duties and\nresponsibiliues with a high degree of safety.\n3. 1213(a) by engagmg in scheduled interstate air transportation within the 48 contiguous\nUnited States or the District of Coiumbia in violation of appropriate operations\nSpecifications.\n4. 121.367(a) in that ValuJet’s inspection program failed to insure that maintenance is\nperformed in accordance with the certificate holder's manual.\n5. 121.575 in that ValuJet performed maintenance and failed to have 2 training program to\nensure that each person who determines the adequacy of work done is fully informed about\nprocedures and techniques and new equipment in use aad is competent to perfonn his duties.\n6. 121.380 (a)(2) by failing to keep records documenting performance of the CPCP.\n7. 121.380(a)(2XGii) dy failing to keep accurate records of the time since last overhaul of\nall items inscalled on the aircraft which are required to be overhauled on a specified time\n8. 121.628(a)(5) in thar ValuJet aircraft contrary to the applicable conditions and limitations\ncontainec in the ValuJet MEL.\n9. 121.683 (a){1) by failing to keep complete pilot taining and qualification records.", "x": -0.07944976538419724, "y": -0.09910497814416885}, {"rank": 10, "i": 3557, "id": "087-valujet-flight-592.pdf#230", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 149"], "folder": "1990'ler", "score": 0.6195163130760193, "text": "[087-valujet-flight-592.pdf › Sayfa 149]\n# Sayfa 149\n\n135\n23. Because work card 0069 did not require an inspector’s signoff at the completion of each task,\nand there was no requirement for it to do so, there might have been no inspection of the\nmaintenance work related to the removal of the chemical oxygen generators. Had work card\n0069 required an inspector’s signoff, one of the inspectors involved with the two airplanes\nmight have noticed that safety caps had not been installed on any of the generators.\n\n24. Had work card 0069 required, and included instruc vented the oxygen\ngenerators from being transported on board flight 592, it is very likely that had safety caps\nbeen installed, the generators would not have activated and the accident would not have\noccurred.\n\n28. Improper maintenance activities and false entries pose a serious threat to aviation safety and\nmust be curtailed.\n\n29. Although the use of the wrong parts tag was an additional failure of SabreTech to perform\nmaintenance activity in accordance with prescribed maintenance procedures, it probably did\nnot contribute to the mishandling of the generators that ultimately led to the generators being\nloaded into the forward cargo compartment on flight 592.\n\n30. The maintenance duty time limitations of 14 CFR Part 121.377 may not be consistent with\nthe current state of scientific knowledge about factors contributing to fatigue among\npersonnel working in safety-sensitive transportation jobs.", "x": -0.11051756888628006, "y": -0.1365424543619156}, {"rank": 11, "i": 3558, "id": "087-valujet-flight-592.pdf#231", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 149"], "folder": "1990'ler", "score": 0.619001030921936, "text": "[087-valujet-flight-592.pdf › Sayfa 149]\nactivity in accordance with prescribed maintenance procedures, it probably did\nnot contribute to the mishandling of the generators that ultimately led to the generators being\nloaded into the forward cargo compartment on flight 592.\n\n30. The maintenance duty time limitations of 14 CFR Part 121.377 may not be consistent with\nthe current state of scientific knowledge about factors contributing to fatigue among\npersonnel working in safety-sensitive transportation jobs.\n\n31. The lack of a formal system in SabreTech’s shipping and receiving department, including\nprocedures for tracking the handling and disposition of hazardous materials, contributed to\nthe improper transportation of the generators aboard flight 592.", "x": -0.11654621362686157, "y": -0.09262363612651825}, {"rank": 12, "i": 3356, "id": "087-valujet-flight-592.pdf#29", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 28"], "folder": "1990'ler", "score": 0.6174125671386719, "text": "[087-valujet-flight-592.pdf › Sayfa 28]\n# Sayfa 28\n\n14\nfor N803VV. The passenger cabin oxygen system maintenance tasks were ultimately completed\nand signed off as completed on April 30 for N803VV and on May 5 for N802VV.26\nSabreTech maintenance records indicated a total of 72 chemical oxygen\ngenerators were removed from N802VV. Sixty-seven (identified as Douglas part No.\nBWM7001-503/Scott part No. 801386-06) were three-mask generators, and five (identified as\nDouglas part No. BWM7001-501/Scott Aviation part No. 801386-05) were two-mask generators.\nThe serial numbers of these generators, as recorded in the maintenance records, were checked\nagainst Scott Aviation factory records. The records indicated that most 27 of the generators were\nmanufactured in 1979 and 1980; although some three-mask generators were manufactured in\n1982.\nAlthough the available records did not indicate the total number of generators that\nwere removed from N803VV, interviews with various SabreTech employees indicated that about\nthe same number of generators were removed from N802VV and N803VV. No record of the\nserial numbers of the generators removed from N803VV was located.\nSabreTech maintenance records did indicate that six three-mask oxygen\ngenerators were removed from N830VV because they had been accidentally expended and\nrequired replacement but that the remaining generators on this airplane were not removed.\nOf the approximately 144 oxygen generators removed from N803VV and\nN802VV, approximately 6 were reported by mechanics to have been expended. There is no\nrecord indicating that any of the remaining approximately 138 oxygen generators removed from\nthese airplanes were expended.\nSix oxygen generators were located during a thorough search of the SabreTech\nfacil es-flight-1380.pdf › Sayfa 182", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 183", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 184", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 185", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 186", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 187", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 188", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 189", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 190", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 191", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 192", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 193"], "question": [-0.1420302391052246, -0.11114369332790375], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[087-valujet-flight-592.pdf › Sayfa 150]\n# Sayfa 150\n\n136\n32. The failure of SabreTech to properly prepare, package, and identify the unexpended chemical\noxygen generators before presenting them to ValuJet for carriage aboard flight 592 was\ncausal to the accident.\n\n33. Some aspects of air carrier maintenance programs do not adequately reflect the human factors\nissues involved in the air carrier maintenance environment.\n\n34. Contrary to its authority, ValuJet’s practices before the accident might have included the\nshipment of hazardous aircraft equipment items aboard company airplanes.\n\n35. The procedures of many air carriers for handling hazardous company materials (COMAT) are\nnot fully consistent with the hazardous materials regulations and the guidance provided on\nDecember 13, 1996, by the Research and Special Programs Administration on the transport\nof COMAT by air carriers.\n\n36. It is equally important that employees of both the air carrier and of relevant subcontractors be\nthoroughly versed and trained on the handling of hazardous materials and on the air carrier’s\nauthority to transport hazardous materials.\n\n37. Had ValuJet implemented a program to ensure that its subcontractor maintenance facility\nemployees were trained on the company’s lack of authority to transport hazardous materials\nand had received hazardous materials recognition training, SabreTech might not have\nmishandled the packaging and shipment of the chemical oxygen generators that were loaded\non flight 592.\n\n38. ValuJet failed to adequately oversee SabreTech and this failure was a cause of the accident.\n\n39. Before the accident, the Federal Aviation Administration’s (FAA) oversight of ValuJet did\nnot include any significant oversight of its heavy maintenance functions. The FAA’s\ninadequate oversight of ValuJet’s maintenance functions, including its failure to address\nValuJet’s limited oversight capabilities, contributed to this accident.\n\n40. The continuing lack of an explicit requirement for the principal maintenance inspector of a\nPart 121 operator to regularly inspect or surveil Part 145 repair stations that are performing\nheavy maintenance for their air carriers is a significant deficiency in the Federal Aviation\nAdministration’s oversight of the operator’s total maintenance program.\n\n41. The manner in which the Federal Aviation Administration’s Southern Region applied the\nresults of the Flight Standards District Office (FSDO) staffing level models was not\nsufficiently flexible to account for a rapidly growing and complex air carrier and resulted in\nan inadequate level of inspector resources in the Atlanta FSDO.\n\n42. In part because he was responsible for so many operators, the principal maintenance inspector\nassigned to oversee the SabreTech facility in Miami was unable to provide effective oversight\nof the ValuJet heavy maintenance operations conducted at that facility.\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[087-valujet-flight-592.pdf › Sayfa 133]\n# Sayfa 133\n\n119\n2.6.6 SabreTech’s Preparation of the COMAT Shipment\nBased at least partially on the improper handling and tagging of the oxygen\ngenerators by SabreTech mechanics, the SabreTech stock clerk did not prepare or package the\ngenerators properly, or attach hazardous materials labeling that likely would have alerted\nValuJet’s ramp personnel to the hazardous contents of the shipment. Consequently, the Safety\nBoard concludes that the failure of SabreTech to properly prepare, package, and identify the\nunexpended chemical oxygen generators before presenting them to ValuJet for carriage aboard\nflight 592 was causal to the accident.\n2.6.7 Human Factors in the Maintenance Environment\nMany of the shortcomings discussed above (including the SabreTech mechanics’\nfailure to install safety caps, their improper maintenance entries, their use of improper tags, and\nthe inadequate communications between the maintenance shop floor and stores department)\nresult from human failures that might have been avoided if more attention were given to human\nfactors issues in the maintenance environment. Although it is unclear whether it may have\nplayed a role in this accident, the Safety Board is also concerned that the SabreTech mechanics\ndid not follow a consistent procedure for accomplishing shift changes or for tracking which\nspecific tasks were performed during each shift. The Safety Board has addressed this issue\npreviously127 and continues to believe that emphasis should be placed on proper procedures.\nThe Safety Board recognizes that the FAA has conducted workshops and\nsponsored research into the human factors issues relevant to air carrier maintenance. However,\nbased on previous accidents involving deficiencies in the performance of maintenance tasks, 128\nand the circumstances of this accident, the Safety Board concludes that some aspects of air\ncarrier maintenance programs do not adequately reflect the human factors issues involved in the\nair carrier maintenance environment. Therefore, the Safety Board believes that the FAA should\ninclude, in its development and approval of air carrier maintenance procedures and programs,\nexplicit consideration of human factors issues, including training, procedures development,\nredundancy, supervision, and the work environment, to improve the performance of personnel\nand their adherence to procedures.\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[087-valujet-flight-592.pdf › Sayfa 141]\nSayfa 141\n\n127\ncertificate-holding entities, including an additional 20 Part 145 repair stations, the Safety Board\nconcludes that the PMI assigned to oversight of the SabreTech facility in Miami was unable to\nprovide effective oversight of the ValuJet heavy maintenance operations conducted at that\nfacility. Based on the circumstances of this accident, the Safety Board believes that the FAA\nshould review the volume and nature of the work requirements of its PMIs assigned to 14 CFR\nPart 145 Repair Stations that perform maintenance for Part 121 air carriers, and ensure that these\ninspectors have adequate time and resources to perform surveillance.\n2.10 Adequacy of FAA’s Hazardous Materials Program\nThe circumstances surrounding the fire on board ValuJet flight 592 raised\nconcerns about the effectiveness of the FAA’s hazardous materials program in addressing the\ndangers of chemical oxygen generators. Before the crash of flight 592, the FAA knew of five\nseparate incidents that occurred between August 10, 1986, and October 20, 1994, involving\nchemical oxygen generators that initiated fires in transportation. The worst of these fires\ndestroyed an American Trans Air DC-10 airplane on the ground at O’Hare International Airport,\nin Chicago, Illinois, on August 10, 1986. Immediately following this fire, the FAA issued a\nwarning to all air carriers about the hazards of chemical oxygen generators. However, despite the\nseries of chemical oxygen generator fires that occurred since 1986, the FAA took no substantive\naction before the ValuJet accident near Miami to address the safety hazard posed by these\ngenerators.\nFurther, although the FAA’s investigations of the chemical oxygen generator fires\nbetween 1986 through 1994 determined that the generators were being removed from airplanes\nduring maintenance, the FAA did not adjust its resources to inspect aircraft maintenance\nfacilities; no inspections regarding hazardous materials were performed at maintenance facilities\nduring this period.\nA factor in the failure of the FAA to develop an effective hazardous materials\nprogram to address the dangers of chemical oxygen generators might have been the inadequate\nallocation of resources to, and the inadequate emphasis on, compliance with the regulations\nregarding the transportation of hazardous materials by air. Before the ValuJet flight 592\naccident, resources had been shifted from the FAA’s hazardous materials program to the FAA’s\nsecurity program. Further, some security inspectors who performed the hazardous materials\ncompliance inspections used only 3 to 4 percent of their work time performing such inspections;\nthe remainder of their time was devoted to security issues. The Safety Board recognizes the\nimportance to the traveling public of allocating resources to airport and airline security issues;\nhowever, the FAA should have allocated sufficient resources to its hazardous materials program.\nThe Safety Board concludes that had the FAA responded to the prior chemical oxygen generator\nfires and allocated sufficient resources and initiated programs to address the potential hazards of\nthese generators, including issuing follow-up warnings and inspecting the shipping\n\u003c/parca>\n\n\u003cparca no=\"4\">\n[087-valujet-flight-592.pdf › Sayfa 115]\n# Sayfa 115\n\n101\nthe breached area of the cargo compartment. Thus, the electrical system was not a source of\nignition of the fire.\nThe investigation revealed that shortly before flight 592’s departure from Miami,\nfive boxes of unexpended chemical oxygen generators and three tires (two of which included\nwheel assemblies)119 were loaded into the forward cargo compartment in the area where the fire\ndamage was the most severe. The investigation further found that safety caps were not installed\nover the percussion caps that start a chemical reaction in the oxygen generators; lanyards for the\nretaining pins for the percussion caps’ spring-loaded actuation mechanism were not secured on\nseveral generators; and the generators were not packaged adequately to prevent generators from\nstriking the actuation mechanism or dislodging retaining pins on adjacent generators. Based on\nthe results of the Safety Board’s fire tests on chemical oxygen generators that were conducted\nnear Atlantic City, New Jersey, after the accident, the physical evidence of fire damage in the\nforward cargo compartment of the accident airplane, and the lack of other cargo capable of\ninitiating a fire in the forward cargo hold, the Safety Board concludes that the activation of one or\nmore chemical oxygen generators in the forward cargo compartment of the airplane initiated the\nfire on ValuJet flight 592.\nThe Safety Board’s analysis, therefore, first examines the accident sequence,\nincluding the initiation and propagation of the onboard fire, and the adequacy of air carrier and\nFAA efforts to minimize the hazards posed by fires in cargo compartments of commercial\nairplanes. The analysis also explores the pilots’ performance and actions when they became\naware of the fire shortly after takeoff from Miami, and the adequacy of smoke protection\nequipment and smoke evacuation procedures aboard air carrier aircraft. The analysis then\nexamines the circumstances surrounding the shipment of the oxygen generators and the\nprocedures for shipping company material and hazardous materials.\nThe analysis also evaluates concerns raised regarding the adequacy of the FAA’s\nhazardous materials program; ValuJet’s outsourcing of maintenance and training activity; the\ncompany’s oversight of its contract maintenance facilities; and the FAA’s oversight of ValuJet\nand ValuJet’s contract maintenance facilities. Finally, the analysis addresses the adequacy of\nValuJet’s procedures for manifesting lap children.\n2.2 Propagation and Detection of Fire\nThe first indication of a problem during the accident flight occurred at 1410:03,\napproximately 6 minutes after flight 592 took off from Miami, when the CVR recorded an\nunidentified sound, which prompted the captain to ask “What was that?” Simultaneously, an\nanomaly in the FDR altitude and airspeed parameters occurred consistent with a static pressure\n\u003c/parca>\n\n\u003cparca no=\"5\">\n[087-valujet-flight-592.pdf › Sayfa 129]\n\u0015\u0011\u0004 \u0017/G0A\u0003\n\u000e\u0003/G0A\u0013\u0003\u0013\u0004\n\u0003/G0A\u0003\n\u0006\u0007/G09\n/G0D\u0004 \u0006/G0A\u0013\u0004 \u0007/G09\u0004 \u0016/G09\u0014\u0014\u0017/G0A\b\u0016\u0006\u0007\u0003\u0004 \u0007\u0002\u0006\u0007\u0004 \u0017/G0A\u0003\n\u000e\u0003/G0A\u0013\u0003\u0013\u0004\n\u0003/G0A\u0003\n\u0006\u0007/G09\n/G0D\u0004 \u0006\n\u0003\n\u0002\u0006’\u0006\n\u0013/G09\u0017/G0D\u0004\u0014\u0006\u0007\u0003\n\b\u0006\n/G0D,\u0004\u0004\u0001\u0002\u0003\u0004*++\u0004/G0D\u0002/G09\u0017\n\u0013\u0004\u0010\u0017\n\u0007\u0002\u0003\n\u0004\n\u0003(\u0017\b\n\u0003\u0004\u0007\u0002\u0006\u0007\u0004\u0006\b\n\u0016\n\u0006\u0010\u0007\u0004\u0014\u0006/G0A\u0017\u0010\u0006\u0016\u0007\u0017\n\u0003\n/G0D\u0004\b/G0A/G0D\u0007\n\u0017\u0016\u0007\u0004\u0006\n\n/G09\u000e\u0003\n\u0006\u0007/G09\n/G0D\u0004/G09\u0010\u0004\u0006\b\n\u0016\n\u0006\u0010\u0007\u0004\u0017/G0D\b/G0A\n\u0004\u0016\u0002\u0003\u0014\b\u0016\u0006\n\u0004/G09\n\u0011\n\u0003/G0A\u0004\n\u0003/G0A\u0003\n\u0006\u0007/G09\n/G0D\u0004/G09\u0010\u0004\u0007\u0002\u0003\u0004/G0A\u0003\u0003\u0013\u0004\u0007/G09\u0004&\u0003\n\b\u0010\u0011\u0004\u0007\u0002\u0003\u0004\u000e\n\u0003/G0D\u0003/G0A\u0016\u0003\u0004/G09\u0010\u0004\n/G09\n\n\u0006\u0010\u0010\b\n\u0004/G0D\u0017\u0016\u0002\u0004\n\u0006\u0015\u0003\n/G0D\u0004/G09/G0A\u0004\u0016\u0002\u0003\u0014\b\u0016\u0006\n\u0004/G09\n\u0011\n\u0003/G0A\u0004\n\u0003/G0A\u0003\n\u0006\u0007/G09\n/G0D\u0004\u0016\u0017\n\n\u0003/G0A\u0007\n\u0011\u0004\b/G0A\u0004\u0007\u0002\u0003\b\n\u0004\u000e/G09/G0D/G0D\u0003/G0D/G0D\b/G09/G0A,\u0004\u0004\u0001\u0002\u0003\u0004\u000f\u0006\u0010\u0003\u0007\u0011\n\u0012/G09\u0006\n\u0013\u0004\b/G0D\u0004\u0016/G09/G0A\u0016\u0003\n/G0A\u0003\u0013\u0004\u0007\u0002\u0006\u0007\u0004/G09\u0007\u0002\u0003\n\u0004\u0002\u0006’\u0006\n\u0013/G09\u0017/G0D\u0004\u0006\b\n\u0016\n\u0006\u0010\u0007\u0004\u0016/G09\u0014\u000e/G09/G0A\u0003/G0A\u0007/G0D\u0004\u0014\b\n\u0002\u0007\u0004/G0A/G09\u0007\u0004\u0015\u0003\u0004\b\u0013\u0003/G0A\u0007\b\u0010\b\u0003\u0013\u0004/G09\n\u0004\u0002\u0006/G0A\u0013\n\u0003\u0013\n\u000e\n/G09\u000e\u0003\n\n\u0011,\u0004\u0004\u0001\u0002\u0003\n\u0003\u0010/G09\n\u0003\u0018\u0004\u0007\u0002\u0003\u0004\u000f\u0006\u0010\u0003\u0007\u0011\u0004\u0012/G09\u0006\n\u0013\u0004\u0015\u0003\n\b\u0003&\u0003/G0D\u0004\u0007\u0002\u0006\u0007\u0004\u0007\u0002\u0003\u0004*++\u0004/G0D\u0002/G09\u0017\n\u0013\u0004\n\u0003(\u0017\b\n\u0003\u0004\u0006\n\n\u0004\u0006\b\n\u0004\u0016\u0006\n\n\b\u0003\n/G0D\u0004\u0007/G09\n\u0013\u0003&\u0003\n/G09\u000e\u0004\u0006/G0A\u0013\u0004\b\u0014\u000e\n\u0003\u0014\u0003/G0A\u0007\u0004\u000e\n/G09\n\n\u0006\u0014/G0D\u0004\u0007/G09\u0004\u0003/G0A/G0D\u0017\n\u0003\u0004\u0007\u0002\u0006\u0007\u0004/G09\u0007\u0002\u0003\n\u0004\u0006\b\n\u0016\n\u0006\u0010\u0007\u0004\u0016/G09\u0014\u000e/G09/G0A\u0003/G0A\u0007/G0D\u0004\u0007\u0002\u0006\u0007\u0004\u0006\n\u0003\u0004\u0002\u0006’\u0006\n\u0013/G09\u0017/G0D\n\u0006\n\u0003\u0004 \u000e\n/G09\u000e\u0003\n\n\u0011\u0004 \b\u0013\u0003/G0A\u0007\b\u0010\b\u0003\u0013\u0004 \u0006/G0A\u0013\u0004 \u0007\u0002\u0006\u0007\u0004 \u0003\u0010\u0010\u0003\u0016\u0007\b&\u0003\u0004 \u000e\n/G09\u0016\u0003\u0013\u0017\n\u0003/G0D\u0004 \u0006\n\u0003\u0004 \u0003/G0D\u0007\u0006\u0015\n\b/G0D\u0002\u0003\u0013\u0004 \u0007/G09\u0004 /G0D\u0006\u0010\u0003\n\u0011\u0004 \u0002\u0006/G0A\u0013\n\u0003\u0004 \u0007\u0002/G09/G0D\u0003\n\u0016/G09\u0014\u000e/G09/G0A\u0003/G0A\u0007/G0D\u0004\u0006\u0010\u0007\u0003\n\u0004\u0007\u0002\u0003\u0011\u0004\u0006\n\u0003\u0004\n\u0003\u0014/G09&\u0003\u0013\u0004\u0010\n/G09\u0014\u0004\u0006\b\n\u0016\n\u0006\u0010\u0007,\n2.6.3 Lack of Safety Caps\nThe Safety Board concludes that although the installation of safety caps would not\nlikely have prevented the oxygen generators from being transported on board flight 592, it is very\nlikely that had safety caps been installed, the generators would not have activated and the\naccident would not have occurred. Based on the Aircraft Maintenance Service Agreement\nbetween ValuJet and SabreTech, the safety caps that were required to be installed on the\nchemical oxygen generators removed from N802VV and N803VV were considered “peculiar”\nexpendables because they were not routinely carried in SabreTech’s inventory. (The removal of\nchemical oxygen generators was an infrequently performed task because of the generators’ 12-\nyear life limit.) It appears from the service agreement that ValuJet was responsible for supplying\npeculiar expendables to SabreTech. However, ValuJet did not ensure that the required safety\ncaps were obtained and installed. Although SabreTech never specifically requested that ValuJet\nsupply it with safety caps, one of the ValuJet technical representatives assigned to the SabreTech\nfacility during the reconfiguration of the MD-80s stated that he had observed generators without\n\u003c/parca>\n\n\u003cparca no=\"6\">\n[087-valujet-flight-592.pdf › Sayfa 142]\nchemical oxygen\ngenerators on ValuJet flight 592 have raised concerns that the practices, procedures, and training\nof the personnel involved in the identification and handling of undeclared hazardous materials\nhave remained inadequate.\nAlthough the FAA had developed more than 1,000 enforcement cases on undeclared\nshipments of hazardous materials in 1994 and 1995 combined, these cases were primarily\ndeveloped in reaction to a package in air cargo or a passenger bag that had\n\nbroken open revealing its\ncontents, or evidence of leakage on the package or bag. Further, nearly all of the FAA’s\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[087-valujet-flight-592.pdf › Sayfa 151]\n# Sayfa 151\n\n137\n\n43. Had the Federal Aviation Administration responded to prior chemical oxygen generator fires\nand allocated sufficient resources and initiated programs to address the potential hazards of\nthese generators, including issuing follow-up warnings and inspecting the shipping\ndepartments of aircraft maintenance facilities, the chemical oxygen generators might not have\nbeen placed on flight 592.\n\n44. The limited authority of the U.S. Postal Service and the Federal Aviation Administration to\ninspect and thus successfully identify undeclared hazardous materials in U.S. mail loaded on\nairplanes creates a situation in which undeclared shipments of hazardous materials can\nreadily find their way on board passenger airplanes.\n\n45. Because of the lack of information regarding products approved for transportation by the\nBureau of Explosives, Research and Special Programs Administration cannot adequately ensure\nthat these products are being packaged and shipped safely in the transportation environment.\n\n46. ValuJet did not follow its internal procedures for boarding and accounting for lap children.\n\n47. It is essential that air carriers maintain easily accessible and accurate records of the names of\nboth ticketed and unticketed passengers aboard their flights for retrieval in the event of an\naccident or other emergency.\n3.2 Probable Cause\n\u0001\u0002\u0003\u0004\u0005\u0006\u0007\b/G09/G0A\u0006\n\u0004\u0001\n\u0006/G0A/G0D\u000e/G09\n\u0007\u0006\u0007\b/G09/G0A\u0004\u000f\u0006\u0010\u0003\u0007\u0011\u0004\u0012/G09\u0006\n\u0013\u0004\u0013\u0003\u0007\u0003\n\u0014\b/G0A\u0003/G0D\u0004\u0007\u0002\u0006\u0007\u0004\u0007\u0002\u0003\u0004\u000e\n/G09\u0015\u0006\u0015\n\u0003\u0004\u0016\u0006\u0017/G0D\u0003/G0D\u0004/G09\u0010\n\u0007\u0002\u0003\u0004\u0006\u0016\u0016\b\u0013\u0003/G0A\u0007\u0018\u0004\u0019\u0002\b\u0016\u0002\u0004\n\u0003/G0D\u0017\n\u0007\u0003\u0013\u0004\u0010\n/G09\u0014\u0004\u0006\u0004\u0010\b\n\u0003\u0004\b/G0A\u0004\u0007\u0002\u0003\u0004\u0006\b\n\u000e\n\u0006/G0A\u0003\u001a/G0D\u0004\u0016\n\u0006/G0D/G0D\u0004\u001b\u0004\u0016\u0006\n\n/G09\u0004\u0016/G09\u0014\u000e\u0006\n\u0007\u0014\u0003/G0A\u0007\u0004\u0007\u0002\u0006\u0007\u0004\u0019\u0006/G0D\n\b/G0A\b\u0007\b\u0006\u0007\u0003\u0013\u0004\u0015\u0011\u0004\u0007\u0002\u0003\u0004\u0006\u0016\u0007\u0017\u0006\u0007\b/G09/G0A\u0004/G09\u0010\u0004/G09/G0A\u0003\u0004/G09\n\u0004\u0014/G09\n\u0003\u0004/G09\n\u0011\n\u0003/G0A\u0004\n\u0003/G0A\u0003\n\u0006\u0007/G09\n/G0D\u0004\u0015\u0003\b/G0A\n\u0004\b\u0014\u000e\n/G09\u000e\u0003\n\n\u0011\u0004\u0016\u0006\n\n\b\u0003\u0013\u0004\u0006/G0D\u0004\u0016\u0006\n\n/G09\u0018\n\u0019\u0003\n\u0003\u0004\n\u0004 \u0007\u0002\u0003\u0004 \u0010\u0006\b\n\u0017\n\u0003\u0004 /G09\u0010\u0004 \u000f\u0006\u0015\n\u0003\u0001\u0003\u0016\u0002\u0004 \u0007/G09\u0004 \u000e\n/G09\u000e\u0003\n\n\u0011\u0004 \u000e\n\u0003\u000e\u0006\n\u0003\u0018\u0004 \u000e\u0006\u0016!\u0006\n\u0003\u0018\u0004 \u0006/G0A\ function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

    ["Embedding", "Metni, anlamını koruyacak şekilde sabit uzunlukta bir sayı listesine çeviren model çıktısı."],

    ["Normalize", "Okun boyu 1'e eşitlenir. Böylece yalnızca yönü karşılaştırılır; uzun metin, kısa metne göre avantaj kazanmaz."],
  ]);
}

/* ---------- ② Arama ---------- */
{
  const S = T.search;
  const c = card("s2", "2", `${int(T.corpus.n_chunks)} parça puanlandı, en iyi ${T.k} tanesi seçildi`, stepMs("search"),
    `Soru vektörü, indeksteki <b>her</b> parça vektörüyle karşılaştırıldı (kosinüs benzerliği). Sonuç ${int(T.corpus.n_chunks)} skor. Bunlar sıralandı ve en yüksek ${T.k} tanesi seçildi. Model yok, "anlama" yok: yalnızca geometri.`);
  const lo = S.histogram.edges[0], hi = S.histogram.edges.at(-1);

  // Histogram
  html(c, `<h3>Tüm skorların dağılımı</h3><p class="lede" style="margin:0 0 6px">Her çubuk bir skor aralığı, yüksekliği o aralıktaki parça sayısı. Parçaların çoğu ortada yığılır (soruyla ilgisiz). Seçilenler sağ uçta, kesim çizgisinin sağında.</p>`);
  {
    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Skor histogramı" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);
    [0, 0.5, 1].forEach(f => {
      const n = Math.round(maxC * f), y = Y(n);
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);
      const hitRect = svg("rect", { x: X(a), y: m.t, width: X(b) - X(a), height: H - m.t - m.b, style: "fill:transparent" }, s);
      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);
    const kx = X(S.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t - 6, y2: H - m.b + 34, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    svg("text", { x: kx - 6, y: m.t + 4, "text-anchor": "end", class: "ink", style: "font-weight:600",
      text: `kesim ${fmt(S.kth_score)} (#${T.k})` }, s);
    svg("text", { x: X(S.mean_score), y: m.t + 4, "text-anchor": "middle", class: "ink2", text: `ortalama ${fmt(S.mean_score, 2)}` }, s);
  }
  if (S.next_score != null) {
    const gap = S.kth_score - S.next_score;
    html(c, `<div class="callout"><b>Kıl payı:</b> ${T.k}. parça <b class="num">${fmt(S.kth_score)}</b>, ${T.k + 1}. parça <b class="num">${fmt(S.next_score)}</b>, fark yalnızca <b class="num">${fmt(gap, 4)}</b>. ` +
      (gap < 0.01 ? "Kesim bıçak sırtında. k'yi 1 artırmak Claude'a başka bir parça gösterirdi. Aşağıdaki tabloda kesimin hemen altında kalanlar da var." : "Seçilenler geri kalanlardan belirgin biçimde ayrışıyor.") + `</div>`);
  }

  // Klasör şeridi
  html(c, `<h3>Hangi klasör yarıştı?</h3><p class="lede" style="margin:0 0 6px">Her satır bir klasör, her nokta o klasördeki bir parça. Sağa gittikçe skor artar. Büyük noktalar seçilen ${T.k} parça.</p>`);
  {
    const pts = T.map.points, W = 1000, rowH = 30, m = { l: 150, r: 10, t: 6, b: 26 };
    const H = m.t + FOLDERS.length * rowH + m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Klasöre göre skorlar" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    FOLDERS.forEach((f, fi) => {
      const y = m.t + fi * rowH + rowH / 2;
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      const nh = hits.filter(h => h.folder === f).length;
      svg("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", class: nh ? "ink" : "", style: nh ? "font-weight:600" : "",
        text: `${f}${nh ? ` (${nh})` : ""}` }, s);
    });
    const kx = X(T.search.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t, y2: H - m.b, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    pts.forEach((p, i) => {
      if (p[4]) return;
      const y = m.t + p[3] * rowH + rowH / 2 + ((i * 7919) % 11 - 5);  // sabit titreşim: üst üste binmesin
      svg("circle", { cx: X(p[2]), cy: y, r: 2.2, style: `fill:${folderColor(p[3])};fill-opacity:.35` }, s);
    });
    hits.forEach(h => {
      const fi = FOLDERS.indexOf(h.folder), y = m.t + fi * rowH + rowH / 2;
      const d = svg("circle", { cx: X(h.score), cy: y, r: 6, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, s);
      hoverable(d, `<b>#${h.rank}</b> · ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
  }

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = v => pad + (v - x0) / (x1 - x0) * (W - 2 * pad), Y = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",
      style: "background:var(--page);border-radius:10px" }, c);
    P.forEach((p, i) => {
      if (p[4]) return;
      const d = svg("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, style: `fill:${folderColor(p[3])};fill-opacity:.45` }, s);
      hoverable(d, () => `${esc(T.map.labels[i])}<br>skor <b>${fmt(p[2])}</b>`);
    });
    const qx = X(T.map.question[0]), qy = Y(T.map.question[1]);
    hits.forEach(h => svg("line", { x1: qx, y1: qy, x2: X(h.x), y2: Y(h.y), style: "stroke:var(--ink);stroke-opacity:.18;stroke-width:1" }, s));
    hits.forEach(h => {
      const g = svg("g", { id: `map-hit-${h.rank}` }, s);
      svg("circle", { cx: X(h.x), cy: Y(h.y), r: 9, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, g);
      svg("text", { x: X(h.x), y: Y(h.y) + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700", text: h.rank }, g);
      hoverable(g, `<b>#${h.rank}</b> · skor ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    const star = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
      const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
      return `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

/* ---------- Sözlük ---------- */
{
  const c = card("gloss", null, "Hata ayıklama rehberi", null, "Kötü bir cevap aldığında bu sayfayı yukarıdan aşağıya şu sırayla oku:");
  html(c, `<table><tbody>
    <tr><td style="width:36%"><b>Tabloda doğru parça yok</b></td><td>Arama hatası. Soru başka bir konu kümesine düşmüş olabilir (haritaya bak) ya da parça zayıf bir vektör üretmiştir (kısa tablo satırı, bağlamsız metin). Çözüm yolları: soruyu yeniden ifade etmek, k'yi artırmak, hibrit arama (BM25).</td></tr>
    <tr><td><b>Doğru parça kıl payı kalanlar arasında</b></td><td>Kesim bıçak sırtında. k'yi biraz artırmak yetebilir.</td></tr>
    <tr><td><b>Doğru parça seçilmiş ama cevap yanlış</b></td><td>Üretim hatası. ④'te o parçaya atıf var mı? Yoksa Claude onu gözden kaçırmıştır. Prompt'u ya da parça sırasını gözden geçir.</td></tr>
    <tr><td><b>Parça metni bozuk</b></td><td>Veri hazırlığı hatası (load/chunk). Tablodaki "parça metni"ni aç. HTML artığı ya da yanlış başlık varsa sorun indekslemede.</td></tr>
    <tr><td><b>"Bulamadım" dedi</b></td><td>Doğru davranış olabilir. Önce tabloda cevabın gerçekten olmadığını doğrula.</td></tr>
  </tbody></table>`);
}
</script>
</body>
</html>
