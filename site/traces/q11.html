<title>RAG İzleme</title>

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 20px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
h3 { font-size: 15px; margin: 22px 0 6px; }
.num { font-variant-numeric: tabular-nums; }
.step-no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: var(--surface); font-size: 14px; flex: none; }
.dur { margin-left: auto; font-size: 13px; color: var(--ink2); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
  padding: 20px; margin: 18px 0; }
.lede { color: var(--ink2); margin: 2px 0 14px; }
.question { font-size: 20px; font-weight: 600; margin: 14px 0 10px; padding: 14px 18px;
  border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--ring); border-radius: 999px;
  padding: 3px 10px; background: var(--surface); }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0 4px; }
.term { background: var(--page); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
.term b { color: var(--ink); display: block; margin-bottom: 2px; }
.callout { border-left: 3px solid var(--warm); padding: 8px 12px; background: var(--page);
  border-radius: 0 8px 8px 0; font-size: 14px; margin: 12px 0; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg .ink { fill: var(--ink); } svg .ink2 { fill: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 8px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.tile { background: var(--page); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12.5px; color: var(--ink2); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
tr.hit-row { cursor: pointer; } tr.hit-row:hover td, tr.hl td { background: var(--page); }
tr.runner td { color: var(--muted); }
tr.cut td { border-bottom: 2px dashed var(--warm); padding: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.bar.runner { background: var(--axis); }
.path { word-break: break-word; }
.path small { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--page); padding: 12px;
  border-radius: 8px; font-size: 12.5px; max-height: 420px; overflow: auto; color: var(--ink2); }
.answer { font-size: 15.5px; line-height: 1.65; }
.answer h4 { font-size: 16px; margin: 18px 0 6px; } .answer p { margin: 6px 0; }
.answer table.md { width: auto; margin: 8px 0; } .answer ul { margin: 6px 0; padding-left: 22px; }
code { font-size: 0.92em; background: var(--page); padding: 1px 5px; border-radius: 4px; }
.cite { font: inherit; font-size: 12px; font-weight: 650; border: 0; border-radius: 6px; padding: 0 6px;
  margin: 0 1px; background: var(--accent-soft); color: var(--ink); cursor: pointer; vertical-align: 1px; }
.cite:hover, .cite:focus { background: var(--accent); color: #fff; outline: none; }
.cited-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.cg { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 13px;
  font-weight: 650; border: 2px solid var(--axis); color: var(--muted); }
.cg.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 360px; background: var(--ink);
  color: var(--surface); font-size: 12.5px; padding: 7px 10px; border-radius: 8px; opacity: 0;
  transition: opacity .08s; }
.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { r: 11; } }
.theme-btn { float: right; font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink2);
  border: 1px solid var(--ring); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
nav.toc a { font-size: 13px; color: var(--ink2); text-decoration: none; border-bottom: 1px dotted var(--axis); }

\nInvestigation Bureau (AIB). The ini tial findings summarized from the preliminar y\nreport published by the Ethiopia AIB were as follows:\n• The takeoff roll appeared normal, including normal values of left and right\nAOA.\n• Shortly after airborne, the DFDR recorded left and right AOA value deviated\nand reached value of 74.5° while the right AOA value reached 15.3°.\nAfterwards, the stick shaker activated and remained active until near the end of\nthe flight.\n• After autopilot engagement, there were small amplitude roll oscillations\naccompanied by lateral acceleration, rudder oscillations and slig ht heading\nchanges; these oscillations also continued after the autopilot disengaged.\n• After the autopilot disengaged, the DFDR recorded automatic aircraft nose\ndown (AND) trim command four times without flight crew’s input. As a result,\nthree motions of the stabilizer trim were recorded. The FDR data also indicated\nthat the crew utilized the electric manual trim to counter the automatic AND\ninput.\n• The crew performed runaway stabilizer checklist and put the STAB TRIM\ncutout switch to cutout position and conf irmed that the manual trim operation\nwas not working.\n1.18.3 Boeing Record on Stick Shaker Activation\nThe Boeing recorded 30 flights experienced stick-shaker on all Boeing model, in\nperiod of 2001 to 2018. The data shows 27 occurrences on Boeing 737 in which 21\nflights returned, 5 flights continued, 3 flights diverted to the nearest airport and 1\nflight where flight crew decision could not be determined . Three other occurrences\nwere on Boeing 757 and Boeing 767 where all flights returned.\nModel Returned Continued Diverted Unknown Total\n737-300 2 1 - 1 4\n737-700 2 - 2 - 4\n737-800 14 3 1 - 18\n737-8 (MAX) - 1 - - 1\n757-200 1 - - - 1\n767-200 1 - - - 1\n767-300 1 - - - 1\nTotal 21 5 3 1 30", "x": -0.18330268561840057, "y": -0.03874536603689194}, {"rank": 2, "i": 5142, "id": "137-germanwings-flight-9525.pdf#98", "path": "2010'ler/137-germanwin gained\naltitude before descending again. It collided with the surface of the ocean.\nThe reasons that led the co-pilot to take these actions could not be\ndetermined.\n11/10/1999 ATR-42 Air\nBotswana\nBotswana 1 The pilot, the only person on board, deliberately flew the aeroplane into\nthe ground by crashing at Gaborone airport. The validity of his licence had\nbeen revoked for medical reasons.\n19/12/1997 B737 Silk Air Indonesia 104 While the aircraft was in cruise at 35,000 ft, the flight recorders stopped\nrecording one after the other. The aeroplane suddenly started to descend.\nNo Mayday message was transmitted before or during the descent. The\naircraft crashed into a river. The safety investigation was not able to\nidentify any technical problem that would make it possible to explain the\naccident.\n09/05/1996 BAC 1-\n11\nBritish\nAirways\nFrance 0 The airplane was in cruise between Birmingham (UK) and Milan (Italy)\nwhen the first officer complained of feeling unwell, stating that he was\n\"frightened of the altitude\". The commander summoned the purser onto\nthe flight deck using a single chime of the cabin staff call system. The first\nofficer refused the offer of oxygen and a soft drink. He continued to show\nsymptoms of anxiety and stress, such that the purser felt unable to comply\nwith the standard incapacitation drill which calls for the crew member to be\nslid back in the seat with", "x": -0.10772079229354858, "y": 0.05054498836398125}, {"rank": 3, "i": 4285, "id": "102-air-florida-flight-90.pdf#5", "path": "1980'ler/102-air-florida-flight-90.pdf", "heading_path": ["Sayfa 6"], "folder": "1980'ler", "score": 0.5555979609489441, "text": "[102-air-florida-flight-90.pdf › Sayfa 6]\n# Sayfa 6\n\nNATIONAL TRANSPORTATION SAFETY BOARD\nWASHINGTON, D.C. 20594\nAIRCRAFT ACCIDENT REPORT\nAdopted: August 10, 1982\nAIR FLORIDA, INC., BOEING 737-222, N62AF,\nCOLLISION WITH 14TH STREET BRIDGE\nNEAR WASHINGTON NATIONAL AIRPORT\nWASHINGTON, D.C.\nJANUARY 13, 1982\nSYNOPSIS\nOn January 13, 1982, Air Florida Flight 90, a Boeing 737-222 (N62AF) was a\nscheduled flight to Fort Lauderdale, Florida, from Washington National Airport,\nWashington, D.C. There were 74 passengers, including 3 infants, and 5 crewmembers on\nboard. The flight's scheduled departure time was delayed about 1 hour 45 minutes due to\na moderate to heavy snowfall which necessitated the temporary closing of the airport.\nFollowing takeoff from runway 36, which was made with snow and/or ice\nadhering to the aircraft, the aircraft crashed at 1601 e.s.t. into the barrier wall of the\nnorthbound span of the 14th Street Bridge, which connects the District of Columbia with\nArlington County, Virginia, and plunged into the ice-covered Potomac River. It came to\nrest on the west side of the bridge 0.75 nmi from the departure end of runway 36. Four\npassengers and one crewmember survived the crash.\nWhen the aircraft hit the bridge, it struck seven occupied vehicles and then\ntore away a section of the bridge wall and bridge railing. Four persons in the vehicles\nwere killed; four were injured.\nThe National Transportation Safety Board determines that the probable cause\nof this aecident was the flightcrew's failure to use engine anti-ice during ground operation\nand takeoff, their decision to take off with snow/ice on the airfoil surfaces of the\naircraft, and the captain's failure to reject the takeoff during the early stage when his\nattention was called to anomalous engine instrument readings. Contributing to the\naccident were the prolonged ground delay between deicing and the receipt of ATC takeoff\nclearance during which the airplane was exposed to continual precipitation, the known\ninherent pitchup characteristics of the B-737 aircraft when the leading edge is\ncontaminated with even small amounts of snow or ice, and the limited experience of the\nflighterew in jet transport winter operations.\n1. FACTUAL INFORMATION\n11 History of the Flight\nOn January 13, 1982, Air Florida, Inc., Flight 90, a Boeing 737-222 (N62AF),\nwas a scheduled passenger flight from Washington National Airport, Washington, D.C., to\nthe Fort Lauderdale International Airport, Fort Lauderdale, Florida, with an intermediate\nstop at the Tampa International Airport, Tampa, Florida. Flight 90 was scheduled to", "x": -0.07773864269256592, "y": 0.04630224034190178}, {"rank": 4, "i": 1967, "id": "056-american-eagle-flight-4184.pdf#14", "path": "1990'ler/056-american-eagle-flight-4184.pdf", "heading_path": ["Sayfa 13"], "folder": "1990'ler", "score": 0.5439003705978394, "text": "[056-american-eagle-flight-4184.pdf › Sayfa 13]\n# Sayfa 13\n\nvii\nEXECUTIVE SUMMARY\nOn October 31, 1994, at 1559 Central Standard Time, an Avions de\nTransport Regional, model 72-212 (ATR 72), registration number N401AM,\nleased to and operated by Simmons Airlines, Incorporated, and doing business as\nAmerican Eagle flight 4184, crashed during a rapid descent after an uncommanded\nroll excursion. The airplane was in a holding pattern and was descending to a\nnewly assigned altitude of 8,000 feet when the initial roll excursion occurred. The\nairplane was destroyed by impact forces; and the captain, first officer, 2 flight\nattendants and 64 passengers received fatal injuries. Flight 4184 was a regularly\nscheduled passenger flight being conducted under 14 Code of Federal\nRegulations, Part 121; and an instrument flight rules flight plan had been filed.\nThe National Transportation Safety Board determines that the\nprobable causes of this accident were the loss of control, attributed to a sudden\nand unexpected aileron hinge moment reversal that occurred after a ridge of ice\naccreted beyond the deice boots because: 1) ATR failed to completely disclose to\noperators, and incorporate in the ATR 72 airplane flight manual, flightcrew\noperating manual and flightcrew training programs, adequate information\nconcerning previously known effects of freezing precipitation on the stability and\ncontrol characteristics, autopilot and related operational procedures when the ATR\n72 was operated in such conditions; 2) the French Directorate General for Civil\nAviation’s inadequate oversight of the ATR 42 and 72, and its failure to take the\nnecessary corrective action to ensure continued airworthiness in icing conditions;\nand 3) the French Directorate General for Civil Aviation's failure to provide the\nFederal Aviation Administration with timely airworthiness information developed\nfrom previous ATR incidents and accidents in icing conditions, as specified under\nthe Bilateral Airworthiness Agreement and Annex 8 of the International Civil\nAviation Organization.\nContributing to the accident were: 1) the Federal Aviation\nAdministration’s failure to ensure that aircraft icing certification requirements,\noperational requirements for flight into icing conditions, and Federal Aviation\nAdministration published aircraft icing information adequately accounted for the\nhazards that can result from flight in freezing rain and other icing conditions not\nspecified in 14 Code of Federal Regulations, Part 25, Appendix C; and 2) the\nFederal Aviation Administration's inadequate oversight of the ATR 42 and 72 to\nensure continued airworthiness in icing conditions.", "x": -0.17085076868534088, "y": -0.01634814217686653}, {"rank": 5, "i": 4282, "id": "102-air-florida-flight-90.pdf#2", "path": "1980'ler/102-air-florida-flight-90.pdf", "heading_path": ["Sayfa 3"], "folder": "1980'ler", "score": 0.5431499481201172, "text": "[102-air-florida-flight-90.pdf › Sayfa 3]\n# Sayfa 3\n\nAbstract continued\nThe National Transportation Safety Board determines that the probable cause of this\naecident was the flightcrew's failure to use engine anti-ice during ground operation and\ntakeoff, their decision to take off. with snow/ice on the airfoil surfaces of the aircraft,\nand the captain's failure to reject the takeoff during the early stage when his attention\nwas called to anomalous engine instrument readings. Contributing to the accident were\nthe prolonged ground delay between deicing and the receipt of ATC takeoff clearance\nduring which the airplane was exposed to continual precipitation, the known inherent\npitchup characteristics of the B-737 aircraft when the leading edge is contaminated with\neven small amounts of snow or ice, and the limited experience of the flighterew in jet\ntransport winter operations.\nLi", "x": -0.12171459943056107, "y": -0.018883369863033295}, {"rank": 6, "i": 4465, "id": "102-air-florida-flight-90.pdf#185", "path": "1980'ler/102-air-florida-flight-90.pdf", "heading_path": ["Sayfa 87"], "folder": "1980'ler", "score": 0.5401584506034851, "text": "[102-air-florida-flight-90.pdf › Sayfa 87]\n# Sayfa 87\n\n~32-\n33. The average impact loads on the passengers were within human\ntolerance. -However, the accident was not survivable because the\ncomplex dynamics of impact caused the destruction of the fuselage and\neabin floor which in turn caused loss of occupant restraint. The survival\nof four passengers and one flight attendant was attributed to the relative\nintegrity of the seating area where the tail section separated.\n34. The crash/fire/ rescue capability of Washington National Airport meets\nthe applicable regulations, which donot require water rescue equipment.\n35. Washington National Airport had water rescue equipment available;\nhowever, it had not been tested for use in ice-covered waters and it\nproved ineffective.\n36. The Washington National Airport. crash/fire/rescue personnel were\nnotified 3 minutes after the crash as tower personnel attempted to\ndetermine the aircraft's whereabouts.\n37. Rescue of the survivors was due solely to the expeditious response of a\nU.S. Park Police helicopter, and the heroic actions of the helicopter\nerew and of one bystander.\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the probable cause\nof this accident was the flightcrew's failure to use engine anti-ice during ground operation\nand takeoff, their decision to take off with snow/ice on the airfoil surfaces of the\naircraft, and the captain's failure to reject the takeoff during the early stage when his\nattention was called to anomalous engine instrument readings. Contributing to the\naccident were the prolonged ground delay between deicing and the receipt of ATC takeoff\nclearance during which the airplane was exposed to continual precipitation, the known\ninherent pitchup characteristics of the B-737 aireraft when the leading edge is\ncontaminated with even small amounts of snow or ice, and the limited experience of the\nflightcrew in jet transport winter operations.\n4. RECOMMENDATIONS\nAs a result of this accident and several others involving operations in snow and\nicing conditions the National Transportation Safety Board issued the following\nrecommendation to the FAA on January 28, 1982.\nImmediately notify all air carrier operators of the potential hazard\nassociated with engine inlet pressure probe icing, and require that they\nprovide flightecrews with information on how to recognize this hazard and\nrequiring that flighterews cross-check all engine instruments during the\napplication of takeoff power. (Class I, Urgent Action) (A-82-6)\nImmediately review the predeparture deicing procedures used by all air\ncarrier operators engaged in cold weather operations and the information\nprovided to flighterews to emphasize the inability of deicing fluid to\nprotect against reicing resulting from precipitation following deicing.\n(Class I, Urgent Action) (A-82-7)", "x": -0.16717106103897095, "y": -0.02822413668036461}, {"rank": 7, "i": 3338, "id": "087-valujet-flight-592.pdf#11", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 14"], "folder": "1990'ler", "score": 0.5393508672714233, "text": "[087-valujet-flight-592.pdf › Sayfa 14]\n# Sayfa 14\n\nx\nEXECUTIVE SUMMARY\nOn May 11, 1996, at 1413:42 eastern daylight t 5610662549734116}, {"rank": 8, "i": 5209, "id": "183-comair-flight-5191.pdf#13", "path": "2000'ler/183-comair-flight-5191.pdf", "heading_path": ["Sayfa 12"], "folder": "2000'ler", "score": 0.535408079624176, "text": "[183-comair-flight-5191.pdf › Sayfa 12]\n# Sayfa 12\n\nNational Transportation Safety Board\nAIRCRAFT\nAccident Report\nx\nex eCu t i v e su m mAr y\nOn August 27, 2006, about 0606:35 eastern daylight time, Comair flight 5191, a\nBombardier CL-600-2B19, N431CA, crashed during takeoff from Blue Grass Airport,\nLexington, Kentucky. The flight crew was instructed to take off from runway 22 but\ninstead lined up the airplane on runway 26 and began the takeoff roll. The airplane ran\noff the end of the runway and impacted the airport perimeter fence, trees, and terrain.\nThe captain, flight attendant, and 47 passengers were killed, and the first officer received\nserious injuries. The airplane was destroyed by impact forces and postcrash fire. The flight\nwas operating under the provisions of 14 Code of Federal Regulations Part 121 and was en\nroute to Hartsfield-Jackson Atlanta International Airport, Atlanta, Georgia. Night visual\nmeteorological conditions prevailed at the time of the accident.\nThe National Transportation Safety Board determines that the probable cause of\nthis accident was the flight crewmembers’ failure to use available cues and aids to identify\nthe airplane’s location on the airport surface during taxi and their failure to cross-check\nand verify that the airplane was on the correct runway before takeoff. Contributing to the\naccident were the flight crew’s nonpertinent conversation during taxi, which resulted in a\nloss of positional awareness, and the Federal Aviation Administration’s (FAA) failure to\nrequire that all runway crossings be authorized only by specific air traffic control (ATC)\nclearances.\nThe safety issues discussed in this report focus on the need for (1) improved flight\ndeck procedures, (2) the implementation of cockpit moving map displays or cockpit\nrunway alerting systems, (3) improved airport surface marking standards, and (4) ATC\npolicy changes in the areas of taxi and takeoff clearances and task prioritization. Safety\nrecommendations concerning these issues are addressed to the FAA.", "x": -0.12667149305343628, "y": 0.08336133509874344}], "runners_up": [{"rank": 9, "i": 2181, "id": "056-american-eagle-flight-4184.pdf#228", "path": "1990'ler/056-american-eagle-flight-4184.pdf", "heading_path": ["Sayfa 228"], "folder": "1990'ler", "score": 0.5286340117454529, "text": "[056-american-eagle-flight-4184.pdf › Sayfa 228]\n# Sayfa 228\n\n210\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the\nprobable causes of this accident were the loss of control, attributed to a sudden\nand unexpected aileron hinge moment reversal that occurred after a ridge of ice\naccreted beyond the deice boots because: 1) ATR failed to completely disclose to\noperators, and incorporate in the ATR 72 airplane flight manual, flightcrew\noperating manual and flightcrew training programs, adequate information\nconcerning previously known effects of freezing precipitation on the stability and\ncontrol characteristics, autopilot and related operational procedures when the ATR\n72 was operated in such conditions; 2) the French Directorate General for Civil\nAviation’s (DGAC’s) inadequate oversight of the ATR 42 and 72, and its failure\nto take the necessary corrective action to ensure continued airworthiness in icing\nconditions; and 3) the DGAC’s failure to provide the FAA with timely\nairworthiness information developed from previous ATR incidents and accidents\nin icing conditions, as specified under the Bilateral Airworthiness Agreement and\nAnnex 8 of the International Civil Aviation Organization.\nContributing to the accident were: 1) the Federal Aviation\nAdministration’s (FAA’s) failure to ensure that aircraft icing certification\nrequirements, operational requirements for flight into icing conditions, and FAA\npublished aircraft icing information adequately accounted for the hazards that can\nresult from flight in freezing rain and other icing conditions not specified in 14\nCode of Federal Regulations (CFR) Part 25, Appendix C; and 2) the FAA’s\ninadequate oversight of the ATR 42 and 72 to ensure continued airworthiness in\nicing conditions.", "x": -0.17728979885578156, "y": -0.03625744581222534}, {"rank": 10, "i": 3974, "id": "093-united-airlines-flight-173.pdf#43", "path": "1970'ler/093-united-airlines-flight-173.pdf", "heading_path": ["Sayfa 35"], "folder": "1970'ler", "score": 0.526712954044342, "text": "[093-united-airlines-flight-173.pdf › Sayfa 35]\n# Sayfa 35\n\n+ --\n-29-\n. ’ --- , -\n3.2 Probable Cause\nThe National Transportation Safety Board determined that the probable cause\nof the accident was the failure of the captain to monitor properly the aircraft’s\nfuel state and to properly respond to the low fuel state and the crew-member’s\nadvisories regarding fuel state. This resulted in fuel exhaustion to all engine‘s. His\ninattention resulted from preoccupation with a landing gear malfunction and\npreparations for a possible landing emergency.\nContributing to the accident was the failure of the other two flight\ncrewmembers either to fully comprehend the criticality of the fuel state or to\nsuccessfully communicate their concern to the captain.", "x": -0.09551162272691727, "y": 0.02631230093538761}, {"rank": 11, "i": 1945, "id": "044-eastern-air-lines-flight-401.pdf#42", "path": "1970'ler/044-eastern-air-lines-flight-401.pdf", "heading_path": ["Sayfa 43"], "folder": "1970'ler", "score": 0.524444043636322, "text": "[044-eastern-air-lines-flight-401.pdf › Sayfa 43]\n# Sayfa 43\n\n-39.\nwy UNITED STATES OF AMERICA\nJ NATIONAL TRANSPORTATION SAFETY BOARD\n| WASHINGTON, D.C.\nAPPENDIX H\nISSUED: May 2, 1973\nAdopted by the NATIONAL YRANSPORTATION SAFETY BOARD\nat its office Ia Washington, 0. C.\non the ith day of April 1973\n|g Meee ener esaser onus enesensevaenuneanae\n4 FORWARDED 70:\n4 Honorable Alexander P. Butterfield\n. Administrator\ni Federal Aviation Administration\n; Washington, BD. C. 20591\nane eet Manag St Maye Magee\nSOOO ROHe SHOR REEESESS HEHE EEE REEBOK\n“ys SAFETY RECOMMENDATIONS A~73-1) thru 13\nVhe National Transportation Safety Board's current investigation of\na fatal air carrier accident involving an Eastern Air Lines, Inc., L-lOli,\nN310FA, which crashed near Miami, Florida, on December 29, 1972, has\nrevealed two areas in which we believe early corrective section is needed\nto prevent the recurrence of similar accidents.\nThe airplane involved crashed about 6 minvtes after the crev had\nexecuted a missed approach in order to check the status of the nose gear.\nThe green, gear-sefe annunciator light had failed to illuminate when the\ngear handle was placed in the gear-down position during the initial approach,\nOw investigation indicates that at the time of the accident, all\nthree flight crewmembers were engrossed in an attempt to ascertain whether\nthe landing gear was safely extended, and they were not aware until just\nbefore impact that the airplane had departed the 2,0-fcot clearance alti-\ntude. The flight engineer was in the forward avionics center, located\nbeneath the cockpit floor and Just forward of the nose wheelwell, attempting\nto ascertain visually, by means of an optical sight tube, whether the gear\nwas locked down,\nThe flight engineer was not successful in his attexpt to view the\nrods on the nose landing gear linkage which indicate whether the gear is\nlocked down. If this is to be done at night, & light in the nose wheelwell\nmust be turned on by a switch on the captain's eyebrow panel. The person\nwho attempts to view the indicator rods must pull a knob located over an\noptical sight in order to remve a cover on the far end of the sight. In\nthis case, the flight engineer twice noted that he could see nothing -- that\nit was \"pitch dark.\" We do not know whether (1) the captain ever attempted", "x": -0.1261707991361618, "y": 0.027734948322176933}, {"rank": 12, "i": 3373, "id": "087-valujet-flight-592.pdf#46", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 41"], "folder": "1990'ler", "score": 0.522750198841095, "text": "[087-valujet-flight-592.pdf › Sayfa 41]\n# Sayfa 41\n\n27\n(e) Class E. A Class E cargo compartment is one on airplanes used only\nfor the carriage of cargo and in which—\n(1) [Reserved]\n(2) There is a separate approved smoke or fire detector system to give\nwarning at the pilot or flight engineer station;\n(3) There are means to shut off the ventilating airflow to, or within, the\ncompartment, and the controls for these means are accessible to the flight crew in\nthe crew compartment;\n(4) There are means to exclude hazardous quantities of smoke, flames, or\nnoxious gases, from the flight crew compartment; and\n(5) The required crew emergency exits are accessible under any cargo\nloading condition.\nTitle 14 CFR 25.855 states the following:\n(b) Class B through Class E cargo or baggage compartments, as defined in\n25.857, must have a liner, and the liner must be separate from (but may be\nattached to) the airplane structure.\n(c) Ceiling and sidewall liner panels of Class C and D compartments must\nmeet the test requirements of part III of appendix F of this part or other approved\nequivalent methods.42\n(d) All other materials used in the construction of the cargo or baggage\ncompartment must meet the applicable test criteria prescribed in part I of appendix\nF of this part or other approved equivalent methods.\n1.6.3.2 Safety Board Recommendations\nOn August 19, 1980, a Lockheed L-1011 operated by Saudi Arabian Airlines was\nforced to return shortly after departure from Riyadh, Saudia Arabia, because of an in-flight fire in\nthe aft section of the airplane. Even though the airplane landed successfully, the fire continued\nand spread throughout the cabin, killing all 301 occupants. The Safety Board participated in that\ninvestigation in accordance with the provisions of Annex 13 to the Convention on International\nCivil Aviation. As the result of findings from that accident, which concluded that a fire probably\noriginated in the aft cargo compartment from an undetermined source, on February 10, 1981, the\nSafety Board issued two safety recommendations asking the FAA to do the following:\nReevaluate the “Class D” certification of the L-1011 C-3 cargo compartment with\na view toward either changing the classification to “C,” requiring detection and\nextinguishing equipment, or changing the compartment liner material to insure\ncontainment of a fire of the types likely in the compartment while in flight. (A-\n81-012)\n[and]\n\n42 Part III of appendix F of 14 CFR 25 is contained in appendix F of this report.", "x": -0.10023866593837738, "y": -0.09901783615350723}], "kth_score": 0.535408079624176, "next_score": 0.5286340117454529, "max_score": 0.5773676037788391, "mean_score": 0.3887005150318146, "histogram": {"counts": [1, 3, 4, 21, 48, 77, 99, 139, 142, 130, 112, 103, 117, 107, 153, 172, 224, 273, 321, 385, 437, 478, 448, 488, 431, 350, 294, 210, 152, 109, 61, 41, 20, 12, 4, 2, 3, 1, 0, 2], "edges": [0.20164735615253448, 0.21104036271572113, 0.22043336927890778, 0.22982637584209442, 0.23921938240528107, 0.2486123889684677, 0.25800538063049316, 0.2673984169960022, 0.27679139375686646, 0.2861844301223755, 0.29557740688323975, 0.3049704432487488, 0.31436342000961304, 0.32375645637512207, 0.33314943313598633, 0.34254246950149536, 0.3519354462623596, 0.36132848262786865, 0.3707214593887329, 0.38011449575424194, 0.3895074725151062, 0.39890050888061523, 0.4082934856414795, 0.4176865220069885, 0.4270794987678528, 0.4364725351333618, 0.4458655118942261, 0.4552585482597351, 0.46465152502059937, 0.4740445613861084, 0.48343753814697266, 0.4928305745124817, 0.502223551273346, 0.511616587638855, 0.5210095643997192, 0.530402600 southwest-airlines-flight-1380.pdf › Sayfa 187", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 188", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 189", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 190", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 191", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 192", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 193"], "question": [-0.14356881380081177, 0.02620610222220421], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[184-lion-air-flight-610.pdf › Sayfa 171]\n# Sayfa 171\n\n169\nShortly after departure, the DFDR recorded the AOA sensor value became\nerroneous and the left stick shaker activated and remained activ e until near the end\nof the flight. The airspeed and altitude of the left air data system began to deviate\nfrom the corresponding right side values. The flight crew lost control of the aircraft\nand crashed at 28 Nm South East of Addis Ababa Bole Internatio nal Airport\nEthiopia.\nThe ICAO Annex 13 investigation is carried out by Ethiopia Aircraft Accident\nInvestigation Bureau (AIB). The ini tial findings summarized from the preliminar y\nreport published by the Ethiopia AIB were as follows:\n• The takeoff roll appeared normal, including normal values of left and right\nAOA.\n• Shortly after airborne, the DFDR recorded left and right AOA value deviated\nand reached value of 74.5° while the right AOA value reached 15.3°.\nAfterwards, the stick shaker activated and remained active until near the end of\nthe flight.\n• After autopilot engagement, there were small amplitude roll oscillations\naccompanied by lateral acceleration, rudder oscillations and slig ht heading\nchanges; these oscillations also continued after the autopilot disengaged.\n• After the autopilot disengaged, the DFDR recorded automatic aircraft nose\ndown (AND) trim command four times without flight crew’s input. As a result,\nthree motions of the stabilizer trim were recorded. The FDR data also indicated\nthat the crew utilized the electric manual trim to counter the automatic AND\ninput.\n• The crew performed runaway stabilizer checklist and put the STAB TRIM\ncutout switch to cutout position and conf irmed that the manual trim operation\nwas not working.\n1.18.3 Boeing Record on Stick Shaker Activation\nThe Boeing recorded 30 flights experienced stick-shaker on all Boeing model, in\nperiod of 2001 to 2018. The data shows 27 occurrences on Boeing 737 in which 21\nflights returned, 5 flights continued, 3 flights diverted to the nearest airport and 1\nflight where flight crew decision could not be determined . Three other occurrences\nwere on Boeing 757 and Boeing 767 where all flights returned.\nModel Returned Continued Diverted Unknown Total\n737-300 2 1 - 1 4\n737-700 2 - 2 - 4\n737-800 14 3 1 - 18\n737-8 (MAX) - 1 - - 1\n757-200 1 - - - 1\n767-200 1 - - - 1\n767-300 1 - - - 1\nTotal 21 5 3 1 30\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[137-germanwings-flight-9525.pdf › Sayfa 73]\nSayfa 73\n\nD-AIPX - 24 March 2015\n73\n23/01/2001 DC-3 Galaxy Air\nCargo\nUSA 2 The airplane departed an island runway in Alaska during dark night VFR\nconditions without filing a flight plan. The airplane collided with a volcanic\nmountain at 1,500 feet msl on the runway heading, 4.5 miles from the\nairport. The captain's medical certificate had previously been considered\nfor denial after serving 49 months in federal prison for cocaine distribution,\nbut after review, the FAA issued the captain a first class medical. FAA\nmedical records for the captain do not contain any record of monitoring for\nsubstance abuse. The first officer's medical had also been considered for\ndenial after an episode of a loss of consciousness. After a lengthy review\nand an appeal to the NTSB, the FAA issued the first officer a second-class\nmedical. A toxicological examination of the captain, conducted by the FAA,\nfound cocaine and metabolites of cocaine. A toxicological examination of\nthe first officer found two different prescription antidepressant drugs.\n31/10/1999 B767 EgyptAir North Atlantic\nOcean\n217 The aeroplane was in cruise at flight level FL330 with a flight crew\nconsisting of a Captain, a duty co-pilot and a relief co-pilot. The duty co-\npilot left the cockpit, and the relief co-pilot took his place in the right seat.\nEight minutes later, the Captain left the cockpit in turn, leaving the relief\nco-pilot alone. The autopilot was then disengaged and nose-down inputs\nwere recorded on the FDR. The aeroplane descended. The engines were\nshut down. The Captain returned to the cockpit and tried to take back\ncontrol of the aeroplane. The Captain repeatedly asked the co-pilot to help\nhim to pitch up the aeroplane (“pull with me”) but the latter continued to\ncommand the elevator to pitch nose down. The aeroplane regained\naltitude before descending again. It collided with the surface of the ocean.\nThe reasons that led the co-pilot to take these actions could not be\ndetermined.\n11/10/1999 ATR-42 Air\nBotswana\nBotswana 1 The pilot, the only person on board, deliberately flew the aeroplane into\nthe ground by crashing at Gaborone airport. The validity of his licence had\nbeen revoked for medical reasons.\n19/12/1997 B737 Silk Air Indonesia 104 While the aircraft was in cruise at 35,000 ft, the flight recorders stopped\nrecording one after the other. The aeroplane suddenly started to descend.\nNo Mayday message was transmitted before or during the descent. The\naircraft crashed into a river. The safety investigation was not able to\nidentify any technical problem that would make it possible to explain the\naccident.\n09/05/1996 BAC 1-\n11\nBritish\nAirways\nFrance 0 The airplane was in cruise between Birmingham (UK) and Milan (Italy)\nwhen the first officer complained of feeling unwell, stating that he was\n\"frightened of the altitude\". The commander summoned the purser onto\nthe flight deck using a single chime of the cabin staff call system. The first\nofficer refused the offer of oxygen and a soft drink. He continued to show\nsymptoms of anxiety and stress, such that the purser felt unable to comply\nwith the standard incapacitation drill which calls for the crew member to be\nslid back in the seat with\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[102-air-florida-flight-90.pdf › Sayfa 6]\n# Sayfa 6\n\nNATIONAL TRANSPORTATION SAFETY BOARD\nWASHINGTON, D.C. 20594\nAIRCRAFT ACCIDENT REPORT\nAdopted: August 10, 1982\nAIR FLORIDA, INC., BOEING 737-222, N62AF,\nCOLLISION WITH 14TH STREET BRIDGE\nNEAR WASHINGTON NATIONAL AIRPORT\nWASHINGTON, D.C.\nJANUARY 13, 1982\nSYNOPSIS\nOn January 13, 1982, Air Florida Flight 90, a Boeing 737-222 (N62AF) was a\nscheduled flight to Fort Lauderdale, Florida, from Washington National Airport,\nWashington, D.C. There were 74 passengers, including 3 infants, and 5 crewmembers on\nboard. The flight's scheduled departure time was delayed about 1 hour 45 minutes due to\na moderate to heavy snowfall which necessitated the temporary closing of the airport.\nFollowing takeoff from runway 36, which was made with snow and/or ice\nadhering to the aircraft, the aircraft crashed at 1601 e.s.t. into the barrier wall of the\nnorthbound span of the 14th Street Bridge, which connects the District of Columbia with\nArlington County, Virginia, and plunged into the ice-covered Potomac River. It came to\nrest on the west side of the bridge 0.75 nmi from the departure end of runway 36. Four\npassengers and one crewmember survived the crash.\nWhen the aircraft hit the bridge, it struck seven occupied vehicles and then\ntore away a section of the bridge wall and bridge railing. Four persons in the vehicles\nwere killed; four were injured.\nThe National Transportation Safety Board determines that the probable cause\nof this aecident was the flightcrew's failure to use engine anti-ice during ground operation\nand takeoff, their decision to take off with snow/ice on the airfoil surfaces of the\naircraft, and the captain's failure to reject the takeoff during the early stage when his\nattention was called to anomalous engine instrument readings. Contributing to the\naccident were the prolonged ground delay between deicing and the receipt of ATC takeoff\nclearance during which the airplane was exposed to continual precipitation, the known\ninherent pitchup characteristics of the B-737 aircraft when the leading edge is\ncontaminated with even small amounts of snow or ice, and the limited experience of the\nflighterew in jet transport winter operations.\n1. FACTUAL INFORMATION\n11 History of the Flight\nOn January 13, 1982, Air Florida, Inc., Flight 90, a Boeing 737-222 (N62AF),\nwas a scheduled passenger flight from Washington National Airport, Washington, D.C., to\nthe Fort Lauderdale International Airport, Fort Lauderdale, Florida, with an intermediate\nstop at the Tampa International Airport, Tampa, Florida. Flight 90 was scheduled to\n\u003c/parca>\n\n\u003cparca no=\"4\">\n[056-american-eagle-flight-4184.pdf › Sayfa 13]\n# Sayfa 13\n\nvii\nEXECUTIVE SUMMARY\nOn October 31, 1994, at 1559 Central Standard Time, an Avions de\nTransport Regional, model 72-212 (ATR 72), registration number N401AM,\nleased to and operated by Simmons Airlines, Incorporated, and doing business as\nAmerican Eagle flight 4184, crashed during a rapid descent after an uncommanded\nroll excursion. The airplane was in a holding pattern and was descending to a\nnewly assigned altitude of 8,000 feet when the initial roll excursion occurred. The\nairplane was destroyed by impact forces; and the captain, first officer, 2 flight\nattendants and 64 passengers received fatal injuries. Flight 4184 was a regularly\nscheduled passenger flight being conducted under 14 Code of Federal\nRegulations, Part 121; and an instrument flight rules flight plan had been filed.\nThe National Transportation Safety Board determines that the\nprobable causes of this accident were the loss of control, attributed to a sudden\nand unexpected aileron hinge moment reversal that occurred after a ridge of ice\naccreted beyond the deice boots because: 1) ATR failed to completely disclose to\noperators, and incorporate in the ATR 72 airplane flight manual, flightcrew\noperating manual and flightcrew training programs, adequate information\nconcerning previously known effects of freezing precipitation on the stability and\ncontrol characteristics, autopilot and related operational procedures when the ATR\n72 was operated in such conditions; 2) the French Directorate General for Civil\nAviation’s inadequate oversight of the ATR 42 and 72, and its failure to take the\nnecessary corrective action to ensure continued airworthiness in icing conditions;\nand 3) the French Directorate General for Civil Aviation's failure to provide the\nFederal Aviation Administration with timely airworthiness information developed\nfrom previous ATR incidents and accidents in icing conditions, as specified under\nthe Bilateral Airworthiness Agreement and Annex 8 of the International Civil\nAviation Organization.\nContributing to the accident were: 1) the Federal Aviation\nAdministration’s failure to ensure that aircraft icing certification requirements,\noperational requirements for flight into icing conditions, and Federal Aviation\nAdministration published aircraft icing information adequately accounted for the\nhazards that can result from flight in freezing rain and other icing conditions not\nspecified in 14 Code of Federal Regulations, Part 25, Appendix C; and 2) the\nFederal Aviation Administration's inadequate oversight of the ATR 42 and 72 to\nensure continued airworthiness in icing conditions.\n\u003c/parca>\n\n\u003cparca no=\"5\">\n[102-air-florida-flight-90.pdf › Sayfa 3]\n# Sayfa 3\n\nAbstract continued\nThe National Transportation Safety Board determines that the probable cause of this\naecident was the flightcrew's failure to use engine anti-ice during ground operation and\ntakeoff, their decision to take off. with snow/ice on the airfoil surfaces of the aircraft,\nand the captain's failure to reject the takeoff during the early stage when his attention\nwas called to anomalous engine instrument readings. Contributing to the accident were\nthe prolonged ground delay between deicing and the receipt of ATC takeoff clearance\nduring which the airplane was exposed to continual precipitation, the known inherent\npitchup characteristics of the B-737 aircraft when the leading edge is contaminated with\neven small amounts of snow or ice, and the limited experience of the flighterew in jet\ntransport winter operations.\nLi\n\u003c/parca>\n\n\u003cparca no=\"6\">\n[102-air-florida-flight-90.pdf › Sayfa 87]\n# Sayfa 87\n\n~32-\n33. The average impact loads on the passengers were within human\ntolerance. -However, the accident was not survivable because the\ncomplex dynamics of impact caused the destruction of the fuselage and\neabin floor which in turn caused loss of occupant restraint. The survival\nof four passengers and one flight attendant was attributed to the relative\nintegrity of the seating area where the tail section separated.\n34. The crash/fire/ rescue capability of Washington National Airport meets\nthe applicable regulations, which donot require water rescue equipment.\n35. Washington National Airport had water rescue equipment available;\nhowever, it had not been tested for use in ice-covered waters and it\nproved ineffective.\n36. The Washington National Airport. crash/fire/rescue personnel were\nnotified 3 minutes after the crash as tower personnel attempted to\ndetermine the aircraft's whereabouts.\n37. Rescue of the survivors was due solely to the expeditious response of a\nU.S. Park Police helicopter, and the heroic actions of the helicopter\nerew and of one bystander.\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the probable cause\nof this accident was the flightcrew's failure to use engine anti-ice during ground operation\nand takeoff, their decision to take off with snow/ice on the airfoil surfaces of the\naircraft, and the captain's failure to reject the takeoff during the early stage when his\nattention was called to anomalous engine instrument readings. Contributing to the\naccident were the prolonged ground delay between deicing and the receipt of ATC takeoff\nclearance during which the airplane was exposed to continual precipitation, the known\ninherent pitchup characteristics of the B-737 aireraft when the leading edge is\ncontaminated with even small amounts of snow or ice, and the limited experience of the\nflightcrew in jet transport winter operations.\n4. RECOMMENDATIONS\nAs a result of this accident and several others involving operations in snow and\nicing conditions the National Transportation Safety Board issued the following\nrecommendation to the FAA on January 28, 1982.\nImmediately notify all air carrier operators of the potential hazard\nassociated with engine inlet pressure probe icing, and require that they\nprovide flightecrews with information on how to recognize this hazard and\nrequiring that flighterews cross-check all engine instruments during the\napplication of takeoff power. (Class I, Urgent Action) (A-82-6)\nImmediately review the predeparture deicing procedures used by all air\ncarrier operators engaged in cold weather operations and the information\nprovided to flighterews to emphasize the inability of deicing fluid to\nprotect against reicing resulting from precipitation following deicing.\n(Class I, Urgent Action) (A-82-7)\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[087-valujet-flight-592.pdf › Sayfa 14]\n# Sayfa 14\n\nx\nEXECUTIVE SUMMARY\nOn May 11, 1996, at 1413:42 eastern daylight time, a Douglas DC-9-32 crashed\ninto the Everglades about 10 minutes after takeoff from Miami International Airport, Miami,\nFlorida. The airplane, N904VJ, was being operated by ValuJet Airlines, Inc., as flight 592. Both\npilots, the three flight attendants, and all 105 passengers were killed. Visual meteorological\nconditions existed in the Miami area at the time of the takeoff. Flight 592, operating under the\nprovisions of 14 CFR Part 121, was on an instrument flight rules flight plan destined for the\nWilliam B. Hartsfield International Airport, Atlanta, Georgia.\n\u0001\u0002\u0003\u0004\u0005\u0006\u0007\b/G09/G0A\u0006\n\u0004\u0001\n\u0006/G0A/G0D\u000e/G09\n\u0007\u0006\u0007\b/G09/G0A\u0004\u000f\u0006\u0010\u0003\u0007\u0011\u0004\u0012/G09\u0006\n\u0013\u0004\u0013\u0003\u0007\u0003\n\u0014\b/G0A\u0003/G0D\u0004\u0007\u0002\u0006\u0007\u0004\u0007\u0002\u0003\u0004\u000e\n/G09\u0015\u0006\u0015\n\u0003\u0004\u0016\u0006\u0017/G0D\u0003/G0D\u0004/G09\u0010\n\u0007\u0002\u0003\u0004\u0006\u0016\u0016\b\u0013\u0003/G0A\u0007\u0018\u0004\u0019\u0002\b\u0016\u0002\u0004\n\u0003/G0D\u0017\n\u0007\u0003\u0013\u0004\u0010\n/G09\u0014\u0004\u0006\u0004\u0010\b\n\u0003\u0004\b/G0A\u0004\u0007\u0002\u0003\u0004\u0006\b\n\u000e\n\u0006/G0A\u0003\u001a/G0D\u0004\u0016\n\u0006/G0D/G0D\u0004\u001b\u0004\u0016\u0006\n\n/G09\u0004\u0016/G09\u0014\u000e\u0006\n\u0007\u0014\u0003/G0A\u0007\u0004\u0007\u0002\u0006\u0007\u0004\u0019\u0006/G0D\n\b/G0A\b\u0007\b\u0006\u0007\u0003\u0013\u0004\u0015\u0011\u0004\u0007\u0002\u0003\u0004\u0006\u0016\u0007\u0017\u0006\u0007\b/G09/G0A\u0004/G09\u0010\u0004/G09/G0A\u0003\u0004/G09\n\u0004\u0014/G09\n\u0003\u0004/G09\n\u0011\n\u0003/G0A\u0004\n\u0003/G0A\u0003\n\u0006\u0007/G09\n 004 \u0010\b\n\u0003/G0D\u0004 \u0019\b\u0007\u0002\u0004 \u000e\n/G09\n\n\u0006\u0014/G0D\u0004 \u0007/G09\u0004 \u0006\u0013\u0013\n\u0003/G0D/G0D\u0004 \u0007\u0002\u0003\u0004 \u000e/G09\u0007\u0003/G0A\u0007\b\u0006\n\u003c/parca>\n\n\u003cparca no=\"8\">\n[183-comair-flight-5191.pdf › Sayfa 12]\n# Sayfa 12\n\nNational Transportation Safety Board\nAIRCRAFT\nAccident Report\nx\nex eCu t i v e su m mAr y\nOn August 27, 2006, about 0606:35 eastern daylight time, Comair flight 5191, a\nBombardier CL-600-2B19, N431CA, crashed during takeoff from Blue Grass Airport,\nLexington, Kentucky. The flight crew was instructed to take off from runway 22 but\ninstead lined up the airplane on runway 26 and began the takeoff roll. The airplane ran\noff the end of the runway and impacted the airport perimeter fence, trees, and terrain.\nThe captain, flight attendant, and 47 passengers were killed, and the first officer received\nserious injuries. The airplane was destroyed by impact forces and postcrash fire. The flight\nwas operating under the provisions of 14 Code of Federal Regulations Part 121 and was en\nroute to Hartsfield-Jackson Atlanta International Airport, Atlanta, Georgia. Night visual\nmeteorological conditions prevailed at the time of the accident.\nThe National Transportation Safety Board determines that the probable cause of\nthis accident was the flight crewmembers’ failure to use available cues and aids to identify\nthe airplane’s location on the airport surface during taxi and their failure to cross-check\nand verify that the airplane was on the correct runway before takeoff. Contributing to the\naccident were the flight crew’s nonpertinent conversation during taxi, which resulted in a\nloss of positional awareness, and the Federal Aviation Administration’s (FAA) failure to\nrequire that all runway crossings be authorized only by specific air traffic control (ATC)\nclearances.\nThe safety issues discussed in this report focus on the need for (1) improved flight\ndeck procedures, (2) the implementation of cockpit moving map displays or cockpit\nrunway alerting systems, (3) improved airport surface marking standards, and (4) ATC\npolicy changes in the areas of taxi and takeoff clearances and task prioritization. Safety\nrecommendations concerning these issues are addressed to the FAA.\n\u003c/parca>\n\nSoru: Why did Ethiopian Airlines Flight 302 crash after takeoff from Addis Ababa?", "parts": [{"kind": "system", "chars": 419}, {"kind": "chunk", "rank": 1, "folder": "2010'ler", "chars": 2390}, {"kind": "chunk", "rank": 2, "folder": "2010'ler", "chars": 3281}, {"kind": "chunk", "rank": 3, "folder": "1980'ler", "chars": 2629}, {"kind": "chunk", "rank": 4, "folder": "1990'ler", "chars": 2685}, {"kind": "chunk", "rank": 5, "folder": "1980'ler", "chars": 919}, {"kind": "chunk", "rank": 6, "folder": "1980'ler", "chars": 2889}, {"kind": "chunk", "rank": 7, "folder": "1990'ler", "chars": 2422}, {"kind": "chunk", "rank": 8, "folder": "2000'ler", "chars": 2066}, {"kind": "question", "chars": 83}]}, "generate": null};

  const y = ev.clientY + 16 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
function hoverable(node, html) {
  node.addEventListener("mousemove", ev => showTip(ev, typeof html === "function" ? html() : html));
  node.addEventListener("mouseleave", hideTip);
}
function card(id, no, title, dur, lede) {

/* Claude'un cevabı için küçük markdown çizici: başlık, tablo, liste, kalın, [n] atıf */
function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };

    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);

      const n = Math.round(maxC * f), y = Y(n);

      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);

      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);

    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",

    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

/* ---------- Sözlük ---------- */
{
  const c = card("gloss", null, "Hata ayıklama rehberi", null, "Kötü bir cevap aldığında bu sayfayı yukarıdan aşağıya şu sırayla oku:");
  html(c, `<table><tbody>
    <tr><td style="width:36%"><b>Tabloda doğru parça yok</b></td><td>Arama hatası. Soru başka bir konu kümesine düşmüş olabilir (haritaya bak) ya da parça zayıf bir vektör üretmiştir (kısa tablo satırı, bağlamsız metin). Çözüm yolları: soruyu yeniden ifade etmek, k'yi artırmak, hibrit arama (BM25).</td></tr>
    <tr><td><b>Doğru parça kıl payı kalanlar arasında</b></td><td>Kesim bıçak sırtında. k'yi biraz artırmak yetebilir.</td></tr>
    <tr><td><b>Doğru parça seçilmiş ama cevap yanlış</b></td><td>Üretim hatası. ④'te o parçaya atıf var mı? Yoksa Claude onu gözden kaçırmıştır. Prompt'u ya da parça sırasını gözden geçir.</td></tr>
    <tr><td><b>Parça metni bozuk</b></td><td>Veri hazırlığı hatası (load/chunk). Tablodaki "parça metni"ni aç. HTML artığı ya da yanlış başlık varsa sorun indekslemede.</td></tr>
    <tr><td><b>"Bulamadım" dedi</b></td><td>Doğru davranış olabilir. Önce tabloda cevabın gerçekten olmadığını doğrula.</td></tr>
  </tbody></table>`);
}
</script>
</body>
</html>
