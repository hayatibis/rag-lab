body { margin: 0; background: var(--page); color: var(--ink);

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 20px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
h3 { font-size: 15px; margin: 22px 0 6px; }
.num { font-variant-numeric: tabular-nums; }
.step-no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;

.dur { margin-left: auto; font-size: 13px; color: var(--ink2); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;

.lede { color: var(--ink2); margin: 2px 0 14px; }
.question { font-size: 20px; font-weight: 600; margin: 14px 0 10px; padding: 14px 18px;
  border-left: 4px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--ring); border-radius: 999px;
  padding: 3px 10px; background: var(--surface); }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0 4px; }
.term { background: var(--page); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
.term b { color: var(--ink); display: block; margin-bottom: 2px; }
.callout { border-left: 3px solid var(--warm); padding: 8px 12px; background: var(--page);
  border-radius: 0 8px 8px 0; font-size: 14px; margin: 12px 0; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg .ink { fill: var(--ink); } svg .ink2 { fill: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 8px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.tile { background: var(--page); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12.5px; color: var(--ink2); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
tr.hit-row { cursor: pointer; } tr.hit-row:hover td, tr.hl td { background: var(--page); }
tr.runner td { color: var(--muted); }
tr.cut td { border-bottom: 2px dashed var(--warm); padding: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.bar.runner { background: var(--axis); }
.path { word-break: break-word; }
.path small { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--page); padding: 12px;
  border-radius: 8px; font-size: 12.5px; max-height: 420px; overflow: auto; color: var(--ink2); }
.answer { font-size: 15.5px; line-height: 1.65; }
.answer h4 { font-size: 16px; margin: 18px 0 6px; } .answer p { margin: 6px 0; }
.answer table.md { width: auto; margin: 8px 0; } .answer ul { margin: 6px 0; padding-left: 22px; }
code { font-size: 0.92em; background: var(--page); padding: 1px 5px; border-radius: 4px; }
.cite { font: inherit; font-size: 12px; font-weight: 650; border: 0; border-radius: 6px; padding: 0 6px;
  margin: 0 1px; background: var(--accent-soft); color: var(--ink); cursor: pointer; vertical-align: 1px; }
.cite:hover, .cite:focus { background: var(--accent); color: #fff; outline: none; }
.cited-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.cg { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 13px;
  font-weight: 650; border: 2px solid var(--axis); color: var(--muted); }
.cg.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 360px; background: var(--ink);

  transition: opacity .08s; }
.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { r: 11; } }
.theme-btn { float: right; font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink2);

nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }

rocess.\nDuring the certification process, unintended MCAS activation was considered to\nhave a major effect in the normal flight envelope an d hazardous effect in the\noperational flight envelope. This means that a failure condition with a probability of\noccurrence less than or equal one -in-a hundred thousand (1E -5) chance would\nsuffice in normal flight envelope. At the time of the accident roughly 250 737 MAX\naircraft were in service with assumed average utilization of 2,000 flight hours, with\nthe total accumulated fleet at 500,000 flight hours. With two AOA sensors installed\non each aircraft, this means a failure occurred on the 737 MAX every 1 ,000,000\nflight hours (1E-6), more than the requirement probability of 1E -7. The same AOA\nsensor is used on other aircraft and the AOA failure rate is even lower.\nIf the probability of an undesirable failure condition is not below the maximum\nallowable probability for that category of hazard, redesign of the system should be\nconsidered. If the uncommanded MCAS failure condition had been assessed as\nmore severe than Major, the decision to rely on single AOA sensor should have\nbeen avoided.\n2.5.1.4 MCAS Function\nThe MCAS specifications called for the system to limit its ability to move the\nhorizontal stabilizer at the flaps up high rate trim up to a maximum of 2.5 °. The\nDFDR recorded the changes of horizontal stabilizer as changes in pitch trim unit. In\nthe accident flight, MCAS repeatedly moved the horizo ntal stabilizer based on a\ncombination of the erroneous AOA inputs and flight crew manual electric inputs.\nThe C aptain managed to control the aircraft with the pitch trim. The DFDR data\nshowed that control was mainta ined by keeping pitch trim above 5 units to counter\nthe repetitive MCAS activations. After transfer of control to the FO, the FO did not\napply sufficient manual electric trim to counter repetitive MCAS activations\nresulting in compounding mis-trim which required significant control column force.\nThe DFDR data indicated the aircraft descended and could not be controlled.\nColumn forces exceeded 100 lbs., which is more than the 75 lbs. limit set by the\nregulation (14 FAR 25.143).\nThe early design of MCAS allow ed a maximum stabilizer movement of 0 .6°, but it\nwas later revised and extended to 2.5 °. Boeing reasoned that unintended MCAS\nactivation due to erroneous AOA input was able to be managed by using elevator\nalone, electric stabilizer trim or by stabilizer tr im cutout switches. During manual\nflight, stabilizer manual electric trim is normally used to offload control column\nforces during mis -trim conditions. Without the awareness of the MCAS function,\nthe flight crew would", "x": -0.2822871804237366, "y": -0.1147877499461174}, {"rank": 2, "i": 5713, "id": "184-lion-air-flight-610.pdf#241", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 196"], "folder": "2010'ler", "score": 0.5774587988853455, "text": "[184-lion-air-flight-610.pdf › Sayfa 196]\nMCAS relying on input from a single\nAOA sensor, made this Flight Control System susceptible to a single failure of\nAOA malfunction.\nDuring the accident flight, the scenario was initiated by a single failure, a high bias\nin AOA sensor. This high bias resulted in several aircraft level effects including\nstick shaker, erroneous airspeed and altitude displays and MCAS after the flaps\nwere retracted.\nOver the last 17 ye ars in the Boeing 737 fleet alone, there were 25 events of\n\nstick\nshaker activation during or shortly after takeoff. Because of these events, Boeing\nshould have foreseen and assessed AOA sensor failures. The FCC controlling the\nMCAS is dependent on a single AOA source, the MCAS contribution to cumulative\nAOA effects should have been assessed.", "x": -0.20609743893146515, "y": -0.11516730487346649}, {"rank": 3, "i": 5533, "id": "184-lion-air-flight-610.pdf#61", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 51"], "folder": "2010'ler", "score": 0.5669238567352295, "text": "[184-lion-air-flight-610.pdf › Sayfa 51]\n# Sayfa 51\n\n49\nthe following: Air/Ground, Flap position, Angle of attack, Pitch rate, True Airspeed\nand Mach (Figure 13).\n\nFigure 13: MCAS System configuration\n\nThe AOA and Mach inputs are provided to each FCC by the associated Air Data\nInertial Reference Unit (ADIRU). Each ADIRU receives AOA information from\none of the two resolvers contained within the associated AOA sensor (i.e. the Left\nADIRU uses left AOA vane and the Right ADIRU uses the right AOA vane).\nInformation from the other resolver contained within the AOA sensor, along with\ndata from other sources, is provided to the Sta ll Management Yaw Damper\ncomputer (SMYD), which is used, along with data from other sources, for the\npurpose of calculating and sending commands to the Stall Warning System (SWS).\nAs originally delivered, the MCAS became active during manual, flaps -up flight\n(autopilot not engaged) when the AOA value received by the master FCC exceeded\na thresho ld based on Mach number. When activated, the MCAS provided a high\nrate automatic trim command to move the stabilizer AND. The magnitude of the\nAND command was based on the AOA and the Mach. After the non -normal\nmaneuver that result ed in the high AOA, and once the AOA fell below a reset\nthreshold, MCAS would move the stabilizer ANU to the original position and reset\nthe system. At any time, the stabilizer inputs could be stopped or reversed by the\npilots using their yoke -mounted elec tric stabilizer trim switches, which also reset\nthe system after a 5 second delay.\nThe latter behavior is based on the assumption that flight crews use the trim\nswitches to completely return the aircraft to neutral trim. In the FCC software\nversion current at the time of the accident, if the original elevated AOA condition\npersists for more than 5 seconds following an MCAS flight control law reset, the\nMCAS flight control law will command another stabilizer nose down trim input\n(with the magnitude based on the AOA and Mach sensed at that time).\nOn all Boeing 737 models, column cutout switches interrupt stabilizer commands,\neither from the auto -flight system (e.g. FCC) or the electric trim switches in a\ndirection opposite to elevator command. On the Boeing 737NG and Boeing 737", "x": -0.18289312720298767, "y": -0.07007193565368652}, {"rank": 4, "i": 5725, "id": "184-lion-air-flight-610.pdf#253", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 201"], "folder": "2010'ler", "score": 0.5544420480728149, "text": "[184-lion-air-flight-610.pdf › Sayfa 201]\nthis assumption is invalid.\n2.5.1.7 Summary\nThe MCAS function was not a fail -safe design a nd did not include redundancy. A\nsingle failure to the AOA sensor corresponding with the FCC commanding STS\nresulted in erroneous activation of MCAS. During the accident, flight crew\nreactions were different from and did not match the guidance for assumpti ons of\nflight crew behavior that were used when classifying the hazard severity of this\nfailure mode in the functional hazard\n\nassessment.", "x": -0.1948946714401245, "y": -0.08763997256755829}, {"rank": 5, "i": 5477, "id": "184-lion-air-flight-610.pdf#5", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 5"], "folder": "2010'ler", "score": 0.5472647547721863, "text": "[184-lion-air-flight-610.pdf › Sayfa 5]\n38\n1.6.5.2 Angle of Attack (AOA) Sensors ........................................... 43\n1.6.5.3 Horizontal Stabilizer ............................................................. 46\n1.6.5.4 MCAS Functional – Detailed Description ............................ 48\n1.6.5.5 Autopilot System and Flight Director (F/D) ......................... 50\n1.6.5.6 Auto-throttle (A/T) System ................................................... 51\n1.6.5.7 Stall Warning System\n\n........................................................... 52\n1.6.5.8 AUTO BRAKE DISARM Amber Light ............................... 53\n1.6.5.9 Take Off Configuration Warning Light ................................ 53", "x": -0.016276715323328972, "y": -0.030297616496682167}, {"rank": 6, "i": 5714, "id": "184-lion-air-flight-610.pdf#242", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 197"], "folder": "2010'ler", "score": 0.5445222854614258, "text": "[184-lion-air-flight-610.pdf › Sayfa 197]\n# Sayfa 197\n\n195\n\nDuring the single and multiple failure analysis from the air data system worst case\nscenario of “failure of one AOA followed by erroneous AOA”, Boeing concluded\nthat the effect would be hazardous until the flight crew recognized the problem and\ntook appropriate action to mitigate it. Boeing recognized that training would\nimprove flight crew recognition and response. The Airspeed Unreliable NNC and\nthe Runaway Stabilizer NNC provide guidance and training for recognition and\nresponse. However, the accident flight crew was unable to complete the Airspeed\nUnreliable NNC before the acci dent occurred nor were they able to recognize the\nneed for the runaway stabilizer NNC. Sinc e the training or the guidance for action s\ntaken in such situation were not provided, the effect category should have remained\nhazardous.\n2.5.1.3 Decision to Rely on Single Sensor\nThe Boeing 737 -8 (MAX) is equipped with two Flight Control Computers (FCCs)\nand two Angle of Attack (AOA) sensors. The Speed Trim System (STS), including\nthe MCAS function, is a flight control law contained within each of the two FCCs.\nSTS is only active in the master FCC fo r that flight. At aircraft power -up, the\nmaster FCC defaults to t he left side FCC; and will then alternate between the left\nand right FCC by flight. The master FCC is not affected by the position of the\nFlight Director switches. The FCCs receive inputs fro m several systems including\nthe air data inertial reference syste m (ADIRS). The AOA inputs are provided to\neach FCC by associated air data inertial reference unit (ADIRU). Each ADIRU\nreceives AOA information from one of the two resolvers contained within the\nassociated AOA sensor (i.e. the Left ADIRU uses left AOA vane and the Right\nADIRU uses the right AOA vane).\nThe MCAS software uses input from a single AOA sensor only. Certain failure or\nanomalies of the AOA sensor corresponding to the master FCC controlling STS can\ngenerate an unintended activation of MCAS. Anticipa ted flight crew response\nincluding aircraft nose up (ANU) electric trim commands (which reset MCAS) may\ncause the flight crew difficultly in controlling the aircraft.\nErroneous AOA signals are not frequent events. Boeing reported that 25 activations\nof stick shaker mostly due to AOA failures occurred in 737 aircraft for the past 17\nyears during more than 240 million flight hours. The MCAS architecture with\nredundant AOA inputs for MCAS could have been considered but was not required\nbased on the FHA classification of Major.\nThe accident flight was the first flight of the day therefore after powering up the\naircraft, the left FCC acted as the operating STS channel and received input from\nleft AOA sensor. The DFDR showed that on the accident flight, the left A OA\nsensor had a high bias 21° when compared to the right AOA sensor.\nThe FCC received the biased AOA data and, after the flaps were retracted,\ncommanded MCAS. As stated earlier, a combination of repetitive MCAS -\ncommands coupled with insufficient flight crew electric trim inputs and not using\nthe STAB TRIM CUTOUT switches can lead to significant miss -trim and loss of\ncontrol.", "x": -0.25761210918426514, "y": -0.0910474881529808}, {"rank": 7, "i": 5776, "id": "184-lion-air-flight-610.pdf#304", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 249"], "folder": "2010'ler", "score": 0.5412794351577759, "text": "[184-lion-air-flight-610.pdf › Sayfa 249]\n# Sayfa 249\n\n247\nAccording to the Enhanced Digital Flight Control System (EDFCS) system safety\nanalysis (SSA), the worst -case failure mode of the Speed Trim function was\nconsidered to be a runaway of the horizontal s tabilizer trim actuator (HSTA) as a\nresult of sensor or FCC failures, or FCC -to-stabilizer trim motor (STM) wiring\nfailures. The SSA indicated that during the runaway, the flight crew is able to detect\nthe fault by noticing the continuous running of the t rim mechanical wheels in the\nflight deck, or by the change in column force necessary to maintain pitch attitude, or\nthrough change in aircraft pitch attitude. The SSA indicated that the flight crew\ncompensates for the runaway through:\n• column input in the direction opposing the uncommanded trim until activation of\nthe column activated trim cutout switches, or\n• activation of the main electric trim by either flight crew in a direction opposing\nthe uncommanded motion, which overrides the FCC commanded trim runa way,\nor\n• moving the guarded stabilizer trim cutout switches30 located on the aisle stand to\nthe CUTOUT position, or restraining the stabilizer trim wheel,\n• Speed/ Stab Trim runaways are limited by the inherent stabilizer trim motor rate\nand column actuated trim cut-out switches. Sufficient means are available for the\nflight crew to maintain control and recover from the runaway31.\nD.2 MCAS Functional – Detailed Description:\nThe MCAS is a function within the Speed Trim System and, when activated, moves\nthe stabilizer during non-normal flaps up, high angle of attack maneuvers to provide\na desirable increase in stick force gradient and a reduced pitch up tendency. Similar\nto the Speed Trim Function, the MCAS function is also a flight control law 32\ncontained within each of the two FCCs. MCAS is only active in the m aster FCC for\nthat flight. At aircraft power-up, the master FCC defaults to the left side FCC; and\nwill then alternate bet ween the left and right FCC by flight. The master FCC is not\naffected by the posit ion of the Flight Director switches. The FCCs rec eive inputs\nfrom several systems including the air data inertial reference system (ADIRS).\nReference Figure 1 Diagram showing the components of MCAS\nSpecific to the MCAS, the control law commands the stabilizer t rim as a function of\nthe following: Air/Ground, Flap position, Angle of attack, Pitch rate, True Airspeed\nand Mach.\n\n30 Two stabilizer trim cutout switches on the control stand can be used to stop the main electric and autopilot trim inputs to\nthe stabilizer trim actuator. The s witches can be set to NORMAL or CUTOUT. If either switch is moved to CUTOUT,\nboth the electric and autopilot trim inputs are disconnected from the stabilizer trim motor. NORMAL is the default\nposition to enable operation of the electric and autopilot trim.\n31 MCAS failures do allow the stabilizer to move at the flaps down trim rate, even if the flaps are up, but even the flaps\ndown trim rate is a limit, albeit faster than the normal flaps up rate. Column cutout is always available in the forward\ndirection but may not be available in the aft direction for certain MCAS failures.\n32 MCAS is an open loop flight control law.", "x": -0.19740234315395355, "y": -0.09806960076093674}, {"rank": 8, "i": 5784, "id": "184-lion-air-flight-610.pdf#312", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 254"], "folder": "2010'ler", "score": 0.5410394668579102, "text": "[184-lion-air-flight-610.pdf › Sayfa 254]\n# Sayfa 254\n\n252\nBoeing advised that these assump tions are used across all Boeing models when\nperforming functional hazard assessments of flight control systems and that these\nassumptions are consistent with the requirements contained in 14 CFR 25.671 &\n25.672 and within the guidance contained in FAA Adv isory Circular (AC) 25 -7C\nfor compliance evaluation of 14 CFR 25.14339.\nIn March 2016, Boeing determined that MCAS should be revised to improve wings-\nlevel, flaps up, low Mach stall characteristics and identification. The MCAS was\nrevised such that dependi ng on AOA, it would be capable of commanding\nincremental stabilizer to a maximum of 2.5 degrees at low Mach decreasing to a\nmaximum of 0.65 degrees at high Mach.\nThe requirements document also indicated that the preliminary functional hazard\nassessments of MCAS were re -evaluated by pilot assessments in the motion\nsimulator and by engineering analysis and determined to have not change d in\nhazard classification as a result of the increase in MCAS authority to 2.5 degrees.\nTable 2 Results of preliminary hazard assessment for revised MCAS authority\nHazard Hazard\nclassification\nUncommanded MCAS function operation up to its maximum\nauthority\nMajor*\nUncommanded MCAS function operation equivalent to 3\nsecond mistrim **\nMajor\n\n* Major Classification:\nThe uncommanded MCAS command to the maximum nose down authority at low\nMach numbers was evaluated in the 737 MAX cab and rated as Minor. The high\nMach uncommanded MCAS command and subsequent recovery is the critical flight\nphase in establishing the hazard rating for erroneous MCAS commands. According to\nBoeing, engineering analysis determined that the existing high Mach evaluations\nremain valid as the aerodynamic configuration had not changed significantly since the\npre-flight evaluations, and the MCAS authority limit at high Mach did not change\nsignificantly in the flight test update. As the ratings for these high Mach evaluations\nwere more severe than for low Mach, the overall flight envelope hazard ratings remain\nthe same as the pre-flight evaluations.\n\n** Piloted Simulation not Required:\nAccording to Boeing, Engineering analysis determined no low Mach piloted\nsimulation to be required as this failure is less critical than MCAS function\noperation to maximum authority. Stabilizer motion for 3 seconds would not reach\nmaximum authority in low Mach conditions. The existing high Mach evaluations\nremain valid as the aerodynam ic configuration has not changed significantly since\nthe preflight evaluations, and the 3 second stabilizer motion is the same magnitude.\n\n39 FAR 25.143(g) Controllability and Maneuverability – General, Requires that changes of gradient that occur with changes\nof load factor must not cause undue difficulty in maintaining control of the ai rplane, and local gradients must not be so\nlow as to result in a danger of over -controlling. Reference is made to CFR amendment 25 -129 for the described FAR\n25.143(g) requirement.", "x": -0.22838041186332703, "y": -0.2055133581161499}], "runners_up": [{"rank": 9, "i": 5712, "id": "184-lion-air-flight-610.pdf#240", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 196"], "folder": "2010'ler", "score": 0.5409809350967407, "text": "[184-lion-air-flight-610.pdf › Sayfa 196]\nSayfa 196\n\n194\nTo recover, the flight crew could: 1) stop making manual electric trim inputs (which\nwould stop resetting MCAS), or 2) make sufficient (long duration) manual electric\ntrim inputs to return the aircraft to a trimmed state, or 3) use the stabilizer trim\ncutout procedure to stop all electr ic trim commands and control trim using the\nmanual trim wheels. If one of these three flight crew trim responses is not used, a\nsubsequent combination of MCAS commands and short -duration (insufficient)\nflight crew electric trim inputs may result in a mis-trimmed condition that cannot be\ncontrolled.\nA combination of repetitive MCAS -commanded coupled with flight crew electric\ntrim input led to a flight condition that considerably increased the flight crew\nworkload of maintaining control. The previous LNI043 flight showed that repetitive\nMCAS-commanded stabilizer movement was able to be countered by the flight\ncrew by repeatedly t rimming out erroneous aircraft nose down trim (option 2 noted\nabove) and was only able to be stopped by Stabilizer Trim Cutout switch es (option\n3 noted above), enabling the flight crew to safely continue flight and land in Jakarta.\nBoeing reasoning that the stabilizer cutout is available but not required is incorrect.\nDuring the FHA, Boeing did not adequately assess the effect of repet itive MCAS\nactivation. The repetitive MCAS -commands coupled with insufficient flight crew\nelectric trim inputs, may have led to increasing flight crew workload.\n2.5.1.2.5 Single and Multiple Failure Analysis\n14 FAR 25.671 (c) states that “probable malfunctions must have only minor effects\non control system operation and must be capable of being readily counteracted by\nthe pilot”. This includes any single failure, such as the AOA sensor malfunction.\nBoeing performed a single and multiple failure analysis to help vali date system\nfunctional hazard ass essments (FHAs), design assurance level (DAL) assertions,\nand extended oper ations (ETOPs). The analysis considered the ai r data system’s\nworst-case scenario of “Erroneous L eft & Right Air Data” and “Loss of one AOA\nfollowed by Erroneous AOA” (both dual failures ). The air data systems worst case\nscenario would be that the three altitude s and airspeed display’s showed different\nvalues from each other. This unreliable airspeed/altitude failure effect was deemed\npotentially cata strophic prior to flight crew recognition of the issue. Boeing\nconsidered that the loss of one AOA and erroneous AOA as two independent events\nwith distinct probabilities. The combined f ailure event probability was assessed as\nbeyond extremely improbable, hence complying with the safety requirements for\nthe Air Data System. However, the design of MCAS relying on input from a single\nAOA sensor, made this Flight Control System susceptible to a single failure of\nAOA malfunction.\nDuring the accident flight, the scenario was initiated by a single failure, a high bias\nin AOA sensor. This high bias resulted in several aircraft level effects including\nstick shaker, erroneous airspeed and altitude displays and MCAS after the flaps\nwere retracted.\nOver the last 17 ye ars in the Boeing 737 fleet alone, there were 25 events of", "x": -0.1983116716146469, "y": -0.07266446202993393}, {"rank": 10, "i": 5579, "id": "184-lion-air-flight-610.pdf#107", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 95"], "folder": "2010'ler", "score": 0.5373181104660034, "text": "[184-lion-air-flight-610.pdf › Sayfa 95]\n# Sayfa 95\n\n93\ncountered the MCAS activation using the control column trim switches. The\nproblem was solved using the runaway stabilizer procedure.\nDuring the execution of second case of the third scenario, the AOA bias was set on\nthe right AOA sensor prior t he flight and the FCC A remained as master. As a\nresult, no erroneous MCAS activations were expected, however, the left stick\nshaker activated and ALT DISAGREE and IAS DISAGREE was noticed. The\nobservation found that the erroneous airspeed was quickly noti ce by identifying the\npitch limit indicator position on the affected PFD.\nThe third case of the third scenario was to observe the conditions that occurred\nduring the accident flight. The flight crews were instructed to clean up the aircraft\nafter takeoff, begin the Airspeed Unreliable and Altitude Disagree NNCs, and\nrespond to ATC requests. The control column electric trim was initially used to\ncounter MCAS, then insufficient control column electric trim was used similar to\nthe accident flight. The observations were as follows:\n1. Altitude was not able to be maintained with aft control column force if short\nactivations of electric trim result in an accumulation of mis -trim from MCAS\nnose down trim commands.\n2. Repeated MCAS activations increased the flight crew workload and required\nmore attention to counter it.\n3. The recreated accident flight ATC communication was distracting.\n4. It was hard to get through the Airspeed Unreliable NNC. Being unable to\ncomplete the airspeed unreliable NNC and/or not being able to i dentify reliable\nairspeed/altitude increased the flight crew work load..\n5. Discussion arose regarding flight crew request to ATC to confirm altitude. This\nbehavior indicated that the flight crew and the ATC likely did not realize that\nthe altitude displayed on the radar was almost certainly Mode C / Mode S data\nfrom the aircraft and was no more reliable than what was displayed in the flight\ndeck. Hearing ATC providing an altitude might cause the flight crew to\nconsider the altimeter was reliable when trying t o diagnose the problem. A\ncomment was made that prior accidents had involved flight crews requesting\naltitude information from ATC. Suggestions made included additional\ninformation/training to flight crews and possibly have the controller reply to\nsuch requests with, “Your aircraft is reporting altitude as …. feet” to remind\nflight crew how the system works. .\nThe fourth case of the third scenario was for the flight crew to feel the control\ncolumn forces during single and repetitive MCAS activations while t rying to keep\nthe aircraft level. The AOA bias was introduced and the MCAS function activated.\nThe observations were as follows:\n1. Significant aft control column force was necessary to hold the control\ncolumn after one activation of MCAS.\n2. After two full appl ications of MCAS and no restoring electric manual trim\nup, one participant characterized the control column force as “too heavy.”", "x": -0.22165757417678833, "y": -0.057242948561906815}, {"rank": 11, "i": 5722, "id": "184-lion-air-flight-610.pdf#250", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 200"], "folder": "2010'ler", "score": 0.5371779203414917, "text": "[184-lion-air-flight-610.pdf › Sayfa 200]\nSayfa 200\n\n198\n2.5.1.5 Revision to MCAS Authority\nThe original MCAS design limited its authority to 0.6° of stabilizer movement, out\nof a physical maximum of 4. 2° of nose-down movement. Later in the development\nprogram, the limit was increased to 2.5 ° after flight tests showed that additional\nmovement of the stabilizer was required duri ng elevated AOA conditions at low\nspeeds.\nThe behavior of an aircraft in a high angle -of-attack stall is difficult to model in\nadvance purely by analysis and during flight tests on a new aircraft, it is not\nuncommon to modify the control software to refine the aircraft’s flight\ncharacteristics.\nThe higher limit meant that each time MCAS was triggered in a low Mach\nenvironment, it caused a much greater movement of the stabilizer than was\nspecified in that original safety analysis document. As MCAS pushed the nose\ndown, the flight crew could respond by operating the electric stabilizer trim switch\nlong enough to reset the stabilizer movement. However, if the reset was not fully\ncompleted, subsequent activation of MCAS would move the aircraft further nose -\ndown. At a limit of 2.5°, two cycles of MCAS without correction would have been\nenough to reach the maximum nose -down condition. At this point, the flight crew\nwould experience extreme difficulty to maintain control of the aircraft.\nAfter the change, FHA was reviewed but not all documents including Stabilizer\nSystem Safety Assessment were updated. Boeing briefed the FAA flight test prior\nto the certification flight testing that the MCAS envelope (low speed MCAS with\nthe greater 2.5° authority) was expanding and it also updated the MCAS description\nin the EDFCS System Description document and provided it to the FAA.\nWithout documenting the updated analysis in the stabilizer SSA document, the FAA\nflight control systems specialists may not have been aware of the design change.\nBoeing did not submit the required documentation and the FAA did not sufficiently\noversee Boeing ODA.\n2.5.1.6 Decision to not Include Description in FCOM or Differences Training\nBoeing and the FAA engaged in extensive discussion about the appropriate content\nof Boeing 737-8 (MAX) training and manuals for a period of several years prior to\nBoeing 737 -8 ( MAX) certification. During discussions and communications with\nthe FAA beginning in M arch 2016, Boeing proposed removing MCAS from the\nFCOM and differences tables . The supporting rationale was discussed between\nBoeing and FAA and accepted by FAA, but not formally documented in meeting\nminutes. Specifically, 14 FAR 25.1585 (b) states that “ Information or procedures\nnot directly rela ted to airworthiness or not under t he control of the crew must not\nbe included, nor must any procedure that is accepted as basic airmanship.”\nBoeing considered that MCAS function is automatic, without any control input\nfrom the flight crew and that it would operate in the background. Boein g also\nconsidered that the procedure required to respon d to any MCAS function was no\ndifferent than the existing procedures and that crews were not expected to encounter\nMCAS in normal operation. The discussions did not consider the failure scenari o\nseen on the accident flight.", "x": -0.20058707892894745, "y": -0.13234162330627441}, {"rank": 12, "i": 5777, "id": "184-lion-air-flight-610.pdf#305", "path": "2010'ler/184-lion-air-flight-610.pdf", "heading_path": ["Sayfa 250"], "folder": "2010'ler", "score": 0.5366909503936768, "text": "[184-lion-air-flight-610.pdf › Sayfa 250]\n# Sayfa 250\n\n248\nFigure 1 Diagram showing the components of MCAS33\n\nThe AOA and Mach inputs are provided to each FCC by the associated air data\ninertial reference unit (ADIRU). Each ADIRU receives AOA information from one\nof the two resolvers contained within the associated AOA sensor (i.e. the Left\nADIRU uses left AOA vane and the Right ADIRU uses the right AOA vane).\nInformation from the other resolver co ntained within the AOA sensor, along with\ndata from other sources, is provided to the stall management yaw damper computer\n(SMYD), which is used, along with data from other sources, for the purpose of\ncalculating and sending commands to the Stall Warning System (SWS)34.\nAs originally delivered, the MCAS became active during manual, flaps -up flight\n(autopilot not engaged) when the AOA value received by the master FCC exceeded a\nthreshold based on Mach number. When activated, the MCAS provided a high rate\nautomatic trim command to move the stabilizer AND. The magnitude of the AND\ncommand was based on the AOA and the Mach. After the non-normal maneuver that\nresulted in the high AOA, and once the AOA fell below a reset threshold, MCAS\nwould move the stabilizer ANU to the original position and reset the system. At any\ntime, the stabilizer inputs could be stopped or reversed by the pilots using their yoke -\nmounted electric stabilizer trim switches, which also reset the system after a 5 second\ndelay.\nThe latter behavior is based on the assumption that flight crews use the trim switches\nto completely return the aircraft to neutral trim. In the FCC software version current\nat the time of the accident, if the original elevated AOA condition persists for more\nthan 5 seconds following an MCAS flight control law reset, the MCAS flight control\nlaw will command another stabilizer nose down trim input (with the magnitude based\non the AOA and Mach sensed at that time).\nOn all 737 models , column cutout switches interrupt stabilizer commands, either\nfrom the autoflight system (e.g. FCC) or the electric trim switches in a direction\nopposite to elevator command. On the 737NG and MAX, two column cutout\n\n33 Reference Boeing 737 MAX MCAS briefing, dated March 25, 2019.\n34 The SWS operates the control column stick shakers to alert the crew when the airplane is nearing an aerodynamic stall.", "x": -0.1936253160238266, "y": -0.055782657116651535}], "kth_score": 0.5410394668579102, "next_score": 0.5409809350967407, "max_score": 0.5815954208374023, "mean_score": 0.3185123801231384, "histogram": {"counts": [6, 15, 59, 143, 223, 238, 175, 102, 71, 74, 92, 113, 159, 223, 345, 361, 462, 517, 471, 455, 445, 404, 296, 240, 146, 109, 76, 47, 29, 7, 17, 9, 11, 6, 6, 11, 7, 1, 1, 2], "edges": [0.  "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 176", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 177", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 178", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 179", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 180", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 181", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 182", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 183", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 184", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 185", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 186", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 187", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 188", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 189", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 190", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 191", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 192", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 193"], "question": [-0.20426002144813538, -0.0033371523022651672], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[184-lion-air-flight-610.pdf › Sayfa 198]\nSayfa 198\n\n196\nAs discussed earlier, the condition remained hazardous since the training or the\nguidance for action taken in such situation were no t adequately provided. To\ncomply with the safety requirement of a “hazardous failure condition,” the aircraft\nis supposed to rely on sensors that have less than a one -in-10-million (1E-7) chance\nof failing. Generally, that means taking measurements from tw o sensors. A\nhazardous failure condition depending on a single sensor should have been avoided\nin the certification process.\nDuring the certification process, unintended MCAS activation was considered to\nhave a major effect in the normal flight envelope an d hazardous effect in the\noperational flight envelope. This means that a failure condition with a probability of\noccurrence less than or equal one -in-a hundred thousand (1E -5) chance would\nsuffice in normal flight envelope. At the time of the accident roughly 250 737 MAX\naircraft were in service with assumed average utilization of 2,000 flight hours, with\nthe total accumulated fleet at 500,000 flight hours. With two AOA sensors installed\non each aircraft, this means a failure occurred on the 737 MAX every 1 ,000,000\nflight hours (1E-6), more than the requirement probability of 1E -7. The same AOA\nsensor is used on other aircraft and the AOA failure rate is even lower.\nIf the probability of an undesirable failure condition is not below the maximum\nallowable probability for that category of hazard, redesign of the system should be\nconsidered. If the uncommanded MCAS failure condition had been assessed as\nmore severe than Major, the decision to rely on single AOA sensor should have\nbeen avoided.\n2.5.1.4 MCAS Function\nThe MCAS specifications called for the system to limit its ability to move the\nhorizontal stabilizer at the flaps up high rate trim up to a maximum of 2.5 °. The\nDFDR recorded the changes of horizontal stabilizer as changes in pitch trim unit. In\nthe accident flight, MCAS repeatedly moved the horizo ntal stabilizer based on a\ncombination of the erroneous AOA inputs and flight crew manual electric inputs.\nThe C aptain managed to control the aircraft with the pitch trim. The DFDR data\nshowed that control was mainta ined by keeping pitch trim above 5 units to counter\nthe repetitive MCAS activations. After transfer of control to the FO, the FO did not\napply sufficient manual electric trim to counter repetitive MCAS activations\nresulting in compounding mis-trim which required significant control column force.\nThe DFDR data indicated the aircraft descended and could not be controlled.\nColumn forces exceeded 100 lbs., which is more than the 75 lbs. limit set by the\nregulation (14 FAR 25.143).\nThe early design of MCAS allow ed a maximum stabilizer movement of 0 .6°, but it\nwas later revised and extended to 2.5 °. Boeing reasoned that unintended MCAS\nactivation due to erroneous AOA input was able to be managed by using elevator\nalone, electric stabilizer trim or by stabilizer tr im cutout switches. During manual\nflight, stabilizer manual electric trim is normally used to offload control column\nforces during mis -trim conditions. Without the awareness of the MCAS function,\nthe flight crew would\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[184-lion-air-flight-610.pdf › Sayfa 196]\nMCAS relying on input from a single\nAOA sensor, made this Flight Control System susceptible to a single failure of\nAOA malfunction.\nDuring the accident flight, the scenario was initiated by a single failure, a high bias\nin AOA sensor. This high bias resulted in several aircraft level effects including\nstick shaker, erroneous airspeed and altitude displays and MCAS after the flaps\nwere retracted.\nOver the last 17 ye ars in the Boeing 737 fleet alone, there were 25 events of\n\nstick\nshaker activation during or shortly after takeoff. Because of these events, Boeing\nshould have foreseen and assessed AOA sensor failures. The FCC controlling the\nMCAS is dependent on a single AOA source, the MCAS contribution to cumulative\nAOA effects should have been assessed.\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[184-lion-air-flight-610.pdf › Sayfa 51]\n# Sayfa 51\n\n49\nthe following: Air/Ground, Flap position, Angle of attack, Pitch rate, True Airspeed\nand Mach (Figure 13).\n\nFigure 13: MCAS System configuration\n\nThe AOA and Mach inputs are provided to each FCC by the associated Air Data\nInertial Reference Unit (ADIRU). Each ADIRU receives AOA information from\none of the two resolvers contained within the associated AOA sensor (i.e. the Left\nADIRU uses left AOA vane and the Right ADIRU uses the right AOA vane).\nInformation from the other resolver contained within the AOA sensor, along with\ndata from other sources, is provided to the Sta ll Management Yaw Damper\ncomputer (SMYD), which is used, along with data from other sources, for the\npurpose of calculating and sending commands to the Stall Warning System (SWS).\nAs originally delivered, the MCAS became active during manual, flaps -up flight\n(autopilot not engaged) when the AOA value received by the master FCC exceeded\na thresho ld based on Mach number. When activated, the MCAS provided a high\nrate automatic trim command to move the stabilizer AND. The magnitude of the\nAND command was based on the AOA and the Mach. After the non -normal\nmaneuver that result ed in the high AOA, and once the AOA fell below a reset\nthreshold, MCAS would move the stabilizer ANU to the original position and reset\nthe system. At any time, the stabilizer inputs could be stopped or reversed by the\npilots using their yoke -mounted elec tric stabilizer trim switches, which also reset\nthe system after a 5 second delay.\nThe latter behavior is based on the assumption that flight crews use the trim\nswitches to completely return the aircraft to neutral trim. In the FCC software\nversion current at the time of the accident, if the original elevated AOA condition\npersists for more than 5 seconds following an MCAS flight control law reset, the\nMCAS flight control law will command another stabilizer nose down trim input\n(with the magnitude based on the AOA and Mach sensed at that time).\nOn all out switches30 located on the aisle stand to\nthe CUTOUT position, or restraining the stabilizer trim wheel,\n• Speed/ Stab Trim runaways are limited by the inherent stabilizer trim motor rate\nand column actuated trim cut-out switches. Sufficient means are available for the\nflight crew to maintain control and recover from the runaway31.\nD.2 MCAS Functional – Detailed Description:\nThe MCAS is a function within the Speed Trim System and, when activated, moves\nthe stabilizer during non-normal flaps up, high angle of attack maneuvers to provide\na desirable increase in stick force gradient and a reduced pitch up tendency. Similar\nto the Speed Trim Function, the MCAS function is also a flight control law 32\ncontained within each of the two FCCs. MCAS is only active in the m aster FCC for\nthat flight. At aircraft power-up, the master FCC defaults to the left side FCC; and\nwill then alternate bet ween the left and right FCC by flight. The master FCC is not\naffected by the posit ion of the Flight Director switches. The FCCs rec eive inputs\nfrom several systems including the air data inertial reference system (ADIRS).\nReference Figure 1 Diagram showing the components of MCAS\nSpecific to the MCAS, the control law commands the stabilizer t rim as a function of\nthe following: Air/Ground, Flap position, Angle of attack, Pitch rate, True Airspeed\nand Mach.\n\n30 Two stabilizer trim cutout switches on the control stand can be used to stop the main electric and autopilot trim inputs to\nthe stabilizer trim actuator. The s witches can be set to NORMAL or CUTOUT. If either switch is moved to CUTOUT,\nboth the electric and autopilot trim inputs are disconnected from the stabilizer trim motor. NORMAL is the default\nposition to enable operation of the electric and autopilot trim.\n31 MCAS failures do allow the stabilizer to move at the flaps down trim rate, even if the flaps are up, but even the flaps\ndown trim rate is a limit, albeit faster than the normal flaps up rate. Column cutout is always available in the forward\ndirection but may not be available in the aft direction for certain MCAS failures.\n32 MCAS is an open loop flight control law.\n\u003c/parca>\n\n\u003cparca no=\"8\">\n[184-lion-air-flight-610.pdf › Sayfa 254]\n# Sayfa 254\n\n252\nBoeing advised that these assump tions are used across all Boeing models when\nperforming functional hazard assessments of flight control systems and that these\nassumptions are consistent with the requirements contained in 14 CFR 25.671 &\n25.672 and within the guidance contained in FAA Adv isory Circular (AC) 25 -7C\nfor compliance evaluation of 14 CFR 25.14339.\nIn March 2016, Boeing determined that MCAS should be revised to improve wings-\nlevel, flaps up, low Mach stall characteristics and identification. The MCAS was\nrevised such that dependi ng on AOA, it would be capable of commanding\nincremental stabilizer to a maximum of 2.5 degrees at low Mach decreasing to a\nmaximum of 0.65 degrees at high Mach.\nThe requirements document also indicated that the preliminary functional hazard\nassessments of MCAS were re -evaluated by pilot assessments in the motion\nsimulator and by engineering analysis and determined to have not change d in\nhazard classification as a result of the increase in MCAS authority to 2.5 degrees.\nTable 2 Results of preliminary hazard assessment for revised MCAS authority\nHazard Hazard\nclassification\nUncommanded MCAS function operation up to its maximum\nauthority\nMajor*\nUncommanded MCAS function operation equivalent to 3\nsecond mistrim **\nMajor\n\n* Major Classification:\nThe uncommanded MCAS command to the maximum nose down authority at low\nMach numbers was evaluated in the 737 MAX cab and rated as Minor. The high\nMach uncommanded MCAS command and subsequent recovery is the critical flight\nphase in establishing the hazard rating for erroneous MCAS commands. According to\nBoeing, engineering analysis determined that the existing high Mach evaluation function svg(tag, attrs = {}, parent) {

function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

{

  const c = card("s1", "1", "Soru sayıya çevrildi", stepMs("embed"),
    `Soru metni yerel <b>${esc(T.corpus.embed_model)}</b> modeline gönderildi. Model, sorunun <i>anlamını</i> ${e.dim} sayıdan oluşan bir listeye (vektöre) çevirdi. ` +
    "Parçalar da indekslemede aynı modelle aynı uzaya çevrilmişti. Anlamca yakın metinlerin vektörleri aynı yöne bakar.");
  const cols = 64, rows = Math.ceil(e.dim / cols), cw = 1000 / cols, ch = 12;
  const s = svg("svg", { viewBox: `0 0 1000 ${rows * ch + 26}`, role: "img", "aria-label": "Vektör değerleri ısı şeridi" }, c);
  const maxAbs = Math.max(...e.preview.map(Math.abs)) || 1;
  e.preview.forEach((v, i) => {
    const t = Math.min(1, Math.abs(v) / maxAbs);
    const r = svg("rect", { x: (i % cols) * cw, y: Math.floor(i / cols) * ch, width: cw - 1, height: ch - 1, rx: 1.5,
      style: `fill:${v >= 0 ? "var(--warm)" : "var(--accent)"};fill-opacity:${(0.12 + 0.88 * t).toFixed(2)}` }, s);
    hoverable(r, `boyut #${i}<br><b>${fmt(v, 4)}</b>`);
  });
  svg("text", { x: 0, y: rows * ch + 18, text: `${e.dim} kutu = ${e.dim} sayı · turuncu = pozitif, mavi = negatif, koyuluk = büyüklük · vektör uzunluğu ${fmt(e.norm, 3)} (normalize edildi)` }, s);
  html(c, `<div class="callout">Tek bir kutunun anlamı yoktur: "#${e.preview.indexOf(Math.max(...e.preview))} numaralı boyut finans demek" gibi bir karşılık yok. Anlam, bu vektörün diğer vektörlerle yaptığı <b>açıda</b> saklıdır. Bir sonraki adım tam olarak bu açıyı ölçüyor.</div>`);
  terms(c, [
    ["Embedding", "Metni, anlamını koruyacak şekilde sabit uzunlukta bir sayı listesine çeviren model çıktısı."],
    ["Vektör", `Bu sayı listesi. Burada ${e.dim} boyutlu: ${e.dim} eksenli bir uzayda tek bir ok gibi düşün.`],
    ["Normalize", "Okun boyu 1'e eşitlenir. Böylece yalnızca yönü karşılaştırılır; uzun metin, kısa metne göre avantaj kazanmaz."],
  ]);
}

/* ---------- ② Arama ---------- */
{
  const S = T.search;
  const c = card("s2", "2", `${int(T.corpus.n_chunks)} parça puanlandı, en iyi ${T.k} tanesi seçildi`, stepMs("search"),
    `Soru vektörü, indeksteki <b>her</b> parça vektörüyle karşılaştırıldı (kosinüs benzerliği). Sonuç ${int(T.corpus.n_chunks)} skor. Bunlar sıralandı ve en yüksek ${T.k} tanesi seçildi. Model yok, "anlama" yok: yalnızca geometri.`);
  const lo = S.histogram.edges[0], hi = S.histogram.edges.at(-1);

  // Histogram
  html(c, `<h3>Tüm skorların dağılımı</h3><p class="lede" style="margin:0 0 6px">Her çubuk bir skor aralığı, yüksekliği o aralıktaki parça sayısı. Parçaların çoğu ortada yığılır (soruyla ilgisiz). Seçilenler sağ uçta, kesim çizgisinin sağında.</p>`);
  {
    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Skor histogramı" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);
    [0, 0.5, 1].forEach(f => {
      const n = Math.round(maxC * f), y = Y(n);
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);
      const hitRect = svg("rect", { x: X(a), y: m.t, width: X(b) - X(a), height: H - m.t - m.b, style: "fill:transparent" }, s);
      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);
    const kx = X(S.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t - 6, y2: H - m.b + 34, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    svg("text", { x: kx - 6, y: m.t + 4, "text-anchor": "end", class: "ink", style: "font-weight:600",
      text: `kesim ${fmt(S.kth_score)} (#${T.k})` }, s);
    svg("text", { x: X(S.mean_score), y: m.t + 4, "text-anchor": "middle", class: "ink2", text: `ortalama ${fmt(S.mean_score, 2)}` }, s);
  }
  if (S.next_score != null) {
    const gap = S.kth_score - S.next_score;
    html(c, `<div class="callout"><b>Kıl payı:</b> ${T.k}. parça <b class="num">${fmt(S.kth_score)}</b>, ${T.k + 1}. parça <b class="num">${fmt(S.next_score)}</b>, fark yalnızca <b class="num">${fmt(gap, 4)}</b>. ` +
      (gap < 0.01 ? "Kesim bıçak sırtında. k'yi 1 artırmak Claude'a başka bir parça gösterirdi. Aşağıdaki tabloda kesimin hemen altında kalanlar da var." : "Seçilenler geri kalanlardan belirgin biçimde ayrışıyor.") + `</div>`);
  }

  // Klasör şeridi
  html(c, `<h3>Hangi klasör yarıştı?</h3><p class="lede" style="margin:0 0 6px">Her satır bir klasör, her nokta o klasördeki bir parça. Sağa gittikçe skor artar. Büyük noktalar seçilen ${T.k} parça.</p>`);
  {
    const pts = T.map.points, W = 1000, rowH = 30, m = { l: 150, r: 10, t: 6, b: 26 };
    const H = m.t + FOLDERS.length * rowH + m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Klasöre göre skorlar" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    FOLDERS.forEach((f, fi) => {
      const y = m.t + fi * rowH + rowH / 2;
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      const nh = hits.filter(h => h.folder === f).length;
      svg("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", class: nh ? "ink" : "", style: nh ? "font-weight:600" : "",
        text: `${f}${nh ? ` (${nh})` : ""}` }, s);
    });
    const kx = X(T.search.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t, y2: H - m.b, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    pts.forEach((p, i) => {
      if (p[4]) return;
      const y = m.t + p[3] * rowH + rowH / 2 + ((i * 7919) % 11 - 5);  // sabit titreşim: üst üste binmesin
      svg("circle", { cx: X(p[2]), cy: y, r: 2.2, style: `fill:${folderColor(p[3])};fill-opacity:.35` }, s);
    });
    hits.forEach(h => {
      const fi = FOLDERS.indexOf(h.folder), y = m.t + fi * rowH + rowH / 2;
      const d = svg("circle", { cx: X(h.score), cy: y, r: 6, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, s);
      hoverable(d, `<b>#${h.rank}</b> · ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
  }

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = v => pad + (v - x0) / (x1 - x0) * (W - 2 * pad), Y = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",
      style: "background:var(--page);border-radius:10px" }, c);
    P.forEach((p, i) => {
      if (p[4]) return;
      const d = svg("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, style: `fill:${folderColor(p[3])};fill-opacity:.45` }, s);
      hoverable(d, () => `${esc(T.map.labels[i])}<br>skor <b>${fmt(p[2])}</b>`);
    });
    const qx = X(T.map.question[0]), qy = Y(T.map.question[1]);
    hits.forEach(h => svg("line", { x1: qx, y1: qy, x2: X(h.x), y2: Y(h.y), style: "stroke:var(--ink);stroke-opacity:.18;stroke-width:1" }, s));
    hits.forEach(h => {
      const g = svg("g", { id: `map-hit-${h.rank}` }, s);
      svg("circle", { cx: X(h.x), cy: Y(h.y), r: 9, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, g);
      svg("text", { x: X(h.x), y: Y(h.y) + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700", text: h.rank }, g);
      hoverable(g, `<b>#${h.rank}</b> · skor ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    const star = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
      const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
      return `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

/* ---------- Sözlük ---------- */
{
