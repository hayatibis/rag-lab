orcible intrusion\nby unauthorized persons made it impossible to enter the flight compartment before\nthe aircraft impacted the terrain in the French Alps.\nThe BEA investigation concluded that the process for medical certification of\npilots, in particular self-reporting in case of decrease in medical fitness between\ntwo periodic medical evaluations, did not succeed in preventing the co-pilot, who\nwas experiencing mental disorder with psychotic symptoms, from exercising the\nprivilege of his licence. The following factors may have contributed to the failure of\nthis principle:\n the co-pilot’s probable fear of losing his right to fly as a professional pilot if he\nhad reported his decrease in medical fitness to an AME;\n the potential financial consequences generated by the lack of specific insurance\ncovering the risks of loss of income in case of unfitness to fly;\n the lack of clear guidelines in German regulations on when a threat to public\nsafety outweighs the requirements of medical confidentiality.\nThe BEA has addressed eleven safety recommendations to the WHO, IATA, the\nEuropean Commission, EASA, BMVI and BÄK relating to:\n medical evaluation of pilots with mental health issues;\n routine analysis of in-flight incapacitation;\n mitigation of the consequences of loss of licence;\n anti-depressant medication and flying status;\n balance between medical confidentiality and public safety;\n promotion of pilot support programmes.", "x": -0.15711094439029694, "y": -0.06985556334257126}, {"rank": 2, "i": 5178, "id": "137-germanwings-flight-9525.pdf#134", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 97"], "folder": "2010'ler", "score": 0.5744438767433167, "text": "[137-germanwings-flight-9525.pdf › Sayfa 97]\n# Sayfa 97\n\nD-AIPX - 24 March 2015\n97\nThe following factors may have contributed to the failure of this principle:\n the co-pilot’s probable fear of losing his ability to fly as a professional pilot if he\nhad reported his decrease in medical fitness to an AME;\n the potential financial consequences generated by the lack of specific insurance\ncovering the risks of loss of income in case of unfitness to fly;\n the lack of clear guidelines in German regulations on when a threat to public\nsafety outweighs the requirements of medical confidentiality.\nSecurity requirements led to cockpit doors designed to resist forcible intrusion by\nunauthorized persons. This made it impossible to enter the flight compartment\nbefore the aircraft impacted the terrain in the French Alps.", "x": -0.06251505017280579, "y": -0.08850700408220291}, {"rank": 3, "i": 5143, "id": "137-germanwings-flight-9525.pdf#99", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 73"], "folder": "2010'ler", "score": 0.5695555210113525, "text": "[137-germanwings-flight-9525.pdf › Sayfa 73]\nthe first officer complained of feeling unwell, stating that he was\n\"frightened of the altitude\". The commander summoned the purser onto\nthe flight deck using a single chime of the cabin staff call system. The first\nofficer refused the offer of oxygen and a soft drink. He continued to show\nsymptoms of anxiety and stress, such that the purser felt unable to comply\nwith the standard incapacitation drill which calls for the crew member to be\nslid back in the seat with\n\nthe harness locked. The Captain decided to\ndivert to Lyon, France where the plane landed without further incident. The\ninterviews conducted after the incident revealed that it was not the first\ntime this first officer acted like this, and he admitted having taken\npsychotropic medication, without declaring it to the aeromedical\nauthorities.\n21/08/1994 ATR42 Royal Air\nMaroc\nMorocco 44 The Captain disengaged the autopilot and deliberately directed the aircraft\ntowards the ground. The co-pilot was in the cockpit but was not able to\ncounter the Captain’s actions.\n09/02/1982 DC-8 Japan\nAirlines\nJapan 24 After having disengaged the autopilot on final approach at a height of 164\nft, the pilot pushed the control column forward and set the thrust levers on\nidle. He then moved the thrust levers of engines 2 and 3 to the reverse idle\nposition. While the aircraft’s attitude decreased, the co-pilot tried to pull on\nthe control column. The co-pilot was unable to raise the nose of the\naeroplane because the Captain was pushing forward on the control\ncolumn with both hands. The aircraft crashed into the sea 510 m short of\nthe runway. The investigation led by a Commission of the Ministry of\nTransport of Japan showed that the captain’s actions resulted from a\nmental problem. He was suffering from schizophrenia.", "x": -0.12224946916103363, "y": 0.06136279180645943}, {"rank": 4, "i": 5142, "id": "137-germanwings-flight-9525.pdf#98", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 73"], "folder": "2010'ler", "score": 0.5571687817573547, "text": "[137-germanwings-flight-9525.pdf › Sayfa 73]\nSayfa 73\n\nD-AIPX - 24 March 2015\n73\n23/01/2001 DC-3 Galaxy Air\nCargo\nUSA 2 The airplane departed an island runway in Alaska during dark night VFR\nconditions without filing a flight plan. The airplane collided with a volcanic\nmountain at 1,500 feet msl on the runway heading, 4.5 miles from the\nairport. The captain's medical certificate had previously been considered\nfor denial after serving 49 months in federal prison for cocaine distribution,\nbut after review, the FAA issued the captain a first class medical. FAA\nmedical records for the captain do not contain any record of monitoring for\nsubstance abuse. The first officer's medical had also been considered for\ndenial after an episode of a loss of consciousness. After a lengthy review\nand an appeal to the NTSB, the FAA issued the first officer a second-class\nmedical. A toxicological examination of the captain, conducted by the FAA,\nfound cocaine and metabolites of cocaine. A toxicological examination of\nthe first officer found two different prescription antidepressant drugs.\n31/10/1999 B767 EgyptAir North Atlantic\nOcean\n217 The aeroplane was in cruise at flight level FL330 with a flight crew\nconsisting of a Captain, a duty co-pilot and a relief co-pilot. The duty co-\npilot left the cockpit, and the relief co-pilot took his place in the right seat.\nEight minutes later, the Captain left the cockpit in turn, leaving the relief\nco-pilot alone. The autopilot was then disengaged and nose-down inputs\nwere recorded on the FDR. The aeroplane descended. The engines were\nshut down. The Captain returned to the cockpit and tried to take back\ncontrol of the aeroplane. The Captain repeatedly asked the co-pilot to help\nhim to pitch up the aeroplane (“pull with me”) but the latter continued to\ncommand the elevator to pitch nose down. The aeroplane regained\naltitude before descending again. It collided with the surface of the ocean.\nThe reasons that led the co-pilot to take these actions could not be\ndetermined.\n11/10/1999 ATR-42 Air\nBotswana\nBotswana 1 The pilot, the only person on board, deliberately flew the aeroplane into\nthe ground by crashing at Gaborone airport. The validity of his licence had\nbeen revoked for medical reasons.\n19/12/1997 B737 Silk Air Indonesia 104 While the aircraft was in cruise at 35,000 ft, the flight recorders stopped\nrecording one after the other. The aeroplane suddenly started to descend.\nNo Mayday message was transmitted before or during the descent. The\naircraft crashed into a river. The safety investigation was not able to\nidentify any technical problem that would make it possible to explain the\naccident.\n09/05/1996 BAC 1-\n11\nBritish\nAirways\nFrance 0 The airplane was in cruise between Birmingham (UK) and Milan (Italy)\nwhen the first officer complained of feeling unwell, stating that he was\n\"frightened of the altitude\". The commander summoned the purser onto\nthe flight deck using a single chime of the cabin staff call system. The first\nofficer refused the offer of oxygen and a soft drink. He continued to show\nsymptoms of anxiety and stress, such that the purser felt unable to comply\nwith the standard incapacitation drill which calls for the crew member to be\nslid back in the seat with", "x": -0.10772079229354858, "y": 0.05054498836398125}, {"rank": 5, "i": 5159, "id": "137-germanwings-flight-9525.pdf#115", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 85"], "folder": "2010'ler", "score": 0.5446687936782837, "text": "[137-germanwings-flight-9525.pdf › Sayfa 85]\nand psychiatrist. On 10\nMarch 2015, the same physician diagnosed a possible psychosis and recommended\npsychiatric hospital treatment. A psychiatrist prescribed anti-depressant and sleeping\naid medication in February and March 2015. Neither of those health care providers,\nwho were probably aware of the co-pilot’s profession, informed any aviation authority,\nnor any other authority about the co-pilot’s mental state.\nOn the day of the accident, the pilot was still\n\nsuffering from a psychiatric disorder,\nwhich was possibly a psychotic depressive episode and was taking psychotropic\nmedication. This made him unfit to fly. No action could have been taken by authorities\nand/or his employer to prevent him from flying that day, because they were informed\nby neither the co-pilot himself, nor by anybody else, such as a physician, a colleague,\nor family member.", "x": -0.06635675579309464, "y": -0.028292326256632805}, {"rank": 6, "i": 5160, "id": "137-germanwings-flight-9525.pdf#116", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 86"], "folder": "2010'ler", "score": 0.538888156414032, "text": "[137-germanwings-flight-9525.pdf › Sayfa 86]\n# Sayfa 86\n\nD-AIPX - 24 March 2015\n86\nActions on the autopilot system during the first flight of the day may be interpreted\nas a rehearsal for suicide.\nDuring cruise on the second flight of the day, the co-pilot waited until he was alone\nin the cockpit. He then intentionally modified the autopilot settings to order the\naeroplane to descend until it collided with the ground. He kept the cockpit door\nlocked during the descent, despite requests for access made via the keypad and the\ncabin interphone. He did not respond to the calls from the civil or military air traffic\ncontrollers, nor to knocks on the door, possibly because of cognitive constriction\ncommon when a person is committing suicide.\nThe reinforced structure of the cockpit doors, designed for security reasons to resist\npenetration, could not be broken from outside to enable somebody to enter before\nthe aircraft impacted the terrain in the French Alps.\n2.2 Mental health assessment of professional pilots\nAirline transport pilots must hold a valid Class 1 medical certificate to exercise the\nprivileges of their licence. For pilots in the co-pilot’s age group, class 1 medical\ncertificates are valid for a period of 12 months. During yearly examinations, pilots\nundergo physical and mental examinations defined by the regulation and assessments\nare made by certified AMEs to determine the fit or unfit status of applicants.\nPilots must declare on their class 1 application form whether they have or have ever\nhad any history of psychological or psychiatric trouble of any sort. The psychiatric\nassessment of pilots during medical certification is then performed through general\ndiscussion and by observing behaviour, appearance, speech, mood, thinking,\nperception, cognition and insight. When in doubt about the psychiatric state of an\napplicant, an AME can request an expert opinion from a specialist before making a fit\nor unfit determination.\nThe depression episode experienced by the co-pilot in 2008 was correctly identified by\nthe Lufthansa AeMC during the revalidation process of his class 1 medical certificate\nin April 2009. A waiver based on the assessment from a psychiatrist allowed the pilot\nto hold a class 1 medical certificate again in July 2009. Every year after that, his class\n1 medical certificate was revalidated or renewed. All of the AMEs who examined\nhim during that period were aware of the waiver and were informed of his medical\nhistory of depression. The waiver FRA 091/09 neither included the requirement for\nregular specific assessments by a psychiatrist nor reduced the time in-between two\nassessments. Therefore, all the AMEs assessed his psychological and psychiatric\nfitness, through the usual discussions and observation of behaviour, to determine\nwhether any signs of depression were reappearing, which would have made the\nwaiver invalid and would have required further examination from a specialist. They\ndid not detect any signs of this.", "x": -0.1222439631819725, "y": -0.09012901037931442}, {"rank": 7, "i": 5061, "id": "137-germanwings-flight-9525.pdf#17", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 16"], "folder": "2010'ler", "score": 0.5348812937736511, "text": "[137-germanwings-flight-9525.pdf › Sayfa 16]\n# Sayfa 16\n\nD-AIPX - 24 March 2015\n16\nAfter joining Germanwings, he followed the operator’s conversion training course as\na Captain from May to September 2014. During his training and recurrent checks his\nprofessional level was judged by his instructors and examiners to be above standard.\nHe passed his line check on 20 September 2014.\nThe last operator proficiency check (OPC) was performed on 14 January 2015.\nHis schedule shows that he had not flown between 14 and 22 March 2015. On\n23 March 2015, the day before the accident, he flew two rotations from Düsseldorf\nto London-Heathrow: he took off from Düsseldorf at 6 h 09 for the first rotation\nand landed at Düsseldorf at 14 h 04 following the second rotation. On the day of\nthe accident, he made the flight from Düsseldorf, taking off at 6 h 01, to Barcelona,\nlanding there at 7 h 57.\n1.5.2 Co-pilot\nMale, aged 27, German nationality.\n Private Pilot Licence PPL(A) issued on 1 March 2011;\n Multi-crew Pilot Licence MPL(A) issued on 11 February 2014;\n A320 type rating revalidated on 28 October 2014.\nExperience :\n total : 919 flying hours;\n on type : 540 flying hours;\n in the previous 3 months : 107 hours;\n in the previous month: 30 hours;\n in the previous 24 hours : 3 hours.\nFlying career:\n between January and April 2008, he took entry selection courses with Lufthansa\nFlight Training (LFT);\n on 1 September 2008, he started his basic training at the Lufthansa Flight Training\nPilot School in Bremen (Germany);\n on 5 November 2008 he suspended his training for medical reasons;\n on 26 August 2009 he restarted his training;\n on 13 October 2010, he passed his ATPL written exam;\n from 8 November 2010 to 2 March 2011, he continued his training at the Airline\nTraining Centre in Phoenix (Arizona, USA);\n from 15 June 2011 to 31 December 2013, he was under contract as a flight\nattendant for Lufthansa while continuing his Air Transport pilot training;\n from 27 September to 23 December 2013, he took and passed his A320 type\nrating at Lufthansa in Munich (Germany);\n on 4 December 2013, he joined Germanwings;\n from 27 January 2014 to 21 June 2014, he undertook his operator’s conversion\ntraining including his line flying under supervision at Germanwings;\n on 26 June 2014, he passed his proficiency check and was appointed as a co-pilot;\n on 28 October 2014, he passed his operator proficiency check.\nDuring his training and recurrent checks, his professional level was judged to be\nabove standard by his instructors and examiners.", "x": -0.07614422589540482, "y": -0.032420821487903595}, {"rank": 8, "i": 5139, "id": "137-germanwings-flight-9525.pdf#95", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 72"], "folder": "2010'ler", "score": 0.533122718334198, "text": "[137-germanwings-flight-9525.pdf › Sayfa 72]\nSayfa 72\n\nD-AIPX - 24 March 2015\n72\nThis list does not include events due to terrorist attacks.\nDate Aircraft Operator State of\nOccurrence\nDeaths Circumstances\n18/01/2015 A320 Condor Portugal 0 The airplane was in cruise at FL370 approximately 60 NM from Lisbon\nwhen the co-pilot became incapacitated, and could no longer perform his\nduties. The Captain diverted to Faro, where the plane landed uneventfully.\nThe copilot was then transported to the hospital, where he exhibited\nbehaviour during the following days that raised psychiatric concerns.\n29/11/2013 ERJ\n190\nLAM Namibia 33 The aeroplane was in cruise at flight level FL380 when the co-pilot left the\ncockpit to go to the toilet, leaving the Captain alone. On three occasions,\ndifferent altitudes were selected to order a descent to the ground with\nautopilot. The CVR showed variable levels of aural warnings, as well as\nnoises of repeated knocking and calls, corresponding to attempts to get\ninto the cockpit.\n27/03/2012 A320 JetBlue US A 0 As the plane was leaving New York-JFK and climbing in altitude in its\nscheduled five-hour flight to Las Vegas, the Captain said something to the\nfirst officer (FO) about being evaluated by someone, but the FO did not\nknow what he meant. The Captain then talked about his church and the\nneed to “focus” and asked the FO to take the controls and work the radios.\nThe Captain began talking about religion, but, according to the FO, his\nstatements were not coherent. The FO became concerned when the\nCaptain said “things just don’t matter.” According to the FO, the Captain\nyelled over the radio to air traffic control and instructed them to be quiet.\nThe Captain turned off the radios in the aircraft, dimmed his monitors, and\nsternly admonished the FO for trying to talk on the radio. When the captain\nsaid “we need to take a leap of faith,” the FO stated that he became very\nworried. The Captain told the FO that “we’re not going to Vegas” and\nbegan giving what the FO described as a sermon. The FO suggested to\nthe Captain that they invite the off-duty JetBlue captain who was on board\nthe flight into the cockpit. However, the Captain abruptly left the cockpit to\ngo to the forward lavatory, alarming the rest of the flight crew when he\ndidn’t follow the company’s protocol for leaving the cockpit. When flight\nattendants met the Captain and asked him what was wrong, he became\naggressive and banged on the door of the occupied lavatory, saying he\nneeded to get inside. While the Captain was in the lavatory, at the request\nof the FO, a flight attendant brought the off-duty captain to the cockpit,\nwhere he assisted the FO with the remainder of the flight. When the\nCaptain exited the lavatory, he began talking to flight attendants,\nmentioning “150 souls on board.” The Captain walked to the rear of the\naircraft but along the way stopped and asked a male passenger if he had a\nproblem. The Captain then sprinted back to the forward galley and tried to\nenter his code to re-enter the cockpit. When the FO announced over the\npublic address system an order to restrain the Captain, several\npassengers assisted and brought him down in the forward galley, where\nhe continued to yell comments about Jesus,", "x": -0.07004308700561523, "y": 0.11808184534311295}], "runners_up": [{"rank": 9, "i": 5177, "id": "137-germanwings-flight-9525.pdf#133", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 96"], "folder": "2010'ler", "score": 0.5298026204109192, "text": "[137-germanwings-flight-9525.pdf › Sayfa 96]\n# Sayfa 96\n\nD-AIPX - 24 March 2015\n96\nFindings relevant to the first flight of the day of the accident (from Düsseldorf\nto Barcelona)\n the aircraft took off from Düsseldorf at 6 h 01;\n several altitude selections towards 100 ft were recorded during descent on the\nflight that preceded the accident flight, while the co-pilot was alone in the cockpit;\n the aircraft landed in Barcelona at 7 h 57.\nFindings relevant to the second flight of the day of the accident (from Barcelona\nto Düsseldorf)\n the aeroplane took off from Barcelona bound for Düsseldorf at 9 h 00, with flight\nnumber 4U9525, and callsign GWI18G;\n the autopilot and autothrust were engaged during the climb;\n the Captain left the cockpit at the beginning of the cruise at FL380;\n the selected altitude changed from 38,000 ft to 100 ft while the co-pilot was alone\nin the cockpit. The aeroplane then started a continuous and controlled descent\non autopilot;\n during the descent, the Marseille control centre called flight GWI18G on eleven\noccasions on three different frequencies, without any answer being transmitted;\n the French military defence system tried to contact flight GWI18G on three\noccasions during the descent, without any answer;\n the buzzer to request access to the cockpit sounded once during the descent,\n4 min 07 s after the Captain had left;\n the intercom sounded in the cockpit, 4 min 40 s after the Captain had left;\n three other calls on the interphone sounded in the cockpit;\n none of the calls using the interphone elicited any answer;\n noises similar to violent blows on the cockpit doors were recorded on five\noccasions;\n the cockpit doors of the aircraft are designed for security reasons to resist\npenetration by small arms fire and grenade shrapnel and to resist forcible\nintrusions by unauthorized persons;\n an input on the right sidestick was recorded for about 30 seconds on the FDR\n1 min 33 s before the impact, not enough to disengage the autopilot;\n the autopilot and autothrust remained engaged until the end of the CVR and FDR\nrecordings;\n the sound of breathing was recorded on the CVR until a few seconds before the\nend of the flight;\n before the collision with the terrain, warnings from the GPWS, Master Caution\nand Master Warning sounded;\n the aeroplane collided with the terrain at 9 h 41 min 06.\n3.2 Causes\nThe collision with the ground was due to the deliberate and planned action of the\nco-pilot who decided to commit suicide while alone in the cockpit. The process for\nmedical certification of pilots, in particular self-reporting in case of decrease in medical\nfitness between two periodic medical evaluations, did not succeed in preventing\nthe co-pilot, who was experiencing mental disorder with psychotic symptoms, from\nexercising the privilege of his licence.", "x": -0.11213012039661407, "y": 0.14049209654331207}, {"rank": 10, "i": 5064, "id": "137-germanwings-flight-9525.pdf#20", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 19"], "folder": "2010'ler", "score": 0.5271624326705933, "text": "[137-germanwings-flight-9525.pdf › Sayfa 19]\n# Sayfa 19\n\nD-AIPX - 24 March 2015\n19\nThe following deferred defects were documented in accordance with Part M ( annex I)\nof the Commission Regulation EC No. 2042/2003, M.A. 403 prior to the event flight:\n on 6 March 2015, cabin ready button on forward attendant panel missing,\ndispatched as per Minimum Equipment List (MEL);\n on 18 March 2015, R/H logo light unserviceable, dispatched as per MEL;\n on 23 March 2015, play on forward hinge of L/H nose gear door out of limit,\nreleased with Change Repair Approval Sheet for 50 FH since no airframe vibration\nreported during last 100 FH;\n on 24 March 2015 (in Dusseldorf), ENG 2 IGN fault during engine start, dispatched\nas per MEL.\nOn 24 March 2015, during the stop in Barcelona, before the accident flight, the Captain\ncontacted the Germanwings maintenance control centre in Cologne about a problem\nconcerning flushing of the front toilets on the aeroplane (8). The correspondent on\nthe telephone advised resetting the system circuit breaker located at the rear of the\naeroplane. Since the disembarkation of the passengers had not finished, the Captain\nsaid he would carry out this operation as soon as possible and would contact the\nservice again if the problem persisted. No other calls were recorded.\nD check type scheduled maintenance was planned for April 2015.\n1.6.4 Cockpit door locking system\nNote: the following descriptions apply to D-AIPX and are based on information supplied by Airbus\nand Germanwings.\nA door separates the cockpit and passenger cabin. Its core consists of a composite\nsandwich type structure made of prepreg sheets covering a honeycomb core.\nThe outer prepreg sheets are designed to ensure bullet-proofing. A door escape\nhatch is pre-cut on its lower part. The latter can only be used from the cockpit. It is\nused in emergencies when the door is stuck. Unlike the cockpit door which opens\ntowards the inside of the cockpit, the door escape hatch can only be opened in the\nopposite direction.\nThree electrical release strikes are used to lock the door as soon as it is closed. A\nrotating handle system on the door is used to mechanically unlock it from the cockpit.\nFigure 2 - cockpit access door\n(8)During the flight\nbetween Düsseldorf\nand Barcelona,\nthe crew had\nalready informed\nmaintenance via an\nACARS message.", "x": -0.09670339524745941, "y": -0.015324106439948082}, {"rank": 11, "i": 5060, "id": "137-germanwings-flight-9525.pdf#16", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 15"], "folder": "2010'ler", "score": 0.5238588452339172, "text": "[137-germanwings-flight-9525.pdf › Sayfa 15]\n# Sayfa 15\n\nD-AIPX - 24 March 2015\n15\n1.2 Injuries to persons\nInjuries\nFatal Serious Minor/none\nCrew members 6 - -\nPassengers 144 - -\nOthers - - -\n1.3 Damage to aircraft\nThe aeroplane was destroyed.\n1.4 Other damage\nNone.\n1.5 Personnel information\n1.5.1 Captain\nMale, aged 34, German nationality.\n Air transport pilot’s licence ATPL(A) issued on 28 January 2014;\n A320 type rating revalidated on 9 July 2014;\n Last class 1 medical check-up performed on 31 October 2014 and valid until\n12 December 2015.\nExperience:\n total: 6,763 flying hours;\n on type: 3,811 flying hours, of which 259 as Captain;\n in the previous 3 months: 108 hours;\n in the previous month: 18 hours;\n in the last 24 hours: 8 hours.\nFlying career:\n from March 2001 to June 2003, he undertook Air Transport pilot training at\nthe Lufthansa Flight Training Pilot School in Bremen (Germany) and the Airline\nTraining Centre in Phoenix (Arizona, USA);\n in March 2005, he obtained his A320 type rating;\n from June 2005 to January 2010, he worked as a co-pilot on Airbus A320 for the\nCondor Berlin airline;\n in April 2010, he obtained his A340 type rating, and his type rating for the A330\nin February 2011;\n from April 2010 to May 2014, he worked as a co-pilot on Airbus A330/A340 for\nLufthansa;\n on 6 May 2014, he joined Germanwings as a Captain on A320.", "x": -0.025284303352236748, "y": 0.02332182787358761}, {"rank": 12, "i": 5165, "id": "137-germanwings-flight-9525.pdf#121", "path": "2010'ler/137-germanwings-flight-9525.pdf", "heading_path": ["Sayfa 88"], "folder": "2010'ler", "score": 0.5213932991027832, "text": "[137-germanwings-flight-9525.pdf › Sayfa 88]\na sick leave certificate. In\nMarch 2015, the same private physician recommended him for psychiatric hospital\ntreatment, and issued him another sick leave certificate. The co-pilot had also several\nsick leave certificates from various physicians in February and March 2015. However,\nnot all of these sick leave certificates were forwarded to Germanwings. Therefore\nthere are times when the co-pilot flew during some of these periods of sick leave, in\nparticular on the day of the\n\naccident\nSeveral elements also show that the co-pilot was aware of the potential interference\nof his medication with flight safety. He was aware of the risks of this medication, as\nrevealed by the email he sent to his psychiatrist mentioning additional medication.", "x": -0.018948184326291084, "y": -0.05175226181745529}], "kth_score": 0.533122718334198, "next_score": 0.5298026204109192, "max_score": 0.6095291972160339, "mean_score": 0.3455604612827301, "histogram": {"counts": [3, 14 , "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 173", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 174", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 175", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 176", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 177", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 178", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 179", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 180", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 181", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 182", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 183", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 184", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 185", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 186", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 187", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 188", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 189", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 190", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 191", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 192", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 193"], "question": [-0.10243266075849533, 0.045084916055202484], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[137-germanwings-flight-9525.pdf › Sayfa 9]\n# Sayfa 9\n\nD-AIPX - 24 March 2015\n9\nIn the cruise phase of the accident flight, the co-pilot waited until he was alone in the\ncockpit. He then intentionally modified the autopilot settings to order the aeroplane\nto descend. He kept the cockpit door locked during the descent, despite requests\nfor access made via the keypad and the cabin interphone. He did not respond to\nthe calls from the civil or military air traffic controllers, nor to knocks on the door.\nSecurity requirements that led to cockpit doors designed to resist forcible intrusion\nby unauthorized persons made it impossible to enter the flight compartment before\nthe aircraft impacted the terrain in the French Alps.\nThe BEA investigation concluded that the process for medical certification of\npilots, in particular self-reporting in case of decrease in medical fitness between\ntwo periodic medical evaluations, did not succeed in preventing the co-pilot, who\nwas experiencing mental disorder with psychotic symptoms, from exercising the\nprivilege of his licence. The following factors may have contributed to the failure of\nthis principle:\n the co-pilot’s probable fear of losing his right to fly as a professional pilot if he\nhad reported his decrease in medical fitness to an AME;\n the potential financial consequences generated by the lack of specific insurance\ncovering the risks of loss of income in case of unfitness to fly;\n the lack of clear guidelines in German regulations on when a threat to public\nsafety outweighs the requirements of medical confidentiality.\nThe BEA has addressed eleven safety recommendations to the WHO, IATA, the\nEuropean Commission, EASA, BMVI and BÄK relating to:\n medical evaluation of pilots with mental health issues;\n routine analysis of in-flight incapacitation;\n mitigation of the consequences of loss of licence;\n anti-depressant medication and flying status;\n balance between medical confidentiality and public safety;\n promotion of pilot support programmes.\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[137-germanwings-flight-9525.pdf › Sayfa 97]\n# Sayfa 97\n\nD-AIPX - 24 March 2015\n97\nThe following factors may have contributed to the failure of this principle:\n the co-pilot’s probable fear of losing his ability to fly as a professional pilot if he\nhad reported his decrease in medical fitness to an AME;\n the potential financial consequences generated by the lack of specific insurance\ncovering the risks of loss of income in case of unfitness to fly;\n the lack of clear guidelines in German regulations on when a threat to public\nsafety outweighs the requirements of medical confidentiality.\nSecurity requirements led to cockpit doors designed to resist forcible intrusion by\nunauthorized persons. This made it impossible to enter the flight compartment\nbefore the aircraft impacted the terrain in the French Alps.\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[137-germanwings-flight-9525.pdf › Sayfa 73]\nthe first officer complained of feeling unwell, stating that he was\n\"frightened of the altitude\". The commander summoned the purser onto\nthe flight deck using a single chime of the cabin staff call system. The first\nofficer refused the offer of oxygen and a soft drink. He continued to show\nsymptoms of anxiety and stress, such that the purser felt unable to comply\nwith the standard incapacitation drill which calls for the crew member to be\nslid back in the seat with\n\nthe harness locked. The Captain decided to\ndivert to Lyon, France where the plane landed without further incident. The\ninterviews conducted after the incident revealed that it was not the first\ntime this first officer acted like this, and he admitted having taken\npsychotropic medication, without declaring it to the aeromedical\nauthorities.\n21/08/1994 ATR42 Royal Air\nMaroc\nMorocco 44 The Captain disengaged the autopilot and deliberately directed the aircraft\ntowards the ground. The co-pilot was in the cockpit but was not able to\ncounter the Captain’s actions.\n09/02/1982 DC-8 Japan\nAirlines\nJapan 24 After having disengaged the autopilot on final approach at a height of 164\nft, the pilot pushed the control column forward and set the thrust levers on\nidle. He then moved the thrust levers of engines 2 and 3 to the reverse idle\nposition. While the aircraft’s attitude decreased, the co-pilot tried to pull on\nthe control column. The co-pilot was unable to raise the nose of the\naeroplane because the Captain was pushing forward on the control\ncolumn with both hands. The aircraft crashed into the sea 510 m short of\nthe runway. The investigation led by a Commission of the Ministry of\nTransport of Japan showed that the captain’s actions resulted from a\nmental problem. He was suffering from schizophrenia.\n\u003c/parca>\n\n\u003cparca no=\"4\">\n[137-germanwings-flight-9525.pdf › Sayfa 73]\nSayfa 73\n\nD-AIPX - 24 March 2015\n73\n23/01/2001 DC-3 Galaxy Air\nCargo\nUSA 2 The airplane departed an island runway in Alaska during dark night VFR\nconditions without filing a flight plan. The airplane collided with a volcanic\nmountain at 1,500 feet msl on the runway heading, 4.5 miles from the\nairport. The captain's medical certificate had previously been considered\nfor denial after serving 49 months in federal prison for cocaine distribution,\nbut after review, the FAA issued the captain a first class medical. FAA\nmedical records for the captain do not contain any record of monitoring for\nsubstance abuse. The first officer's medical had also been considered for\ndenial after an episode of a loss of consciousness. After a lengthy review\nand an appeal to the NTSB, the FAA issued the first officer a second-class\nmedical. A toxicological examination of the captain, conducted by the FAA,\nfound cocaine and metabolites of cocaine. A toxicological examination of\nthe first officer found two different prescription antidepressant drugs.\n31/10/1999 B767 EgyptAir North Atlantic\nOcean\n217 The aeroplane was in cruise at flight level FL330 with a flight crew\nconsisting of a Captain, a duty co-pilot and a relief co-pilot. The duty co-\npilot left the cockpit, and the relief co-pilot took his place in the right seat.\nEight minutes later, the Captain left the cockpit in turn, leaving the relief\nco-pilot alone. The autopilot was then disengaged and nose-down inputs\nwere recorded on the FDR. The aeroplane descended. The engines were\nshut down. The Captain returned to the cockpit and tried to take back\ncontrol of the aeroplane. The Captain repeatedly asked the co-pilot to help\nhim to pitch up the aeroplane (“pull with me”) but the latter continued to\ncommand the elevator to pitch nose down. The aeroplane regained\naltitude before descending again. It collided with the surface of the ocean.\nThe reasons that led the co-pilot to take these actions could not be\ndetermined.\n11/10/1999 ATR-42 Air\nBotswana\nBotswana 1 The pilot, the only person on board, deliberately flew the aeroplane into\nthe ground by crashing at Gaborone airport. The validity of his licence had\nbeen revoked for medical reasons.\n19/12/1997 B737 Silk Air Indonesia 104 While the aircraft was in cruise at 35,000 ft, the flight recorders stopped\nrecording one after the other. The aeroplane suddenly started to descend.\nNo Mayday message was transmitted before or during the descent. The\naircraft crashed into a river. The safety investigation was not able to\nidentify any technical problem that would make it possible to explain the\naccident.\n09/05/1996 BAC 1-\n11\nBritish\nAirways\nFrance 0 The airplane was in cruise between Birmingham (UK) and Milan (Italy)\nwhen the first officer complained of feeling unwell, stating that he was\n\"frightened of the altitude\". The commander summoned the purser onto\nthe flight deck using a single chime of the cabin staff call system. The first\nofficer refused the offer of oxygen and a soft drink. He continued to show\nsymptoms of anxiety and stress, such that the purser felt unable to comply\nwith the standard incapacitation drill which calls for the crew member to be\nslid back in the seat with\n\u003c/parca>\n\n\u003cparca no=\"5\">\n[137-germanwings-flight-9525.pdf › Sayfa 85]\nand psychiatrist. On 10\nMarch 2015, the same physician diagnosed a possible psychosis and recommended\npsychiatric hospital treatment. A psychiatrist prescribed anti-depressant and sleeping\naid medication in February and March 2015. Neither of those health care providers,\nwho were probably aware of the co-pilot’s profession, informed any aviation authority,\nnor any other authority about the co-pilot’s mental state.\nOn the day of the accident, the pilot was still\n\nsuffering from a psychiatric disorder,\nwhich was possibly a psychotic depressive episode and was taking psychotropic\nmedication. This made him unfit to fly. No action could have been taken by authorities\nand/or his employer to prevent him from flying that day, because they were informed\nby neither the co-pilot himself, nor by anybody else, such as a physician, a colleague,\nor family member.\n\u003c/parca>\n\n\u003cparca no=\"6\">\n[137-germanwings-flight-9525.pdf › Sayfa 86]\n# Sayfa 86\n\nD-AIPX - 24 March 2015\n86\nActions on the autopilot system during the first flight of the day may be interpreted\nas a rehearsal for suicide.\nDuring cruise on the second flight of the day, the co-pilot waited until he was alone\nin the cockpit. He then intentionally modified the autopilot settings to order the\naeroplane to descend until it collided with the ground. He kept the cockpit door\nlocked during the descent, despite requests for access made via the keypad and the\ncabin interphone. He did not respond to the calls from the civil or military air traffic\ncontrollers, nor to knocks on the door, possibly because of cognitive constriction\ncommon when a person is committing suicide.\nThe reinforced structure of the cockpit doors, designed for security reasons to resist\npenetration, could not be broken from outside to enable somebody to enter before\nthe aircraft impacted the terrain in the French Alps.\n2.2 Mental health assessment of professional pilots\nAirline transport pilots must hold a valid Class 1 medical certificate to exercise the\nprivileges of their licence. For pilots in the co-pilot’s age group, class 1 medical\ncertificates are valid for a period of 12 months. During yearly examinations, pilots\nundergo physical and mental examinations defined by the regulation and assessments\nare made by certified AMEs to determine the fit or unfit status of applicants.\nPilots must declare on their class 1 application form whether they have or have ever\nhad any history of psychological or psychiatric trouble of any sort. The psychiatric\nassessment of pilots during medical certification is then performed through general\ndiscussion and by observing behaviour, appearance, speech, mood, thinking,\nperception, cognition and insight. When in doubt about the psychiatric state of an\napplicant, an AME can request an expert opinion from a specialist before making a fit\nor unfit determination.\nThe depression episode experienced by the co-pilot in 2008 was correctly identified by\nthe Lufthansa AeMC during the revalidation process of his class 1 medical certificate\nin April 2009. A waiver based on the assessment from a psychiatrist allowed the pilot\nto hold a class 1 medical certificate again in July 2009. Every year after that, his class\n1 medical certificate was revalidated or renewed. All of the AMEs who examined\nhim during that period were aware of the waiver and were informed of his medical\nhistory of depression. The waiver FRA 091/09 neither included the requirement for\nregular specific assessments by a psychiatrist nor reduced the time in-between two\nassessments. Therefore, all the AMEs assessed his psychological and psychiatric\nfitness, through the usual discussions and observation of behaviour, to determine\nwhether any signs of depression were reappearing, which would have made the\nwaiver invalid and would have required further examination from a specialist. They\ndid not detect any signs of this.\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[137-germanwings-flight-9525.pdf › Sayfa 16]\n# Sayfa 16\n\nD-AIPX - 24 March 2015\n16\nAfter joining Germanwings, he followed the operator’s conversion training course as\na Captain from May to September 2014. During his training and recurrent checks his\nprofessional level was judged by his instructors and examiners to be above standard.\nHe passed his line check on 20 September 2014.\nThe last operator proficiency check (OPC) was performed on 14 January 2015.\nHis schedule shows that he had not flown between 14 and 22 March 2015. On\n23 March 2015, the day before the accident, he flew two rotations from Düsseldorf\nto London-Heathrow: he took off from Düsseldorf at 6 h 09 for the first rotation\nand landed at Düsseldorf at 14 h 04 following the second rotation. On the day of\nthe accident, he made the flight from Düsseldorf, taking off at 6 h 01, to Barcelona,\nlanding there at 7 h 57.\n1.5.2 Co-pilot\nMale, aged 27, German nationality.\n Private Pilot Licence PPL(A) issued on 1 March 2011;\n Multi-crew Pilot Licence MPL(A) issued on 11 February 2014;\n A320 type rating revalidated on 28 October 2014.\nExperience :\n total : 919 flying hours;\n on type : 540 flying hours;\n in the previous 3 months : 107 hours;\n in the previous month: 30 hours;\n in the previous 24 hours : 3 hours.\nFlying career:\n between January and April 2008, he took entry selection courses with Lufthansa\nFlight Training (LFT);\n on 1 September 2008, he started his basic training at the Lufthansa Flight Training\nPilot School in Bremen (Germany);\n on 5 November 2008 he suspended his training for medical reasons;\n on 26 August 2009 he restarted his training;\n on 13 October 2010, he passed his ATPL written exam;\n from 8 November 2010 to 2 March 2011, he continued his training at the Airline\nTraining Centre in Phoenix (Arizona, USA);\n from 15 June 2011 to 31 December 2013, he was under contract as a flight\nattendant for Lufthansa while continuing his Air Transport pilot training;\n from 27 September to 23 December 2013, he took and passed his A320 type\nrating at Lufthansa in Munich (Germany);\n on 4 December 2013, he joined Germanwings;\n from 27 January 2014 to 21 June 2014, he undertook his operator’s conversion\ntraining including his line flying under supervision at Germanwings;\n on 26 June 2014, he passed his proficiency check and was appointed as a co-pilot;\n on 28 October 2014, he passed his operator proficiency check.\nDuring his training and recurrent checks, his professional level was judged to be\nabove standard by his instructors and examiners.\n\u003c/parca>\n\n\u003cparca no=\"8\">\n[137-germanwings-flight-9525.pdf › Sayfa 72]\nSayfa 72\n\nD-AIPX - 24 March 2015\n72\nThis list does not include events due to terrorist attacks.\nDate Aircraft Operator State of\nOccurrence\nDeaths Circumstances\n18/01/2015 A320 Condor Portugal 0 The airplane was in cruise at FL370 approximately 60 NM from Lisbon\nwhen the co-pilot became incapacitated, and could no longer perform his\nduties. The Captain diverted to Faro, where the plane landed uneventfully.\nThe copilot was then transported to the hospital, where he exhibited\nbehaviour during the following days that raised psychiatric concerns.\n29/11/2013 ERJ\n190\nLAM Namibia 33 The aeroplane was in cruise at flight level FL380 when the co-pilot left the\ncockpit to go to the toilet, leaving the Captain alone. On three occasions,\ndifferent altitudes were selected to order a descent to the ground with\nautopilot. The CVR showed variable levels of aural warnings, as well as\nnoises of repeated knocking and calls, corresponding to attempts to get\ninto the cockpit.\n27/03/2012 A320 JetBlue US A 0 As the plane was leaving New York-JFK and climbing in altitude in its\nscheduled five-hour flight to Las Vegas, the Captain said something to the\nfirst officer (FO) about being evaluated by someone, but the FO did not\nknow what he meant. The Captain then talked about his church and the\nneed to “focus” and asked the FO to take the controls and work the radios.\nThe Captain began talking about religion, but, according to the FO, his\nstatements were not coherent. The FO became concerned when the\nCaptain said “things just don’t matter.” According to the FO, the Captain\nyelled over the radio to air traffic control and instructed them to be quiet.\nThe Captain turned off the radios in the aircraft, dimmed his monitors, and\nsternly admonished the FO for trying to talk on the radio. When the captain\nsaid “we need to take a leap of faith,” the FO stated that he became very\nworried. The Captain told the FO that “we’re not going to Vegas” and\nbegan giving what the FO described as a sermon. The FO suggested to\nthe Captain that they invite the off-duty JetBlue captain who was on board\nthe flight into the cockpit. However, the Captain abruptly left the cockpit to\ngo to the forward lavatory, alarming the rest of the flight crew when he\ndidn’t follow the company’s protocol for leaving the cockpit. When flight\nattendants met the Captain and asked him what was wrong, he became\naggressive and banged on the door of the occupied lavatory, saying he\nneeded to get inside. While the Captain was in the lavatory, at the request\nof the FO, a flight attendant brought the off-duty captain to the cockpit,\nwhere he assisted the FO with the remainder of the flight. When the\nCaptain exited the lavatory, he began talking to flight attendants,\nmentioning “150 souls on board.” The Captain walked to the rear of the\naircraft but along the way stopped and asked a male passenger if he had a\nproblem. The Captain then sprinted back to the forward galley and tried to\nenter his code to re-enter the cockpit. When the FO announced over the\npublic address system an order to restrain the Captain, several\npassengers assisted and brought him down in the forward galley, where\nhe continued to yell comments about Jesus,\n\u003c/parca>\n\nSoru: Germanwings'te kaptan kokpite neden giremedi?", "parts": [{"kind": "system", "chars": 419}, {"kind": "chunk", "rank": 1, "folder": "2010'ler", "chars": 2052}, {"kind": "chunk", "rank": 2, "folder": "2010'ler", "chars": 849}, {"kind": "chunk", "rank": 3, "folder": "2010'ler", "chars": 1858}, {"kind": "chunk", "rank": 4, "folder": "2010'ler", "chars": 3281}, {"kind": "chunk", "rank": 5, "folder": "2010'ler", "chars": 935}, {"kind": "chunk", "rank": 6, "folder": "2010'ler", "chars": 3020}, {"kind": "chunk", "rank": 7, "folder": "2010'ler", "chars": 2588}, {"kind": "chunk", "rank": 8, "folder": "2010'ler", "chars": 3278}, {"kind": "question", "chars": 53}]}, "generate": null};

function svg(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v; else if (k === "style") e.setAttribute("style", v); else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = ev.clientY + 16 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
function hoverable(node, html) {
  node.addEventListener("mousemove", ev => showTip(ev, typeof html === "function" ? html() : html));
  node.addEventListener("mouseleave", hideTip);
}
function card(id, no, title, dur, lede) {
  const c = document.createElement("section");
  c.className = "card"; c.id = id;
  c.innerHTML = `<h2>${no ? `<span class="step-no">${no}</span>` : ""}${esc(title)}${dur != null ? `<span class="dur">${ms(dur)}</span>` : ""}</h2>`
    + (lede ? `<p class="lede">${lede}</p>` : "");
  $("#app").appendChild(c);
  return c;
}
function terms(parent, list) {
  const d = document.createElement("div"); d.className = "terms";
  d.innerHTML = list.map(([t, x]) => `<div class="term"><b>${t}</b>${x}</div>`).join("");
  parent.appendChild(d);
}
function html(parent, s) { parent.insertAdjacentHTML("beforeend", s); }

/* Claude'un cevabı için küçük markdown çizici: başlık, tablo, liste, kalın, [n] atıf */
function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

{
  const e = T.embed;
  const c = card("s1", "1", "Soru sayıya çevrildi", stepMs("embed"),

    "Parçalar da indekslemede aynı modelle aynı uzaya çevrilmişti. Anlamca yakın metinlerin vektörleri aynı yöne bakar.");
  const cols = 64, rows = Math.ceil(e.dim / cols), cw = 1000 / cols, ch = 12;

/* ---------- ② Arama ---------- */
{
  const S = T.search;
  const c = card("s2", "2", `${int(T.corpus.n_chunks)} parça puanlandı, en iyi ${T.k} tanesi seçildi`, stepMs("search"),
    `Soru vektörü, indeksteki <b>her</b> parça vektörüyle karşılaştırıldı (kosinüs benzerliği). Sonuç ${int(T.corpus.n_chunks)} skor. Bunlar sıralandı ve en yüksek ${T.k} tanesi seçildi. Model yok, "anlama" yok: yalnızca geometri.`);
  const lo = S.histogram.edges[0], hi = S.histogram.edges.at(-1);

  // Histogram
  html(c, `<h3>Tüm skorların dağılımı</h3><p class="lede" style="margin:0 0 6px">Her çubuk bir skor aralığı, yüksekliği o aralıktaki parça sayısı. Parçaların çoğu ortada yığılır (soruyla ilgisiz). Seçilenler sağ uçta, kesim çizgisinin sağında.</p>`);
  {
    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Skor histogramı" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);
    [0, 0.5, 1].forEach(f => {
      const n = Math.round(maxC * f), y = Y(n);
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);
      const hitRect = svg("rect", { x: X(a), y: m.t, width: X(b) - X(a), height: H - m.t - m.b, style: "fill:transparent" }, s);
      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);
    const kx = X(S.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t - 6, y2: H - m.b + 34, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    svg("text", { x: kx - 6, y: m.t + 4, "text-anchor": "end", class: "ink", style: "font-weight:600",
      text: `kesim ${fmt(S.kth_score)} (#${T.k})` }, s);
    svg("text", { x: X(S.mean_score), y: m.t + 4, "text-anchor": "middle", class: "ink2", text: `ortalama ${fmt(S.mean_score, 2)}` }, s);
  }
  if (S.next_score != null) {
    const gap = S.kth_score - S.next_score;
    html(c, `<div class="callout"><b>Kıl payı:</b> ${T.k}. parça <b class="num">${fmt(S.kth_score)}</b>, ${T.k + 1}. parça <b class="num">${fmt(S.next_score)}</b>, fark yalnızca <b class="num">${fmt(gap, 4)}</b>. ` +
      (gap < 0.01 ? "Kesim bıçak sırtında. k'yi 1 artırmak Claude'a başka bir parça gösterirdi. Aşağıdaki tabloda kesimin hemen altında kalanlar da var." : "Seçilenler geri kalanlardan belirgin biçimde ayrışıyor.") + `</div>`);
  }

  // Klasör şeridi
  html(c, `<h3>Hangi klasör yarıştı?</h3><p class="lede" style="margin:0 0 6px">Her satır bir klasör, her nokta o klasördeki bir parça. Sağa gittikçe skor artar. Büyük noktalar seçilen ${T.k} parça.</p>`);
  {
    const pts = T.map.points, W = 1000, rowH = 30, m = { l: 150, r: 10, t: 6, b: 26 };
    const H = m.t + FOLDERS.length * rowH + m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Klasöre göre skorlar" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    FOLDERS.forEach((f, fi) => {
      const y = m.t + fi * rowH + rowH / 2;
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      const nh = hits.filter(h => h.folder === f).length;
      svg("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", class: nh ? "ink" : "", style: nh ? "font-weight:600" : "",
        text: `${f}${nh ? ` (${nh})` : ""}` }, s);
    });
    const kx = X(T.search.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t, y2: H - m.b, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    pts.forEach((p, i) => {
      if (p[4]) return;
      const y = m.t + p[3] * rowH + rowH / 2 + ((i * 7919) % 11 - 5);  // sabit titreşim: üst üste binmesin
      svg("circle", { cx: X(p[2]), cy: y, r: 2.2, style: `fill:${folderColor(p[3])};fill-opacity:.35` }, s);
    });
    hits.forEach(h => {
      const fi = FOLDERS.indexOf(h.folder), y = m.t + fi * rowH + rowH / 2;
      const d = svg("circle", { cx: X(h.score), cy: y, r: 6, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, s);
      hoverable(d, `<b>#${h.rank}</b> · ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
  }

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = v => pad + (v - x0) / (x1 - x0) * (W - 2 * pad), Y = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",
      style: "background:var(--page);border-radius:10px" }, c);
    P.forEach((p, i) => {
      if (p[4]) return;
      const d = svg("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, style: `fill:${folderColor(p[3])};fill-opacity:.45` }, s);
      hoverable(d, () => `${esc(T.map.labels[i])}<br>skor <b>${fmt(p[2])}</b>`);
    });
    const qx = X(T.map.question[0]), qy = Y(T.map.question[1]);
    hits.forEach(h => svg("line", { x1: qx, y1: qy, x2: X(h.x), y2: Y(h.y), style: "stroke:var(--ink);stroke-opacity:.18;stroke-width:1" }, s));
    hits.forEach(h => {
      const g = svg("g", { id: `map-hit-${h.rank}` }, s);
      svg("circle", { cx: X(h.x), cy: Y(h.y), r: 9, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, g);
      svg("text", { x: X(h.x), y: Y(h.y) + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700", text: h.rank }, g);
      hoverable(g, `<b>#${h.rank}</b> · skor ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    const star = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
      const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
      return `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

/* ---------- Sözlük ---------- */
{
  const c = card("gloss", null, "Hata ayıklama rehberi", null, "Kötü bir cevap aldığında bu sayfayı yukarıdan aşağıya şu sırayla oku:");
  html(c, `<table><tbody>
    <tr><td style="width:36%"><b>Tabloda doğru parça yok</b></td><td>Arama hatası. Soru başka bir konu kümesine düşmüş olabilir (haritaya bak) ya da parça zayıf bir vektör üretmiştir (kısa tablo satırı, bağlamsız metin). Çözüm yolları: soruyu yeniden ifade etmek, k'yi artırmak, hibrit arama (BM25).</td></tr>
    <tr><td><b>Doğru parça kıl payı kalanlar arasında</b></td><td>Kesim bıçak sırtında. k'yi biraz artırmak yetebilir.</td></tr>
    <tr><td><b>Doğru parça seçilmiş ama cevap yanlış</b></td><td>Üretim hatası. ④'te o parçaya atıf var mı? Yoksa Claude onu gözden kaçırmıştır. Prompt'u ya da parça sırasını gözden geçir.</td></tr>
    <tr><td><b>Parça metni bozuk</b></td><td>Veri hazırlığı hatası (load/chunk). Tablodaki "parça metni"ni aç. HTML artığı ya da yanlış başlık varsa sorun indekslemede.</td></tr>
    <tr><td><b>"Bulamadım" dedi</b></td><td>Doğru davranış olabilir. Önce tabloda cevabın gerçekten olmadığını doğrula.</td></tr>
  </tbody></table>`);
}
</script>
</body>
</html>
