.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

.tile { background: var(--page); border-radius: 10px; padding: 12px 14px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
tr.hit-row { cursor: pointer; } tr.hit-row:hover td, tr.hl td { background: var(--page); }

.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.bar.runner { background: var(--axis); }
.path { word-break: break-word; }
.path small { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--page); padding: 12px;

.answer { font-size: 15.5px; line-height: 1.65; }

.cite:hover, .cite:focus { background: var(--accent); color: #fff; outline: none; }
.cited-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }

.cg.on { background: var(--accent); border-color: var(--accent); color: #fff; }

dder pedals at the time of the event.\nWhile climbing through 10,000 feet, he said he experienced several rapid “jerks” that he\ncould not identify. The flight encountered light turbulence at the time. While continuing\nthe climb between 25,000 feet and 28,000 feet, he said he felt a significant right rudder\ninput which lasted between 5 and 10 seconds. The airplane was still in light turbulence\nand at 280 knots. Although he was not sure if his feet were on the rudder pedals during\nthis later occurrence, he reacted by centering the ball with left rudder input and normal\nflight was resumed. Both crewmembers looked up at the overhead panel and saw the\nNo. 1 constant speed drive (CSD) low oil pressure light illuminated. The yaw damper was\nturned off and its circuit breaker was pulled. The CSD light went out, then came back on\nabout 5 minutes later. The CSD was disconnected, and no further anomalies were\nexperienced during the remainder of the flight or subsequent flights.\nThere were no open maintenance items when the airplane departed Denver on\nMarch 3, 1991. No other maintenance items were found in the AMIS review that appeared\nrelated to the accident circumstances.\nAll applicable Airworthiness Directives (ADs) had been complied with. Required\nactions that were not yet accomplished were within the time limits specified in the AD.\nThe hydraulic rudder actuator, standby actuator, transfer valve, and yaw damper\ncoupler are “on condition”6 items in the United Airlines maintenance program.\nSubsequent to the records review, the history of the standby rudder actuator was\nreviewed in detail because of discrepancies found during the actuator's disassembly (see\nsection 1.12.3.2 of this report.) The actuator was manufactured on October 3, 1981, by\nHydraulic Units, Inc.—now Dowty Aerospace. It had been installed on N999UA by\nBoeing during manufacture of the airplane. It had not been removed from the airplane by\neither Frontier Airlines or by UAL. It was identified by the manufacturer's part\nnumber 1U1150-1 and Boeing part number BAC10-60797-4, serial number 0953.\n1.6.3 Boeing 737 Hydraulic System Information\nHydraulic power on the 737-200 is provided by three independent hydraulic\nsystems, each of which is capable of operating pressures of about 2,950 pounds per square\ninch (psi). The systems are designated as hydraulic system A, hydraulic system B, and the\nstandby hydraulic system. Hydraulic systems A and B have independent hydraulic\nreservoirs and two hydraulic pumps each. Although hydraulic systems A and B normally\noperate together to provide dual hydraulic power for primary flight controls (ailerons,\nelevators, and rudder), either system is capable of powering the flight controls alone if the\nother system fails. Further, if one of the hydraulic pumps in either the A or B systems\nwere to fail, the remaining pump has sufficient capacity to provide full flight control\nauthority for its respective system operation. If needed, the ailerons and elevators can also\n6 “On condition” means that maintenance is performed only after a defect is noted during", "x": -0.20364901423454285, "y": -0.000988004612736404}, {"rank": 5, "i": 3464, "id": "087-valujet-flight-592.pdf#137", "path": "1990'ler/087-valujet-flight-592.pdf", "heading_path": ["Sayfa 107"], "folder": "1990'ler", "score": 0.5253088474273682, "text": "[087-valujet-flight-592.pdf › Sayfa 107]\n# Sayfa 107\n\n93\nOn January 26, 1996, Delta Air Lines changed its policy and required that the\noxygen generators be expended and disposed of at the maintenance facilities where the\ngenerators were removed. This policy change was in response to two fires involving packages of\nexpired chemical oxygen generators at the Delta maintenance facility in Atlanta.114 According to\nthe Delta station maintenance foreman in Seattle, the generators had been removed from an\nairplane at his facility and were sent to Atlanta for actuation and disposal.\nAfter the crash of flight 592, Trans World Airlines also discontinued its practice\nof sending expired generators to its maintenance base in Kansas City for actuation and disposal.\n1.18.2 Incidents Involving Chemical Oxygen Generators\nIncident No. 1.— On August 10, 1986, an American Trans Air DC-10 was\ndestroyed while parked at a gate at Chicago O’Hare International Airport. Passengers and crew\nfrom the inbound flight had deplaned, and mechanics and cabin cleaners were servicing the\nairplane. When smoke began entering the cabin, the onboard personnel unsuccessfully attempted\nto determine the source of the smoke before they evacuated the airplane at 7:15 a.m.\nSubsequently, a fire spread rapidly throughout the cabin, and the airplane was destroyed. No one\nwas injured.\nThe Safety Board’s investigation revealed that at about 6:50 a.m., a mechanic had\nentered the airplane’s cargo compartment during servicing to look for a replacement for a broken\nseatback on the plane. The mechanic stated that while examining seat backs being transported as\nCOMAT, he noticed that the door to a supplemental oxygen compartment on one of the\nseatbacks would not latch and its associated chemical oxygen generator was loose. The\nmechanic stated that he handled the generator by the plastic hose and placed the generator back\ninto its compartment. The investigation revealed that the COMAT shipment did not have proper\nshipping papers, packaging, and labels in accordance with the hazardous materials regulations.\nThe Safety Board found that the fire was initiated by the mechanic’s improper\nhandling of an oxygen generator associated with a seat back temporarily stored in the C1 cargo\ncompartment, and that the oxygen generator had not been packaged in accordance with federal\nregulations.\nFollowing the incident, the FAA sent a notice dated August 13, 1986, to all\ndomestic air carriers and foreign airworthiness authorities informing them of the circumstances\nof the incident and reminding them that chemical oxygen generators are oxidizers and therefore\nclassified as hazardous materials which should be properly packaged and stowed securely. The\n\n114 The fires occurred on December 22 and 24, 1995. According to the Delta investigators, they believed that\nthe December 22 fire was intentionally started. The investigation of the second fire revealed that the safety clips on\nthe actuating devices had not been fully inserted. The investigators stated that they believed that a partially inserted\nsafety clip could have fallen out during rough handling of the box containing the generators. (These fires were not\nreported to the FAA, nor were they required to be.)", "x": -0.16200903058052063, "y": -0.08209238201379776}, {"rank": 6, "i": 5, "id": "001-united-airlines-flight-811.pdf#5", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 6"], "folder": "1980'ler", "score": 0.5250284671783447, "text": "[001-united-airlines-flight-811.pdf › Sayfa 6]\n# Sayfa 6\n\nEXECUTIVE SUMMARY\nOn February 24, 1989, United Airlines flight 811, a Boeing 747-122,\nexperienced an explosive decompression as it was climbing between 22,000 and\n23,000 feet after taking off from Honolulu, Hawaii, en route to Sydney, Australia\nwith 3 flightcrew, {5 flight attendants, and 337 passengers aboard.\nThe cirplane made a successful emergency landing at Honolulu and\nthe occupants evacuated the airplane. Examination of the airplane revealed that the\nforward lower lobe cargo door had separated in flight and had caused extensive\ndamage to the fuselage and cabin structure adjacent to the door. Nine of the\npassengers had been ejected from the airplane and lost at sea.\nA year after the accident, the Safety Board was uncertain that the\ncargo door would be located and recovered from the Pacific Ocean. The Safety\nBoard decided to proceed with a finai report based on the available evidence\nwithout the benefit of an actual examination of the door mechanism. The original\nreport was adopted by the Safety Board on April 16, 1990, as NTSB/AAR-90/01.\nSubsequently, on July 22, 1990, a search and recovery operation was\nbegun by the U.S. Navy with the cost shared by the Safety Board, the Federal\nAviation Administration, Boeing Aircraft Company, and United Airlines. The\nsearch and recovery effort was supported by Navy radar data on the separated\ncargo door, underwater sonar equipment, and a manned submersible vehicle. The\neffort was successful, and the cargo door was recovered in two pieces from the\nocean floor at a depth of 14,200 feet on September 26 and October 1, 1990.\nBefore the recovery of the cargo door, the Safety Board believed that\nthe door locking mechanisms had sustained damage in service prior to the accident\nflight to the extent that the door could have been closed and appeared to have been\nlocked, witen in fact the door was not fully latched. This belie? was expressed in\nthe report and was supported by the evidence available at the time. However, upon\nexamination of the door, the damage to the locking mechanisia did not support this\nhypothesis. Rather, the evidence indicated that the latch cams had been back-\ndriven from the closed position into a nearly open position after the door had been\nclosed and locked. The latch cams had been driven into the lock sectors that\ndeformed so that they failed to prevent the back-driving.", "x": -0.09250108152627945, "y": 0.029505232349038124}, {"rank": 7, "i": 4319, "id": "102-air-florida-flight-90.pdf#39", "path": "1980'ler/102-air-florida-flight-90.pdf", "heading_path": ["Sayfa 22"], "folder": "1980'ler", "score": 0.5220848917961121, "text": "[102-air-florida-flight-90.pdf › Sayfa 22]\nSayfa 22\n\n-17-\nThe FDR showed a sharp decrease and then a gentle rise in the altitude trace\nbeginning at 1600:31.6 (0002:00.6); this is characteristic of the change in static pressure\ncaused by aircraft rotation. Airspeed at this time was recorded as 130 knots. The V\ncallout occurred at 1600:37, and the sound of the stall warning (stickshaker) began\n2 seconds later and continued until impact.\nAfter rotation, the aircraft began to climb at a fairly constant but slightly\ndecreasing airspeed; between 1600:37.6 and 1600:46.0, airspeed decreased from 147 to\n144 kns. Altitude at the end of this period was 240 feet and heading had changed about 3°\nto the right. During the next 7 seconds ending at 1600:53.8, airspeed decreased\nsignificantly, from 144 to 130 kns, while heading changed to the left, from 009° to 002.4°\nthe maximum recorded altitude of 352 feet was achieved at the end of this period. The\nheading then continued changing to the left, reaching 347.5° 6.6 seconds later; the\nrecording ended 0.6 second beyond this point with a heading of 354.4°.\nThe altitude trace beyond 1600:54.0 is jagged, with rapid excursions up and\ndown... The FDR altitude stylus was calibrated so that-a movement of 0.0033 inch\ncorresponds to a change in altitude of 100 feet (between 1,000 feet and 8,000 feet); hence,\nany vibration-induced stylus movement such as might be produced by stall buffet would\nproduce significant changes in the altitude trace with respect to the maximum value of\n352 feet.\n1.12 Wreckage\nWreckage recovery was initiated immediately after the accident and\nsimultaneously with the recovery of victims. Recovery operations were conducted in\ncoordination with the National Transportation Safety Board by various segments of the\nDepartment of Defense, Department of Transportation, and Metropolitan Washington\nPolice Department, all under the general direction of the Federal Emergency Management\nAgency (FEMA).\nAs the aircraft descended, the right wing was structurally damaged when it hit\nthe boom truck, and shortly thereafter, the aircraft struck the steel barrier and railing on\nthe west side of the 14th Street Bridge at an elevation of about 37 feet mean sea level.\nFragments of the right wing remained on the bridge. The remainder of the wreckage sank\nin the Potomac River in about 25 to 30 feet of water. The wreckage area was confined to\nthe south side of the river between the 14th Street Bridge and the Center Highway Bridge\nof the George Mason Memorial Bridge. (See figure 4.)\nAfter initial impact, the aircraft broke into several major pieces. © The\nfuselage broke into four major pieces which included: (1) nose section with cockpit; (2)\nfuselage section between nose section and wing center section; (3) fuselage-to-wing\nintersection; and (4) aft body structure with empennage attached. The wing structure was\nseparated into three major pieces which included: (1) left wing outboard of the No. 1\nengine, including all associated flight control surfaces; (2) wing center section, lower\nsurface, including wing lower surface stubs between the No.1 engine mounts and the\nNo. 2 engine mounts; and (3) right wing outboard of the No. 2 engine with the outboard\n20 feet mostly", "x": -0.16351526975631714, "y": 0.10921406745910645}, {"rank": 8, "i": 979, "id": "013-aloha-airlines-flight-243.pdf#4", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 6"], "folder": "1980'ler", "score": 0.5211727619171143, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 6]\n# Sayfa 6\n\nEXECUTIVE SUMMARY\nOn April 28, 1988, at 1346, a Boeing 737-200, N73711, operated by.\nAloha Airlines Inc., as flight 243, experienced an explosive decompression\nand structural failure at 24,000 feet, while en route from Hilo, to Honolulu,\nHawaii. Approximately 18 feet from the cabin skin and structure aft of the\ncabin entrance door and above the passenger floorline separated from the\nairplane during flight.’ There were 89 passengers and 6 crewmembers on board.\nOne flight attendant was swept overboard during the decompression and is\npresumed to have been fatally injured; 7 passengers and 1 flight attendant\nreceived serious injuries. The flight crew performed an emergency descent\nand landing at Kahului Airport on the Island of Maui.\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the failure of the Aloha Airlines\nmaintenance program to detect the presence of significant disbonding and\nfatigue damage which ultimately led to failure of the lap joint at S-10L and\nthe separation of the fuselage upper lobe. Contributing to the accident were\nthe failure of Aloha Airlines management to supervise properly its\nmaintenance force; the failure of the FAA to evaluate properly the Aloha\nAirlines maintenace program and to assess the airline’s inspection. and\nquality control deficiencies; the failure of the FAA to require Airworthiness\nDirective 87-21-08 inspection of all the lap joints proposed by Boeing Alert\nService Bulletin SB 737-53A1039; and the lack of a complete terminating\naction (neither generated by Boeing nor required by the FAA) after the\ndiscovery of early production difficulties in the B-737 cold bond lap joint\nwhich resulted in low bond durability, corrosion, and premature fatigue\ncracking.\nThe safety issues raised in this report include:\no . The quality of air carrier maintenance programs and\nthe FAA surveillance of those programs.\n) The engineering design, certification, and\ncontinuing airworthiness of the B-737~ with\nparticular emphasis on multiple site fatigue\ncracking of the fuselage lap joints.\n) The human factors aspects of air carrier maintenance\nand inspection for the continuing airworthiness of\ntransport category airplanes, to include repair\nprocedures and the training, certification and\nqualification of mechanics and inspectors.\nRecommendations. concerning these issues were addressed to the\nFederal Aviation Administration, Aloha Airlines, and the Air Transport’\nAssociation.", "x": -0.08326712250709534, "y": -0.08773919194936752}], "runners_up": [{"rank": 9, "i": 77, "id": "001-united-airlines-flight-811.pdf#77", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 79"], "folder": "1980'ler", "score": 0.5189635753631592, "text": "[001-united-airlines-flight-811.pdf › Sayfa 79]\n# Sayfa 79\n\n71\nDuring the approach to HNL, all of the leading edge flaps had\nextended, except the outboard sections 22 through 26 on the right wing. The\nreason that they failed to extend probably was the damage to the pneumatic duct\ncaused by the ejected debris. The pneumatic pressure probably was too low to\nactuate the most outboard flaps to the extended position.\nThe failure of the flightcrew and passenger oxygen systems was\ncaused by structural deformation and damage to the supply lines in the area\nadjacent to the cargo door and failed fuselage structure.\nThe Safety Board's analysis of this accident concentrated on the\nreasons for the loss of the cargo door and the events that led to its loss in flight.\nThe analysis included an evaluation of the design, certification, and approval\n_ processes for the B-747 cargo doors, and the operational, maintenance, and\ninspection processes for the doors. Also, the analysis included an evaluation of the\nhistorical events that had occurred over the past months and years that eventually\nled to this accident.\n2.2 Loss of the Cargo Door\nThe calculated pressure differential at the time of the loss was about\n6.5 psi, which would have exerted a load on a properly closed and locked door that\nwas substantial, but well within design limits.\nThere was no evidence of a structural problem with the cargo door\nthat could have caused it to fail from metal fatigue or corrosion. Although the\ncargo door was recovered in two pieces on the floor of the ocean, there was no\nevidence of a preseparation structural failure of the door. All fractures and damage\nfound on the door were determined to be the result of the sudden opening of the\ndoor rather than the cause. The evidence showed that the door was intact when it\nflew open violently and that its integrity was compromised when it struck the upper\nfuselage structure and most likely when it struck the water. The fracture in the\ncargo door occurred just below the midspan latch cams. Paint marks on the outer\nsurface of the door that matched upper fuselage structure paint pattem, damage to\nthe latch pins, pull-in hooks and hook pins, as well as damage to the floor structure\nnear the upper door hinge area were consisteat evidence that the door was intact\nwhen it flew open.", "x": -0.08836044371128082, "y": -0.025363842025399208}, {"rank": 10, "i": 3061, "id": "071-us-airways-flight-1549.pdf#20", "path": "2000'ler/071-us-airways-flight-1549.pdf", "heading_path": ["Sayfa 17"], "folder": "2000'ler", "score": 0.5127604007720947, "text": "[071-us-airways-flight-1549.pdf › Sayfa 17]\nSayfa 17\n\nNTSB Aircraft Accident Report\nxv\nExecutive Summary\nOn January 15, 2009, about 1527 eastern standa rd time, US Airways flight 1549, an\nAirbus Industrie A320-214, N106US, experienced an almost complete loss of thrust in both\nengines after encountering a flock of birds a nd was subsequently ditched on the Hudson River\nabout 8.5 miles from LaGuardia Airport (LGA), Ne w York City, New Yor k. The flight was en\nroute to Charlotte Douglas International Airport, Charlotte, North Carolina, and had departed\nLGA about 2 minutes before the in-flight event occurred. The 150 passengers, including a\nlap-held child, and 5 crewmembers evacuated the airplane via the forwar d and overwing exits.\nOne flight attendant and four passengers were seriously injured, and the airplane was\nsubstantially damaged. The scheduled, domestic passenger flight was operating under the\nprovisions of 14 Code of Federal Regulations Part 121 on an instrument flight rules flight plan.\nVisual meteorological conditions prevailed at the time of the accident.\nThe National Transportation Safety Board determines that the probable cause of this\naccident was the ingestion of large birds into each engine, which resu lted in an almost total loss\nof thrust in both engines and the subsequent ditching on the Hudson River. Contributing to the\nfuselage damage and resulting unavailability of the aft slide/rafts were (1) the Federal Aviation\nAdministration’s (FAA) approval of ditching cert ification without determ ining whether pilots\ncould attain the ditching paramete rs without engine thrust, (2) th e lack of industry flight crew\ntraining and guidance on ditching techniques, and (3) the cap tain’s resulting difficulty\nmaintaining his intended airspeed on final approach due to the ta sk saturation resulting from the\nemergency situation.\nContributing to the survivability of the accid ent was (1) the decision-making of the flight\ncrewmembers and their crew resource management during the accident sequence; (2) the\nfortuitous use of an airplane that was equippe d for an extended overwater flight, including the\navailability of the forward slide/ rafts, even though it was not requi red to be so equipped; (3) the\nperformance of the cabin crewmembers while e xpediting the evacuation of the airplane; and\n(4) the proximity of the emergency responders to the accident site an d their immediate and\nappropriate response to the accident.\nThe safety issues discussed in this report relate to the following: in-flight engine\ndiagnostics, engine bird-ingestion certificatio n testing, emergency and abnormal checklist\ndesign, dual-engine failure and d itching training, training on the effects of flight envelope\nlimitations on airplane response to pilot inpu ts, validation of operational procedures and\nrequirements for airplane ditching certification, and wildlife hazard mitigation. The report also\ndiscusses survival-related issues, including passenger brace positions; slide/raft stowage;\npassenger immersion protection; life line usage; life vest stowage, retrieval, and donning;\npreflight safety briefings; and passenger educat ion. Safety recommendations concerning these\nissues are addressed to the FAA, the U.S. Department", "x": -0.14288398623466492, "y": 0.02566586062312126}, {"rank": 11, "i": 3875, "id": "092-american-airlines-flight-191.pdf#129", "path": "1970'ler/092-american-airlines-flight-191.pdf", "heading_path": ["Sayfa 62"], "folder": "1970'ler", "score": 0.5125930309295654, "text": "[092-american-airlines-flight-191.pdf › Sayfa 62]\nSayfa 62\n\n-58-\n7\n]\nI\n}\ni\ni\n'\ni\nairspeed had been. maintained, control could have been retained regardless of the\nmultiple failures of the slat control, or loss of the engine and Nos. 1 and 3\nhydraulic systems. On this basis alone, the Safety Board would view the design of\n- the leading edge slat system as satisfactory. However, the additional loss of those\nsystems designed to alert the pilot to the need to maintain airspeed. was most\ncritical. The stall warning system lacked redundancy; there was only one\n. $tieckshaker motor; and the left and right stall warning computers did not receive\ncrossover information from the applicable slat position sensors on opposite sides of\nthe aircraft. The accident aircraft's stall warning system failed to operate because\nd.c. power was not available to the stickshaker motor. Even had d.c. power been\navailable to the stickshaker motor, the system would not have provided a warning\nbased on the slats retracted stall speed schedule, because the computer receiving\nposition information from the left outboard slat was inoperative due to the loss of\npower on the No. 1 generator bus. Had power been restored to that bus, the system\nwould have provided a warning based on the slat retracted stall speed. . However, in\nview of the critical nature of the stali warning system, additional redundancy\nshould have been provided in the design.\nIn summary, the certification of the DC-10 was carried out: in\naccordance with the rules in effect at the time. The premises applied to satisfy\nthe rules were in accordance with then accepted engineering and aeronautical\nknowledge and standards. However, in retrospect, the regulations may have been\ninadequate in that they did not require the manufacturer, to account for multiple\nmalfunctions resulting from a single failure, even though that failure was\nconsidered to be extremely improbable. MeDonnell- ~Douglas considered : the\nstructural failure of the pylon and engine to be of the same magnitude as a\nstructural failure of a horizontal stabilizer or a wing. | It was an unaceptable\noccurrence, and therefore, like the wing and horizontal stabilizer, the pylon\nstructure was designed to meet and exceed all the foreseeable loads for the life of\nthe aircraft. Therefore, just as it did not analyze the effect the loss of a wing or\nhorizontal stabilizer would have on the aircraft's systems; McDonnell-Douglas did\nnot perform an analysis based on the loss of the pylon and engine. .\nLogie supports the decision not to analyze the loss of the wing and\nhorizontal stabilizer. With the loss of either of these structures, further flight is\naerodynamically impossible and the subsequent effect of the loss on the aircraft's\n- systems is academic. However, similar logie fails to support the decision not to\nanalyze the structural failure and loss of the engine and pylon, since the aircraft\nwould be aerodynamically capable of continued flight. |The possiblity of pylon\nfailure, while remote, was not impossible. Pylons had failed... Therefore, fault\nanalyses should have ‘been conducted to consider the possible trajectories of the\nfailed pylon, the possibilities of damage to aircraft structure, and the effects on\nthe pilot's", "x": -0.23496167361736298, "y": -0.10768163949251175}, {"rank": 12, "i": 4465, "id": "102-air-florida-flight-90.pdf#185", "path": "1980'ler/102-air-florida-flight-90.pdf", "heading_path": ["Sayfa 87"], "folder": "1980'ler", "score": 0.5120492577552795, "text": "[102-air-florida-flight-90.pdf › Sayfa 87]\n# Sayfa 87\n\n~32-\n33. The average impact loads on the passengers were within human\ntolerance. -However, the accident was not survivable because the\ncomplex dynamics of impact caused the destruction of the fuselage and\neabin floor which in turn caused loss of occupant restraint. The survival\nof four passengers and one flight attendant was attributed to the relative\nintegrity of the seating area where the tail section separated.\n34. The crash/fire/ rescue capability of Washington National Airport meets\nthe applicable regulations, which donot require water rescue equipment.\n35. Washington National Airport had water rescue equipment available;\nhowever, it had not been tested for use in ice-covered waters and it\nproved ineffective.\n36. The Washington National Airport. crash/fire/rescue personnel were\nnotified 3 minutes after the crash as tower personnel attempted to\ndetermine the aircraft's whereabouts.\n37. Rescue of the survivors was due solely to the expeditious response of a\nU.S. Park Police helicopter, and the heroic actions of the helicopter\nerew and of one bystander.\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the probable cause\nof this accident was the flightcrew's failure to use engine anti-ice during ground operation\nand takeoff, their decision to take off with snow/ice on the airfoil surfaces of the\naircraft, and the captain's failure to reject the takeoff during the early stage when his\nattention was called to anomalous engine instrument readings. Contributing to the\naccident were the prolonged ground delay between deicing and the receipt of ATC takeoff\nclearance during which the airplane was exposed to continual precipitation, the known\ninherent pitchup characteristics of the B-737 aireraft when the leading edge is\ncontaminated with even small amounts of snow or ice, and the limited experience of the\nflightcrew in jet transport winter operations.\n4. RECOMMENDATIONS\nAs a result of this accident and several others involving operations in snow and\nicing conditions the National Transportation Safety Board issued d\nactions that were not yet accomplished were within the time limits specified in the AD.\nThe hydraulic rudder actuator, standby actuator, transfer valve, and yaw damper\ncoupler are “on condition”6 items in the United Airlines maintenance program.\nSubsequent to the records review, the history of the standby rudder actuator was\nreviewed in detail because of discrepancies found during the actuator's disassembly (see\nsection 1.12.3.2 of this report.) The actuator was manufactured on October 3, 1981, by\nHydraulic Units, Inc.—now Dowty Aerospace. It had been installed on N999UA by\nBoeing during manufacture of the airplane. It had not been removed from the airplane by\neither Frontier Airlines or by UAL. It was identified by the manufacturer's part\nnumber 1U1150-1 and Boeing part number BAC10-60797-4, serial number 0953.\n1.6.3 Boeing 737 Hydraulic System Information\nHydraulic power on the 737-200 is provided by three independent hydraulic\nsystems, each of which is capable of operating pressures of about 2,950 pounds per square\ninch (psi). The systems are designated as hydraulic system A, hydraulic system B, and the\nstandby hydraulic system. Hydraulic systems A and B have independent hydraulic\nreservoirs and two hydraulic pumps each. Although hydraulic systems A and B normally\noperate together to provide dual hydraulic power for primary flight controls (ailerons,\nelevators, and rudder), either system is capable of powering the flight controls alone if the\nother system fails. Further, if one of the hydraulic pumps in either the A or B systems\nwere to fail, the remaining pump has sufficient capacity to provide full flight control\nauthority for its respective system operation. If needed, the ailerons and elevators can also\n6 “On condition” means that maintenance is performed only after a defect is noted during\n\u003c/parca>\n\n\u003cparca no=\"5\">\n[087-valujet-flight-592.pdf › Sayfa 107]\n# Sayfa 107\n\n93\nOn January 26, 1996, Delta Air Lines changed ions.\nThe Safety Board found that the fire was initiated by the mechanic’s improper\nhandling of an oxygen generator associated with a seat back temporarily stored in the C1 cargo\ncompartment, and that the oxygen generator had not been packaged in accordance with federal\nregulations.\nFollowing the incident, the FAA sent a notice dated August 13, 1986, to all\ndomestic air carriers and foreign airworthiness authorities informing them of the circumstances\nof the incident and reminding them that chemical oxygen generators are oxidizers and therefore\nclassified as hazardous materials which should be properly packaged and stowed securely. The\n\n114 The fires occurred on December 22 and 24, 1995. According to the Delta investigators, they believed that\nthe December 22 fire was intentionally started. The investigation of the second fire revealed that the safety clips on\nthe actuating devices had not been fully inserted. The investigators stated that they believed that a partially inserted\nsafety clip could have fallen out during rough handling of the box containing the generators. (These fires were not\nreported to the FAA, nor were they required to be.)\n\u003c/parca>\n\n\u003cparca no=\"6\">\n[001-united-airlines-flight-811.pdf › Sayfa 6]\n# Sayfa 6\n\nEXECUTIVE SUMMARY\nOn February 24, 1989, United Airlines flight 811, a Boeing 747-122,\nexperienced an explosive decompression as it was climbing between 22,000 and\n23,000 feet after taking off from Honolulu, Hawaii, en route to Sydney, Australia\nwith 3 flightcrew, {5 flight attendants, and 337 passengers aboard.\nThe cirplane made a successful emergency landing at Honolulu and\nthe occupants evacuated the airplane. Examination of the airplane revealed that the\nforward lower lobe cargo door had separated in flight and had caused extensive\ndamage to the fuselage and cabin structure adjacent to the door. Nine of the\npassengers had been ejected from the airplane and lost at sea.\nA year after the accident, the Safety Board was uncertain that the\ncargo door would be located and recovered from the Pacific Ocean. The Safety\nBoard decided to proceed with a finai report based on the available evidence\nwithout the benefit of an actual examination of the door mechanism. The original\nreport was adopted by the Safety Board on April 16, 1990, as NTSB/AAR-90/01.\nSubsequently, on July 22, 1990, a search and recovery operation was\nbegun by the U.S. Navy with the cost shared by the Safety Board, the Federal\nAviation Administration, Boeing Aircraft Company, and United Airlines. The\nsearch and recovery effort was supported by Navy radar data on the separated\ncargo door, underwater sonar equipment, and a manned submersible vehicle. The\neffort was successful, and the cargo door was recovered in two pieces from the\nocean floor at a depth of 14,200 feet on September 26 and October 1, 1990.\nBefore the recovery of the cargo door, the Safety Board believed that\nthe door locking mechanisms had sustained damage in service prior to the accident\nflight to the extent that the door could have been closed and appeared to have been\nlocked, witen in fact the door was not fully latched. This belie? was expressed in\nthe report and was supported by the evidence available at the time. However, upon\nexamination of the door, the damage to the locking mechanisia did not support this\nhypothesis. Rather, the evidence indicated that the latch cams had been back-\ndriven from the closed position into a nearly open position after the door had been\nclosed and locked. The latch cams had been driven into the lock sectors that\ndeformed so that they failed to prevent the back-driving.\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[102-air-florida-flight-90.pdf › Sayfa 22]\nSayfa 22\n\n-17-\nThe FDR showed a sharp decrease and then a gentle rise in the altitude trace\nbeginning at 1600:31.6 (0002:00.6); this is characteristic of the change in static pressure\ncaused by aircraft rotation. Airspeed at this time was recorded as 130 knots. The V\ncallout occurred at 1600:37, and the sound of the stall warning (stickshaker) began\n2 seconds later and continued until impact.\nAfter rotation, the aircraft began to climb at a fairly constant but slightly\ndecreasing airspeed; between 1600:37.6 and 1600:46.0, airspeed decreased from 147 to\n144 kns. Altitude at the end of this period was 240 feet and heading had changed about 3°\nto the right. During the next 7 seconds ending at 1600:53.8, airspeed decreased\nsignificantly, from 144 to 130 kns, while heading changed to the left, from 009° to 002.4°\nthe maximum recorded altitude of 352 feet was achieved at the end of this period. The\nheading then continued changing to the left, reaching 347.5° 6.6 seconds later; the\nrecording ended 0.6 second beyond this point with a heading of 354.4°.\nThe altitude trace beyond 1600:54.0 is jagged, with rapid excursions up and\ndown... The FDR altitude stylus was calibrated so that-a movement of 0.0033 inch\ncorresponds to a change in altitude of 100 feet (between 1,000 feet and 8,000 feet); hence,\nany vibration-induced stylus movement such as might be produced by stall buffet would\nproduce significant changes in the altitude trace with respect to the maximum value of\n352 feet.\n1.12 Wreckage\nWreckage recovery was initiated immediately after the accident and\nsimultaneously with the recovery of victims. Recovery operations were conducted in\ncoordination with the National Transportation Safety Board by various segments of the\nDepartment of Defense, Department of Transportation, and Metropolitan Washington\nPolice Department, all under the general direction of the Federal Emergency Management\nAgency (FEMA).\nAs the aircraft descended, the right wing was structurally damaged when it hit\nthe boom truck, and shortly thereafter, the aircraft struck the steel barrier and railing on\nthe west side of the 14th Street Bridge at an elevation of about 37 feet mean sea level.\nFragments of the ance program to detect the presence of significant disbonding and\nfatigue damage which ultimately led to failure of the lap joint at S-10L and\nthe separation of the fuselage upper lobe. Contributing to the accident were\nthe failure of Aloha Airlines management to supervise properly its\nmaintenance force; the failure of the FAA to evaluate properly the Aloha\nAirlines maintenace program and to assess the airline’s inspection. and\nquality control deficiencies; the failure of the FAA to require Airworthiness\nDirective 87-21-08 inspection of all the lap joints proposed by Boeing Alert\nService Bulletin SB 737-53A1039; and the lack of a complete terminating\naction (neither generated by Boeing nor required by the FAA) after the\ndiscovery of early production difficulties in the B-737 cold bond lap joint\nwhich resulted in low bond durability, corrosion, and premature fatigue\ncracking.\nThe safety issues raised in this report include:\no . The quality of air carrier maintenance programs and\nthe FAA surveillance of those programs.\n) The engineering design, certification, and\ncontinuing airworthiness of the B-737~ with\nparticular emphasis on multiple site fatigue\ncracking of the fuselage lap joints.\n) The human factors aspects of air carrier maintenance\nand inspection for the continuing airworthiness of\ntransport category airplanes, to include repair\nprocedures and the training, certification and\nqualification of mechanics and inspectors.\nRecommendations. concerning these issues were addressed to the\nFederal Aviation Administration, Aloha Airlines, and the Air Transport’\nAssociation.\n\u003c/parca>\n\nSoru: Why did United Airlines Flight 232 lose all hydraulics over Iowa?", "parts": [{"kind": "system", "chars": 419}, {"kind": "chunk", "rank": 1, "folder": "2000'ler", "chars": 964}, {"kind": "chunk", "rank": 2, "folder": "1970'ler", "chars": 3281}, {"kind": "chunk", "rank": 3, "folder": "1970'ler", "chars": 3284}, {"kind": "chunk", "rank": 4, "folder": "1 function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

    svg("path", { d: `M${x2},${y2} l-8,-5 v10 z`, style: "fill:var(--axis)" }, s);
  };
  svg("text", { x: 0, y: 18, class: "ink", style: "font-size:13px;font-weight:650", text: "İNDEKSLEME · önceden, bir kez (index.py)" }, s);
  const n = T.corpus;
  box(0, 30, 180, 64, `${int(n.n_docs)} doküman`, "md · html · pdf · docx");
  arrow(180, 62, 250, 62);
  box(250, 30, 200, 64, `${int(n.n_chunks)} parça`, "başlığa göre bölündü, ~600 token");
  arrow(450, 62, 520, 62);
  box(520, 30, 220, 64, `${int(n.n_chunks)} × ${n.dim} matris`, "her parça = 1024 sayı");
  arrow(740, 62, 810, 62);
  box(810, 30, 190, 64, "data/index.npz", "diskte duruyor");

  svg("text", { x: 0, y: 150, class: "ink", style: "font-size:13px;font-weight:650", text: "SORGU · şimdi, bu soru için (ask.py)" }, s);
  box(0, 162, 150, 64, "soru", `“${T.question.slice(0, 18)}${T.question.length > 18 ? "…" : ""}”`);
  arrow(150, 194, 185, 194);
  box(185, 162, 150, 64, "① embed", `1 × ${n.dim} vektör`, "s1", true);
  arrow(335, 194, 370, 194);
  box(370, 162, 170, 64, "② arama", `${int(n.n_chunks)} skor → en iyi ${T.k}`, "s2", true);
  arrow(540, 194, 575, 194);
  box(575, 162, 150, 64, "③ prompt", `talimat + ${T.k} parça`, "s3", true);
  arrow(725, 194, 760, 194);
  box(760, 162, 110, 64, "④ Claude", T.generate ? "cevap yazar" : "atlandı", "s4", true);
  arrow(870, 194, 905, 194);
  box(905, 162, 95, 64, "cevap", "+ [kaynak]");
  // indeks → arama bağlantısı
  svg("path", { d: "M630,94 C630,130 455,120 455,160", style: "fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4" }, s);
  svg("text", { x: 548, y: 128, "text-anchor": "middle", class: "ink2", style: "font-size:12px", text: "arama bu matrise bakar" }, s);
  svg("text", { x: 0, y: 262, class: "ink2", style: "font-size:12.5px",
    text: "Mavi kutular bu sayfada ayrıntılı. ① ve ② makinende çalışır (Ollama + numpy). Dışarıya yalnızca ③'te hazırlanan metin çıkar." }, s);
}

/* ---------- Süreler ---------- */
{
  const c = card("time", null, "Zaman nereye gitti?", total,
    "Her adımın süresi, toplam süreye oranıyla gösteriliyor. Genellikle zamanın büyük kısmını Claude alır. Arama, 1660 parça olmasına rağmen tek bir matris çarpımı olduğu için milisaniyeler sürer.");
  const names = { embed: "① embed (Ollama)", search: "② arama (numpy)", prompt: "③ prompt", generate: "④ Claude" };
  const colors = { embed: "var(--c3)", search: "var(--c1)", prompt: "var(--c4)", generate: "var(--c7)" };
  const s = svg("svg", { viewBox: "0 0 1000 64" }, c);
  let x = 0;
  T.steps.forEach(st => {
    const w = Math.max(3, st.ms / total * 1000 - 2);
    const r = svg("rect", { x, y: 0, width: w, height: 30, rx: 4, style: `fill:${colors[st.name]}` }, s);
    hoverable(r, `<b>${names[st.name]}</b><br>${ms(st.ms)} · toplamın %${fmt(st.ms / total * 100, 1)}'i`);
    x += w + 2;
  });
  const lg = document.createElement("div"); lg.className = "legend";
  lg.innerHTML = T.steps.map(st => `<span><i class="sw" style="background:${colors[st.name]}"></i>${names[st.name]} <b class="num">${ms(st.ms)}</b> <span style="color:var(--muted)">(%${fmt(st.ms / total * 100, 1)})</span></span>`).join("");
  c.appendChild(lg);
}

/* ---------- ① Embed ---------- */
{
  const e = T.embed;
  const c = card("s1", "1", "Soru sayıya çevrildi", stepMs("embed"),
    `Soru metni yerel <b>${esc(T.corpus.embed_model)}</b> modeline gönderildi. Model, sorunun <i>anlamını</i> ${e.dim} sayıdan oluşan bir listeye (vektöre) çevirdi. ` +
    "Parçalar da indekslemede aynı modelle aynı uzaya çevrilmişti. Anlamca yakın metinlerin vektörleri aynı yöne bakar.");
  const cols = 64, rows = Math.ceil(e.dim / cols), cw = 1000 / cols, ch = 12;
  const s = svg("svg", { viewBox: `0 0 1000 ${rows * ch + 26}`, role: "img", "aria-label": "Vektör değerleri ısı şeridi" }, c);
  const maxAbs = Math.max(...e.preview.map(Math.abs)) || 1;
  e.preview.forEach((v, i) => {
    const t = Math.min(1, Math.abs(v) / maxAbs);
    const r = svg("rect", { x: (i % cols) * cw, y: Math.floor(i / cols) * ch, width: cw - 1, height: ch - 1, rx: 1.5,
      style: `fill:${v >= 0 ? "var(--warm)" : "var(--accent)"};fill-opacity:${(0.12 + 0.88 * t).toFixed(2)}` }, s);
    hoverable(r, `boyut #${i}<br><b>${fmt(v, 4)}</b>`);
  });
  svg("text", { x: 0, y: rows * ch + 18, text: `${e.dim} kutu = ${e.dim} sayı · turuncu = pozitif, mavi = negatif, koyuluk = büyüklük · vektör uzunluğu ${fmt(e.norm, 3)} (normalize edildi)` }, s);
  html(c, `<div class="callout">Tek bir kutunun anlamı yoktur: "#${e.preview.indexOf(Math.max(...e.preview))} numaralı boyut finans demek" gibi bir karşılık yok. Anlam, bu vektörün diğer vektörlerle yaptığı <b>açıda</b> saklıdır. Bir sonraki adım tam olarak bu açıyı ölçüyor.</div>`);
  terms(c, [
    ["Embedding", "Metni, anlamını koruyacak şekilde sabit uzunlukta bir sayı listesine çeviren model çıktısı."],
    ["Vektör", `Bu sayı listesi. Burada ${e.dim} boyutlu: ${e.dim} eksenli bir uzayda tek bir ok gibi düşün.`],
    ["Normalize", "Okun boyu 1'e eşitlenir. Böylece yalnızca yönü karşılaştırılır; uzun metin, kısa metne göre avantaj kazanmaz."],
  ]);
}

/* ---------- ② Arama ---------- */
{
  const S = T.search;
  const c = card("s2", "2", `${int(T.corpus.n_chunks)} parça puanlandı, en iyi ${T.k} tanesi seçildi`, stepMs("search"),
    `Soru vektörü, indeksteki <b>her</b> parça vektörüyle karşılaştırıldı (kosinüs benzerliği). Sonuç ${int(T.corpus.n_chunks)} skor. Bunlar sıralandı ve en yüksek ${T.k} tanesi seçildi. Model yok, "anlama" yok: yalnızca geometri.`);
  const lo = S.histogram.edges[0], hi = S.histogram.edges.at(-1);

  // Histogram
  html(c, `<h3>Tüm skorların dağılımı</h3><p class="lede" style="margin:0 0 6px">Her çubuk bir skor aralığı, yüksekliği o aralıktaki parça sayısı. Parçaların çoğu ortada yığılır (soruyla ilgisiz). Seçilenler sağ uçta, kesim çizgisinin sağında.</p>`);
  {
    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Skor histogramı" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);
    [0, 0.5, 1].forEach(f => {
      const n = Math.round(maxC * f), y = Y(n);
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);
      const hitRect = svg("rect", { x: X(a), y: m.t, width: X(b) - X(a), height: H - m.t - m.b, style: "fill:transparent" }, s);
      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);
    const kx = X(S.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t - 6, y2: H - m.b + 34, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    svg("text", { x: kx - 6, y: m.t + 4, "text-anchor": "end", class: "ink", style: "font-weight:600",
      text: `kesim ${fmt(S.kth_score)} (#${T.k})` }, s);
    svg("text", { x: X(S.mean_score), y: m.t + 4, "text-anchor": "middle", class: "ink2", text: `ortalama ${fmt(S.mean_score, 2)}` }, s);
  }
  if (S.next_score != null) {
    const gap = S.kth_score - S.next_score;
    html(c, `<div class="callout"><b>Kıl payı:</b> ${T.k}. parça <b class="num">${fmt(S.kth_score)}</b>, ${T.k + 1}. parça <b class="num">${fmt(S.next_score)}</b>, fark yalnızca <b class="num">${fmt(gap, 4)}</b>. ` +
      (gap < 0.01 ? "Kesim bıçak sırtında. k'yi 1 artırmak Claude'a başka bir parça gösterirdi. Aşağıdaki tabloda kesimin hemen altında kalanlar da var." : "Seçilenler geri kalanlardan belirgin biçimde ayrışıyor.") + `</div>`);
  }

  // Klasör şeridi
  html(c, `<h3>Hangi klasör yarıştı?</h3><p class="lede" style="margin:0 0 6px">Her satır bir klasör, her nokta o klasördeki bir parça. Sağa gittikçe skor artar. Büyük noktalar seçilen ${T.k} parça.</p>`);
  {
    const pts = T.map.points, W = 1000, rowH = 30, m = { l: 150, r: 10, t: 6, b: 26 };
    const H = m.t + FOLDERS.length * rowH + m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Klasöre göre skorlar" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    FOLDERS.forEach((f, fi) => {
      const y = m.t + fi * rowH + rowH / 2;
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      const nh = hits.filter(h => h.folder === f).length;
      svg("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", class: nh ? "ink" : "", style: nh ? "font-weight:600" : "",
        text: `${f}${nh ? ` (${nh})` : ""}` }, s);
    });
    const kx = X(T.search.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t, y2: H - m.b, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    pts.forEach((p, i) => {
      if (p[4]) return;
      const y = m.t + p[3] * rowH + rowH / 2 + ((i * 7919) % 11 - 5);  // sabit titreşim: üst üste binmesin
      svg("circle", { cx: X(p[2]), cy: y, r: 2.2, style: `fill:${folderColor(p[3])};fill-opacity:.35` }, s);
    });
    hits.forEach(h => {
      const fi = FOLDERS.indexOf(h.folder), y = m.t + fi * rowH + rowH / 2;
      const d = svg("circle", { cx: X(h.score), cy: y, r: 6, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, s);
      hoverable(d, `<b>#${h.rank}</b> · ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
  }

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = v => pad + (v - x0) / (x1 - x0) * (W - 2 * pad), Y = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",
      style: "background:var(--page);border-radius:10px" }, c);
    P.forEach((p, i) => {
      if (p[4]) return;
      const d = svg("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, style: `fill:${folderColor(p[3])};fill-opacity:.45` }, s);
      hoverable(d, () => `${esc(T.map.labels[i])}<br>skor <b>${fmt(p[2])}</b>`);
    });
    const qx = X(T.map.question[0]), qy = Y(T.map.question[1]);
    hits.forEach(h => svg("line", { x1: qx, y1: qy, x2: X(h.x), y2: Y(h.y), style: "stroke:var(--ink);stroke-opacity:.18;stroke-width:1" }, s));
    hits.forEach(h => {
      const g = svg("g", { id: `map-hit-${h.rank}` }, s);
      svg("circle", { cx: X(h.x), cy: Y(h.y), r: 9, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, g);
      svg("text", { x: X(h.x), y: Y(h.y) + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700", text: h.rank }, g);
      hoverable(g, `<b>#${h.rank}</b> · skor ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    const star = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
      const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
      return `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

/* ---------- Sözlük ---------- */
{
  const c = card("gloss", null, "Hata ayıklama rehberi", null, "Kötü bir cevap aldığında bu sayfayı yukarıdan aşağıya şu sırayla oku:");
  html(c, `<table><tbody>
    <tr><td style="width:36%"><b>Tabloda doğru parça yok</b></td><td>Arama hatası. Soru başka bir konu kümesine düşmüş olabilir (haritaya bak) ya da parça zayıf bir vektör üretmiştir (kısa tablo satırı, bağlamsız metin). Çözüm yolları: soruyu yeniden ifade etmek, k'yi artırmak, hibrit arama (BM25).</td></tr>
    <tr><td><b>Doğru parça kıl payı kalanlar arasında</b></td><td>Kesim bıçak sırtında. k'yi biraz artırmak yetebilir.</td></tr>
    <tr><td><b>Doğru parça seçilmiş ama cevap yanlış</b></td><td>Üretim hatası. ④'te o parçaya atıf var mı? Yoksa Claude onu gözden kaçırmıştır. Prompt'u ya da parça sırasını gözden geçir.</td></tr>
    <tr><td><b>Parça metni bozuk</b></td><td>Veri hazırlığı hatası (load/chunk). Tablodaki "parça metni"ni aç. HTML artığı ya da yanlış başlık varsa sorun indekslemede.</td></tr>
    <tr><td><b>"Bulamadım" dedi</b></td><td>Doğru davranış olabilir. Önce tabloda cevabın gerçekten olmadığını doğrula.</td></tr>
  </tbody></table>`);
}
</script>
</body>
</html>
