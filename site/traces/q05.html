body { margin: 0; background: var(--page); color: var(--ink);

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 20px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
h3 { font-size: 15px; margin: 22px 0 6px; }
.num { font-variant-numeric: tabular-nums; }
.step-no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;

.dur { margin-left: auto; font-size: 13px; color: var(--ink2); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;

.lede { color: var(--ink2); margin: 2px 0 14px; }
.question { font-size: 20px; font-weight: 600; margin: 14px 0 10px; padding: 14px 18px;

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--ring); border-radius: 999px;
  padding: 3px 10px; background: var(--surface); }
.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0 4px; }
.term { background: var(--page); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
.term b { color: var(--ink); display: block; margin-bottom: 2px; }
.callout { border-left: 3px solid var(--warm); padding: 8px 12px; background: var(--page);
  border-radius: 0 8px 8px 0; font-size: 14px; margin: 12px 0; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg .ink { fill: var(--ink); } svg .ink2 { fill: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 8px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.tile { background: var(--page); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12.5px; color: var(--ink2); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
tr.hit-row { cursor: pointer; } tr.hit-row:hover td, tr.hl td { background: var(--page); }
tr.runner td { color: var(--muted); }
tr.cut td { border-bottom: 2px dashed var(--warm); padding: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.bar.runner { background: var(--axis); }
.path { word-break: break-word; }
.path small { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--page); padding: 12px;
  border-radius: 8px; font-size: 12.5px; max-height: 420px; overflow: auto; color: var(--ink2); }
.answer { font-size: 15.5px; line-height: 1.65; }
.answer h4 { font-size: 16px; margin: 18px 0 6px; } .answer p { margin: 6px 0; }
.answer table.md { width: auto; margin: 8px 0; } .answer ul { margin: 6px 0; padding-left: 22px; }
code { font-size: 0.92em; background: var(--page); padding: 1px 5px; border-radius: 4px; }
.cite { font: inherit; font-size: 12px; font-weight: 650; border: 0; border-radius: 6px; padding: 0 6px;
  margin: 0 1px; background: var(--accent-soft); color: var(--ink); cursor: pointer; vertical-align: 1px; }
.cite:hover, .cite:focus { background: var(--accent); color: #fff; outline: none; }
.cited-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.cg { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 13px;
  font-weight: 650; border: 2px solid var(--axis); color: var(--muted); }
.cg.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 360px; background: var(--ink);

.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { r: 11; } }
.theme-btn { float: right; font: inherit; font-size: 12.5px; background: var(--surface); color: var(--ink2);

nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }

4, -0.0291, 0.0061, 0.0299, -0.0384, 0.0375, -0.0601, 0.0202, 0.0203, 0.0063, 0.0176, -0.0178, -0.0371, -0.015, -0.0053, 0.0587, 0.0198, 0.02, 0.0034, -0.0062, 0.0041, 0.0254, 0.0162, -0.0137, 0.0097, 0.0293, -0.0038, -0.0197, -0.0073, -0.0225, -0.002, 0.0354, 0.0093, -0.003, 0.0172, 0.0302, -0.0296, -0.0378, 0.0351, 0.0813, -0.0438, 0.0159, 0.0101, 0.0303, -0.0083, 0.0018, 0.0001, 0.0055, 0.0024, 0.0286, -0.0269, 0.0599, 0.0389, 0.0086, 0.0145, -0.0298, -0.0032, 0.0037, -0.035, -0.0424, 0.0317, 0.0232, -0.0737, -0.0084, -0.0074, 0.0114, 0.0143, 0.0138, -0.045, 0.0094, 0.0424, -0.0012, 0.0716, -0.018, 0.0701, 0.0153, -0.0687, 0.0073, 0.0148, 0.038, -0.0067, 0.0261, 0.0292, -0.0132, 0.0065, -0.0013, 0.0194, 0.0921, 0.0008, -0.0429, 0.0337, 0.0113, -0.0126, -0.0039, -0.0798, 0.0312, 0.0284, -0.0264, 0.0367, -0.0192, 0.0209, 0.0073, -0.0054, -0.0354, -0.0367, 0.0074, 0.0346, -0.0229, -0.0198, -0.0239, 0.0773, -0.0162, 0.0108, 0.0475, 0.0384, -0.0377, 0.0263, 0.0019, 0.0034, -0.0115, 0.0192, -0.0125, 0.0087, 0.0338, -0.0341, 0.0144, -0.0131, 0.0488, -0.0137, 0.0161, 0.0165, -0.0746, 0.0194, -0.031, 0.0566, 0.0387, 0.0072, 0.0406, 0.0435, -0.007, -0.0275, 0.0432, -0.0046, 0.0255, 0.0375], "norm": 1.0}, "search": {"hits": [{"rank": 1, "i": 4090, "id": "098-air-france-flight-447.pdf#88", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 89"], "folder": "2000'ler", "score": 0.585954487323761, "text": "[098-air-france-flight-447.pdf › Sayfa 89]\n# Sayfa 89\n\nF-GZCP - 1st June 2009\n87\nImportant points revealed by analysis of these 13 unreliable IAS.\nIn the cases studied:\n The aeroplanes remained within the flight envelope during these relatively\nshort events;\n The FD’s did not disengage;\n The autothrust had been disconnected before the anomalies began in one case.\nIn the other cases, either the autothrust remained engaged, or the thrust lock\nfunction remained active for several dozen seconds before the manual adjustment\nof the thrust.\nReactions of the crews\nThis type of anomaly resulted, in most cases, in the AP disconnecting, the FD\ndisappearing, the autothrust changing to thrust lock and the flight control law\nchanging to alternate.\nThe pilot flying prioritised flying tasks and the aircraft’s flight path, maintaining a\ncruise attitude or descending to increase the margins for manoeuvre within the flight\nenvelope. The decision to descend may also have been decided as a result of the stall\nwarning triggering.\nThe reappearance of the flight directors on the PFD when two airspeeds are calculated\nas similar may prompt the crew to promptly engage an autopilot. However, although\nthe magnitude of these speeds may be the same, they may be erroneous and low,\nand could cause the autopilot to command flight control surface movements that are\nincompatible with the aircraft’s actual speed.\nIn those cases where the autothrust is automatically disconnected and the thrust\nlock function activated, the absence of an appropriate manual adjustment of the\nthrust may generate a risk of the combination of the pitch attitude and thrust being\nunsuitable, notably when this disconnection occurs when the N1 value is low.\nStall warning\nNine cases of the activation of the stall warning were noted.\nThe stall warning activates when the angle of incidence exceeds a variable threshold\nvalue. All the warning activations can be explained by the fact that the aircraft was in\nalternate law at cruise Mach and in turbulent zones (see also paragraph 1.6.11). Only\none warning triggering event was caused by a distinct input on the controls.\nCase of TAM flight on 12 November 2003\nThis case, which happened to an A330-200, was not one of the thirteen events studied\nabove because no crew report was available. However, in the light of the data from\nflight AF 447, it seems useful to mention it. In fact, following icing of at least two\nPitot probes at FL360, the crew made some high amplitude flight control inputs (to\nthe stop), sometimes simultaneously. When the AP disengaged, both pilots made\npitch-up inputs (one went to the stop) that resulted in an increase in pitch of 8°. On\nseveral occasions, the stall warning was triggered due to the nose-up inputs, and the\ncrew reacted with strong pitch-down inputs. During the 4 minutes that the sequence\nlasted, the load factor varied between 1.96 g and -0.26 g, the pitch attitude reached\n13° nose-up and the angle of attack reached 10°. Altitude variations, however, were\nless than 600 ft.", "x": -0.1996493637561798, "y": 0.06137316673994064}, {"rank": 2, "i": 4082, "id": "098-air-france-flight-447.pdf#80", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 83"], "folder": "2000'ler", "score": 0.5698219537734985, "text": "[098-air-france-flight-447.pdf › Sayfa 83]\n# Sayfa 83\n\nF-GZCP - 1st June 2009\n81\n1.12.4 Summary\nThe examinations undertaken showed that there was no depressurisation and that\non impact:\n The aeroplane was intact;\n The aeroplane struck the surface of the water with a pitch-up attitude, a slight\nbank and a high vertical speed;\n The flaps were retracted;\n The engines were at high RPM ;\n The stabiliser was near to its maximum pitch-up position.\nThis information was confirmed by the analysis of the data from the flight recorders.\n1.13 Medical and Pathological Information\nAutopsy reports and photographs of the victims found on the surface of the sea were\nprovided to the BEA by the Brazilian authorities. It should be noted that interpretation\nof the injuries is disrupted by the effects of prolonged presence in water.\nThe autopsies performed identified fractures of the spinal column, the thorax and\nthe pelvis. The fractures described were located mainly at the level of the transition\nvertebrae.\nThe compression fractures of the spinal column associated with the fractures of the\npelvis, observed on passengers seated throughout the cabin, are compatible with\nthe effect, on a seated person, of high acceleration whose component in the axis of\nthe spinal column is oriented upwards through the pelvis.\nExamination of the bodies recovered during phase 5 confirmed these observations.\nIn conclusion, taking into account the vertical acceleration at the time of impact with\nthe surface of the water, there was no possibility of surviving the accident.\n1.14 Fire\nThere was no evidence of fire or explosion.\n1.15 Survival Aspects and SAR\nThe paragraph below describes the data collection operations concerning the Search\nand Rescue operations (SAR) that would lead to the departure of the first resources\ndeployed for the AF 447 searches.\nBetween 2 h 47 and 5 h 30, the ATLANTICO , DAKAR Oceanic, SAL and CANARIAS\ncontrol centres communicated with each other several times and questioned the\nestimated times of passage of flight AF 447 at reporting points and the fact that none\nof them had had either radio or radar contact with the aeroplane after 1 h 35. No alert\nphase had yet been triggered.\nDuring this time, the following actions were taken by the various parties:\nAt 4 h 18, following the DAKAR controller’s request to relay flight AF 447, the crew\nof flight AF459 sent a message to Air France OCC to try and contact AF 447. The OCC\ndispatcher sent an ACARS message to the crew of flight AF 447: the message was\nrejected.", "x": -0.11507466435432434, "y": 0.0025213153567165136}, {"rank": 3, "i": 4189, "id": "098-air-france-flight-447.pdf#187", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 163"], "folder": "2000'ler", "score": 0.5508987307548523, "text": "[098-air-france-flight-447.pdf › Sayfa 163]\n# Sayfa 163\n\nF-GZCP - 1st June 2009\n161\nThe investigation showed that the static pressure sensors had been covered\nwith adhesive tape before a maintenance operation, but that these had not been\nremoved. The report said that this was the cause of the accident, but also that the\ncrew should have taken into account the GPWS warning that sounded just before the\ncollision with the sea and the height values from the radio altimeter. It made several\nrecommendations, specifically on training and recurrent training for pilots and the\nmodification of maintenance practices. It should be noted that many crews, not only\nwith this operator, had not received any of the information that should have been\ngiven to them urgently following the accident to the Birgenair Boeing 757 in the\nDominican Republic eight months previously.\nAccidents related to loss of control of flight path in a stall situation\nOther recent accidents were caused by loss of control of the aeroplane flight path\nin a stall situation. At the authorities’ request, the investigation reports led to the\ncreation of various working groups made up of academics, manufacturers, operators\nand authorities.\nIn liaison with stall issues, the causes and recommendations reported in these\naccidents are summarised below.\nh Accident on 22 December 1996, DC-8 operated by Airborne Express\nCause:\n Inappropriate inputs by the PF on the controls and ineffective monitoring by the\nPNF to identify and recover a stall situation.\nContributing Factor:\n Simulator fidelity in relation to a stall.\nRecommendations:\n Improvement of characteristics of flight simulators to represent a stall;\n Development of guides on stall training;\n Practising stall recovery in simulator;\n Presentation to pilots of the angle of attack and training in using this information\nh Accident on 14 October 2004, CL-600 operated by Pinnacle Airlines\nCause:\n Stall following crew inputs\nRecommendations:\n Improve training in operations at high altitude;\n Training for stall recovery at high altitude.\nh Accident on 16 August 2005, MD-82 operated by West Caribbean Airways\nCause:\n Failure to take actions to prevent a stall, and defective CRM (lack of effective\ncommunication, decision making process, ranking of priorities), enabling neither\nthe prevention nor the identification of a stall situation and as a result making\ninappropriate inputs.\nRecommendations:\n Knowledge of aeroplane performance in terms of altitude limitations;\n Simulator training on identifying a stall at high altitude and on recovery procedure;", "x": -0.20586493611335754, "y": -0.0264518354088068}, {"rank": 4, "i": 4258, "id": "098-air-france-flight-447.pdf#256", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 200"], "folder": "2000'ler", "score": 0.5479403138160706, "text": "[098-air-france-flight-447.pdf › Sayfa 200]\n# Sayfa 200\n\nF-GZCP - 1st June 2009\n198\n Although having identified and called out the loss of the airspeed indications,\nneither of the two copilots called the “Unreliable IAS” procedure.\n The Flight Directors did not disconnect.\n The crossbars disappeared and then re-appeared on several occasions, changing\nmode several times.\n The copilots had not undertaken any in-flight training, at high altitude, for the\n“vol avec IAS douteuse” procedure or on manual aeroplane handling.\n The speed displayed on the left PFD was incorrect for 29 seconds, that of the\nspeed on the ISIS for 54 seconds and the speed displayed on the right PFD for\n61 seconds at most.\n In less than one minute after autopilot disconnection, the aeroplane exited its\nflight envelope following inappropriate pilot inputs.\n The Captain came back into the cockpit about 1 min 30 after the autopilot\ndisconnection.\n Throughout the flight, the movements of the flight control surfaces were\nconsistent with the pilot’s inputs.\n Up to the exit from the flight envelope, the aeroplane’s movements were\nconsistent with the position of the flight control surfaces.\n There is no regulatory CRM training for a crew made up of two copilots in a\nsituation with a relief Captain.\n The approach to stall was characterised by the triggering of the warning then the\nappearance of buffet.\n In the absence of a display of the limit speeds on the speed tape on the PFD, the\naural stall warning is not confirmed by any specific visual display.\n The stall warning sounded continuously for 54 seconds.\n Neither of the pilots made any reference to the stall warning or to buffet.\n A short time after the triggering of the stall warning, the PF selected TO/GA thrust\nand made a nose-up input.\n Neither of the pilots formally identified the stall situation.\n The theoretical training undertaken by the copilots, as well as some documents,\nincluding the OSV note, associated the buffet phenomenon with the approach to\nstall as well as to overspeed. On the Airbus A330, the buffet phenomenon is only\nencountered on the approach to stall.\n The angle of attack is the parameter that allows the stall warning to be triggered;\nif the angle of attack values become invalid, the warning stops.\n By design, when the measured speed values are lower than 60 kt, the measured\nangle of attack values are invalidated.\n Each time that the stall warning triggered, the angle of attack exceeded the value\nof its theoretical trigger threshold.\n The aeroplane’s angle of attack is not directly displayed to the pilots.", "x": -0.18765325844287872, "y": 0.0723298192024231}, {"rank": 5, "i": 4211, "id": "098-air-france-flight-447.pdf#209", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 175"], "folder": "2000'ler", "score": 0.5458557605743408, "text": "[098-air-france-flight-447.pdf › Sayfa 175]\nno verbal expression\nof this to the PNF. At no time did the PF indicate his intentions or objectives with\nrespect to the control and stabilisation of the flight path. Although the PF’s various\nroll inputs indicate his intention to keep the wings horizontal, it is not possible\nto determine what the PF’s target was in the longitudinal axis. Four seconds after\nthe autopilot disconnection, the rapid increase in nose-up attitude resulted in the\ntriggering of the STALL 1 warning.\n\nThis warning only appeared to provoke a small\naeroplane handling reaction from the PF. The PNF asked “What is that?” which may\nrefer to the stall warning. It is possible that the PNF, faced with a short, truncated\nwarning, did not identify it. However, rather than indicating his failure to recognise\nthe warning, this question seems to mean that the PNF did not consider the warning\nto be relevant in the context of the fact that he was not necessarily aware of:", "x": -0.13988828659057617, "y": 0.050979651510715485}, {"rank": 6, "i": 2735, "id": "070-colgan-air-flight-3407.pdf#202", "path": "2000'ler/070-colgan-air-flight-3407.pdf", "heading_path": ["Sayfa 104"], "folder": "2000'ler", "score": 0.5457683801651001, "text": "[070-colgan-air-flight-3407.pdf › Sayfa 104]\nSayfa 104\n\nNTSB Aircraft Accident Report\n90\npresent on the horizontal stabilizer. Bombardier, Transport Canada, and the FAA stated during\npublic hearing testimony that the Q400 was not susceptible to tailplane stalls. 205 In addition,\nColgan had no written procedure for tailplane stalls and did not include tailplane stall training for\nthe Q400.\nThe tailplane stall recovery procedure pres ented in the video called for pulling back on\nthe control column and reducing flaps, which th e accident flight crew did. However, the video\nalso stated that tailplane icing symptoms were lightening of the controls, pitch excursions,\ndifficulty in pitch trim, control buffeting, a nd sudden nose-down pitch, none of which occurred\nbefore the stick shaker activation during the accide nt flight. Further, the activation of the stick\nshaker was a clear warning of an impending c onventional aerodynamic stall and not a tailplane\nstall, and the change in the IAS numbers to red (which occurred after the airspeed was equal to\nor below that of the low-speed cue) was a conspicuous signal that was not consistent with a\ntailplane stall. Also, indications of a tailplane stall, for those airplanes determined to be\nsusceptible, would likely occur at higher airspeeds and/or higher flap deflections.\nFor a tailplane stall recovery, the captain would have had to interpret the situation,\nidentify the tailplane stall, and apply a recovery procedure that he had never practiced. The CVR\nshowed that he did not verbally identify a tailpla ne stall, and the FDR showed that he did not\nfully apply the tailplane stall recovery proce dure described in the video. The NTSB concludes\nthat it is unlikely that the captain was deliberately attempting to perform a tailplane stall\nrecovery. The NTSB further concludes that no ev idence indicated that the Q400 was susceptible\nto a tailplane stall. (Tailplane stall training is discussed further in section 2.9.3.)\nThe NTSB also evaluated why the first officer had raised the flaps without being so\ndirected by the captain. The stick shaker activated within 1 second of the first officer moving the\nflap handle from 5° to 10°. It is possible that, because of the close timing of these events, the first\nofficer’s retraction of the flaps was an attempt to undo her last action. However, after returning\nthe handle to the 5° position, the first officer continued moving the handle to the 0° position. 206\nIt is also possible that she misinterpreted the even t as a tailplane stall, and retracting the flaps to\nthe last position before a tailplane stall was a recommended technique that she had been exposed\nto while watching the NASA icing video duri ng recurrent ground school less than 1 month\nbefore the accident. Also, the absence of standa rd callouts from the captain impeded the first\nofficer’s abilities to coordinate actions to support hi m. Further, it is possible that she raised the\nflaps as part of the steps associated with a landi ng stall recovery profile. However, if that were\nthe case, the first officer failed to make the “positive rate” or “V fri” callouts or confirm that\npower was set, which were required before raising the flaps. Finally, it is possible that the", "x": -0.19141776859760284, "y": 0.05570697784423828}, {"rank": 7, "i": 4887, "id": "122-asiana-airlines-flight-214.pdf#194", "path": "2010'ler/122-asiana-airlines-flight-214.pdf", "heading_path": ["Sayfa 112"], "folder": "2010'ler", "score": 0.5444925427436829, "text": "[122-asiana-airlines-flight-214.pdf › Sayfa 112]\nSayfa 112\n\nNTSB Aircraft Accident Report\n94\nprotection features” made the unqualified statement that “autothrottles engage automatically (if\narmed).” No description was provided of the circumstances when the A/T will not automatically\nengage. These circumstances, which were listed in the 777 FCOM, include when the AFDS pitch\nmode is FLCH SPD (as it was during the accident flight) or TO/G A, or the airplane is below\n400 ft above the airport on takeoff or below 100 ft RA on approach.\nFurther, the Boeing 777 FCTM, upon which Asiana based much of its training, did not\nexplain the conditions under which the A /T would not automatically engage. The FCTM\nrecommended A/T use during all phases of flight, including manual flight, and presented a stall\nprotection demonstration that did not include situations when the A/T would not automatically\nactivate. Asiana adopted the FCTM stall p rotection demonstration in its 777 simulator training ,\nand the PF had observed the demonstration.\nDuring the demonstration , A/P and A /T were disengaged, thrust levers were retarded to\nidle, MCP-selected speed was reduced below minimum speed on the speed tape, and the airplane\nwas allowed to decelerate into the amber band on the airspeed ta pe (below minimum\nmaneuvering speed). With no pilot intervention, the A /T system “woke up,” enga ged in SPD\nmode, and returned the airplane to minimum maneuver ing speed. The PF stated that when he\nsaw the demonstration , he was “astonished” that the airplane would recover by itself from an\napproach to stall. Because the training the PF received did not adequately describe the\ncircumstances in which the A/T would not automatically engage or expose him to such\ncircumstances, this demonstration likely gave him false confidence that the A /T would provide\nspeed protection at all times.\nAdditionally, the PF w as exposed to some informal, partially accurate information about\nthe interrelationship between the FLCH SPD pitch mode and the HOLD A/T mode during his\n777 transition training. An Asiana 777 ground school instructor stated that he had , on three\noccasions, experienced an “anomaly” in the behavior of the A/T in that it did not automatically\nengage while in FLCH SPD mode, and he personally explained this experience to pilots in his\nground school classes. He stated that the PF had been in a class that had been given this\nexplanation. Apparently, the PF was not able to recognize and apply this knowledge during the\naccident flight. The instructor’s description of these experiences as “anomalies” rather than a\nresult of the system’s design logic and the fact that the instructor’s comments were not\nincorporated into Asiana’s 777 formal training curriculum indicate that this aspect of AFDS and\nA/T functionality was not accurately described or adequately emphasized.\nThe NTSB concludes that, as a result of complexitie s in the 777 AFCS and inadequacies\nin related training and documentation, the PF had an inaccurate understanding of how the AFDS\nand A /T interacted to control airspeed , which led to his inadvertent deactivation of automatic\nairspeed control.\nAs previously mentioned, interviews with other Asiana pilots and instructors indicated\nthat", "x": -0.22593185305595398, "y": -0.04661918058991432}, {"rank": 8, "i": 4182, "id": "098-air-france-flight-447.pdf#180", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 160"], "folder": "2000'ler", "score": 0.5383213758468628, "text": "[098-air-france-flight-447.pdf › Sayfa 160]\nSayfa 160\n\nF-GZCP - 1st June 2009\n158\nthe radar, the Captain selected gain in MAX mode. At about 2 h 00, he observed a\nfirst return that differed significantly depending on whether the radar’s gain was in\nCAL or MAX mode. The TILT was set between -1° and 1.5°. He decided to take evasive\naction to the west, which resulted in a deviation of 20 NM to the left of the route.\nDuring this evasive action, a vast squall line with an estimated length of 150 NM\nappeared on the screen, which was set to a scale of 160 NM. The returns were yellow\nand red when the radar was set with gain on the MAX position and green and yellow\nwhen the gain was on the CAL position. No lightning was observed.\nATLANTICO control, informed by the crew of their decision to avoid this squall line\nby taking evasive action to the east, asked them to return to the airway as soon as\nthey could. This evasive action meant the aircraft flew between 70 and 80 NM to the\nright of the planned route. In addition, the crew was authorised to climb from FL350\nto FL370.\nOn leaving the ATLANTICO FIR, through the TASIL waypoint, the crew attempted\nin vain to contact DAKAR control in HF on the 5565 KHz and 6535 KHz frequencies,\nand on the other HF frequencies given in the on-board documentation. Likewise, the\nattempted ADS-C connection was unfruitful.\nThe crew returned to the airway around the ASEBA waypoint, that is to say more\nthan 28 minutes after the first theoretical contact with DAKAR control. They reported\nslight turbulence on the edge of the convective zone.\nRadio contact was established with DAKAR control at about 3 h 45, close to the\nSAGMA waypoint. The SELCAL test was performed and the controller asked the crew\nto try to contact AF 447. Several attempts were made on various HF frequencies, and\nthen on 121.5 MHz and 123.45 MHz, without any success.\nh FLIGHT LH507\nFlight LH507 (B747-400) preceded flight AF 447 by about twenty minutes at FL350.\nThe crew reported that it flew at the upper limit of the cloud layer and then in the\nclouds in the region of ORARO. In this zone they saw green returns on the radar on\ntheir path, which they avoided by changing their route by about ten nautical miles to\nthe west. While flying through this zone, which took about fifteen minutes, they felt\nmoderate turbulence and did not observe any lightning. They lowered their speed\nto the speed recommended in turbulent zones. They saw bright St Elmo’s fire on the\nwindshield on the left-hand side. The crew listened into the 121.5 MHz frequency\nthroughout the flight without hearing any message from AF 447.\n1.18.5.2 ATLANTICO controllers\nThe controller of the ATLANTICO ACC explained that he had asked the crew to give\nits estimated time of arrival at the TASIL waypoint. He attributed their failure to\nreply to the fact that the crew had probably lowered the volume of their radio. He\nexpected to receive position reports from the crew as they passed the ORARO and\nSALPU waypoints. For this reason, he did not attempt to call the crew via the SELCAL.\nThe controller waited for the position report from the crew at the ORARO and then\nSALPU waypoints to update the estimated time of arrival at the TASIL waypoint. He\ndid not receive a", "x": -0.11493342369794846, "y": 0.10652684420347214}], "runners_up": [{"rank": 9, "i": 2726, "id": "070-colgan-air-flight-3407.pdf#193", "path": "2000'ler/070-colgan-air-flight-3407.pdf", "heading_path": ["Sayfa 101"], "folder": "2000'ler", "score": 0.5368097424507141, "text": "[070-colgan-air-flight-3407.pdf › Sayfa 101]\nSayfa 101\n\nNTSB Aircraft Accident Report\n87\nabrupt and inappropriate. 197 The aft control column input occu rred within 1 second of the stick\nshaker activation, which suggested that the capta in’s hands were close to or resting on the\ncontrol column. However, it was not possible to determine whether the captain’s hands were\nlightly placed on the control wheel before the onset of the stick shaker and the initial aft input\nwas the result of a rough grab in response to being startled by the activation of the stick\nshaker.198\nThe aft control column movement was relaxed momentarily, but no evidence showed that\nthe control column was pushed forward enough to prevent or recover from a stall. (The control\ncolumn did not move forward of its neutral position any time after stick shaker activation.)\nNTSB postaccident observations in a Q400 flight simulator (with no simulated ice) showed that\nColgan’s recovery procedures after initial stic k shaker activation did not require exceptional\npiloting skills or aggressive inputs on the flight controls, even when full power was applied\nduring the recovery effort.\nThe captain’s subsequent control inputs were also not appropriate because he pulled back\non the column rather than pushed forward to reduce AOA. As a result, the airplane’s pitch\nattitude and AOA increased and its airspeed decreased. After the stall, the AOA oscillated\nbetween 10° and 27°, the airspeed remained below the low-speed cue value, and the stick shaker\nremained active.\nAccording to Colgan’s procedures for a sta ll recovery, the captain, as the flying pilot,\nwas to call “stall,” increase power to the rating detent, and call “check power,” but he did not\nfollow these procedures. Even though the captain added power in response to the stall warning,\nhe did not add full power as required. 199 Also, the first officer did not call “stall” when the\ncaptain failed to do so, inform him that power had not been increased to the rating detent (she\nwould have been able to observe the position of the power levers), or advance the power to the\nrating detent when the captain failed to do so. Th e next steps in the stall recovery procedure\nwould have been for (1) the first officer, as th e monitoring pilot, to call “positive rate” as an\nindication that the airplane was climbing; (2) the captain to call “gear up”; (3) the first officer to\nraise the gear and call “V fri” when the airspeed had accelerated to 125 knots; and (4) the captain\nto call for flaps 0.\nIn addition, the captain had not yet called for th e landing gear to be raised or for the flaps\nto be retracted. However, about 7 seconds after th e stick shaker activated, the first officer raised\nthe flaps and then told the captain about the action she had just taken. All of Colgan’s procedures\n197 The NTSB considered the possib ility that the captain’s initial aft input was the result of unrecognized\nspatial disorientation. Accelerations and decelerations can be misinterpreted by pilots as pitch cues, which is a\ncondition known as the somatogravic illusion. However, for this event, the deceleration would not have provided\nperceived nose-down pitch cues of sufficient magnitude to explain the captain’s action.\n198 To", "x": -0.17671728134155273, "y": 0.10359536856412888}, {"rank": 10, "i": 4185, "id": "098-air-france-flight-447.pdf#183", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 161"], "folder": "2000'ler", "score": 0.5342024564743042, "text": "[098-air-france-flight-447.pdf › Sayfa 161]\nSayfa 161\n\nF-GZCP - 1st June 2009\n159\nAt 2 h 00, the controller was relieved. His successor did not receive a position report\nfrom the ORARO waypoint. He then waited for a report of the passing of the TASIL\nwaypoint. The controllers indicated that on that night, the HF communications were\nvery poor.\n1.18.5.3 DAKAR controllers\nThe controllers of the DAKAR Oceanic ACC on duty at the time of the event indicated\nthat, on that night, numerous flight plans were not received. They added that the\nquality of reception of the HF used deteriorated during their shift. They stated that\nthey had not been concerned about the absence of radio contact with AF 447, since\naircraft frequently crossed all or some of the DAKAR Oceanic FIR without making\nradio contact. They indicated that they had not been informed, when coordinating\nwith the Brazilian controller, of the loss of radio contact between AF 447 and Brazil.\nIn anticipation of a change of shift, the display of the air traffic on the Eurocat screen\nwas updated by “accepting” all the flight plan tracks. The shift changed at 2 h 30.\nThe controllers on duty for this new shift indicated that they had coordinated with\nregards to AF 447 with the controller of the SAL ACC, by providing them with the\nestimated time of entry into the SAL FIR. They specifically clarified that no radio\ncommunication had been established with the flight. At 8 h 30 they informed the\nhead of the air traffic office of the absence of contact with AF 447. The latter passed\non this information to the DAKAR RCC.\n1.18.6 Previous Accidents and Recommendations\nAccidents with a relation to airspeed problems\nh Accident on 1st December 1974 to the Boeing 727 operated by Northwest Airlines\nThe aeroplane was scheduled to undertake flight 6231 between New York JFK, NY\n(United States) and Buffalo, NY. About 10 minutes after take-off, the crew noticed that\nthe speed and the rate of climb were very high, respectively 405 kt and 6,500 ft/min.\nA little later the overspeed warning triggered, quickly followed by the stall warning\n(stickshaker). The crew attributed the stickshaker to the appearance of « Mach\nbuffet » and tried to reduce the indicated speed. The aeroplane levelled off towards\n24,800 ft and then stalled. It went into an uncontrolled spiral spin during which the\nstabilizer separated from the aeroplane. It struck the ground about 1 minute 20 after\nbeginning its descent.\nThe NTSB report identified the probable cause of the event as being the loss of control\nof the aeroplane due to the crew not recognising and correcting the aeroplane’s\nsituation : high angle of attack, low speed stall and spiral descent. The report specified\nthat the stall was caused by inappropriate crew reactions to erroneous speed and\nMach displays that resulted from blockage of the Pitot probes through atmospheric\nicing. The report stated that contrary to standard operating procedures, the crew had\nnot switched on the Pitot probe heating.\nThe NTSB issued three recommendations to the FAA including one to issue a safety\ninformation bulletin to inspectors in order to underline the need for pilots to use pitch\nattitude information when other displays linked to the airspeed measurement", "x": -0.22817866504192352, "y": 0.12734286487102509}, {"rank": 11, "i": 4015, "id": "098-air-france-flight-447.pdf#13", "path": "2000'ler/098-air-france-flight-447.pdf", "heading_path": ["Sayfa 19"], "folder": "2000'ler", "score": 0.5325060486793518, "text": "[098-air-france-flight-447.pdf › Sayfa 19]\n# Sayfa 19\n\nF-GZCP - 1st June 2009\n17\nSynopsis\nOn 31 May 2009, the Airbus A330 flight AF 447 took off from Rio de Janeiro Galeão\nairport bound for Paris Charles de Gaulle. The aeroplane was in contact with the\nBrazilian ATLANTICO control centre on the INTOL – SALPU – ORARO - TASIL route at\nFL350. At around 2 h 02, the Captain left the cockpit. At around 2 h 08, the crew made\na course change of 12 degrees to the left, probably to avoid returns detected by the\nweather radar.\nAt 2 h 10 min 05, likely following the obstruction of the Pitot probes by ice crystals,\nthe speed indications were incorrect and some automatic systems disconnected. The\naeroplane’s flight path was not controlled by the two copilots. They were rejoined 1\nminute 30 later by the Captain, while the aeroplane was in a stall situation that lasted\nuntil the impact with the sea at 2 h 14 min 28.\nThe accident resulted from the following succession of events:\n Temporary inconsistency between the measured airspeeds, likely following the\nobstruction of the Pitot probes by ice crystals that led in particular to autopilot\ndisconnection and a reconfiguration to alternate law,\n Inappropriate control inputs that destabilized the flight path,\n The crew not making the connection between the loss of indicated airspeeds and\nthe appropriate procedure,\n The PNF’s late identification of the deviation in the flight path and insufficient\ncorrection by the PF,\n The crew not identifying the approach to stall, the lack of an immediate reaction\non its part and exit from the flight envelope,\n The crew’s failure to diagnose the stall situation and, consequently, the lack of\nany actions that would have made recovery possible.\nThe BEA has addressed 41 Safety Recommendations to the DGAC, EASA, the FAA,\nICAO and to the Brazilian and Senegalese authorities related to flight recorders,\ncertification, training and recurrent training of pilots, relief of the Captain, SAR and\nATC, flight simulators, cockpit ergonomics, operational feedback and oversight of\noperators by the national oversight authority.\nf-cp090601en\nDate of accident\n1st June 2009 at 2 h 14 min 28 (1)\nSite of accident\nAt reference 3°03’57’’ N, 30°33’42’’ W,\nnear the TASIL point, in international\nwaters, Atlantic Ocean\nType of flight\nInternational public transport of\npassengers\nScheduled flight AF 447\n(1)All times in\nthis report are\nUTC, except\nwhere otherwise\nspecified. Two\nhours should be\nadded to obtain\nthe legal time\napplicable in\nmetropolitan\nFrance on the\nday of the event,\nand three hours\nsubtracted for Rio\nde Janeiro time.\nAircraft\nAirbus A330-203\nRegistered F-GZCP\nOwner and Operator\nAir France\nOperator\nAir France\nPersons on board\nFlight crew: 3\nCabin crew: 9\nPassengers: 216", "x": -0.12329044193029404, "y": 0.07303184270858765}, {"rank": 12, "i": 4829, "id": "122-asiana-airlines-flight-214.pdf#136", "path": "2010'ler/122-asiana-airlines-flight-214.pdf", "heading_path": ["Sayfa 87"], "folder": "2010'ler", "score": 0.5304903984069824, "text": "[122-asiana-airlines-flight-214.pdf › Sayfa 87]\n# Sayfa 87\n\nNTSB Aircraft Accident Report\n69\nflight with the PM said he did not know what thrust mode the A /T would be in after this\nsequence of actions. Two 777 OE instructor captains who had conducted OE training flights with\nthe PF said that the A /T would transition to HOLD mode and remain there until a different A/P\npitch mode was selected by the pilot.\nThe Asiana 777 chief pilot was asked if there we re any conditions in which the 777 A/T\nsystem would not pr ovide low speed protection , and he said it would not provide low speed\nprotection in HOLD mode. He said this informatio n was not included in Asiana’s 777 pilot\ntraining curriculum but was contained in the 777 FCOM, and he thought Asiana 777 pilots were\naware of it. When the same question was posed to three OE training captains (two of whom had\nconducted OE training flights with the PM and one of whom had conducted an OE flight with\nthe PF), they said that the A /T system did not provide lo w speed protection in HOLD mode;\nhowever, one said he had only learned that after the accident. A fourth OE instructor was asked\nthe same question and said that the A/T system would not provide low speed protection if the\nA/P and A/T both failed. A contract simulator instructor (who had been providing 777 simulator\ntraining to Asiana pilots since 2006) was asked if he thought m ost pilots understood that the 777\nA/T system did not provide low speed protection in HOLD mode , and he said he was not aware\nof that himself until Boeing provided an update to the 777 FCOM in 2012.89\n1.17.2.3 Stall Protection Demonstration\nThe 777 FCTM, page 7.11, “Stall Protection Demon stration,” described a demonstration\nto be used in 777 training to familiarize pilots with stall warning and the correct recovery\ntechnique for conditions approaching a stall, with and without the A/P engaged. In a series of\nthree approaches to stall from level flight, the first maneuv er demonstrated the A/T “wake up”\nfeature, the second d emonstrated nose -up trim inhibit and increased column force below\nminimum maneuver speed, and the third demonstrated A/P commanded descent at slightly above\nminimum maneuver speed when the A/T is disarmed.\nAsiana adopted the FCTM stall p rotection demonstra tion in its 777 sim 6", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 187", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 188", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 189", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 190", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 191", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 192", "2010'ler/185-southwest-airlines-flight-1380.pdf › Sayfa 193"], "question": [-0.20448145270347595, -0.025354957208037376], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[098-air-france-flight-447.pdf › Sayfa 89]\n# Sayfa 89\n\nF-GZCP - 1st June 2009\n87\nImportant points revealed by analysis of these 13 unreliable IAS.\nIn the cases studied:\n The aeroplanes remained within the flight envelope during these relatively\nshort events;\n The FD’s did not disengage;\n The autothrust had been disconnected before the anomalies began in one case.\nIn the other cases, either the autothrust remained engaged, or the thrust lock\nfunction remained active for several dozen seconds before the manual adjustment\nof the thrust.\nReactions of the crews\nThis type of anomaly resulted, in most cases, in the AP disconnecting, the FD\ndisappearing, the autothrust changing to thrust lock and the flight control law\nchanging to alternate.\nThe pilot flying prioritised flying tasks and the aircraft’s flight path, maintaining a\ncruise attitude or descending to increase the margins for manoeuvre within the flight\nenvelope. The decision to descend may also have been decided as a result of the stall\nwarning triggering.\nThe reappearance of the flight directors on the PFD when two airspeeds are calculated\nas similar may prompt the crew to promptly engage an autopilot. However, although\nthe magnitude of these speeds may be the same, they may be erroneous and low,\nand could cause the autopilot to command flight control surface movements that are\nincompatible with the aircraft’s actual speed.\nIn those cases where the autothrust is automatically disconnected and the thrust\nlock function activated, the absence of an appropriate manual adjustment of the\nthrust may generate a risk of the combination of the pitch attitude and thrust being\nunsuitable, notably when this disconnection occurs when the N1 value is low.\nStall warning\nNine cases of the activation of the stall warning were noted.\nThe stall warning activates when the angle of incidence exceeds a variable threshold\nvalue. All the warning activations can be explained by the fact that the aircraft was in\nalternate law at cruise Mach and in turbulent zones (see also paragraph 1.6.11). Only\none warning triggering event was caused by a distinct input on the controls.\nCase of TAM flight on 12 November 2003\nThis case, which happened to an A330-200, was not one of the thirteen events studied\nabove because no crew report was available. However, in the light of the data from\nflight AF 447, it seems useful to mention it. In fact, following icing of at least two\nPitot probes at FL360, the crew made some high amplitude flight control inputs (to\nthe stop), sometimes simultaneously. When the AP disengaged, both pilots made\npitch-up inputs (one went to the stop) that resulted in an increase in pitch of 8°. On\nseveral occasions, the stall warning was triggered due to the nose-up inputs, and the\ncrew reacted with strong pitch-down inputs. During the 4 minutes that the sequence\nlasted, the load factor varied between 1.96 g and -0.26 g, the pitch attitude reached\n13° nose-up and the angle of attack reached 10°. Altitude variations, however, were\nless than 600 ft.\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[098-air-france-flight-447.pdf › Sayfa 83]\n# Sayfa 83\n\nF-GZCP - 1st June 2009\n81\n1.12.4 Summary\nThe examinations undertaken showed that there was no depressurisation and that\non impact:\n The aeroplane was intact;\n The aeroplane struck the surface of the water with a pitch-up attitude, a slight\nbank and a high vertical speed;\n The flaps were retracted;\n The engines were at high RPM ;\n The stabiliser was near to its maximum pitch-up position.\nThis information was confirmed by the analysis of the data from the flight recorders.\n1.13 Medical and Pathological Information\nAutopsy reports and photographs of the victims found on the surface of the sea were\nprovided to the BEA by the Brazilian authorities. It should be noted that interpretation\nof the injuries is disrupted by the effects of prolonged presence in water.\nThe autopsies performed identified fractures of the spinal column, the thorax and\nthe pelvis. The fractures described were located mainly at the level of the transition\nvertebrae.\nThe compression fractures of the spinal column associated with the fractures of the\npelvis, observed on passengers seated throughout the cabin, are compatible with\nthe effect, on a seated person, of high acceleration whose component in the axis of\nthe spinal column is oriented upwards through the pelvis.\nExamination of the bodies recovered during phase 5 confirmed these observations.\nIn conclusion, taking into account the vertical acceleration at the time of impact with\nthe surface of the water, there was no possibility of surviving the accident.\n1.14 Fire\nThere was no evidence of fire or explosion.\n1.15 Survival Aspects and SAR\nThe paragraph below describes the data collection operations concerning the Search\nand Rescue operations (SAR) that would lead to the departure of the first resources\ndeployed for the AF 447 searches.\nBetween 2 h 47 and 5 h 30, the ATLANTICO , DAKAR Oceanic, SAL and CANARIAS\ncontrol centres communicated with each other several times and questioned the\nestimated times of passage of flight AF 447 at reporting points and the fact that none\nof them had had either radio or radar contact with the aeroplane after 1 h 35. No alert\nphase had yet been triggered.\nDuring this time, the following actions were taken by the various parties:\nAt 4 h 18, following the DAKAR controller’s request to relay flight AF 447, the crew\nof flight AF459 sent a message to Air France OCC to try and contact AF 447. The OCC\ndispatcher sent an ACARS message to the crew of flight AF 447: the message was\nrejected.\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[098-air-france-flight-447.pdf › Sayfa 163]\n# Sayfa 163\n\nF-GZCP - 1st June 2009\n161\nThe investigation showed that the static pressure sensors had been covered\nwith adhesive tape before a maintenance operation, but that these had not been\nremoved. The report said that this was the cause of the accident, but also that the\ncrew should have taken into account the GPWS warning that sounded just before the\ncollision with the sea and the height values from the radio altimeter. It made several\nrecommendations, specifically on training and recurrent training for pilots and the\nmodification of maintenance practices. It should be noted that many crews, not only\nwith this operator, had not received any of the information that should have been\ngiven to them urgently following the accident to the Birgenair Boeing 757 in the\nDominican Republic eight months previously.\nAccidents related to loss of control of flight path in a stall situation\nOther recent accidents were caused by loss of control of the aeroplane flight path\nin a stall situation. At the authorities’ request, the investigation reports led to the\ncreation of various working groups made up of academics, manufacturers, operators\nand authorities.\nIn liaison with stall issues, the causes and recommendations reported in these\naccidents are summarised below.\nh Accident on 22 December 1996, DC-8 operated by Airborne Express\nCause:\n Inappropriate inputs by the PF on the controls and ineffective monitoring by the\nPNF to identify and recover a stall situation.\nContributing Factor:\n Simulator fidelity in relation to a stall.\nRecommendations:\n Improvement of characteristics of flight simulators to represent a stall;\n Development of guides on stall training;\n Practising stall recovery in simulator;\n Presentation to pilots of the angle of attack and training in using this information\nh Accident on 14 October 2004, CL-600 operated by Pinnacle Airlines\nCause:\n Stall following crew inputs\nRecommendations:\n Improve training in operations at high altitude;\n Training for stall recovery at high altitude.\nh Accident on 16 August 2005, MD-82 operated by West Caribbean Airways\nCause:\n Failure to take actions to prevent a stall, and defective CRM (lack of effective\ncommunication, decision making process, ranking of priorities), enabling neither\nthe prevention nor the identification of a stall situation and as a result making\ninappropriate inputs.\nRecommendations:\n Knowledge of aeroplane performance in terms of altitude limitations;\n Simulator training on identifying a stall at high altitude and on recovery procedure;\n\u003c/parca>\n\n\u003cparca no=\"4\">\n[098-air-france-flight-447.pdf › Sayfa 200]\n# Sayfa 200\n\nF-GZCP - 1st June 2009\n198\n Although having identified and called out the loss of the airspeed indications,\nneither of the two copilots called the “Unreliable IAS” procedure.\n The Flight Directors did not disconnect.\n The crossbars disappeared and then re-appeared on several occasions, changing\nmode several times.\n The copilots had not undertaken any in-flight training, at high altitude, for the\n“vol avec IAS douteuse” procedure or on manual efore the stick shaker activation during the accide nt flight. Further, the activation of the stick\nshaker was a clear warning of an impending c onventional aerodynamic stall and not a tailplane\nstall, and the change in the IAS numbers to red (which occurred after the airspeed was equal to\nor below that of the low-speed cue) was a conspicuous signal that was not consistent with a\ntailplane stall. Also, indications of a tailplane stall, for those airplanes determined to be\nsusceptible, would likely occur at higher airspeeds and/or higher flap deflections.\nFor a tailplane stall recovery, the captain would have had to interpret the situation,\nidentify the tailplane stall, and apply a recovery procedure that he had never practiced. The CVR\nshowed that he did not verbally identify a tailpla ne stall, and the FDR showed that he did not\nfully apply the tailplane stall recovery proce dure described in the video. The NTSB concludes\nthat it is unlikely that the captain was deliberately attempting to perform a tailplane stall\nrecovery. The NTSB further concludes that no ev idence indicated that the Q400 was susceptible\nto a tailplane stall. (Tailplane stall training is discussed further in section 2.9.3.)\nThe NTSB also evaluated why the first officer had raised the flaps without being so\ndirected by the captain. The stick shaker activated within 1 second of the first officer moving the\nflap handle from 5° to 10°. It is possible that, because of the close timing of these events, the first\nofficer’s retraction of the flaps was an attempt to undo her last action. However, after returning\nthe handle to the 5° position, the first officer continued moving the handle to the 0° position. 206\nIt is also possible that she misinterpreted the even t as a tailplane stall, and retracting the flaps to\nthe last position before a tailplane stall was a recommended technique that she had been exposed\nto while watching the NASA icing video duri ng recurrent ground school less than 1 month\nbefore the accident. Also, the absence of standa rd callouts from the captain impeded the first\nofficer’s abilities to coordinate actions to support hi m. Further, it is possible that she raised the\nflaps as part of the steps associated with a landi ng stall recovery profile. However, if that were\nthe case, the first officer failed to make the “positive rate” or “V fri” callouts or confirm that\npower was set, which were required before raising the flaps. Finally, it is possible that the\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[122-asiana-airlines-flight-214.pdf › Sayfa 112]\nSayfa 112\n\nNTSB Aircraft Accident Report\n94\nprotection features” made the unqualified statement that “autothrottles engage automatically (if\narmed).” No description was provided of the circumstances when the A/T will not automatically\nengage. These circumstances, which were listed in the 777 FCOM, include when the AFDS pitch\nmode is FLCH SPD (as it was during the accident flight) or TO/G A, or the airplane is below\n400 ft above the airport on takeoff or below 100 ft RA on approach.\nFurther, the Boeing 777 FCTM, upon which Asiana based much of its training, did not\nexplain the conditions under which the A /T would not automatically engage. The FCTM\nrecommended A/T use during all phases of flight, including manual flight, and presented a stall\nprotection demonstration that did not include situations when the A/T would not automatically\nactivate. Asiana adopted the FCTM stall p rotection demonstration in its 777 simulator training ,\nand the PF had observed the demonstration.\nDuring the demonstration , A/P and A /T were disengaged, thrust levers were retarded to\nidle, MCP-selected speed was reduced below minimum speed on the speed tape, and the airplane\nwas allowed to decelerate into the amber band on the airspeed ta pe (below minimum\nmaneuvering speed). With no pilot intervention, the A /T system “woke up,” enga ged in SPD\nmode, and returned the airplane to minimum maneuver ing speed. The PF stated that when he\nsaw the demonstration , he was “astonished” that the airplane would recover by itself from an\napproach to stall. Because the training the PF received did not adequately describe the\ncircumstances in which the A/T would not automatically engage or expose him to such\ncircumstances, this demonstration likely gave him false confidence that the A /T would provide\nspeed protection at all times.\nAdditionally, the PF w as exposed to some informal, partially accurate information about\nthe interrelationship between the FLCH SPD pitch mode and the HOLD A/T mode during his\n777 transition training. An Asiana 777 ground school instructor stated that he had , on three\noccasions, experienced an “anomaly” in the behavior of the A/T in that it did not automatically\nengage while in FLCH SPD mode, and he personally explained this experience to pilots in his\nground school classes. He stated that the PF had been in a class that had been given this\nexplanation. Apparently, the PF was not able to recognize and apply this knowledge during the\naccident flight. The instructor’s description of these experiences as “anomalies” rather than a\nresult of the system’s design logic and the fact that the instructor’s comments were not\nincorporated into Asiana’s 777 formal training curriculum indicate that this aspect of AFDS and\nA/T functionality was not accurately described or adequately emphasized.\nThe NTSB concludes that, as a result of complexitie s in the 777 AFCS and inadequacies\nin related training and documentation, the PF had an inaccurate understanding of how the AFDS\nand A /T interacted to control airspeed , which led to his inadvertent deactivation of automatic\nairspeed control.\nAs previously mentioned, interviews with other Asiana pilots and instructors indicated\nthat\n\u003c/parca>\n\n\u003cparca no=\"8\">\n[098-air-france-flight-447.pdf › Sayfa 160]\nSayfa 160\n\nF-GZCP - 1st June 2009\n158\nthe radar, the Captain ion of ORARO. In this zone they saw green returns on the radar on\ntheir path, which they avoided by changing their route by about ten nautical miles to\nthe west. While flying through this zone, which took about fifteen minutes, they felt\nmoderate turbulence and did not observe any lightning. They lowered their speed\nto the speed recommended in turbulent zones. They saw bright St Elmo’s fire on the\nwindshield on the left-hand side. The crew listened into the 121.5 MHz frequency\nthroughout the flight without hearing any message from AF 447.\n1.18.5.2 ATLANTICO controllers\nThe controller of the ATLANTICO ACC explained that he had asked the crew to give\nits estimated time of arrival at the TASIL waypoint. He attributed their failure to\nreply to the fact that the crew had probably lowered the volume of their radio. He\nexpected to receive position reports from the crew as they passed the ORARO and\nSALPU waypoints. For this reason, he did not attempt to call the crew via the SELCAL.\nThe controller waited for the position report from the crew at the ORARO and then\nSALPU waypoints to update the estimated time of arrival at the TASIL waypoint. He\ndid not receive a\n\u003c/parca>\n\nSoru: Why did the AF447 crew never apply a stall recovery?", "parts": [{"kind": "system", "chars": 419}, {"kind": "chunk", "rank": 1, "folder": "2000'ler", "chars": 3067}, {"kind": "chunk", "rank": 2, "folder": "2000'ler", "chars": 2565}, {"kind": "chunk", "rank": 3, "folder": "2000'ler", "chars": 2626}, {"kind": "chunk", "rank": 4, "folder": "2000'ler", "chars": 2637}, {"kind": "chunk", "rank": 5, "folder": "2000'ler", "chars": 1017}, {"kind": "chunk", "rank": 6, "folder": "2000'ler", "chars": 3282}, {"kind": "chunk", "rank": 7, "folder": "2010'ler", "chars": 3286}, {"kind": "chunk", "rank": 8, "folder": "2000'ler", "chars": 3278}, {"kind": "question", "chars": 60}]}, "generate": null};

function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}
