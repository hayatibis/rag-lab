about 15,000 feet. The crew began to climb\nagain, but about 20,000 feet, the cabin altitude began to rise rapidly again. The\nflight returned to London.\nWhen the airplane was examined on the ground, the forward cargo\ndoor was found open about 1 1/2 inches along the bottom with the latch cams\nunlatched and the master latch lock handle closed. The cockpit cargo door warning\nlight was off.\nAccording to the persons who examined the airplane, the cargo door\nhad been closed manually and the manual master latch lock handle was stowed, in\ntum closing the pressure relief doors and extinguishing the cockpit cargo door\nwarning lighi. Subsequent investigation on N740PA revealed that the latch lock\nsectors had been damaged and would not restrain the latch cams from being driven\nopen electrically or manually. It was concluded by Boeing and Pan Am that the\nground service person who closed the cargo door apparently had back-driven\n(opened) the latches manually after the door had been closed and locked. The\ndamage to the sectors, and the absence of other mechanical or electrical failures\nsupported this conclusion.\nFurther testing of the door components from N740PA and attempts to\nrecreate the events that led to the door opening in flight revealed that the lock\nsectors, even in their damaged condition, prevented the master latch lock handle\nfrom being stowed, until the latch cams had been rotated to within 20 turns (using\nthe manual 1/2 inch socket drive) of being fully closed. A full cycle, from closed\nto open, is about 95 turns with the manual drive system.\n1.17.2 FAA Surveillance of UAL Maintenance\nThe Denver, Colorado, FAA Flight Standards District Office (FSDO)\nholds the operating certificate for United Airlines, Inc. The FAA FSDO in San", "x": -0.11464361846446991, "y": 0.012150146067142487}, {"rank": 2, "i": 6, "id": "001-united-airlines-flight-811.pdf#6", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 7"], "folder": "1980'ler", "score": 0.6503680944442749, "text": "[001-united-airlines-flight-811.pdf › Sayfa 7]\n# Sayfa 7\n\nThus, as a result of the recovery and examination of the cargo door,\nthe Safety Bcard’s original analysis and probable cause have been modified. This\nreport incorporates these changes and supersedes NTS B/AAR-90/01.\nThe issues in this investigation centered around the design and\ncertification of the B-747 cargo doors, the operation and maintenance to assure the\ncontinuing airworthiness of the doors, cabin safety, and emergency response.\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the sudden opening of the forward lower lobe\ncargo door in flight and the subsequent explosive decompression. The door\nopening was attributed to a faulty switch or wiring in the door control system\nwhich permitted electrical actuation of the door latches toward the unlatched\nposition after initial door closure and before takeoff. Contributing to the cause of\nthe accident was a deficiency in the design of the cargo door locking mechanisms,\nwhich made them susceptible to deformation, allowing the door to become\nunlatched after being properly latched and locked. Also contributing to the\naccident was a Jack of timely corrective actions by Boeing and the FAA following\na 1987 cargo door opening incident ona Pan Am B-747.\nAs a result of this investigation, the Safety Board issucd safety\nrecommendations concerning cargo doors and other nonplug doors on pressurized\ntransport category airplanes, cabin safety, and emergency response.", "x": -0.15363356471061707, "y": -0.02865896373987198}, {"rank": 3, "i": 2, "id": "001-united-airlines-flight-811.pdf#2", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 3"], "folder": "1980'ler", "score": 0.6301445364952087, "text": "[001-united-airlines-flight-811.pdf › Sayfa 3]\n# Sayfa 3\n\nNTSB/AAR-92/02 PB92-910402\nNATIONAL TRANSPORTATION\nSAFETY BOARD\nWASHINGTON, D.C. 20594\nAIRCRAFT ACCIDENT REPORT\nEXPLOSIVE DECOMPRESSION--\nLOSS OF CARGO DOOR IN FLIGHT\nUNITED AIRLINES FLIGHT 811\nBOEING 747-122, N4713U\nHONOLULU, HAWAII\nFEBRUARY 24, 1989\nAdopted: March 18, 1992\nNotation 5059C\nAbstract: This report explains the explosive decompression resulting from the loss of a\ncargo door in flight on United Airlines flight 811, a Boeing 747-122, near Honolulu, Hawaii,\non February 24, 1969. The safety issues discussed in the report are the design and\ncertification of the B-747 carqo doors, the operation and maintenance to assure the\ncontinuing airworthiness of the doors, and emergency response. Recominendations\nconcerning these issues were rade to the Federal Aviation Administration. the State of\nHawaii, and the U.S. Department of Defense.", "x": -0.06480028480291367, "y": 0.034111276268959045}, {"rank": 4, "i": 77, "id": "001-united-airlines-flight-811.pdf#77", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 79"], "folder": "1980'ler", "score": 0.6286067962646484, "text": "[001-united-airlines-flight-811.pdf › Sayfa 79]\n# Sayfa 79\n\n71\nDuring the approach to HNL, all of the leading edge flaps had\nextended, except the outboard sections 22 through 26 on the right wing. The\nreason that they failed to extend probably was the damage to the pneumatic duct\ncaused by the ejected debris. The pneumatic pressure probably was too low to\nactuate the most outboard flaps to the extended position.\nThe failure of the flightcrew and passenger oxygen systems was\ncaused by structural deformation and damage to the supply lines in the area\nadjacent to the cargo door and failed fuselage structure.\nThe Safety Board's analysis of this accident concentrated on the\nreasons for the loss of the cargo door and the events that led to its loss in flight.\nThe analysis included an evaluation of the design, certification, and approval\n_ processes for the B-747 cargo doors, and the operational, maintenance, and\ninspection processes for the doors. Also, the analysis included an evaluation of the\nhistorical events that had occurred over the past months and years that eventually\nled to this accident.\n2.2 Loss of the Cargo Door\nThe calculated pressure differential at the time of the loss was about\n6.5 psi, which would have exerted a load on a properly closed and locked door that\nwas substantial, but well within design limits.\nThere was no evidence of a structural problem with the cargo door\nthat could have caused it to fail from metal fatigue or corrosion. Although the\ncargo door was recovered in two pieces on the floor of the ocean, there was no\nevidence of a preseparation structural failure of the door. All fractures and damage\nfound on the door were determined to be the result of the sudden opening of the\ndoor rather than the cause. The evidence showed that the door was intact when it\nflew open violently and that its integrity was compromised when it struck the upper\nfuselage structure and most likely when it struck the water. The fracture in the\ncargo door occurred just below the midspan latch cams. Paint marks on the outer\nsurface of the door that matched upper fuselage structure paint pattem, damage to\nthe latch pins, pull-in hooks and hook pins, as well as damage to the floor structure\nnear the upper door hinge area were consisteat evidence that the door was intact\nwhen it flew open.", "x": -0.08836044371128082, "y": -0.025363842025399208}, {"rank": 5, "i": 20, "id": "001-united-airlines-flight-811.pdf#20", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 22"], "folder": "1980'ler", "score": 0.6285136342048645, "text": "[001-united-airlines-flight-811.pdf › Sayfa 22]\n# Sayfa 22\n\nBO PERC gene,\n15\nlock switch, removing electrical control power from the opening and closing\ncontrol circuits, and also extinguishes the cockpit cargo door warning light through\na switch located on one of the pressure relief doors. Opening the cargo door is\naccomplisied by reversing the above procedure.\nThe B-747 cargo door has eight (8) view ports located beneath the\nlatch cams for direct viewing of the position of the cams by means of alignment\nstripes. Procedures for using these view ports for verifying the position of the\ncams were not in place or required by Boeing, the FAA, or UAL (see 1.17.5 for\nadditional information).\nClosing the door manually is accomplished through the same\nsequence of actions without electrical power. The door actuator mechanisms are\nmanually driven to a closed and latched position by the use of a one-half inch\nsocket driver. The door can also be opened manually with the use of the socket\ndriver. There are separate socket drives for the door raising/lowering «nechanism,\nthe pull-in hooks, and the latches.\nOperating procedures for the normal electrical operation of the\nforward and aft cargo doors are outlined in the UAL Maintenance Manual (MM).\nAuthorization for deferral of maintenance on the door power system is contained in\nthe UAL B-747 Minimum Equipment List (MEL). In addition, operating\nprocedures for dispatching aicraft with an inoperative door electrical power\nsystem (manual operation) are specified in the operator's MEL.\nThe UAL MM differs from Boeing's recommended MM. UAL had\nmodified Bozing printed material or replaced pages with their own methods ard\nprocedures for conducting mainienance functions. The modifications to the\nmanufacturer's MM were accepted by the FAA through \"approval\" by the FAA\nPrincipal Ma‘ntenance Inspector (PMI). Electrical cargo door open/close operations\nin the UAL and Boeing MM's are approximately the same, except the final\n\"Caution\" statement differs in methods to ensure that the latch cams are closed:\nUnited Airlines Maintenance Manual\nCAUTION DO NOT FORCE HANDLE. LATCH CAMS NOT\nFULLY CLOSED COULD CAUSE HANDLE\nMECHANISM SHEAR RIVET TO SHEAR.", "x": -0.1178227886557579, "y": -0.05672595277428627}, {"rank": 6, "i": 69, "id": "001-united-airlines-flight-811.pdf#69", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 71"], "folder": "1980'ler", "score": 0.6267157793045044, "text": "[001-united-airlines-flight-811.pdf › Sayfa 71]\n# Sayfa 71\n\n1.17.4 Boeing 747 Cargo Door Certification\nTitle 14 CFR 25.783, Amendment 25-15, effective October 24, 1967,\nwas the original certification basis for Boeing 747 cargo doors. Specifically,\nPart 25.783 (e) and (f) apptied to doors for which the initial opening movement is\noutward (non-plug type doors). Those rules specified that:\n(e) There must be a provision for direct visual inspection of\nthe locking mechanism by crewmembers to determine\nwhether external doors, for which the initial opening\nmovement is outward (including passenger, crew, service,\nand cargo doots), are fully locked. In addition, there must\nbe a visual means to signal to appropriate crewmembers\nwhen normally used external doors are closed and fully\nlocked.\n(f) Cargo and service doors not suitable fer use as an exit in\nau emergency need only meet paragraph (e) of this section\nand be safeguarded against opening in flight as a result of\nmechanical failure.\nAmendment 25-23, effective May 8, 1970, added the following text to\nparagraph (f): \"...or failure of a singie structural element.” Amendment 25-23 did\nnot apply to the initial certification basis for the B-747.\nAmendment 25-54, effective October 14, 1980, expanded Part 25.783\n(e), (A), and (g) to read:\n(e) There must be a provision for direct visual inspection of\nthe locking mechanism to determine if external doors, for\nwhich the initial opening movement is not inward\n(including passenger, crew, service and cargo doors), are\nfully closed and locked. The provision must be discernible\nunder operational lighting conditions by appropriate\ncrewmembers using a flashlight or equivalent lighting\nsource. Jn addition, there must be a visual warning means\nto signal the appropriate flight crewmembers if any\nextemal door is not fully closed and locked. The means\nmust be designed such that any failure or combination of\nfailures that would result in an erroneous closed and locked", "x": -0.11627893149852753, "y": -0.11392610520124435}, {"rank": 7, "i": 89, "id": "001-united-airlines-flight-811.pdf#89", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 91"], "folder": "1980'ler", "score": 0.6250342130661011, "text": "[001-united-airlines-flight-811.pdf › Sayfa 91]\n# Sayfa 91\n\n83\nThe next opportunity for the FAA and Boeing to have reexamined the\noriginal assumptions and conclusions about the B-747 cargo door design and\ncertification was after the findings of the Turkish Airline DC-10 accident in 1974\nnear Paris, France. The concems for the DC-10 cargo door latch/lock mechanisms\nand the human and mechanical failures, singularly and in combination, that led to\nthat accident, should have proinpted a review of the B-747 cargo door's continuing\nairworthiness. In the Turkish Airlines case, a single failure by a ramp service\nagent, who closed the door, in combination with a poorly designed latch/lock\nsystein, led to a catastrophic accident. The revisions to the DC-10 cargo door\nmechanisms mandated after that accident apparently were not examined and\ncarried over to the design of the B-747 cargo doors.\nSpecifically, the mechanical retrofit of more positive locking\nmechanisms on the DC-10 cargo door to preclude an erroneous locked indication\nto the flightcrew, and the incorporation of redundant sensors to show the position\nof the latches/locks, were not required to be retrofitted at that time for the B-747.\nOf similar concem is the fact that the cargo doors for the L-1011 required\nredundant latch/lock indication sensors at initial certification, during the\napproximate same time frame the DC-10 and B-747 were certificated.\nMore recently, when Boeing and the FAA leared about the\ncircumstances of the Pan Am cargo door opening incident in March 1987, more\ntimely and positive corrective actions should have been taken. The Satety Board\nbelieves that the findings of that incident investigation should have called into\nquestion the assumptions and conclusions about the original design and\ncertification of the B-747 cargo door, especially the alternative method for\nverifying that the door was latched and locked that was sought by Boeing and was\ngranted by the FAA. Since a B-747 cargo door opening in flight was considered to\nbe an “unacceptable event\", once a door did come open in flight, the FAA and\nBoeing should have acted much quicker to prevent another failure.\nIt took nearly 16 months from the date of the Pan Am Incident\n(March 10, 1987) untii the FAA issued AD-88-12-04 (July 1, 1988). And then, the\nAD allowed 18 or 24 months, depending on the model B-747, from the date of its\nissuance for compliance with the terminating actions of the AD. The fact that\nBoeing had issued an Alert SB as a result of the Pan Am incident is an indication\nof the apparent urgency with which Boeing treated this issue. Alert SB's are issued\nfor \"safety of flight\" reasons, while regular SB's deal with “reliability” and not\nnecessarily safety of flight items. Despite this, the terminating action, issued as", "x": -0.2172841876745224, "y": -0.06948515772819519}, {"rank": 8, "i": 98, "id": "001-united-airlines-flight-811.pdf#98", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 100"], "folder": "1980'ler", "score": 0.6211419105529785, "text": "[001-united-airlines-flight-811.pdf › Sayfa 100]\n# Sayfa 100\n\nThe camouflage paint scheme of the military fire rescue units\nled to reduced visibility of these units and resulted in at least\none near-collision.\nMegaphones were used in flight to communicate with\npassengers because of the high ambient noise level. However,\nmore megaphones would have afforded better communication\nin all parts of the cabin.\nSome flight attendants and passengers had _ difficulties\ntightening straps of their life preservers around their waists\nbecause of the fabric used, the design of the adjustment fittings,\nand the angle the straps were pulled.\nArticles that fell to the floor from stowage bins above the L-2\nand R-2 exits and galley service items had to be cleared away\nfrom the exits before the emergency evacuation could be\ninitiated.\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the sudden opening of the forward lower lobe\ncargo door in flight and the subsequent explosive decompression. The door\nopening was attributed to a faulty switch or wiring in the door control system\nwhich pennitted electrical actuation of the door latches toward the unlatched\nposition after initial door closure and before takeoff. Contributing to the cause of\nthe accident was a deficiency in the design of the cargo door locking echanisms,\nwhich made them susceptible to deformation, allowing the door to become\nunlatched after being properly latched and locked. Also contributing to the\naccident was a lack of timely corrective actions by Boeing and the FAA following\na 1987 cargo do-r opening incident ona Pan Am B-747.", "x": -0.10244597494602203, "y": 0.09897533059120178}], "runners_up": [{"rank": 9, "i": 5, "id": "001-united-airlines-flight-811.pdf#5", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 6"], "folder": "1980'ler", "score": 0.6143236756324768, "text": "[001-united-airlines-flight-811.pdf › Sayfa 6]\n# Sayfa 6\n\nEXECUTIVE SUMMARY\nOn February 24, 1989, United Airlines flight 811, a Boeing 747-122,\nexperienced an explosive decompression as it was climbing between 22,000 and\n23,000 feet after taking off from Honolulu, Hawaii, en route to Sydney, Australia\nwith 3 flightcrew, {5 flight attendants, and 337 passengers aboard.\nThe cirplane made a successful emergency landing at Honolulu and\nthe occupants evacuated the airplane. Examination of the airplane revealed that the\nforward lower lobe cargo door had separated in flight and had caused extensive\ndamage to the fuselage and cabin structure adjacent to the door. Nine of the\npassengers had been ejected from the airplane and lost at sea.\nA year after the accident, the Safety Board was uncertain that the\ncargo door would be located and recovered from the Pacific Ocean. The Safety\nBoard decided to proceed with a finai report based on the available evidence\nwithout the benefit of an actual examination of the door mechanism. The original\nreport was adopted by the Safety Board on April 16, 1990, as NTSB/AAR-90/01.\nSubsequently, on July 22, 1990, a search and recovery operation was\nbegun by the U.S. Navy with the cost shared by the Safety Board, the Federal\nAviation Administration, Boeing Aircraft Company, and United Airlines. The\nsearch and recovery effort was supported by Navy radar data on the separated\ncargo door, underwater sonar equipment, and a manned submersible vehicle. The\neffort was successful, and the cargo door was recovered in two pieces from the\nocean floor at a depth of 14,200 feet on September 26 and October 1, 1990.\nBefore the recovery of the cargo door, the Safety Board believed that\nthe door locking mechanisms had sustained damage in service prior to the accident\nflight to the extent that the door could have been closed and appeared to have been\nlocked, witen in fact the door was not fully latched. This belie? was expressed in\nthe report and was supported by the evidence available at the time. However, upon\nexamination of the door, the damage to the locking mechanisia did not support this\nhypothesis. Rather, the evidence indicated that the latch cams had been back-\ndriven from the closed position into a nearly open position after the door had been\nclosed and locked. The latch cams had been driven into the lock sectors that\ndeformed so that they failed to prevent the back-driving.", "x": -0.09250108152627945, "y": 0.029505232349038124}, {"rank": 10, "i": 16, "id": "001-united-airlines-flight-811.pdf#16", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 18"], "folder": "1980'ler", "score": 0.6113752722740173, "text": "[001-united-airlines-flight-811.pdf › Sayfa 18]\n# Sayfa 18\n\nll\n1.6.2 Cargo Door Description and Op2ration\nBoth the forward and aft lower cargo doors are similar in appearance\nand operation. They are located on the lower right side of the fuselage and are\nourward-opening. The door opening is approximately 110 inches wide by\n99 inches high, as measured along the fuselaye.\nElectrical power for operation of the cargo door swiiches and\nactuators is supplied from the ground handling bus, which is powered by either\nextemal power or the APU. See figur: 17 for a diagram of the cargo door\nelectrical circuitry. The engine gen¢rators cannot provide power to the ground\nhandling bus. APU generator electric:l power to the ground handling bus is\ninterrupted when an engine generator is brought on line after engine start. The\nAPU generator “field” switch can be reengaged by the flightcrew, if necessary on\nthe ground, to power the ground handling bus. The air/ground safety relay\nautomatically disconnects the APU generator from the ground handling bus, if it is\nenergized, when the airplane becomes airborne and the air/ground relay senses that\nthe airplane is off the ground.\nThe cargo door and its associated hardware are designed to carry\ncircumferential (hoop) loads arising from pressurization of the airplane. These\nloads are transmitted from the piano hinge at the top of the door, through the door\nitself, and into the eight latches located along the bottom of the door. The eight\nlatches consist of eight latch pins attached to the lower door sill and eight latch\ncams attached to the bottom of the door. The cargo door also has two midspan\nlatches located along the fore and aft sides of the door. These midspan latches\nprimarily serve to keep the sides of the door aligned with the fuselage. There aie\nalso feur door stops which limit inward movement of the door. There are two pull-\nin hooks located on the fore and aft lower portion of the door, with puli-in hook\npins on the sides of the door frame. (See figure 4 for cargo door components).\nThe cargo doors on the B-747 have a master latch lock handle\ninstalled on the exterior of the door. The handle is opened and closed manually.\nThe master latch lock handle simultaneously controls the operation of the latch\nlock sectors, which act as locks for the latch cams, and the two pressure relief\ndoors loceted on the door. Figure 5 depicts a lock sector and latch cam in an\nunlocked and locked condition.", "x": -0.07316989451646805, "y": -0.008202486671507359}, {"rank": 11, "i": 86, "id": "001-united-airlines-flight-811.pdf#86", "path": "1980'ler/001-united-airlines-flight-811.pdf", "heading_path": ["Sayfa 88"], "folder": "1980'ler", "score": 0.6076579689979553, "text": "[001-united-airlines-flight-811.pdf › Sayfa 88]\n# Sayfa 88\n\npnt hg Pry I A NS\n. :\n80\ntherefore possible that the S2 master latch lock switch failed prior to the accident,\nallowing more possibilities for electrical short circuits to power the latch actuator.\nNevertheless, despite extensive testing, it could not be determined whether the S2\nswitch was functional before the accident.\nThe examination of 35 wires that remained with the recovered cargo\ndoor revealed several areas of damaged insulation that could have permitted an\nelectrical short circuit to power the latch actuator. However, no evidence was\nnoted of arcing that was indicative of short circuits. Furthermore, a significant\nnumber of the wires that had the potential for allowing for short circuits to power\nthe latch actuator were not recovered. Testing conducted by Boeing and by UAL\nwas inconclusive regarding whether a short circuit would have left detectable\nevidence of arcing. Therefore, the Safety Board was unable to determine whether\nthe latch actuator was inadvertently powered by a short circuit in the cargo door\nwires.\nThe incident involving a UAL Boeing 747 at JFK Airport on June 13,\n1991, confirmed that electrical short circuits in the cargo door wiring could cause\nthe door to open. In this case, the short circuits were in the fuselage-to-cargo door\nwiring bundle where the bundle was covered by a flexible conduit. Although\nN4713U did not have a flexible conduit installed at the forward door position, its\nwiring was routed over the top of the door hinge where exposure to damage could\noccur. That portion of the wiring from N4713U was not recovered from the sea.\nThe wires located at the door hinge area cre more susceptible to in-service damage\nfrom movement during the open/close cycie, as compared with the wires mounted\non the door tx3t are normally static.\nFollowing the incident at JFK, UAL directed that the circuit breaker\nthat terminates power to the cargo doors be pulled after the door is closed and\nbefore departure of every B-747 flight. UAL obtained approval for this practice\nfrom the FAA and requested Boeing and the FAA to make such a practice part of\nthe approved manual for the airplane. Neither Boeing nor the FAA acted on UAL's\nrequest.\nNevertheless, the Safety Board believes that the FAA should initiate\nrulemaking to include design considerations fcr nonrtug transport category aircraft\ncargo doors that would deactivate the electrical circuitry to the door actuators after\nthe deors are closed and locked. The catastrophic nature of tie loss of a cargo door\ndictates the need to provide additiona! reduadancies and fail-safe features in the\ndoor mechanisms to supplement the hardware safety features.", "x": -0.19676707684993744, "y": -0.04092525318264961}, {"rank": 12, "i": 71, "id": "001-united-airlines-flight-811.pdf#71", "path": "1980'ler/001-united-airline rticular airplane had\naccumulated 19,053 hours and 1,547 cycles at the time of the occurrence.\nThe airplane was being prepared for flight at the UAL maintenance\nhangar when an inspection of the circuit breaker panel revealed that the C-288 (aft\ncargo door) circuit breaker had popped. The circuit breaker, located in the\nelectrical equipment bay just forward of the forward cargo compartment, was reset,\nand it popped again a few seconds later. A decision was made to defer further", "x": -0.12214020639657974, "y": -0.0759960412979126}], "kth_score": 0.6211419105529785, "next_score": 0.6143236756324768, "max_score": 0.6609404683113098, "mean_score": 0.41198432445526123, "histogram": {"counts": [1, 3, 7, 7, 21, 65, 121, 212, 312, 362, 378, 415, 435, 451, 471, 440, 412, 403, 401, 332, 254, 222, 179, 96, 57, 35, 18, 11, 14, 4, 8, 5, 5, 1, 7, 2, 5, 0, 1, 1], "edges": [0.2650313973426819, 0.27492913603782654, 0.2848268449306488, 0.29472458362579346, 0.3046222925186157, 0.3145200312137604, 0.32441776990890503, 0.3343154788017273, 0.34421321749687195, 0.3541109263896942, 0.36400866508483887, 0.37390637397766113, 0.3838041126728058, 0.39370185136795044, 0.4035995602607727, 0.41349729895591736, 0.423395037651062, 0.4332927465438843, 0.44319045543670654, 0.4530882239341736, 0.46298593282699585, 0.4728836417198181, 0.48278138041496277, 0.4926791191101074, 0.5025768280029297, 0.512474536895752, 0.5223722457885742, 0.5322700142860413, 0.5421677827835083, 0.5520654916763306, 0.5619632005691528, 0.5718609094619751, 0.5817586183547974, 0.5916563868522644, 0.6015540957450867, 0.6114518642425537, 0.621349573135376, 0.6312472820281982, 0.6411449909210205, 0.6510426998138428, 0.6609404683113098]}}, "map": {"points": [[0.0295, 0.074, 0.565, 2, 0], [-0.1019, -0.0795, 0.4027, 2, 0], [-0.0648, 0.0341, 0.6301, 2, 3], [0.0048, 0.0064, 0.5513, 2, 0], [0.0218, -0.0588, 0.5859, 2, 0], [-0.0925, 0.0295, 0.6143, 2, 0], [-0.1536, -0.0287, 0.6504, 2, 2], [-0.0741, 0.0951, 0.5854, 2, 0], [-0.139, 0 nes-flight-1380.pdf › Sayfa 193"], "question": [-0.029807722195982933, 0.10911419987678528], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[001-united-airlines-flight-811.pdf › Sayfa 65]\n# Sayfa 65\n\n1.17 Additional Information\n1.17.1 Previous Cargo Door Incident\nOn March 10, 1987, a Pan American Airways B-747-122, N740PA,\noperating as flight 125 from London to New York, experienced an incident\ninvolving the forward cargo door. According to Pan Am and Boeing officials who\ninvestigated this incident, the flightcrew experienced pressurization problems as\nthe airplane was climbing through about 20,000 feet. The crew began a descent\nand the pressurization problem ceased about 15,000 feet. The crew began to climb\nagain, but about 20,000 feet, the cabin altitude began to rise rapidly again. The\nflight returned to London.\nWhen the airplane was examined on the ground, the forward cargo\ndoor was found open about 1 1/2 inches along the bottom with the latch cams\nunlatched and the master latch lock handle closed. The cockpit cargo door warning\nlight was off.\nAccording to the persons who examined the airplane, the cargo door\nhad been closed manually and the manual master latch lock handle was stowed, in\ntum closing the pressure relief doors and extinguishing the cockpit cargo door\nwarning lighi. Subsequent investigation on N740PA revealed that the latch lock\nsectors had been damaged and would not restrain the latch cams from being driven\nopen electrically or manually. It was concluded by Boeing and Pan Am that the\nground service person who closed the cargo door apparently had back-driven\n(opened) the latches manually after the door had been closed and locked. The\ndamage to the sectors, and the absence of other mechanical or electrical failures\nsupported this conclusion.\nFurther testing of the door components from N740PA and attempts to\nrecreate the events that led to the door opening in flight revealed that the lock\nsectors, even in their damaged condition, prevented the master latch lock handle\nfrom being stowed, until the latch cams had been rotated to within 20 turns (using\nthe manual 1/2 inch socket drive) of being fully closed. A full cycle, from closed\nto open, is about 95 turns with the manual drive system.\n1.17.2 FAA Surveillance of UAL Maintenance\nThe Denver, Colorado, FAA Flight Standards District Office (FSDO)\nholds the operating certificate for United Airlines, Inc. The FAA FSDO in San\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[001-united-airlines-flight-811.pdf › Sayfa 7]\n# Sayfa 7\n\nThus, as a result of the recovery and examination of the cargo door,\nthe Safety Bcard’s original analysis and probable cause have been modified. This\nreport incorporates these changes and supersedes NTS B/AAR-90/01.\nThe issues in this investigation centered around the design and\ncertification of the B-747 cargo doors, the operation and maintenance to assure the\ncontinuing airworthiness of the doors, cabin safety, and emergency response.\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the sudden opening of the forward lower lobe\ncargo door in flight and the subsequent explosive decompression. The door\nopening was attributed to a faulty switch or wiring in the door control system\nwhich permitted electrical actuation of the door latches toward the unlatched\nposition after initial door closure and before takeoff. Contributing to the cause of\nthe accident was a deficiency in the design of the cargo door locking mechanisms,\nwhich made them susceptible to deformation, allowing the door to become\nunlatched after being properly latched and locked. Also contributing to the\naccident was a Jack of timely corrective actions by Boeing and the FAA following\na 1987 cargo door opening incident ona Pan Am B-747.\nAs a result of this investigation, the Safety Board issucd safety\nrecommendations concerning cargo doors and other nonplug doors on pressurized\ntransport category airplanes, cabin safety, and emergency response.\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[001-united-airlines-flight-811.pdf › Sayfa 3]\n# Sayfa 3\n\nNTSB/AAR-92/02 PB92-910402\nNATIONAL TRANSPORTATION\nSAFETY BOARD\nWASHINGTON, D.C. 20594\nAIRCRAFT ACCIDENT REPORT\nEXPLOSIVE DECOMPRESSION--\nLOSS OF CARGO DOOR IN FLIGHT\nUNITED AIRLINES FLIGHT 811\nBOEING 747-122, N4713U\nHONOLULU, HAWAII\nFEBRUARY 24, 1989\nAdopted: March 18, 1992\nNotation 5059C\nAbstract: This report explains the explosive decompression resulting from the loss of a\ncargo door in flight on United Airlines flight 811, a Boeing 747-122, near Honolulu, Hawaii,\non February 24, 1969. The safety issues discussed in the report are the design and\ncertification of the B-747 carqo doors, the operation and maintenance to assure the\ncontinuing airworthiness of the doors, and emergency response. Recominendations\nconcerning these issues were rade to the Federal Aviation Administration. the State of\nHawaii, and the U.S. Department of Defense.\n\u003c/parca>\n\n\u003cparca no=\"4\">\n[001-united-airlines-flight-811.pdf › Sayfa 79]\n# Sayfa 79\n\n71\nDuring the approach to HNL, all of the leading edge flaps had\nextended, except the outboard sections 22 through 26 on the right wing. The\nreason that they failed to extend probably was the damage to the pneumatic duct\ncaused by the ejected debris. The pneumatic pressure probably was too low to\nactuate the most outboard flaps to the extended position.\nThe failure of the flightcrew and passenger oxygen systems was\ncaused by structural deformation and damage to the supply lines in the area\nadjacent to the cargo door and failed fuselage structure.\nThe Safety Board's analysis of this accident concentrated on the\nreasons for the loss of the cargo door and the events that led to its loss in flight.\nThe analysis included an evaluation of the design, certification, and approval\n_ processes for the B-747 cargo doors, and the operational, maintenance, and\ninspection processes for the doors. Also, the analysis included an evaluation of the\nhistorical events that had occurred over the past months and years that eventually\nled to this accident.\n2.2 Loss of the Cargo Door\nThe calculated pressure differential at the time of the loss was about\n6.5 psi, which would have exerted a load on a properly closed and locked door that\nwas substantial, but well within design limits.\nThere was no evidence of a structural problem with the cargo door\nthat could have caused it to fail from metal fatigue or corrosion. Although the\ncargo door was recovered in two pieces on the floor of the ocean, there was no\nevidence of a preseparation structural failure of the door. All fractures and damage\nfound on the door were determined to be the result of the sudden opening of the\ndoor rather than the cause. The evidence showed that the door was intact when it\nflew open violently and that its integrity was compromised when it struck the upper\nfuselage structure and most likely when it struck the water. The fracture in the\ncargo door occurred just below the midspan latch cams. Paint marks on the outer\nsurface of the door that matched upper fuselage structure paint pattem, damage to\nthe latch pins, pull-in hooks and hook pins, as well as damage to the floor structure\nnear the upper door hinge area were consisteat evidence that the door was intact\nwhen it flew open.\n\u003c/parca>\n\n\u003cparca no=\"5\">\n[001-united-airlines-flight-811.pdf › Sayfa 22]\n# Sayfa 22\n\nBO PERC gene,\n15\nlock switch, removing electrical control power from the opening and closing\ncontrol circuits, and also extinguishes the cockpit cargo door warning light through\na switch located on one of the pressure relief doors. Opening the cargo door is\naccomplisied by reversing the above procedure.\nThe B-747 cargo door has eight (8) view ports located beneath the\nlatch cams for direct viewing of the position of the cams by means of alignment\nstripes. Procedures for using these view ports for verifying the position of the\ncams were not in place or required by Boeing, the FAA, or UAL (see 1.17.5 for\nadditional information).\nClosing the door manually is accomplished through the same\nsequence of actions without electrical power. The door actuator mechanisms are\nmanually driven to a closed and latched position by the use of a one-half inch\nsocket driver. The door can also be opened manually with the use of the socket\ndriver. There are separate socket drives for the door raising/lowering «nechanism,\nthe pull-in hooks, and the latches.\nOperating procedures for the normal electrical operation of the\nforward and aft cargo doors are outlined in the UAL Maintenance Manual (MM).\nAuthorization for deferral of maintenance on the door power system is contained in\nthe UAL B-747 Minimum Equipment List (MEL). In addition, operating\nprocedures for dispatching aicraft with an inoperative door electrical power\nsystem (manual operation) are specified in the operator's MEL.\nThe UAL MM differs from Boeing's recommended MM. UAL had\nmodified Bozing printed material or replaced pages with their own methods ard\nprocedures for conducting mainienance functions. The modifications to the\nmanufacturer's MM were accepted by the FAA through \"approval\" by the FAA\nPrincipal Ma‘ntenance Inspector (PMI). Electrical cargo door open/close operations\nin the UAL and Boeing MM's are approximately the same, except the final\n\"Caution\" statement differs in methods to ensure that the latch cams are closed:\nUnited Airlines Maintenance Manual\nCAUTION DO NOT FORCE HANDLE. LATCH CAMS NOT\nFULLY CLOSED COULD CAUSE HANDLE\nMECHANISM SHEAR RIVET TO SHEAR.\n\u003c/parca>\n\n\u003cparca no=\"6\">\n[001-united-airlines-flight-811.pdf › Sayfa 71]\n# Sayfa 71\n\n1.17.4 Boeing 747 Cargo Door Certification\nTitle 14 CFR 25.783, Amendment 25-15, effective October 24, 1967,\nwas the original certification basis for Boeing 747 cargo doors. Specifically,\nPart 25.783 (e) and (f) apptied to doors for which the initial opening movement is\noutward (non-plug type doors). Those rules specified that:\n(e) There must be a provision for direct visual inspection of\nthe locking mechanism by crewmembers to determine\nwhether external doors, for which the initial opening\nmovement is outward (including passenger, crew, service,\nand cargo doots), are fully locked. In addition, there must\nbe a visual means to signal to appropriate crewmembers\nwhen normally used external doors are closed and fully\nlocked.\n(f) Cargo and service doors not suitable fer use as an exit in\nau emergency need only meet paragraph (e) of this section\nand be safeguarded against opening in flight as a result of\nmechanical failure.\nAmendment 25-23, effective May 8, 1970, added the following text to\nparagraph (f): \"...or failure of a singie structural element.” Amendment 25-23 did\nnot apply to the initial certification basis for the B-747.\nAmendment 25-54, effective October 14, 1980, expanded Part 25.783\n(e), (A), and (g) to read:\n(e) There must be a provision for direct visual inspection of\nthe locking mechanism to determine if external doors, for\nwhich the initial opening movement is not inward\n(including passenger, crew, service and cargo doors), are\nfully closed and locked. The provision must be discernible\nunder operational lighting conditions by appropriate\ncrewmembers using a flashlight or equivalent lighting\nsource. Jn addition, there must be a visual warning means\nto signal the appropriate flight crewmembers if any\nextemal door is not fully closed and locked. The means\nmust be designed such that any failure or combination of\nfailures that would result in an erroneous closed and locked\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[001-united-airlines-flight-811.pdf › Sayfa 91]\n# Sayfa 91\n\n83\nThe next opportunity for the FAA and Boeing to have reexamined the\noriginal assumptions and conclusions about the B-747 cargo door design and\ncertification was after the findings of the Turkish Airline DC-10 accident in 1974\nnear Paris, France. The concems for the DC-10 cargo door latch/lock mechanisms\nand the human and mechanical failures, singularly and in combination, that led to\nthat accident, should have proinpted a review of the B-747 cargo door's continuing\nairworthiness. In the Turkish Airlines case, a single failure by a ramp service\nagent, who closed the door, in combination with a poorly designed latch/lock\nsystein, led to a catastrophic accident. The revisions to the DC-10 cargo door\nmechanisms mandated after that accident apparently were not examined and\ncarried over to the design of the B-747 cargo doors.\nSpecifically, the mechanical retrofit of more positive locking\nmechanisms on the DC-10 cargo door to preclude an erroneous locked indication\nto the flightcrew, and the incorporation of redundant sensors to show the position\nof the latches/locks, were not required to be retrofitted at that time for the B-747.\nOf similar concem is the fact that the cargo doors for the L-1011 required\nredundant latch/lock indication sensors at initial certification, during the\napproximate same time frame the DC-10 and B-747 were certificated.\nMore recently, when Boeing and the FAA leared about the\ncircumstances of the Pan Am cargo door opening incident in March 1987, more\ntimely and positive corrective actions should have been taken. The Satety Board\nbelieves that the findings of that incident investigation should have called into\nquestion the assumptions and conclusions about the original design and\ncertification of the B-747 cargo door, especially the alternative method for\nverifying that the door was latched and locked that was sought by Boeing and was\ngranted by the FAA. Since a B-747 cargo door opening in flight was considered to\nbe an “unacceptable event\", once a door did come open in flight, the FAA and\nBoeing should have acted much quicker to prevent another failure.\nIt took nearly 16 months from the date of the Pan Am Incident\n(March 10, 1987) untii the FAA issued AD-88-12-04 (July 1, 1988). And then, the\nAD allowed 18 or 24 months, depending on the model B-747, from the date of its\nissuance for compliance with the terminating actions of the AD. The fact that\nBoeing had issued an Alert SB as a result of the Pan Am incident is an indication\nof the apparent urgency with which Boeing treated this issue. Alert SB's are issued\nfor \"safety of flight\" reasons, while regular SB's deal with “reliability” and not\nnecessarily safety of flight items. Despite this, the terminating action, issued as\n\u003c/parca>\n\n\u003cparca no=\"8\">\n[001-united-airlines-flight-811.pdf › Sayfa 100]\n# Sayfa 100\n\nThe camouflage paint scheme of the military fire rescue units\nled to reduced visibility of these units and resulted in at least\none near-collision.\nMegaphones were used in flight to communicate with\npassengers because of the high ambient noise level. However,\nmore megaphones would have afforded better communication\nin all parts of the cabin.\nSome flight attendants and passengers had _ difficulties\ntightening straps of their life preservers around their waists\nbecause of the fabric used, the design of the adjustment fittings,\nand the angle the straps were pulled.\nArticles that fell to the floor from stowage bins above the L-2\nand R-2 exits and galley service items had to be cleared away\nfrom the exits before the emergency evacuation could be\ninitiated.\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the sudden opening of the forward lower lobe\ncargo door in flight and the subsequent explosive decompression. The door\nopening was attributed to a faulty switch or wiring in the door control system\nwhich pennitted electrical actuation of the door latches toward the unlatched\nposition after initial door closure and before takeoff. Contributing to the cause of\nthe accident was a deficiency in the design of the cargo door locking echanisms,\nwhich made them susceptible to deformation, allowing the door to become\nunlatched after being properly latched and locked. Also contributing to the\naccident was a lack of timely corrective actions by Boeing and the FAA following\na 1987 cargo do-r opening incident ona Pan Am B-747.\n\u003c/parca>\n\nSoru: 747'nin kargo kapısı uçuş sırasında neden açıldı?", "parts": [{"kind": "system", "chars": 419}, {"kind": "chunk", "rank": 1, "folder": "1980'ler", "chars": 2318}, {"kind": "chunk", "rank": 2, "folder": "1980'ler", "chars": 1562}, {"kind": "chunk", "rank": 3, "folder": "1980'ler", "chars": 937}, {"kind": "chunk", "rank": 4, "folder": "1980'ler", "chars": 2352}, {"kind": "chunk", "rank": 5, "folder": "1980'ler", "chars": 2231}, {"kind": "chunk", "rank": 6, "folder": "1980'ler", "chars": 2001}, {"kind": "chunk", "rank": 7, "folder": "1980'ler", "chars": 2831}, {"kind": "chunk", "rank": 8, "folder": "1980'ler", "chars": 1693}, {"kind": "question", "chars": 57}]}, "generate": null};

function svg(tag, attrs = {}, parent) {

  for (const [k, v] of Object.entries(attrs)) {
    if (k === "text") e.textContent = v; else if (k === "style") e.setAttribute("style", v); else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
const tip = $("#tip");
function showTip(ev, html) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = ev.clientY + 16 + tip.offsetHeight > innerHeight ? ev.clientY - tip.offsetHeight - 10 : ev.clientY + 16;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };
function hoverable(node, html) {
  node.addEventListener("mousemove", ev => showTip(ev, typeof html === "function" ? html() : html));
  node.addEventListener("mouseleave", hideTip);
}
function card(id, no, title, dur, lede) {
  const c = document.createElement("section");
  c.className = "card"; c.id = id;
  c.innerHTML = `<h2>${no ? `<span class="step-no">${no}</span>` : ""}${esc(title)}${dur != null ? `<span class="dur">${ms(dur)}</span>` : ""}</h2>`
    + (lede ? `<p class="lede">${lede}</p>` : "");
  $("#app").appendChild(c);
  return c;
}
function terms(parent, list) {
  const d = document.createElement("div"); d.className = "terms";
  d.innerHTML = list.map(([t, x]) => `<div class="term"><b>${t}</b>${x}</div>`).join("");
  parent.appendChild(d);
}
function html(parent, s) { parent.insertAdjacentHTML("beforeend", s); }

/* Claude'un cevabı için küçük markdown çizici: başlık, tablo, liste, kalın, [n] atıf */
function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

{
  const e = T.embed;

    "Parçalar da indekslemede aynı modelle aynı uzaya çevrilmişti. Anlamca yakın metinlerin vektörleri aynı yöne bakar.");
  const cols = 64, rows = Math.ceil(e.dim / cols), cw = 1000 / cols, ch = 12;

/* ---------- ② Arama ---------- */
{
  const S = T.search;
  const c = card("s2", "2", `${int(T.corpus.n_chunks)} parça puanlandı, en iyi ${T.k} tanesi seçildi`, stepMs("search"),
    `Soru vektörü, indeksteki <b>her</b> parça vektörüyle karşılaştırıldı (kosinüs benzerliği). Sonuç ${int(T.corpus.n_chunks)} skor. Bunlar sıralandı ve en yüksek ${T.k} tanesi seçildi. Model yok, "anlama" yok: yalnızca geometri.`);
  const lo = S.histogram.edges[0], hi = S.histogram.edges.at(-1);

  // Histogram
  html(c, `<h3>Tüm skorların dağılımı</h3><p class="lede" style="margin:0 0 6px">Her çubuk bir skor aralığı, yüksekliği o aralıktaki parça sayısı. Parçaların çoğu ortada yığılır (soruyla ilgisiz). Seçilenler sağ uçta, kesim çizgisinin sağında.</p>`);
  {
    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Skor histogramı" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);
    [0, 0.5, 1].forEach(f => {
      const n = Math.round(maxC * f), y = Y(n);
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);
      const hitRect = svg("rect", { x: X(a), y: m.t, width: X(b) - X(a), height: H - m.t - m.b, style: "fill:transparent" }, s);
      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);
    const kx = X(S.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t - 6, y2: H - m.b + 34, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    svg("text", { x: kx - 6, y: m.t + 4, "text-anchor": "end", class: "ink", style: "font-weight:600",
      text: `kesim ${fmt(S.kth_score)} (#${T.k})` }, s);
    svg("text", { x: X(S.mean_score), y: m.t + 4, "text-anchor": "middle", class: "ink2", text: `ortalama ${fmt(S.mean_score, 2)}` }, s);
  }
  if (S.next_score != null) {
    const gap = S.kth_score - S.next_score;
    html(c, `<div class="callout"><b>Kıl payı:</b> ${T.k}. parça <b class="num">${fmt(S.kth_score)}</b>, ${T.k + 1}. parça <b class="num">${fmt(S.next_score)}</b>, fark yalnızca <b class="num">${fmt(gap, 4)}</b>. ` +
      (gap < 0.01 ? "Kesim bıçak sırtında. k'yi 1 artırmak Claude'a başka bir parça gösterirdi. Aşağıdaki tabloda kesimin hemen altında kalanlar da var." : "Seçilenler geri kalanlardan belirgin biçimde ayrışıyor.") + `</div>`);
  }

  // Klasör şeridi
  html(c, `<h3>Hangi klasör yarıştı?</h3><p class="lede" style="margin:0 0 6px">Her satır bir klasör, her nokta o klasördeki bir parça. Sağa gittikçe skor artar. Büyük noktalar seçilen ${T.k} parça.</p>`);
  {
    const pts = T.map.points, W = 1000, rowH = 30, m = { l: 150, r: 10, t: 6, b: 26 };
    const H = m.t + FOLDERS.length * rowH + m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Klasöre göre skorlar" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    FOLDERS.forEach((f, fi) => {
      const y = m.t + fi * rowH + rowH / 2;
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      const nh = hits.filter(h => h.folder === f).length;
      svg("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", class: nh ? "ink" : "", style: nh ? "font-weight:600" : "",
        text: `${f}${nh ? ` (${nh})` : ""}` }, s);
    });
    const kx = X(T.search.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t, y2: H - m.b, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    pts.forEach((p, i) => {
      if (p[4]) return;
      const y = m.t + p[3] * rowH + rowH / 2 + ((i * 7919) % 11 - 5);  // sabit titreşim: üst üste binmesin
      svg("circle", { cx: X(p[2]), cy: y, r: 2.2, style: `fill:${folderColor(p[3])};fill-opacity:.35` }, s);
    });
    hits.forEach(h => {
      const fi = FOLDERS.indexOf(h.folder), y = m.t + fi * rowH + rowH / 2;
      const d = svg("circle", { cx: X(h.score), cy: y, r: 6, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, s);
      hoverable(d, `<b>#${h.rank}</b> · ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
  }

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = v => pad + (v - x0) / (x1 - x0) * (W - 2 * pad), Y = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",
      style: "background:var(--page);border-radius:10px" }, c);
    P.forEach((p, i) => {
      if (p[4]) return;
      const d = svg("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, style: `fill:${folderColor(p[3])};fill-opacity:.45` }, s);
      hoverable(d, () => `${esc(T.map.labels[i])}<br>skor <b>${fmt(p[2])}</b>`);
    });
    const qx = X(T.map.question[0]), qy = Y(T.map.question[1]);
    hits.forEach(h => svg("line", { x1: qx, y1: qy, x2: X(h.x), y2: Y(h.y), style: "stroke:var(--ink);stroke-opacity:.18;stroke-width:1" }, s));
    hits.forEach(h => {
      const g = svg("g", { id: `map-hit-${h.rank}` }, s);
      svg("circle", { cx: X(h.x), cy: Y(h.y), r: 9, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, g);
      svg("text", { x: X(h.x), y: Y(h.y) + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700", text: h.rank }, g);
      hoverable(g, `<b>#${h.rank}</b> · skor ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    const star = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
      const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
      return `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

/* ---------- Sözlük ---------- */
{
  const c = card("gloss", null, "Hata ayıklama rehberi", null, "Kötü bir cevap aldığında bu sayfayı yukarıdan aşağıya şu sırayla oku:");
  html(c, `<table><tbody>
    <tr><td style="width:36%"><b>Tabloda doğru parça yok</b></td><td>Arama hatası. Soru başka bir konu kümesine düşmüş olabilir (haritaya bak) ya da parça zayıf bir vektör üretmiştir (kısa tablo satırı, bağlamsız metin). Çözüm yolları: soruyu yeniden ifade etmek, k'yi artırmak, hibrit arama (BM25).</td></tr>
    <tr><td><b>Doğru parça kıl payı kalanlar arasında</b></td><td>Kesim bıçak sırtında. k'yi biraz artırmak yetebilir.</td></tr>
    <tr><td><b>Doğru parça seçilmiş ama cevap yanlış</b></td><td>Üretim hatası. ④'te o parçaya atıf var mı? Yoksa Claude onu gözden kaçırmıştır. Prompt'u ya da parça sırasını gözden geçir.</td></tr>
    <tr><td><b>Parça metni bozuk</b></td><td>Veri hazırlığı hatası (load/chunk). Tablodaki "parça metni"ni aç. HTML artığı ya da yanlış başlık varsa sorun indekslemede.</td></tr>
    <tr><td><b>"Bulamadım" dedi</b></td><td>Doğru davranış olabilir. Önce tabloda cevabın gerçekten olmadığını doğrula.</td></tr>
  </tbody></table>`);
}
</script>
</body>
</html>
