body { margin: 0; background: var(--page); color: var(--ink);

main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 20px; margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline; }
h3 { font-size: 15px; margin: 22px 0 6px; }
.num { font-variant-numeric: tabular-nums; }

.dur { margin-left: auto; font-size: 13px; color: var(--ink2); font-weight: 500; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;

.lede { color: var(--ink2); margin: 2px 0 14px; }
.question { font-size: 20px; font-weight: 600; margin: 14px 0 10px; padding: 14px 18px;

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12.5px; color: var(--ink2); border: 1px solid var(--ring); border-radius: 999px;

.terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 14px 0 4px; }
.term { background: var(--page); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--ink2); }
.term b { color: var(--ink); display: block; margin-bottom: 2px; }
.callout { border-left: 3px solid var(--warm); padding: 8px 12px; background: var(--page);
  border-radius: 0 8px 8px 0; font-size: 14px; margin: 12px 0; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg .ink { fill: var(--ink); } svg .ink2 { fill: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 8px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 14px; }
.tile { background: var(--page); border-radius: 10px; padding: 12px 14px; }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12.5px; color: var(--ink2); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
td, th { padding: 7px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
tr.hit-row { cursor: pointer; } tr.hit-row:hover td, tr.hl td { background: var(--page); }
tr.runner td { color: var(--muted); }
tr.cut td { border-bottom: 2px dashed var(--warm); padding: 0; }
.bar { height: 8px; border-radius: 4px; background: var(--accent); }
.bar.runner { background: var(--axis); }
.path { word-break: break-word; }
.path small { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--page); padding: 12px;
  border-radius: 8px; font-size: 12.5px; max-height: 420px; overflow: auto; color: var(--ink2); }
.answer { font-size: 15.5px; line-height: 1.65; }
.answer h4 { font-size: 16px; margin: 18px 0 6px; } .answer p { margin: 6px 0; }
.answer table.md { width: auto; margin: 8px 0; } .answer ul { margin: 6px 0; padding-left: 22px; }
code { font-size: 0.92em; background: var(--page); padding: 1px 5px; border-radius: 4px; }
.cite { font: inherit; font-size: 12px; font-weight: 650; border: 0; border-radius: 6px; padding: 0 6px;
  margin: 0 1px; background: var(--accent-soft); color: var(--ink); cursor: pointer; vertical-align: 1px; }
.cite:hover, .cite:focus { background: var(--accent); color: #fff; outline: none; }
.cited-grid { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.cg { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 13px;
  font-weight: 650; border: 2px solid var(--axis); color: var(--muted); }
.cg.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 360px; background: var(--ink);

.pulse { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { r: 11; } }

, -0.0325, -0.0078, 0.0223, 0.0242, -0.0162, 0.0166, 0.0649, -0.0146, -0.015, 0.0105, 0.039, -0.0109, -0.0059, -0.0099, -0.0279, 0.0112, -0.0065, -0.0193, -0.0146, 0.0086, -0.0233, 0.0441, 0.0313, -0.0146, -0.0222, -0.0489, 0.0294, 0.0543, 0.0283, -0.0351, 0.02, 0.0064, -0.0083, -0.0053, 0.0062, 0.0009, -0.0544, 0.0623, -0.0417, -0.0399, 0.0272, 0.0225, 0.0138, 0.0128, -0.0296, 0.009, 0.0259, -0.0202, -0.0117, 0.0444, 0.0548, -0.0024, 0.033, 0.0282, -0.0124, -0.0083, -0.0128, -0.0178, -0.0257, 0.0163, 0.0012, 0.0196, 0.0329, -0.0145, 0.0091, -0.0488, -0.0108, -0.0171, 0.0122, 0.0021, -0.0161, 0.0241, -0.0359, 0.0244, -0.0143, -0.0066, 0.0279, -0.0533, 0.0123, -0.019, 0.0285, 0.0147, 0.0251, 0.0018, -0.052, 0.007, 0.0882, 0.0092, -0.0165, 0.0115, -0.0095, 0.0274, -0.0835, -0.0228, 0.0337, 0.0295, -0.0001, 0.0451, -0.0246, 0.0706, 0.0045, -0.001, -0.0085, -0.0129, 0.0137, 0.025, 0.0279, -0.0197, -0.0254, 0.0584, 0.0165, 0.0132, 0.0204, 0.0094, -0.0681, 0.0277, 0.0071, -0.0143, 0.0069, -0.0249, -0.0587, -0.0063, 0.0181, 0.0206, 0.0541, -0.0122, -0.0035, -0.0485, -0.0245, -0.0088, -0.0174, -0.0246, -0.0407, 0.024, -0.0044, 0.0289, 0.009, 0.0224, -0.0001, -0.0473, -0.0254, 0.0146, -0.0405, 0.0573], "norm": 1.0}, "search": {"hits": [{"rank": 1, "i": 1074, "id": "013-aloha-airlines-flight-243.pdf#99", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 77"], "folder": "1980'ler", "score": 0.6647472381591797, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 77]\n# Sayfa 77\n\nio\n3. CONCLUSIONS\nFindings\n1.\n10.\nThe flightcrew was certificated and qualified for the flight\n“and the airplane was dispatched in accordance with company\nprocedures and Federal regulations.\nWeather was not a factor in this accident.\nAlthough Aloha Airlines~ operated’ according to the FAA\noperating certificate and operations specifications, the\nquality of Aloha Airlines maintenance and inspection program\nwas deficient.\nThere was no evidence of preexisting failure or malfunction of\nthe airplane’s air conditioning, pressurization, pneumatic, or\nelectrical systems that could have contributed to the fuselage\nfailure.\nThe flightcrew’s use of a target speed of 280-290 KIAS and\nspeedbrakes in the descent after. the structural separation\nindicated. they did not consider the appropriate emergency\ndescent checklist which states, in part, that if structural\nintegrity is in doubt, airspeed should be limited as much as\npossible and high maneuvering loads should be avoided.\nThe left engine became inoperative because the engine control\ncables separated due to an increase in cable tension caused by\ncabin floor deformation, coupled with corrosion found in the\narea of cable separation.\nThe fuselage failure initiated in the lap joint along $-10L;\nthe failure mechanism was a result of multiple site fatigue\ncracking of the skin adjacent to rivet holes along the lap\njoint upper rivet row and tear strap disbond which negated the\nfail-safe characteristics of the fuselage.\nThe fatigue cracking initiated from the knife edge associated\nwith the countersunk lap joint rivet holes; the knife edge\nconcentrated stresses that were transferred through the rivets\nbecause of lap joint disbonding.\nThe disbonding of lap joints and tear straps originated from\nmanufacturing difficulties encountered with surface\npreparation and/or bond material processing during the\nconstruction of the airplane which resulted in lap joint bonds\nwith low environmental durability or a lack of bonding.\nAlthough a representative fuselage section of a Boeing 737 was\ntested to 150,000 cycles during certification, the test did\nnot reflect the fatigue performance of the actual fleet", "x": -0.13181579113006592, "y": -0.13755907118320465}, {"rank": 2, "i": 1075, "id": "013-aloha-airlines-flight-243.pdf#100", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 78"], "folder": "1980'ler", "score": 0.6451898217201233, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 78]\n# Sayfa 78\n\n1].\n12.\n13.\n14.\n15.\n16.\n17.\n18.\n72\naircraft because the test parameters did not consider the long\nterm effects of disbonding, corrosion, and fatigue cracking in\nthe lap joints as experienced in airline service.\nDisbonding. of B-737 lap joints, with resulting corrosion and\nprobable fatigue cracking, was explicitly defined in Boeing\nService Bulletin 737-53-1039, Revision 2 dated February 8,\n1974; however the serious implications of multiple site damage\nwere not realized, a permanent solution was not determined,\nand corrective action was relegated to repetitive visual\ninspections: and damage repair.\nThere was sufficient information available to Aloha Airlines\nto alert it to the cracking problems associated with the\ndéterioration of lap joint bonds, and Aloha should have\nfollowed a maintenance program to detect and repair cracking\nbefore it reached a critical condition.\nFAA AD 87-21-08 should have mandated inspection of all lap\njoints per Boeing ASB 737-53A1039, Revision 3, instead of\nlimiting the inspection of only the lap joints at S-4.\nIt was not. determined whether. Aloha Airlines. actually\nperformed the required eddy current inspection in compliance\nwith AD 87-21-08 or whether it was performed ineffectively.\nA properly conducted eddy current inspection, performed in\naccordance with AD-87-21-08 in November 1987, would have\ndetected additional fatigue cracks in the holes of the upper\nrivet row of the lap joint along S-4R.\nFAA. licensed Aircraft and. Powerplant. mechanics are not\nrequired to be knowledgeable in the maintenance and inspection\nof modern contemporary airplanes because the training\ncurriculum has not kept pace with aviation industry\ntechnology.\nThere are human’ factors issues associated with. visual and\nnondestructive inspection which can degrade inspector\nperformance to the extent that theoretically detectable damage\nis overlooked.\nAloha Airlines management’ failed to- recognize the human\nperformance factors of inspection and to fully motivate and\nfocus their inspector force toward the critical nature of lap\n‘joint inspection, corrosion control and crack detection.\nHowever, reports of fleet-wide cracks received by the FAA\nafter the Aloha Airlines accident indicate that a similar lack\nof critical attention to lap. joint inspection and fatigue\ncrack detection. was an industry-wide deficiency.", "x": -0.13360397517681122, "y": -0.18801870942115784}, {"rank": 3, "i": 979, "id": "013-aloha-airlines-flight-243.pdf#4", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 6"], "folder": "1980'ler", "score": 0.6407805681228638, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 6]\n# Sayfa 6\n\nEXECUTIVE SUMMARY\nOn April 28, 1988, at 1346, a Boeing 737-200, N73711, operated by.\nAloha Airlines Inc., as flight 243, experienced an explosive decompression\nand structural failure at 24,000 feet, while en route from Hilo, to Honolulu,\nHawaii. Approximately 18 feet from the cabin skin and structure aft of the\ncabin entrance door and above the passenger floorline separated from the\nairplane during flight.’ There were 89 passengers and 6 crewmembers on board.\nOne flight attendant was swept overboard during the decompression and is\npresumed to have been fatally injured; 7 passengers and 1 flight attendant\nreceived serious injuries. The flight crew performed an emergency descent\nand landing at Kahului Airport on the Island of Maui.\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the failure of the Aloha Airlines\nmaintenance program to detect the presence of significant disbonding and\nfatigue damage which ultimately led to failure of the lap joint at S-10L and\nthe separation of the fuselage upper lobe. Contributing to the accident were\nthe failure of Aloha Airlines management to supervise properly its\nmaintenance force; the failure of the FAA to evaluate properly the Aloha\nAirlines maintenace program and to assess the airline’s inspection. and\nquality control deficiencies; the failure of the FAA to require Airworthiness\nDirective 87-21-08 inspection of all the lap joints proposed by Boeing Alert\nService Bulletin SB 737-53A1039; and the lack of a complete terminating\naction (neither generated by Boeing nor required by the FAA) after the\ndiscovery of early production difficulties in the B-737 cold bond lap joint\nwhich resulted in low bond durability, corrosion, and premature fatigue\ncracking.\nThe safety issues raised in this report include:\no . The quality of air carrier maintenance programs and\nthe FAA surveillance of those programs.\n) The engineering design, certification, and\ncontinuing airworthiness of the B-737~ with\nparticular emphasis on multiple site fatigue\ncracking of the fuselage lap joints.\n) The human factors aspects of air carrier maintenance\nand inspection for the continuing airworthiness of\ntransport category airplanes, to include repair\nprocedures and the training, certification and\nqualification of mechanics and inspectors.\nRecommendations. concerning these issues were addressed to the\nFederal Aviation Administration, Aloha Airlines, and the Air Transport’\nAssociation.", "x": -0.08326712250709534, "y": -0.08773919194936752}, {"rank": 4, "i": 1076, "id": "013-aloha-airlines-flight-243.pdf#101", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 79"], "folder": "1980'ler", "score": 0.6388960480690002, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 79]\n# Sayfa 79\n\n19.\n20.\n21.\n22.\n23.\n24.\n25.\n26.\n73\nBecause of the inexact instructions in. AD 87-21-08, Aloha\nAirlines maintenance personnel did not replace the S-4R lap\njoint upper row countersunk rivets with protruding head\nrivets.\nThe NASIP inspection of Aloha Airlines in December 1987 did\nnot reflect accurately the airworthiness of the operating\nfleet because the team failed to inspect adequately and report\nthe physical condition of the fleet.\nThe PMI assigned to Aloha Airlines, although motivated toward\nhis FAA surveillance tasks, was overburdened with other FSDO\nresponsibilities and not suitably informed about the age and\ncondition of the Aloha fleet or the nature of the Aloha\noperations. He was therefore unable to provide sufficient\nimpetus to effect necessary timely improvements in the Aloha\nAirlines maintenance program.\nThe PMI was not specifically trained to deal with the lap\njoint corrosion and disbonding problems of the B-737. His\nefficiency was further eroded when he was excluded from the\ninformational loop regarding Boeing aging aircraft\ninspections of Aloha airplanes and not apprised of the\nprogram between the FAA Aircraft Certification Service and\nBoeing regarding structural testing of an in-service airplane.\nPrincipal Inspectors have difficulty initiating safety\nimprovements -in air carrier operations and maintenance\n“programs outside the \"regulatory compliance” approach, and\nthey must resort to salesmanship and persuasion unless an\nenforcement is clearly viable.\nThe Boeing SSIP did not include supplemental inspections on\nthe fuselage minimum gage skin due to damage tolerant design\nwhich was classified as “damage obvious\" or \"malfunction\nevident\" because of the controlled decompression scenario.\nThe aviation industry premise that airplanes can be operated\nin a safe airworthiness condition indefinitely is sound only\nif operators have an effective inspection, corrosion control,\nand damage repair program.\nThe current FAA and industry activities to address the aging\nairplane issue must be continued to prevent accidents caused\nby structural failure.\n3.2 Probable Cause\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the failure of the Aloha Airlines\nmaintenance program to detect the presence of significant disbonding and\nfatigue damage which ultimately led to failure of the lap joint at S-10L and", "x": -0.16574349999427795, "y": -0.20148298144340515}, {"rank": 5, "i": 1213, "id": "013-aloha-airlines-flight-243.pdf#238", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 216"], "folder": "1980'ler", "score": 0.6337618231773376, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 216]\n# Sayfa 216\n\n210\nAPPENDIX H\nSDR SUMMARY\nNATIONAL TRANSPORTATION: SAFETY. BOARD\n: Bureau of Technology\nWashington, DC 20594\nFebruary 13, 1989\nBOEING 737 FUSELAGE SERVICE DIFFICULTY REPORT INFORMATION\nA. ACCIDENT\nLocation: Near Maui, Hawatt\nDate: April 28, 1988\nTime: 1347 Hawaiian Standard Time\nAircraft: Aloha Airlines, Inc. Flight 243,\nBoeing 737-297, .N73721\nAccident No.: DCA-88-M-A054\nB.. SUMMARY OF SERVICE DIFFICULTY REPORT INFORMATION\n1... General\nThe Federal Aviation Administration’s (FAA) Service Difficulty Report\nSOR} data base was queried for information pertaining to the Boeing 737\nuselage. It was found that 3,387 records existed from the beginning of the\ncurrent data base (January, 1983) to February 7, 1989. This number was reduced\nto 2,082 records by eliminating all. models of the 737 that were not produced\nas part of the first 291 airplanes.\nBetween January, 1983 and the date of the accident, a total of 1,352\nrecords were. found. Of these,.198 were reports of fuselage skin cracks, and\nten of these reports were of cracking at or near lap joints. Six of the ten\nreports involved lap joints in the upper lobe, while the remaining four were\nfrom the lower lobe of the fuselage. Six of the reports were submitted by\nPiedmont Airlines, three by Aloha (including a. lower lobe crack on the\naccidént airplane), and one by American Airlines. The report by American. was\nthe only report submitted subsequent to the effective date of Airworthiness\nDirective (AD) 87-21-08, November 2, 1987..All of the airplanes cited in the\nten reports were manufactured within the first 291 airplanes.", "x": -0.045211683958768845, "y": -0.03614484891295433}, {"rank": 6, "i": 1032, "id": "013-aloha-airlines-flight-243.pdf#57", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 55"], "folder": "1980'ler", "score": 0.6316969394683838, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 55]\n# Sayfa 55\n\n49\nThe point of maximum floor deflection on N73711 occurred at and to\nthe left of the inboard seat track for the left side seats at BS 440 (seat\nrow 3); this is an area of the floor that is strengthened to sustain cabin\nseat loads. Therefore, the Safety Board concludes that the initial failure\noccurred on the left side of the fuselage in section 43, probably near BS\n440. ,\nBecause of the damage pattern on N73711 and the service history of\nthe lap joints on earlier B-737s, the most probable origin sites were the\nthree upper lobe lap joints on the left side of the airplane--S-4, S-10, and\nS-14. The lap joint at S-4L was eliminated as the location of origin of the\nfailure because of the aft and right movement of the separated structure\nalong BS 360 between S-5L and S-4R. The movement indicated that the origin\nwas lower and to the left of S-5L at the lap joint along S-10L or S-14L. ;\nHad the fuselage first separated along S-14L (below the window line\nand above the floor line), there would have been only a small fuselage wall\nremaining above the floor to react to the pressure inside the cabin. The\nresultant force reacted by this small wall area and internal pressure would\n“have been insufficient to bend the wall outward to break the frames.\nHowever, the fuselage on the left side was torn extensively into the lower\nlobe, and the fuselage frames had separated above and below the floor line.\nThus, the Safety Board concludes that the separation was probably above the\nJap joint at S-14L, that is, at the lap joint at S-10L.\nAt. BS 520 in the remaining fuselage, there were fatigue cracks\nemanating longitudinally from both sides of at least seven adjacent rivet\nholes in the skin along the lap joint at S-10L. Although this was: not the\nfailure origin, such cracking is indicative of the type of preexistent\ncracking that probably was present along random areas of the lap joint at\nS-10L.\nFurther, a passenger had noted and later reported a skin crack aft\nof the forward entry door near a top row of lap joint rivets for S-10L while\nboarding the airplane. (The passenger later was escorted to a similar\nairplane and verified the observation.) The Safety Board believes that the\ntop rivet row was cracked at the S-10L lap joint just aft of BS 360 before\nthe accident flight takeoff.\nAdditionally, passengers seated on the left side of the airplane\nstated that the location of the missing flight attendant immediately before\nthe decompression was in the aisle at seat row 5. During the decompression,\nevidence indicates that the flight attendant was ejected from the airplane at\na location corresponding to S-10L near BS 440.\nConsequently, the Safety Board determines that the fuselage of\nN73711 most probably failed. catastrophically along S-10L, initially near\nBS 440, allowing the upper fuselage to rip free. The reason for this\ncatastrophic failure, rather than the intended fail-safe \"flapping\" of the\nskin as designed, was evaluated by the Safety Board.", "x": -0.03559300675988197, "y": -0.04161950945854187}, {"rank": 7, "i": 1077, "id": "013-aloha-airlines-flight-243.pdf#102", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 80"], "folder": "1980'ler", "score": 0.6259409189224243, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 80]\n# Sayfa 80\n\n74\nthe separation of the fuselage upper lobe. Contributing to the accident\nwere the failure of Aloha Airlines management to supervise properly its\nmaintenance force; the failure of the FAA to evaluate properly the Aloha\nAirlines maintenance program and to assess the airline’s inspection and\nquality control deficiencies; the failure of the FAA to require Airworthiness\nDirective 87-21-08 inspection of all the lap joints proposed by Boeing Alert\nService Bulletin SB 737-53A1039; and, the lack of a complete terminating\n“action (neither generated by Boeing nor required by the FAA) after the\ndiscovery of early production difficulties in the B-737 cold bond lap joint\nwhich resulted in low bond durability, corrosion, and premature fatigue\ncracking.\n4, RECOMMENDATIONS\nAs a result of its investigation of this accident, the National\nTransportation Safety Board made the following safety recommendations:\n--to the Federal Aviation Administration:\n‘Provide specific guidance and proper engineering\nsupport to Principal Maintenance Inspectors to\nevaluate. modifications of airline maintenance\nprograms and operations specifications which propose\nsegmenting major maintence inspections. (Class II,\nPriority Action) (A-89-53)\nIdentify operators whose airplane use differs\nsignificantly from the flight cycle versus flight\ntime relationship upon which the Maintenance\nPlanning Document was predicated, and verify that\ntheir maintenance programs provide timely detection\nof both cycle and time related deficiencies.\n(Class II, Priority Action) (A-89-54)\nRevise the regulations governing the certification\nof aviation maintenance technician schools and the\nlicensing of airframe and powerplant. mechanics to\nrequire that the curriculum and testing requirements\ninclude modern aviation industry technology.\n(Class II, Priority Action) (A-89-55)\nRequire formal certification and recurrent training\n-of aviation maintenance inspectors performing\nnondestructive inspection functions. Formal\ntraining should include apprenticeship and periodic\nskill demonstration. (Class II, Priority Action)\n(A-89-56)\nRequire operators to provide specific. training\nprograms for maintenance and inspection personnel\nabout the conditions under which visual inspections\nmust be. conducted. Require operators to", "x": -0.14080055058002472, "y": -0.18761391937732697}, {"rank": 8, "i": 1054, "id": "013-aloha-airlines-flight-243.pdf#79", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 67"], "folder": "1980'ler", "score": 0.6239293217658997, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 67]\n# Sayfa 67\n\n61\nknowledge, or the required programs to meet its responsibility to ensure the\ncontinued structural integrity of its airplanes.\n2.5 FAA Responsibilities\n2.5.1 Issuance and Clarity of Airworthiness Directives\nIn-service fatigue cracking in a disbonded area of a B-737 lap\njoint was first reported in 1984 (by Aloha Airlines). Then in April 1987,.a\nforeign operator reported several cases within his fleet. Boeing acted by\nrevising the existing lap joint disbond information, SB 737-53-1039, Revision\n2 (which had advised that prolonged operation with disbonded areas would\nresult in fatigue cracks), upgrading the SB to Alert status, and notifying\nthe FAA. In October 1987, multiple site cracking was discovered during the\nmanufacturer’s continued fatigue testing of a B-737 aft body section. Within\nthe same time frame, the FAA issued AD 87-21-08 which required mandatory\ninspection for fatigue cracking.\nThe Safety Board considers it unfortunate that the Boeing Alert SB\nto inspect all lap joints was not issued after the first instance of\ncracking, and that the intent of the Alert SB was altered significantly by\nthe FAA to reduce the scope of.the inspection when the AD was released. The\nSafety Board believes that had a full inspection of all lap joints been\nmandated, the likelihood of this accident occurring may have been reduced.\nTherefore, the limited AD requirements imposed by the FAA. precluded the\ncontinuing airworthiness of the aging B-737s and the reduced inspection\ncriteria is considered a contributing factor to the cause of this accident.\nWhen Aloha Airlines accomplished the inspections and repairs\nassociated with the AD, they omitted inspections of lap joints other than\nthose along S-4 and they did not replace the remaining fasteners in the upper\nrow of the S-4R lap joint with protruding head rivets, as outlined in Boeing\nASB 737-53A1039. The AD pertaining to the lap joint inspections states, in\npart:\nRepair all cracks and tearstrap ‘delaminations found as a\nresult of the above inspections prior to further flight\nin’ accordance’ with Boeing Alert Service Bulletin\n737-53A109, Revision. 3, Dated August 20, or later\nFAA-approved revisions.\nThe appropriate section of the ASB states, in part:\nRepair fatigue cracks using a repair similar to that\nshown in 737 Structural Repair Manual Subject 53-30-3,\nFigure 16, and replace all remaining upper row flush\njoint-fasteners in- that panel joint with oversized\nprotruding head solid fasteners per Part IV - _ Repair\nData.", "x": -0.16165092587471008, "y": -0.18676862120628357}], "runners_up": [{"rank": 9, "i": 1033, "id": "013-aloha-airlines-flight-243.pdf#58", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 56"], "folder": "1980'ler", "score": 0.6180562973022461, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 56]\n# Sayfa 56\n\n50\n2.3 — Fuselage Separation Sequence\nThe redirection of a longitudinal fuselage crack, and thus the\nsuccess of the flapping mechanism to safely decompress an airplane, depends\non the integrity of the structure ahead of the crack tip. If tear straps are\ndisbonded, they become ineffective because stiffening is lost, and the crack\ncan propagate as if the tear straps did not exist. In that case, controlled\n(safe) decompression may not occur.\nMultiple site damage (MSD) describes multiple fatigue cracks along\na rivet line. MSD can range from a few fatigue cracks among many rivet holes\nto the worst case of small, visually undetectable fatigue cracks emanating\nfrom both sides of rivet holes along a complete row of skin panel fasteners.\nIt is theoretically possible that this worst case condition may result in a\ncatastrophic’ failure of the fuselage before any crack is visually detected.\nThe presence of MSD also tends to negate the fail-safe capability of the\nfuselage. An FAA report on the subject of MSD is included as appendix J.\nThe MSD found during service on other B-737 lap joints in the\nworldwide fleet was in random areas along the lap joints. The initial\noccurrence of disbonded lap joints’ in random locations leads to fatigue\ncracking in random areas. Inspections and examinations of the remaining\nportion of the accident airplane in the upper. lobe aft of the fuselage\nseparation area revealed that the MSD was most prevalent in the mid-bay areas\n(between adjacent circumferential tear straps). Fatigue cracks up to\n0.53 inch in length were evident in the lap joint along S-10L near BS 520.\nThe section of S-4R recovered from the right wing leading edge contained\nnumerous fatigue cracks that stemmed from disbonding of the cold-bonded lap\njoint and disbonding of the hot-bonded tear straps.\nThe ‘intended function of the bond (to carry the hoop stress and\nfatigue loads through the lap joint) is lost when the joint is disbonded and\nthe rivets. must carry the load. Because the lap joint rivets are\ncountersunk, the knife edge created by the countersink produces a stress\nconcentration that leads to fatigue cracking from the rivet hole. Therefore,\nwhile a disbonded lap joint can withstand the pressurization cycles that a\nproperly bonded joint. is intended to carry, the lap joint becomes more\n“susceptible to fatigue cracking. ;\nIt is probable that numerous smal] fatigue cracks along S-10L\njoined to form a large crack (or cracks) similar to the crack at S-10L that\nthe passenger saw when boarding the accident flight. The damage discovered\non the accident airplane, damage on other airplanes in the Aloha Airlines\nfleet, fatigue striation growth rates, and the service history of the B-737\nlap joint disbond problem led the Safety Board to conclude that, at the time\nof the accident, numerous fatigue cracks in the fuselage skin lap joint along\n$-10L. linked up quickly to cause catastrophic failure of a large section of\nthe fuselage.\nThe Safety Board believes that sufficient fatigue cracking or tear\nstrap disbond (or a combination of both) existed in the lap joint at $-10L\nto negate the design-intended controlled decompression of the structure.", "x": -0.12406954169273376, "y": -0.1176145002245903}, {"rank": 10, "i": 1034, "id": "013-aloha-airlines-flight-243.pdf#59", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 57"], "folder": "1980'ler", "score": 0.6115103363990784, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 57]\n# Sayfa 57\n\n5]\nThe Safety Board further believes that Aloha Airlines had\nsufficient information regarding lap joint problems to have implemented a\nmaintenance program to. detect and repair the lap joint. damage. The\ninformation available to Aloha Airlines on lap joint problems included the\nfollowing:\n) the B-737s in the Aloha Airlines’ fleet were\nhigh-cycle airplanes accumulating cycles at a faster\nrate than any other operator;\n9) Aloha. Airlines operated in a harsh ~ corrosion\nenvironment;\n0 Aloha Airlines previously had discovered a 7.5-inch\n~-cerack along lap joint S-10L. on another B-737\nairplane;\n) Boeing had issued, and records indicate that Aloha\nAirlines was aware of, a SB covering lap joint\ninspection and repair in 1972, revised in 1974, and\nupgraded to an ASB in 1987; and\n) the FAA had - issued an AD. in~ 1987 requiring ©\n-~ jnspections of the lap joints along S-4 and\nreferencing the Boeing ASB, which called for\ninspection of other lap joint locations, including\nalong S-10.\n2.4 Aloha Airlines Maintenance Program\nThe Safety Board identified three factors of concern in the Aloha\nAirlines maintenance program. They were: © a high accumulation of flight\ncycles between structural. inspections, an extended time period between\ninspections that allowed the related effects of lap joint disbond, corrosion,\nand fatigue to accumulate, and the manner in which a- highly segmented\nstructural inspection program was implemented.\nThe Aloha Airlines structural D check inspection interval for the\ncontinuing airworthiness of their B-737 fleet was approved by the FAA at\n15,000 hours. The selection of 15,000 hours appears to have been more\nconservative than the 20,000-hour interval recommended by Boeing. However,\nbecause of the daily frequency of short duration flights, the rate of\naccumulation of flight cycles on Aloha Airlines airplanes exceeded the rate\nwhich Boeing forecast when the B-737 MPD was created. Aloha Airlines records\nof aircraft utilization indicated that their airplanes accumulated about\nthree cycles for each hour in service. The Boeing economic design life\nprojections were based on accumulating about 1 1/2 cycles per flight hour.\nThus, Aloha Airlines airplanes were accumulating flight cycles at twice the\nrate for which the Boeing MPD was designed. Even with an adjustment for\npartial pressurization cycles on short flights, and thus partial loading of\nthe fuselage, the accumulation of cycles on Aloha Airlines airplanes remained", "x": -0.14976319670677185, "y": -0.16301175951957703}, {"rank": 11, "i": 1016, "id": "013-aloha-airlines-flight-243.pdf#41", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 42"], "folder": "1980'ler", "score": 0.6099109053611755, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 42]\nSayfa 42\n\n36\n1.17.4 Service Difficulty Report Information\nThe FAA SDR data base was queried by the Safety Board after the\naccident for information pertaining to the B-737 fuselage. From the\nbeginning of the current data base (January 1983) until the date of the\naccident, 1,352 records were found. Of these, 198 were reports of fuselage\nskin cracks, and 10 of these reports were of cracking at or near lap joints.\nSix of the 10 reports involved lap joints in the upper lobe, while the\nremaining 4 reports indicated cracks from the lower lobe of the fuselage.\n(See Appendix H.) © One report was submitted after the effective date of\nAD 87-21-08, November 2, 1987. All of the airplanes cited in the 10 reports\nwere among the first 291 B-737 airplanes assembled by Boeing.\nThere were 18 SDRs on file pertaining to airplanes in the Aloha\nAirlines fleet. Three reports were on lap joint cracks/corrosion previously\ncited, and two reports were about upper ‘lobe skin cracking where lap joint\ninvolvement could not be established from the information given. Three of\nthe reports pertained to lower lobe skin corrosion; an additional three\nreports cited corrosion at cargo door frames and the nose. gear wheel well\nstructure. The remaining seven reports involved cracks in fuselage structure\nother than skin or lap joints.\n1.17.5 Supplemental Structural Inspection Program (SSIP)\nAs the high-time airplanes in the world fleet of jet transport\ncategory airplanes began to approach their original lifetime design\nobjectives, the industry questioned the continued airworthiness of the aging\nfleet since many of the airplanes would continue in service beyond design\nobjectives. This. concern ultimately led to a requirement for a. structural\nreassessment or audit and the development of a continuing ~ structural\nintegrity program for older transport airplanes. The air transport airframe\nmanufacturers developed the required programs, utilizing different concepts,\nto achieve continued airworthiness of their aging airplanes. The structural\nintegrity programs have resulted in directed inspections of SSIs (any detail,\nelement, or assembly that contributes significantly to carrying flight,\nground, pressure, or control loads and whose failure could affect the\nstructural integrity necessary for the safety of the airplane) at appropriate\ninitiating thresholds and repeated intervals to detect fatigue damage before\nthe loss of residual strength of the airplane’s structure.\nIn 1978, the portion of 14 CFR 25.571 dealing with fail-safe\nrequirements was revised to reflect state-of-the-art advances in fracture\nmechanics and structural analysis. The new regulation required consideration\nof damage growth characteristics at multiple sites, and.an inspection program\nto incorporate these analyses to ensure that the damage was detected before\nthe residual strength of the airplane dropped below the regulatory fail-safe\nrequirements. This was called the damage tolerance concept.\nBoeing’s approach to the aging fleet problem for the 727/737/747\n(which were certificated under the pre-1978 14 CFR 25.571 criteria) was to\nreassess these airplanes using the revised 14 CFR 25.571 damage tolerance\nrequirements. This", "x": -0.12170664221048355, "y": -0.16115418076515198}, {"rank": 12, "i": 1044, "id": "013-aloha-airlines-flight-243.pdf#69", "path": "1980'ler/013-aloha-airlines-flight-243.pdf", "heading_path": ["Sayfa 62"], "folder": "1980'ler", "score": 0.6083518266677856, "text": "[013-aloha-airlines-flight-243.pdf › Sayfa 62]\nSayfa 62\n\n56\nimportant that the airplanes be available again for the next day’s flying\n~ schedule. Such aircraft utilization tends to drive the scheduling, and\nindeed, the completion of required maintenance work. Mechanics ~ and\ninspectors are forced to perform under time pressure. Further, the intense\neffort to keep the airplanes flying may have been so strong that the\nmaintenance personnel were reluctant to keep airplanes in the hangar any\nTonger than absolutely necessary.\n- Inadequate guidance and support from Aloha management to its\n“inspectors was evident. also when the Production and Planning department sent\nto the inspector’s mail box, the AD and SB on the inspection requirements of\nthe lap joints along S-4 without further review or technical comment. These\ndocuments’ were complicated, critical to airworthiness, and subject to\ninterpretation as evidenced by the disagreement about its content expressed\nby experts at the Safety Board’s public hearing. These documents needed\nhigher level review and written guidance as to their disposition before being\nsent to maintenance for action. Therefore, the Safety Board concludes that\nAloha’s management failed to provide adequate guidance and support to its\nmaintenance personnel and this failure contributed directly to the cause of\nthis accident.\nWhile the foregoing indicates that there were deficiencies in the\ntraining, guidance, and support provided by Aloha Airlines management to its\nmaintenance personnel, there are indications that, had these deficiencies not\nexisted and the inspection task been well defined and structured properly,\nthe inspection error rate would still not have been totally eliminated... This\nbelief is, in part, supported by the reports received by the FAA after this\naccident as a result of AD-T88-10-11 which required inspection and reports on\npositive indications of -cracks and corrosion found in early model B-737\nairplanes. ._ The FAA received 49 reports of corrosion or cracks not previously\nfound; 14 of these instances involved multisite cracking. No matter how\nwell organized a corrosion detection and crack detection program may be and\nno matter how dedicated and vigilant the NDI work force, the inspection\nprocess is inherently susceptible to some error rate. Therefore, the Safety\nBoard believes that the terminating action of AD-T88-10-11, which consisted\nof drilling out the existing rivets and replacing them with protruding head\n_ rivets, an action adopted immediately by a number of airlines, was superior\nto the option in the AD that permitted repeated inspections and patching of\ncracks; a process that included substantial potential for human performance\nerror. The Safety Board fully concurs with recent FAA terminating action for\nB-737. lap joints tha fa 193"], "question": [-0.05128788203001022, -0.0635208785533905], "variance_ratio": 0.1558821052312851}, "prompt": {"system": "Sen bir doküman asistanısın. Kullanıcının sorusunu YALNIZCA verilen numaralı doküman parçalarına dayanarak cevapla.\n\nKurallar:\n- Her iddianın sonuna dayandığın parçanın numarasını [n] biçiminde ekle.\n- Parçalarda cevap yoksa ya da yetersizse tahmin yürütme; \"Dokümanlarda bulamadım.\" de ve neyin eksik olduğunu söyle.\n- Parçalar birbiriyle çelişiyorsa bunu açıkça belirt ve iki tarafı da atıfla ver.\n- Türkçe cevap ver.", "user": "Doküman parçaları:\n\n\u003cparca no=\"1\">\n[013-aloha-airlines-flight-243.pdf › Sayfa 77]\n# Sayfa 77\n\nio\n3. CONCLUSIONS\nFindings\n1.\n10.\nThe flightcrew was certificated and qualified for the flight\n“and the airplane was dispatched in accordance with company\nprocedures and Federal regulations.\nWeather was not a factor in this accident.\nAlthough Aloha Airlines~ operated’ according to the FAA\noperating certificate and operations specifications, the\nquality of Aloha Airlines maintenance and inspection program\nwas deficient.\nThere was no evidence of preexisting failure or malfunction of\nthe airplane’s air conditioning, pressurization, pneumatic, or\nelectrical systems that could have contributed to the fuselage\nfailure.\nThe flightcrew’s use of a target speed of 280-290 KIAS and\nspeedbrakes in the descent after. the structural separation\nindicated. they did not consider the appropriate emergency\ndescent checklist which states, in part, that if structural\nintegrity is in doubt, airspeed should be limited as much as\npossible and high maneuvering loads should be avoided.\nThe left engine became inoperative because the engine control\ncables separated due to an increase in cable tension caused by\ncabin floor deformation, coupled with corrosion found in the\narea of cable separation.\nThe fuselage failure initiated in the lap joint along $-10L;\nthe failure mechanism was a result of multiple site fatigue\ncracking of the skin adjacent to rivet holes along the lap\njoint upper rivet row and tear strap disbond which negated the\nfail-safe characteristics of the fuselage.\nThe fatigue cracking initiated from the knife edge associated\nwith the countersunk lap joint rivet holes; the knife edge\nconcentrated stresses that were transferred through the rivets\nbecause of lap joint disbonding.\nThe disbonding of lap joints and tear straps originated from\nmanufacturing difficulties encountered with surface\npreparation and/or bond material processing during the\nconstruction of the airplane which resulted in lap joint bonds\nwith low environmental durability or a lack of bonding.\nAlthough a representative fuselage section of a Boeing 737 was\ntested to 150,000 cycles during certification, the test did\nnot reflect the fatigue performance of the actual fleet\n\u003c/parca>\n\n\u003cparca no=\"2\">\n[013-aloha-airlines-flight-243.pdf › Sayfa 78]\n# Sayfa 78\n\n1].\n12.\n13.\n14.\n15.\n16.\n17.\n18.\n72\naircraft because the test parameters did not consider the long\nterm effects of disbonding, corrosion, and fatigue cracking in\nthe lap joints as experienced in airline service.\nDisbonding. of B-737 lap joints, with resulting corrosion and\nprobable fatigue cracking, was explicitly defined in Boeing\nService Bulletin 737-53-1039, Revision 2 dated February 8,\n1974; however the serious implications of multiple site damage\nwere not realized, a permanent solution was not determined,\nand corrective action was relegated to repetitive visual\ninspections: and damage repair.\nThere was sufficient information available to Aloha Airlines\nto alert it to the cracking problems associated with the\ndéterioration of lap joint bonds, and Aloha should have\nfollowed a maintenance program to detect and repair cracking\nbefore it reached a critical condition.\nFAA AD 87-21-08 should have mandated inspection of all lap\njoints per Boeing ASB 737-53A1039, Revision 3, instead of\nlimiting the inspection of only the lap joints at S-4.\nIt was not. determined whether. Aloha Airlines. actually\nperformed the required eddy current inspection in compliance\nwith AD 87-21-08 or whether it was performed ineffectively.\nA properly conducted eddy current inspection, performed in\naccordance with AD-87-21-08 in November 1987, would have\ndetected additional fatigue cracks in the holes of the upper\nrivet row of the lap joint along S-4R.\nFAA. licensed Aircraft and. Powerplant. mechanics are not\nrequired to be knowledgeable in the maintenance and inspection\nof modern contemporary airplanes because the training\ncurriculum has not kept pace with aviation industry\ntechnology.\nThere are human’ factors issues associated with. visual and\nnondestructive inspection which can degrade inspector\nperformance to the extent that theoretically detectable damage\nis overlooked.\nAloha Airlines management’ failed to- recognize the human\nperformance factors of inspection and to fully motivate and\nfocus their inspector force toward the critical nature of lap\n‘joint inspection, corrosion control and crack detection.\nHowever, reports of fleet-wide cracks received by the FAA\nafter the Aloha Airlines accident indicate that a similar lack\nof critical attention to lap. joint inspection and fatigue\ncrack detection. was an industry-wide deficiency.\n\u003c/parca>\n\n\u003cparca no=\"3\">\n[013-aloha-airlines-flight-243.pdf › Sayfa 6]\n# Sayfa 6\n\nEXECUTIVE SUMMARY\nOn April 28, 1988, at 1346, a Boeing 737-200, N73711, operated by.\nAloha Airlines Inc., as flight 243, experienced an explosive decompression\nand structural failure at 24,000 feet, while en route from Hilo, to Honolulu,\nHawaii. Approximately 18 feet from the cabin skin and structure aft of the\ncabin entrance door and above the passenger floorline separated from the\nairplane during flight.’ There were 89 passengers and 6 crewmembers on board.\nOne flight attendant was swept overboard during the decompression and is\npresumed to have been fatally injured; 7 passengers and 1 flight attendant\nreceived serious injuries. The flight crew performed an emergency descent\nand landing at Kahului Airport on the Island of Maui.\nThe National Transportation Safety Board determines that the\nprobable cause of this accident was the failure of the Aloha Airlines\nmaintenance program to detect the presence of significant disbonding and\nfatigue damage which ultimately led to failure of the lap joint at S-10L and\nthe separation of the fuselage upper lobe. Contributing to the accident were\nthe failure of Aloha Airlines management to supervise properly its\nmaintenance force; the failure of the FAA to evaluate properly the Aloha\nAirlines maintenace program and to assess the airline’s inspection. and\nquality control deficiencies; the failure of the FAA to require Airworthiness\nDirective 87-21-08 inspection of all the lap joints proposed by Boeing Alert\nService Bulletin SB 737-53A1039; and the lack of a complete terminating\naction (neither generated by Boeing nor required by the FAA) after the\ndiscovery of early production difficulties in the B-737 cold bond lap joint\nwhich resulted in low bond durability, corrosion, and premature fatigue\ncracking.\nThe safety issues raised in this report include:\no . The quality of air carrier maintenance programs and\nthe FAA surveillance of those programs.\n) The engineering design, certification, and\ncontinuing airworthiness of the B-737~ with\nparticular emphasis on multiple site fatigue\ncracking of the fuselage lap joints.\n) The human factors aspects of air carrier maintenance\nand inspection for the continuing airworthiness of\ntransport category airplanes, to include repair\nprocedures and the training, certification and\nqualification of mechanics and inspectors.\nRecommendations. concerning these issues were addressed to the\nFederal Aviation Administration, Aloha Airlines, and the Air Transport’\nAssociation.\n\u003c/parca>\ inally from both sides of at least seven adjacent rivet\nholes in the skin along the lap joint at S-10L. Although this was: not the\nfailure origin, such cracking is indicative of the type of preexistent\ncracking that probably was present along random areas of the lap joint at\nS-10L.\nFurther, a passenger had noted and later reported a skin crack aft\nof the forward entry door near a top row of lap joint rivets for S-10L while\nboarding the airplane. (The passenger later was escorted to a similar\nairplane and verified the observation.) The Safety Board believes that the\ntop rivet row was cracked at the S-10L lap joint just aft of BS 360 before\nthe accident flight takeoff.\nAdditionally, passengers seated on the left side of the airplane\nstated that the location of the missing flight attendant immediately before\nthe decompression was in the aisle at seat row 5. During the decompression,\nevidence indicates that the flight attendant was ejected from the airplane at\na location corresponding to S-10L near BS 440.\nConsequently, the Safety Board determines that the fuselage of\nN73711 most probably failed. catastrophically along S-10L, initially near\nBS 440, allowing the upper fuselage to rip free. The reason for this\ncatastrophic failure, rather than the intended fail-safe \"flapping\" of the\nskin as designed, was evaluated by the Safety Board.\n\u003c/parca>\n\n\u003cparca no=\"7\">\n[013-aloha-airlines-flight-243.pdf › Sayfa 80]\n# Sayfa 80\n\n74\nthe separation of the fuselage upper lobe. Contributing to the accident\nwere the failure of Aloha Airlines management to supervise properly its\nmaintenance force; the failure of the FAA to evaluate properly the Aloha\nAirlines maintenance program and to assess the airline’s inspection and\nquality control deficiencies; the failure of the FAA to require Airworthiness\nDirective 87-21-08 inspection of all the lap joints proposed by Boeing Alert\nService Bulletin SB 737-53A1039; and, the lack of a complete terminating\n“action (neither generated by Boeing nor required by the FAA) after the\ndiscovery of early production difficulties in the B-737 cold bond lap joint\nwhich resulted in low bond durability, corrosion, and premature fatigue\ncracking.\n4, RECOMMENDATIONS\nAs a result of its investigation of this accident, the National\nTransportation Safety Board made the following safety recommendations:\n--to the Federal Aviation Administration:\n‘Provide specific guidance and proper engineering\nsupport to Principal Maintenance Inspectors to\nevaluate. modifications of airline maintenance\nprograms and operations specifications which propose\nsegmenting major maintence inspections. (Class II,\nPriority Action) (A-89-53)\nIdentify operators whose airplane use differs\nsignificantly from the flight cycle versus flight\ntime relationship upon which the Maintenance\nPlanning Document was predicated, and verify that\ntheir maintenance programs provide timely detection\nof both cycle and time related deficiencies.\n(Class II, Priority Action) (A-89-54)\nRevise the regulations governing the certification\nof aviation maintenance technician schools and the\nlicensing of airframe and powerplant. mechanics to\nrequire that the curriculum and testing requirements\ninclude modern aviation industry technology.\n(Class II, Priority Action) (A-89-55)\nRequire formal certification and recurrent training\n-of aviation maintenance inspectors performing\nnondestructive inspection functions. Formal\ntraining should include apprenticeship and periodic\nskill demonstration. (Class II, Priority Action)\n(A-89-56)\nRequire operators to provide specific. training\nprograms for maintenance and inspection personnel\nabout the conditions under which visual inspections\nmust be. conducted. Require operators to\n\u003c/parca>\n\n\u003cparca no=\"8\">\n[013-aloha-airlines-flight-243.pdf › Sayfa 67]\n# Sayfa 67\n\n61\nknowledge, or the required programs to meet its responsibility to ensure the\ncontinued structural integrity of its airplanes.\n2.5 FAA Responsibilities\n2.5.1 Issuance and Clarity of Airworthiness Directives\nIn-service fatigue cracking in a disbonded area of a B-737 lap\njoint was first reported in 1984 (by Aloha Airlines). Then in April 1987,.a\nforeign operator reported several cases within his fleet. Boeing acted by\nrevising the existing lap joint disbond information, SB 737-53-1039, Revision\n2 (which had advised that prolonged operation with disbonded areas would\nresult in fatigue cracks), upgrading the SB to Alert status, and notifying\nthe FAA. In October 1987, multiple site cracking was discovered during the\nmanufacturer’s continued fatigue testing of a B-737 aft body section. Within\nthe same time frame, the FAA issued AD 87-21-08 which required mandatory\ninspection for fatigue cracking.\nThe Safety Board considers it unfortunate that the Boeing Alert SB\nto inspect all lap joints was not issued after the first instance of\ncracking, and that the intent of the Alert SB was altered significantly by\nthe FAA to reduce the scope of.the inspection when the AD was released. The\nSafety Board believes that had a full inspection of all lap joints been\nmandated, the likelihood of this accident occurring may have been reduced.\nTherefore, the limited AD requirements imposed by the FAA. precluded the\ncontinuing airworthiness of the aging B-737s and the reduced inspection\ncriteria is considered a contributing factor to the cause of this accident.\nWhen Aloha Airlines accomplished the inspections and repairs\nassociated with the AD, they omitted inspections of lap joints other than\nthose along S-4 and they did not replace the remaining fasteners in the upper\nrow of the S-4R lap joint with protruding head rivets, as outlined in Boeing\nASB 737-53A1039. The AD pertaining to the lap joint inspections states, in\npart:\nRepair all cracks and tearstrap ‘delaminations found as a\nresult of the above inspections prior to further flight\nin’ accordance’ w function inlineMd(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[(\d+)\]/g, (m, n) => +n >= 1 && +n <= T.k ? `<button class="cite" data-r="${n}">${n}</button>` : m);
}
function renderMd(md) {
  const out = [], lines = md.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<table class="md">${body.map((r, n) => `<tr>${cells(r).map(x => n ? `<td>${inlineMd(x)}</td>` : `<th>${inlineMd(x)}</th>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,4}\s/.test(l)) {
      out.push(`<h4>${inlineMd(l.replace(/^#+\s*/, ""))}</h4>`);
    } else if (/^\s*[-*]\s/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s/, ""));
      i--;
      out.push(`<ul>${items.map(x => `<li>${inlineMd(x)}</li>`).join("")}</ul>`);
    } else if (l.trim()) {
      out.push(`<p>${inlineMd(l)}</p>`);
    }
  }
  return out.join("");
}

  svg("path", { d: "M630,94 C630,130 455,120 455,160", style: "fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4" }, s);
  svg("text", { x: 548, y: 128, "text-anchor": "middle", class: "ink2", style: "font-size:12px", text: "arama bu matrise bakar" }, s);
  svg("text", { x: 0, y: 262, class: "ink2", style: "font-size:12.5px",
    text: "Mavi kutular bu sayfada ayrıntılı. ① ve ② makinende çalışır (Ollama + numpy). Dışarıya yalnızca ③'te hazırlanan metin çıkar." }, s);
}

/* ---------- Süreler ---------- */
{
  const c = card("time", null, "Zaman nereye gitti?", total,
    "Her adımın süresi, toplam süreye oranıyla gösteriliyor. Genellikle zamanın büyük kısmını Claude alır. Arama, 1660 parça olmasına rağmen tek bir matris çarpımı olduğu için milisaniyeler sürer.");
  const names = { embed: "① embed (Ollama)", search: "② arama (numpy)", prompt: "③ prompt", generate: "④ Claude" };
  const colors = { embed: "var(--c3)", search: "var(--c1)", prompt: "var(--c4)", generate: "var(--c7)" };
  const s = svg("svg", { viewBox: "0 0 1000 64" }, c);
  let x = 0;
  T.steps.forEach(st => {
    const w = Math.max(3, st.ms / total * 1000 - 2);
    const r = svg("rect", { x, y: 0, width: w, height: 30, rx: 4, style: `fill:${colors[st.name]}` }, s);
    hoverable(r, `<b>${names[st.name]}</b><br>${ms(st.ms)} · toplamın %${fmt(st.ms / total * 100, 1)}'i`);
    x += w + 2;
  });
  const lg = document.createElement("div"); lg.className = "legend";
  lg.innerHTML = T.steps.map(st => `<span><i class="sw" style="background:${colors[st.name]}"></i>${names[st.name]} <b class="num">${ms(st.ms)}</b> <span style="color:var(--muted)">(%${fmt(st.ms / total * 100, 1)})</span></span>`).join("");
  c.appendChild(lg);
}

/* ---------- ① Embed ---------- */
{
  const e = T.embed;
  const c = card("s1", "1", "Soru sayıya çevrildi", stepMs("embed"),
    `Soru metni yerel <b>${esc(T.corpus.embed_model)}</b> modeline gönderildi. Model, sorunun <i>anlamını</i> ${e.dim} sayıdan oluşan bir listeye (vektöre) çevirdi. ` +
    "Parçalar da indekslemede aynı modelle aynı uzaya çevrilmişti. Anlamca yakın metinlerin vektörleri aynı yöne bakar.");
  const cols = 64, rows = Math.ceil(e.dim / cols), cw = 1000 / cols, ch = 12;
  const s = svg("svg", { viewBox: `0 0 1000 ${rows * ch + 26}`, role: "img", "aria-label": "Vektör değerleri ısı şeridi" }, c);
  const maxAbs = Math.max(...e.preview.map(Math.abs)) || 1;
  e.preview.forEach((v, i) => {
    const t = Math.min(1, Math.abs(v) / maxAbs);
    const r = svg("rect", { x: (i % cols) * cw, y: Math.floor(i / cols) * ch, width: cw - 1, height: ch - 1, rx: 1.5,
      style: `fill:${v >= 0 ? "var(--warm)" : "var(--accent)"};fill-opacity:${(0.12 + 0.88 * t).toFixed(2)}` }, s);
    hoverable(r, `boyut #${i}<br><b>${fmt(v, 4)}</b>`);
  });
  svg("text", { x: 0, y: rows * ch + 18, text: `${e.dim} kutu = ${e.dim} sayı · turuncu = pozitif, mavi = negatif, koyuluk = büyüklük · vektör uzunluğu ${fmt(e.norm, 3)} (normalize edildi)` }, s);
  html(c, `<div class="callout">Tek bir kutunun anlamı yoktur: "#${e.preview.indexOf(Math.max(...e.preview))} numaralı boyut finans demek" gibi bir karşılık yok. Anlam, bu vektörün diğer vektörlerle yaptığı <b>açıda</b> saklıdır. Bir sonraki adım tam olarak bu açıyı ölçüyor.</div>`);
  terms(c, [
    ["Embedding", "Metni, anlamını koruyacak şekilde sabit uzunlukta bir sayı listesine çeviren model çıktısı."],
    ["Vektör", `Bu sayı listesi. Burada ${e.dim} boyutlu: ${e.dim} eksenli bir uzayda tek bir ok gibi düşün.`],
    ["Normalize", "Okun boyu 1'e eşitlenir. Böylece yalnızca yönü karşılaştırılır; uzun metin, kısa metne göre avantaj kazanmaz."],
  ]);
}

/* ---------- ② Arama ---------- */
{
  const S = T.search;
  const c = card("s2", "2", `${int(T.corpus.n_chunks)} parça puanlandı, en iyi ${T.k} tanesi seçildi`, stepMs("search"),
    `Soru vektörü, indeksteki <b>her</b> parça vektörüyle karşılaştırıldı (kosinüs benzerliği). Sonuç ${int(T.corpus.n_chunks)} skor. Bunlar sıralandı ve en yüksek ${T.k} tanesi seçildi. Model yok, "anlama" yok: yalnızca geometri.`);
  const lo = S.histogram.edges[0], hi = S.histogram.edges.at(-1);

  // Histogram
  html(c, `<h3>Tüm skorların dağılımı</h3><p class="lede" style="margin:0 0 6px">Her çubuk bir skor aralığı, yüksekliği o aralıktaki parça sayısı. Parçaların çoğu ortada yığılır (soruyla ilgisiz). Seçilenler sağ uçta, kesim çizgisinin sağında.</p>`);
  {
    const W = 1000, H = 230, m = { l: 40, r: 10, t: 16, b: 52 };
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Skor histogramı" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    const maxC = Math.max(...S.histogram.counts);
    const Y = n => H - m.b - n / maxC * (H - m.t - m.b);
    [0, 0.5, 1].forEach(f => {
      const n = Math.round(maxC * f), y = Y(n);
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end", text: n }, s);
    });
    S.histogram.counts.forEach((n, i) => {
      const a = S.histogram.edges[i], b = S.histogram.edges[i + 1];
      const sel = a >= S.kth_score - 1e-9 || b > S.kth_score;
      const x = X(a) + 1, w = Math.max(1, X(b) - X(a) - 2), y = Y(n);
      const r = svg("rect", { x, y: n ? y : H - m.b, width: w, height: Math.max(0, H - m.b - y), rx: 2,
        style: `fill:${sel ? "var(--accent)" : "var(--axis)"}` }, s);
      const hitRect = svg("rect", { x: X(a), y: m.t, width: X(b) - X(a), height: H - m.t - m.b, style: "fill:transparent" }, s);
      hoverable(hitRect, `skor ${fmt(a)} – ${fmt(b)}<br><b>${n}</b> parça`);
    });
    svg("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, style: "stroke:var(--axis)" }, s);
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
    // seçilenlerin halısı (rug)
    hits.forEach(h => {
      const t = svg("line", { x1: X(h.score), x2: X(h.score), y1: H - m.b + 22, y2: H - m.b + 34, style: "stroke:var(--accent);stroke-width:2" }, s);
      hoverable(t, `<b>#${h.rank}</b> ${fmt(h.score)}<br>${esc(h.path)}`);
    });
    svg("text", { x: W - m.r, y: H - 4, "text-anchor": "end", text: "↑ seçilen parçaların skorları (her çizgi bir parça)" }, s);
    const kx = X(S.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t - 6, y2: H - m.b + 34, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    svg("text", { x: kx - 6, y: m.t + 4, "text-anchor": "end", class: "ink", style: "font-weight:600",
      text: `kesim ${fmt(S.kth_score)} (#${T.k})` }, s);
    svg("text", { x: X(S.mean_score), y: m.t + 4, "text-anchor": "middle", class: "ink2", text: `ortalama ${fmt(S.mean_score, 2)}` }, s);
  }
  if (S.next_score != null) {
    const gap = S.kth_score - S.next_score;
    html(c, `<div class="callout"><b>Kıl payı:</b> ${T.k}. parça <b class="num">${fmt(S.kth_score)}</b>, ${T.k + 1}. parça <b class="num">${fmt(S.next_score)}</b>, fark yalnızca <b class="num">${fmt(gap, 4)}</b>. ` +
      (gap < 0.01 ? "Kesim bıçak sırtında. k'yi 1 artırmak Claude'a başka bir parça gösterirdi. Aşağıdaki tabloda kesimin hemen altında kalanlar da var." : "Seçilenler geri kalanlardan belirgin biçimde ayrışıyor.") + `</div>`);
  }

  // Klasör şeridi
  html(c, `<h3>Hangi klasör yarıştı?</h3><p class="lede" style="margin:0 0 6px">Her satır bir klasör, her nokta o klasördeki bir parça. Sağa gittikçe skor artar. Büyük noktalar seçilen ${T.k} parça.</p>`);
  {
    const pts = T.map.points, W = 1000, rowH = 30, m = { l: 150, r: 10, t: 6, b: 26 };
    const H = m.t + FOLDERS.length * rowH + m.b;
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Klasöre göre skorlar" }, c);
    const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
    FOLDERS.forEach((f, fi) => {
      const y = m.t + fi * rowH + rowH / 2;
      svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, style: "stroke:var(--grid)" }, s);
      const nh = hits.filter(h => h.folder === f).length;
      svg("text", { x: m.l - 10, y: y + 4, "text-anchor": "end", class: nh ? "ink" : "", style: nh ? "font-weight:600" : "",
        text: `${f}${nh ? ` (${nh})` : ""}` }, s);
    });
    const kx = X(T.search.kth_score);
    svg("line", { x1: kx, x2: kx, y1: m.t, y2: H - m.b, style: "stroke:var(--warm);stroke-width:2;stroke-dasharray:4 3" }, s);
    pts.forEach((p, i) => {
      if (p[4]) return;
      const y = m.t + p[3] * rowH + rowH / 2 + ((i * 7919) % 11 - 5);  // sabit titreşim: üst üste binmesin
      svg("circle", { cx: X(p[2]), cy: y, r: 2.2, style: `fill:${folderColor(p[3])};fill-opacity:.35` }, s);
    });
    hits.forEach(h => {
      const fi = FOLDERS.indexOf(h.folder), y = m.t + fi * rowH + rowH / 2;
      const d = svg("circle", { cx: X(h.score), cy: y, r: 6, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, s);
      hoverable(d, `<b>#${h.rank}</b> · ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    for (let i = 0; i <= 5; i++) {
      const v = lo + (hi - lo) * i / 5;
      svg("text", { x: X(v), y: H - 8, "text-anchor": "middle", text: fmt(v, 2) }, s);
    }
  }

  // Anlam haritası
  html(c, `<h3>Anlam haritası</h3><p class="lede" style="margin:0 0 6px">${int(T.corpus.n_chunks)} parçanın ${T.corpus.dim} boyutlu vektörleri 2 boyuta indirildi (PCA). Yakın noktalar benzer konulardır, renkler klasörleri gösterir. ★ soru, numaralı halkalar seçilen parçalar. Üzerine gelince parçanın adını görürsün.</p>`);
  {
    const P = T.map.points, W = 1000, H = 560, pad = 20;
    const xs = P.map(p => p[0]).concat(T.map.question[0]), ys = P.map(p => p[1]).concat(T.map.question[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const X = v => pad + (v - x0) / (x1 - x0) * (W - 2 * pad), Y = v => H - pad - (v - y0) / (y1 - y0) * (H - 2 * pad);
    const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Parçaların 2B anlam haritası",
      style: "background:var(--page);border-radius:10px" }, c);
    P.forEach((p, i) => {
      if (p[4]) return;
      const d = svg("circle", { cx: X(p[0]), cy: Y(p[1]), r: 3, style: `fill:${folderColor(p[3])};fill-opacity:.45` }, s);
      hoverable(d, () => `${esc(T.map.labels[i])}<br>skor <b>${fmt(p[2])}</b>`);
    });
    const qx = X(T.map.question[0]), qy = Y(T.map.question[1]);
    hits.forEach(h => svg("line", { x1: qx, y1: qy, x2: X(h.x), y2: Y(h.y), style: "stroke:var(--ink);stroke-opacity:.18;stroke-width:1" }, s));
    hits.forEach(h => {
      const g = svg("g", { id: `map-hit-${h.rank}` }, s);
      svg("circle", { cx: X(h.x), cy: Y(h.y), r: 9, style: `fill:${fColor(h.folder)};stroke:var(--surface);stroke-width:2` }, g);
      svg("text", { x: X(h.x), y: Y(h.y) + 4, "text-anchor": "middle", style: "fill:#fff;font-size:10.5px;font-weight:700", text: h.rank }, g);
      hoverable(g, `<b>#${h.rank}</b> · skor ${fmt(h.score)}<br>${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`);
    });
    const star = (cx, cy, R) => Array.from({ length: 10 }, (_, i) => {
      const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
      return `${cx + r * Math.cos(a)},${cy - r * Math.sin(a)}`;
    }).join(" ");
    const q = svg("polygon", { points: star(qx, qy, 13), style: "fill:var(--ink);stroke:var(--surface);stroke-width:2" }, s);
    hoverable(q, `<b>soru</b><br>${esc(T.question)}`);
    const lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = T.corpus.folders.map((f, i) => `<span><i class="sw" style="background:${folderColor(i)}"></i>${esc(f.name)} <span style="color:var(--muted)" class="num">${f.chunks}</span></span>`).join("")
      + `<span>★ soru</span>`;
    c.appendChild(lg);
    html(c, `<div class="callout"><b>Dikkat, harita yaklaşıktır:</b> 2 eksen, ${T.corpus.dim} boyuttaki yayılımın yalnızca <b>%${fmt(T.map.variance_ratio * 100, 1)}</b>'ini gösterebiliyor. Haritada uzak görünen bir parça gerçekte yakın olabilir. Seçimi harita değil, üstteki skorlar belirler. Harita yalnızca "soru hangi konu kümesine düştü?" sorusuna sezgi kazandırmak için.</div>`);
  }

  // Tablo
  html(c, `<h3>Seçilen ${T.k} parça ve kıl payı kalanlar</h3><p class="lede" style="margin:0 0 6px">Satıra tıklayınca parçanın tam metni açılır. Bu metin Claude'a aynen gönderilir. Kesik çizginin altındakiler seçilemedi, Claude onları hiç görmedi.</p>`);
  {
    const all = hits.concat(runners), maxS = S.max_score, minS = Math.min(...all.map(h => h.score)) - 0.02;
    const rows = all.map(h => {
      const isRunner = h.rank > T.k, w = ((h.score - minS) / (maxS - minS) * 100).toFixed(1);
      const cut = h.rank === T.k + 1 ? `<tr class="cut"><td colspan="3"></td></tr>` : "";
      return cut + `<tr class="hit-row ${isRunner ? "runner" : ""}" id="row-${h.rank}" data-rank="${h.rank}">
        <td class="num" style="width:42px"><b>#${h.rank}</b></td>
        <td style="width:160px"><div class="num" style="font-size:12.5px">${fmt(h.score)}</div><div class="bar ${isRunner ? "runner" : ""}" style="width:${w}%"></div></td>
        <td class="path"><i class="sw" style="background:${fColor(h.folder)}"></i> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › ") || "—")}</small>
          <details><summary>parça metni (~${int(h.text.length / 4)} token)</summary><pre>${esc(h.text)}</pre></details></td></tr>`;
    }).join("");
    html(c, `<table><thead><tr><th>sıra</th><th>skor</th><th>kaynak › başlık</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  terms(c, [
    ["Kosinüs benzerliği", "İki vektör arasındaki açının kosinüsü. 1'e yakınsa aynı yöne bakıyorlar (benzer anlam), 0'a yakınsa ilgisizler. Vektörler normalize olduğu için bu değer doğrudan nokta çarpımına eşit."],
    ["top-k", `En yüksek skorlu k parça. Burada k=${T.k}. Küçük k bilgiyi kaçırabilir; büyük k ise Claude'a gürültü taşır ve maliyeti artırır.`],
    ["PCA", "Çok boyutlu veriyi en çok yayıldığı birkaç eksene izdüşüren yöntem. Burada yalnızca göz için kullanılıyor, seçimi etkilemiyor."],
  ]);
}

/* ---------- ③ Prompt ---------- */
{
  const P = T.prompt, totalChars = P.parts.reduce((a, p) => a + p.chars, 0);
  const c = card("s3", "3", "Claude'a gidecek metin hazırlandı", stepMs("prompt"),
    `Talimat (system), seçilen ${T.k} parça ve soru tek bir metinde birleştirildi. Toplam yaklaşık <b class="num">${int(totalChars / 4)}</b> token (≈ ${int(totalChars)} karakter). Claude'un bildiği tek şey bu metin: dokümanların geri kalanını görmez.`);
  const s = svg("svg", { viewBox: "0 0 1000 44" }, c);
  let x = 0;
  P.parts.forEach(p => {
    const w = Math.max(2, p.chars / totalChars * 1000 - 2);
    const fill = p.kind === "system" ? "var(--ink2)" : p.kind === "question" ? "var(--warm)" : fColor(p.folder);
    const r = svg("rect", { x, y: 0, width: w, height: 28, rx: 3, style: `fill:${fill}` }, s);
    if (p.kind === "chunk" && w > 18) svg("text", { x: x + w / 2, y: 18, "text-anchor": "middle", style: "fill:#fff;font-size:11px;font-weight:700", text: p.rank }, s);
    hoverable(r, p.kind === "system" ? `<b>talimat (system)</b><br>~${int(p.chars / 4)} token` :
      p.kind === "question" ? `<b>soru</b>` : `<b>parça #${p.rank}</b> · ${esc(p.folder)}<br>~${int(p.chars / 4)} token`);
    x += w + 2;
  });
  html(c, `<div class="legend"><span><i class="sw" style="background:var(--ink2)"></i>talimat</span><span>renkli bloklar = parçalar (klasör rengi, üstünde sıra no)</span><span><i class="sw" style="background:var(--warm)"></i>soru</span></div>`);
  html(c, `<details><summary>Talimatı (system prompt) göster</summary><pre>${esc(P.system)}</pre></details>
    <details><summary>Kullanıcı mesajını (parçalar + soru) göster</summary><pre>${esc(P.user)}</pre></details>`);
  html(c, `<div class="callout">Talimatın üç kuralı RAG'in "dürüstlük" katmanıdır: <b>yalnızca bu parçalara dayan</b>, <b>her iddiaya [n] atıfı koy</b>, <b>yoksa "bulamadım" de</b>. Parçalar yanlışsa Claude'dan beklenen doğru cevap değil, "bulamadım" demesidir.</div>`);
  terms(c, [
    ["Prompt", "Modele gönderilen metnin tamamı. Burada iki bölümden oluşuyor: system (davranış kuralları) ve user (parçalar + soru)."],
    ["Bağlam penceresi", "Modelin tek seferde okuyabildiği metin sınırı. RAG, binlerce dokümandan yalnızca bu pencereye sığan ilgili kısmı seçer."],
    ["Token", "Modelin metni işlediği birim. Türkçede kabaca bir kelimenin ½–¾'ü kadardır."],
  ]);
}

/* ---------- ④ Claude ---------- */
{
  const G = T.generate;
  const c = card("s4", "4", G ? "Claude cevabı yazdı" : "Claude çağrılmadı", stepMs("generate"),
    G ? `Claude yalnızca ③'teki metni okudu ve cevabı yazdı. Cevaptaki <span class="cite" style="cursor:default">n</span> işaretlerinin üzerine gelince hangi parçaya dayandığı yukarıdaki tabloda ve haritada vurgulanır, tıklayınca o parçaya gidersin.`
      : "Bu iz <code>--retrieve-only</code> ile alındı. Arama tamamlandı ama cevap üretilmedi.");
  if (G) {
    const u = G.usage || {};
    html(c, `<div class="tiles">
      <div class="tile"><div class="v">${ms(stepMs("generate"))}</div><div class="l">cevap süresi</div></div>
      <div class="tile"><div class="v">${int(u.input_tokens)}</div><div class="l">giriş token (okunan)</div></div>
      <div class="tile"><div class="v">${int(u.output_tokens)}</div><div class="l">çıkış token (yazılan)</div></div>
      <div class="tile"><div class="v">${G.cited.length}/${T.k}</div><div class="l">atıf alan parça</div></div></div>`);
    if (u.stop_reason === "max_tokens")
      html(c, `<div class="callout"><b>Cevap kesildi:</b> Claude, çıkış sınırına (${int(u.output_tokens)} token) ulaştığı için yazmayı yarıda bıraktı. Bu bir RAG hatası değil, yalnızca çıkış sınırı. <code>rag/answer.py</code> içindeki <code>max_tokens</code> değerini artırabilirsin.</div>`);
    html(c, `<div class="answer">${renderMd(G.answer)}</div>`);
    html(c, `<h3>Hangi parçalar gerçekten kullanıldı?</h3><div class="cited-grid">${hits.map(h => `<div class="cg ${G.cited.includes(h.rank) ? "on" : ""}" title="${esc(h.path)}">${h.rank}</div>`).join("")}</div>
      <p class="lede">Dolu kutular cevapta atıf alan parçalar. <b>${T.k - G.cited.length}</b> parça getirildi ama kullanılmadı. Arama gereğinden fazlasını getirdiyse bu normal; ama doğru cevap boş kutulardan birindeyse Claude onu gözden kaçırmış demektir.</p>`);
    c.querySelectorAll(".cite[data-r]").forEach(b => {
      const r = b.dataset.r, h = hits[r - 1];
      const on = () => { $(`#row-${r}`)?.classList.add("hl"); $(`#map-hit-${r} circle`)?.classList.add("pulse"); };
      const off = () => { $(`#row-${r}`)?.classList.remove("hl"); $(`#map-hit-${r} circle`)?.classList.remove("pulse"); };
      b.addEventListener("mouseenter", on); b.addEventListener("mouseleave", () => { off(); hideTip(); });
      b.addEventListener("mousemove", ev => showTip(ev, `<b>#${r}</b> ${esc(h.path)}<br><small>${esc(h.heading_path.join(" › "))}</small>`));
      b.addEventListener("click", () => { const row = $(`#row-${r}`); row.scrollIntoView({ behavior: "smooth", block: "center" }); row.querySelector("details").open = true; });
    });
  }
  terms(c, [
    ["Atıf [n]", "Cevaptaki iddianın dayandığı parçanın numarası. RAG'in denetlenebilir olmasını sağlayan şey bu: her cümleyi kaynağına kadar takip edebilirsin."],
    ["Halüsinasyon", "Modelin parçalarda olmayan bir bilgiyi kendinden eklemesi. \"Bulamadım\" kuralı ve atıf zorunluluğu buna karşı konmuş bir önlem."],
    ["Retrieval mı, generation mı?", "Cevap yanlışsa önce ②'ye bak: doğru parça listede var mı? Yoksa hata aramadadır. Varsa ama cevap yanlışsa hata Claude'dadır."],
  ]);
}

  html(c, `<table><tbody>
