[project]
name = "rag-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "beautifulsoup4>=4.12",
    "pypdf>=6.21.4",
    "python-docx>=1.1",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
